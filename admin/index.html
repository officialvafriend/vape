<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f4f6">
<title>베이프렌드 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 토스 스타일 (10/6 사용자 요청): 회색 바탕 + 흰 카드, 큰 글씨 한 문장, 목록 + 아래에서 올라오는 창, 아래 탭바 */
  :root{--bg:#f2f4f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--sub:#8b95a1;--line:#f2f4f6;--line2:#e5e8eb;--blue:#3182f6;--blue-soft:#e8f3ff;
    --green:#03b26c;--green-soft:#e5f8ef;--red:#f04452;--red-soft:#fdecee;--amber:#b77700;--amber-soft:#fff4dc;--press:#f9fafb;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--card:#202027;--ink:#f9fafb;--ink2:#c3c9d1;--sub:#8b95a1;--line:#2c2c35;--line2:#33333d;--blue:#4593fc;--blue-soft:#1f2b3e;
    --green:#15c47e;--green-soft:#183027;--red:#ff5b68;--red-soft:#3a2023;--amber:#ffb331;--amber-soft:#3a3020;--press:#26262e;color-scheme:dark}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
  button,input,select{font:inherit;color:inherit} button{border:0;background:none;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;padding:8px 4px 18px}
  .top .logo{font-weight:800;font-size:17px} .top .logo b{color:var(--blue)}
  .top .r{margin-left:auto;display:flex;gap:4px}
  .ic{height:34px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2)}
  .ic:active{background:var(--line2)}
  .card{background:var(--card);border-radius:22px;padding:22px 20px;margin-bottom:12px}
  .eyebrow{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:8px}
  .headline{font-size:24px;font-weight:700;line-height:1.38;letter-spacing:-.6px}
  .headline em{font-style:normal;color:var(--blue)} .headline em.r{color:var(--red)}
  .caption{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.5}
  .bar{height:10px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:18px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s}
  .sec{font-size:18px;font-weight:700;margin:26px 4px 10px;display:flex;align-items:baseline;gap:6px} .sec small{font-size:14px;color:var(--sub);font-weight:600}
  .list{background:var(--card);border-radius:22px;padding:6px 0;margin-bottom:12px}
  .item{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%;text-align:left}
  .item:active{background:var(--press)}
  .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:var(--line);color:var(--ink2)}
  .av.good{background:var(--green-soft);color:var(--green)} .av.warn{background:var(--amber-soft);color:var(--amber)} .av.bad{background:var(--red-soft);color:var(--red)} .av.blue{background:var(--blue-soft);color:var(--blue)}
  .item .tx{flex:1;min-width:0} .item .tx b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .item .tx span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
  .item .val{text-align:right;flex:none} .item .val b{display:block;font-size:16px;font-weight:700} .item .val span{font-size:12px;font-weight:600}
  .t-good{color:var(--green)} .t-warn{color:var(--amber)} .t-bad{color:var(--red)} .t-sub{color:var(--sub)}
  .chev{color:var(--line2);font-size:18px;flex:none;margin-left:-4px}
  .empty{padding:18px 20px;color:var(--sub);font-size:14px}
  .btn{height:56px;border-radius:16px;font-weight:700;font-size:17px;background:var(--blue);color:#fff;width:100%}
  .btn.sec2{background:var(--blue-soft);color:var(--blue)} .btn.gray{background:var(--line2);color:var(--ink2)} .btn.red{background:var(--red-soft);color:var(--red)}
  .btn:disabled{opacity:.4}
  .btns{display:flex;gap:8px;margin-top:20px}
  /* 아래 탭바 */
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line2);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
  .nav div{display:flex;width:100%;max-width:560px}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--sub)}
  .nav button svg{width:24px;height:24px} .nav button.on{color:var(--ink)}
  /* 아래에서 올라오는 창 */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .dim.on{display:flex}
  .sheet{background:var(--card);width:min(560px,100%);border-radius:26px 26px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.35} .sheet .caption{margin-top:6px}
  .sheet .list{background:none;padding:0;margin:14px -22px 0} .sheet .item{padding:13px 22px}
  .lbl{font-size:14px;font-weight:600;color:var(--sub);margin:22px 0 10px}
  .in{width:100%;height:54px;border-radius:14px;border:0;background:var(--line);padding:0 16px;font-size:17px;outline:none}
  .in:focus{box-shadow:inset 0 0 0 2px var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{height:40px;padding:0 15px;border-radius:12px;background:var(--line);font-size:15px;font-weight:600;color:var(--ink2)}
  .chip.on{background:var(--blue);color:#fff}
  .chips.hs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}.chips.hs::-webkit-scrollbar{display:none}.chips.hs .chip{flex:none}
  .seg{display:flex;background:var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--sub)} .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--blue-soft);color:var(--blue);margin:6px 4px 0 0}
  .tag.gray{background:var(--line);color:var(--sub)}
  .item .tx span.tag{display:inline-block;margin-top:6px}
  .sw{width:46px;height:28px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:.2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .sw.on{background:var(--blue)} .sw.on::after{left:21px}
  .sticky{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 16px;z-index:15;pointer-events:none}
  .sticky .btn{max-width:528px;pointer-events:auto;box-shadow:0 6px 20px rgba(49,130,246,.3)}
  .spark{display:block;width:100%;height:56px;margin-top:14px}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;opacity:0;z-index:60;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#191f28;color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:70;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .login{padding-top:14vh} .login .headline{margin-bottom:28px}
  .report{white-space:pre-wrap;font:15px/1.6 "Pretendard Variable",Pretendard,sans-serif;background:var(--line);border-radius:16px;padding:16px 18px;margin-top:16px}
  .search{position:relative} .search .in{padding-left:44px} .search svg{position:absolute;left:15px;top:16px;width:22px;height:22px;color:var(--sub)}
  /* ── PC 배치 (10/12, 900px 이상): 폰 화면은 그대로, 넓은 화면에서는 왼쪽 메뉴 + 요약 + 두 열 ── */
  .warn{color:var(--red);font-weight:600;background:var(--red-soft);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:14px;line-height:1.5}
  .okline{color:var(--green);font-weight:700;margin-top:14px;font-size:15px}
  @media (min-width:900px){
    .wrap{max-width:none;padding:0}
    .nav{display:none!important}
    .login{max-width:420px;margin:0 auto;padding-top:22vh}
    .shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
    .side{position:sticky;top:0;height:100vh;padding:30px 16px 24px;background:var(--card);border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
    .side .logo{font-size:19px;font-weight:800;padding:0 12px 26px;letter-spacing:-.4px} .side .logo b{color:var(--blue)}
    .navb{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:14px;font-size:15px;font-weight:600;color:var(--ink2);width:100%;text-align:left;transition:background .15s}
    .navb svg{width:22px;height:22px;flex:none} .navb:hover{background:var(--press)} .navb.on{background:var(--blue-soft);color:var(--blue)}
    .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px} .side .foot .navb{font-size:14px;height:42px}
    .main{padding:38px 44px 80px;max-width:1320px;width:100%}
    .narrow{max-width:720px}
    .pchead{display:flex;align-items:baseline;gap:14px;margin-bottom:22px} .pchead h1{font-size:30px;font-weight:800;letter-spacing:-.9px} .pchead .caption{margin:0}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
    .kpi{background:var(--card);border-radius:22px;padding:22px 24px 20px;min-height:122px;text-align:left;transition:transform .15s,box-shadow .15s;display:block}
    button.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.07)}
    .kpi .eyebrow{margin-bottom:10px} .kpi .num{font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1} .kpi .num small{font-size:15px;font-weight:600;color:var(--sub);margin-left:5px;letter-spacing:0} .kpi .caption{margin-top:9px}
    .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
    .panel{position:sticky;top:28px;background:var(--card);border-radius:26px;padding:28px 28px 24px;min-height:460px;max-height:calc(100vh - 56px);overflow:auto;animation:none}
    .panel .list{background:none;padding:0;margin:14px -28px 0} .panel .item{padding:13px 28px}
    .panel .btns .btn{height:50px;font-size:16px}
    .item{cursor:pointer} .item:hover{background:var(--press)}
    .sec{margin-top:22px}
    .dim{align-items:center} .sheet{border-radius:26px;max-height:86vh;width:min(620px,100%);padding-bottom:26px}
    .sticky{left:236px;bottom:28px} .sticky .btn{max-width:480px}
    .toast{bottom:40px}
  }
/* 10/19 네이버, 직원앱을 안에 띄우기: PC는 오른쪽 전체, 폰은 위 막대와 아래 메뉴 사이 전체 */
.main.embm{padding:0;max-width:none;height:100vh;display:flex;flex-direction:column}
.emb{flex:1;width:100%;border:0;display:block;min-height:0;height:calc(100vh - 128px)}
.main.embm .emb{height:auto}
.embar{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line2);flex:none}
.embar .chip{flex:none;padding:8px 12px;border-radius:10px;background:var(--bg);font-weight:600;font-size:14px;color:var(--ink2)}
.embar .chip.on{background:var(--blue);color:#fff}
.ops td small{display:block;font-size:11px;font-weight:600}
/* 10/19 KPI: 버튼 36px 14px, 숫자 24px, 표 14px 40px, 홈 상위/하위 두 칸 */
.kbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.kbar .chip{height:36px;padding:0 12px;border-radius:10px;background:var(--card);font-weight:600;font-size:14px;color:var(--ink2);border:1px solid var(--line2)}
.kbar .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ops.kt td{padding-top:9px;padding-bottom:9px}
.ops.kt{min-width:0}.ops.kt td.g{color:var(--green);font-weight:800}.ops.kt td.r{color:var(--red);font-weight:800}
.krank{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.khd{font-size:13px;font-weight:800;padding:12px 16px 4px}
@media (max-width:899px){.krank{grid-template-columns:1fr}}
/* 10/19 홈 정리: 확인할 것 줄 52px, 빨간 점 */
.item.iss{min-height:52px}
.cols.home{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:1400px){.cols.home .ops th,.cols.home .ops td{padding-left:8px;padding-right:8px}.cols.home .ops{min-width:560px}}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;margin:0 4px}
.dot.ok{background:var(--green)}
.ops tr.tot td{border-top:1px solid var(--line2);background:var(--press)}
/* 폰: 표 대신 지점마다 카드 (지점 이름 한 줄 + 칸 3열) */
@media (max-width:899px){
  .ops{min-width:0;display:block}.ops thead{display:none}.ops tbody{display:block}
  .ops tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .ops td{border:0;padding:0;text-align:left;white-space:normal}.ops td:first-child{grid-column:1/-1;font-size:15px}
  .ops td:empty{display:none}
  .ops td:nth-child(n+2)::before{display:block;font-size:11px;color:var(--sub);font-weight:500}
  .ops td:nth-child(2)::before{content:"오픈"}.ops td:nth-child(3)::before{content:"마감"}.ops td:nth-child(4)::before{content:"총매출"}
  .ops td:nth-child(5)::before{content:"현금 차액"}.ops td:nth-child(6)::before{content:"객수"}.ops td:nth-child(7)::before{content:"지정판매율"}.ops td:nth-child(8)::before{content:"리뷰"}
}
/* 10/19 지점 한눈에: 8지점 × 7칸 표, 안 한 것 회색 / 늦음, 차액 빨강 / 정상 초록 */
.opsw{background:var(--card);border-radius:20px;padding:6px 0;overflow-x:auto;margin-bottom:12px}
.ops{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.ops th{font-size:12px;color:var(--sub);font-weight:600;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
.ops th:first-child,.ops td:first-child{text-align:left}
.ops td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.ops tr:last-child td{border-bottom:0}
.ops td b{font-weight:700}
.ops .g{color:var(--green);font-weight:700}.ops .r{color:var(--red);font-weight:700}.ops .n{color:var(--sub)}
.ops small{display:block;font-size:11px;color:var(--sub);font-weight:500}
/* 10/25 사무실 들판: 우사기, 쿠리만쥬는 제자리에 서 있음(사장님 "걷는 건 하지마"), 표정만 15초마다 바뀜 */
.field{position:relative;height:300px;background:url(img/field.png) center top/cover no-repeat,linear-gradient(#bfe3f5 0 32%,#cfe8b8 32%)}
.walker{position:absolute;width:130px;display:flex;flex-direction:column;align-items:center;gap:2px}
.walker img{width:130px;height:112px;object-fit:contain;display:block}
.walker .tag{padding:3px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
@media(max-width:700px){.field{height:220px}.walker{width:96px}.walker img{width:96px;height:84px}}
/* 10/25 그룹관리, 추가 필수: PC는 왼쪽 조작, 오른쪽 목록 여러 칸 (사장님 "여백 활용") */
.gwrap{display:grid;gap:12px}
.gstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.gstat div{background:var(--bg);border-radius:12px;padding:10px 12px}.gstat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.gstat span{font-size:12px;color:var(--sub)}
.glist{display:grid;gap:8px;align-items:start}.gsec{grid-column:1/-1;font-size:16px;font-weight:800;margin:10px 2px 0}.gsec small{font-size:13px;color:var(--sub);font-weight:600}
.gitem{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}.gitem.chg{border-color:var(--amber);background:var(--amber-soft)}
.gtx{flex:1;min-width:0}.gtx b{display:block;font-size:15px;overflow-wrap:anywhere}.gmeta{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.gpill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--sub);white-space:nowrap}
.gsel{width:128px;height:38px;font-size:14px;padding:0 8px;flex-shrink:0}.gmemo{height:34px;font-size:13px;margin-top:8px}
.mwrap{display:grid;gap:12px}
.gbr{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.gtag{height:28px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card);color:var(--sub);border:1px solid var(--line)}.gtag.on{background:var(--blue);color:#fff;border-color:var(--blue)}.gtag.all{background:none;border-style:dashed}
.gside,.mside,.gmain{min-width:0}.gside .chips,.mside .chips{flex-wrap:wrap;overflow:visible;margin-left:0;margin-right:0;padding:0}.mside .card{min-width:0}
@media(min-width:900px){.gwrap,.mwrap{grid-template-columns:360px minmax(0,1fr);align-items:start;gap:20px}.gside,.mside{position:sticky;top:20px;display:grid;gap:12px}.glist{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}.mwrap .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 16px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" style="display:none"><div>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5.5v-6h5v6H20a1 1 0 0 0 1-1v-9.6z"/></svg>홈</button>
  <button data-tab="order">🛒주문요청</button>
  <button data-tab="note">📝매장 노트</button>
  <button data-tab="kpi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 19h16v2H4zM5 11h3v6H5zm5.5-4h3v10h-3zM16 4h3v13h-3z"/></svg>KPI</button>
  <button data-tab="close"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v12H3zm9 2.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg>마감</button>

async function fetchEnc() {

// ── KPI (10/19) ── 데이터: 운영봇 kpiData() (노션 근무자별 ~10/13 + 직원앱 마감 보고 10/20~). 비율 식은 부록C

const kSum = (list) => list.reduce((o, g) => { for (const k of ["days", "sales", "bills", "prem", "des", "disp", "dev", "valm", "rev"]) o[k] = (o[k] || 0) + (g[k] || 0); return o; }, {});
function kTile(label, cur, prev, fmt, rate) {
  const v = cur == null ? null : cur, pv = prev == null ? null : prev, ch = v != null && pv ? (v - pv) / pv : null;
  return `<div class="kpi"><div class="eyebrow">${label}</div><div class="num" style="font-size:24px">${v == null ? "-" : fmt(v)}</div><div class="caption ${ch == null ? "" : ch >= 0 ? "t-good" : "t-bad"}">${ch == null ? "지난 기간 기록 없음" : `지난 기간보다 ${ch >= 0 ? "+" : ""}${(Math.round(ch * 1000) / 10).toFixed(1)}${rate ? "%p" : "%"}`}</div></div>`;
}

const m1 = (n) => (n == null || !isFinite(n) ? "-" : (Math.round(n / 1000) / 10).toLocaleString() + "만");
const kVals = (g) => ({ des: g.prem ? g.des / g.prem : null, disp: g.bills ? g.disp / g.bills : null, valm: g.dev ? g.valm / g.dev : null, rev: g.bills ? g.rev / g.bills : null, ticket: g.bills ? g.sales / g.bills : null, avg: g.days ? g.sales / g.days : null });
function kRow(label, g, hl = {}) {
  const v = kVals(g), c = (k) => (hl[k] && v[k] != null ? (v[k] === hl[k].max ? ' class="g"' : v[k] === hl[k].min ? ' class="r"' : "") : "");
  return `<tr><td><b>${label}</b></td><td>${g.days}</td><td>${m1(g.sales)}</td><td${c("avg")}>${m1(v.avg)}</td><td>${g.bills.toLocaleString()}</td><td${c("ticket")}>${v.ticket == null ? "-" : (v.ticket / 10000).toFixed(1) + "만"}</td><td${c("des")}>${pct(g.des, g.prem)}</td><td${c("disp")}>${pct(g.disp, g.bills)}</td><td${c("valm")}>${pct(g.valm, g.dev)}</td><td${c("rev")}>${pct(g.rev, g.bills)}</td></tr>`;
}
const kHL = (list) => { const o = {}; for (const k of ["avg", "ticket", "des", "disp", "valm", "rev"]) { const xs = list.map((g) => kVals(g)[k]).filter((x) => x != null); if (xs.length > 1) o[k] = { max: Math.max(...xs), min: Math.min(...xs) }; } return o; };

  if (kpiM === "staff") return modeBar + staffKpiHtml(K);

function branchKpiHtml(K) {

  if (t.dataset.tdelid) { const id = t.dataset.tdelid, def = D.tasks.find((x) => x.id === id); if (!def || !confirm(`'${def.title}' 업무를 지울까요? 직원앱 오늘 할 일에서도 빠져요.`)) return; t.disabled = true; try { await sendOp("taskdel", { id }); D.tasks = D.tasks.filter((x) => x.id !== id); D.matrix = D.matrix.filter((x) => x.id !== id); closeSheet(); render(); toast("지웠어요. 직원앱에는 1~2분 뒤에 빠져요"); } catch (err) { t.disabled = false; toast("못 지웠어요: " + err.message); } return; }
  if (t.dataset.mustgo) { mustB = t.dataset.mustgo; tab = "must"; draft = null; closeSheet(); render(); return scrollTo(0, 0); }
  // 업무
  if (a === "tnew") { editTask = { id: "", title: "", note: "", time: "", br: [], rep: "once", date: D.d, dow: [], dom: 1 }; return sheetTask(); }
  if (t.dataset.tedit) { editTask = JSON.parse(JSON.stringify(D.tasks.find((x) => x.id === t.dataset.tedit))); editTask.dow ||= []; return sheetTask(); }
  if (t.dataset.tball !== undefined) { readTaskForm(); editTask.br = editTask.br.length === 8 ? [] : [...BR]; return sheetTask(); }
  if (t.dataset.tb) { readTaskForm(); const b = t.dataset.tb, s = new Set(editTask.br); s.has(b) ? s.delete(b) : s.add(b); editTask.br = BR.filter((x) => s.has(x)); return sheetTask(); }
  if (t.dataset.trep) { readTaskForm(); editTask.rep = t.dataset.trep; return sheetTask(); }
  if (t.dataset.tdow) { readTaskForm(); const d = +t.dataset.tdow, s = new Set(editTask.dow); s.has(d) ? s.delete(d) : s.add(d); editTask.dow = [...s]; return sheetTask(); }
  if (a === "tsave") return saveTask();
  if (a === "tdel") { if (!confirm(`'${editTask.title}' 업무를 지울까요?`)) return; try { await sendOp("taskdel", { id: editTask.id }); D.tasks = D.tasks.filter((x) => x.id !== editTask.id); D.matrix = D.matrix.filter((x) => x.id !== editTask.id); editTask = null; closeSheet(); render(); toast("지웠어요"); } catch { toast("지우지 못했어요"); } return; }
  // 필수 상품
  if (t.dataset.mb) { mustB = t.dataset.mb; ls.set("vf-admin-mustb", mustB); mustCat = ""; mustQ = ""; draft = null; return render(); }
  if (t.dataset.mc !== undefined) { mustCat = t.dataset.mc; return render(); }
  if (t.dataset.mn !== undefined) { const n = t.dataset.mn; draft.set.has(n) ? draft.set.delete(n) : draft.set.add(n); const y = scrollY; render(); return scrollTo(0, y); }
  if (a === "mall" || a === "mnone") { document.querySelectorAll("[data-mn]").forEach((c) => (a === "mall" ? draft.set.add(c.dataset.mn) : draft.set.delete(c.dataset.mn))); const y = scrollY; render(); return scrollTo(0, y); }
  if (a === "msave") return saveMust();
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.gn !== undefined) { const n = e.target.dataset.gn, ed = grpEd(); if (!e.target.value) delete ed[n]; else ed[n] = { ...(ed[n] || {}), to: e.target.value, at: Date.now() }; grpSave(ed); const y = scrollY; render(); scrollTo(0, y); return; }
  if (e.target.dataset.gmemo !== undefined) { const ed = grpEd(), n = e.target.dataset.gmemo; if (ed[n]) { ed[n].memo = e.target.value.trim(); grpSave(ed); } return; }
  if (e.target.id === "mcopy" && e.target.value) { const from = new Set(D.must[e.target.value] || []), names = new Set((D.products[mustB] || []).map(([n]) => n)); let k = 0; for (const n of from) if (names.has(n) && !draft.set.has(n)) { draft.set.add(n); k++; } render(); toast(`${k}개 더했어요. 저장을 눌러야 반영돼요`); }
});
let qT; document.addEventListener("input", (e) => { if (e.target.id === "gq") { clearTimeout(qT); qT = setTimeout(() => { grpQ = e.target.value.trim(); const pos = e.target.selectionStart; render(); const el = $("#gq"); el.focus(); el.setSelectionRange(pos, pos); }, 250); return; } if (e.target.id === "mq") { clearTimeout(qT); qT = setTimeout(() => { mustQ = e.target.value.trim(); const pos = e.target.selectionStart; render(); const el = $("#mq"); el.focus(); el.setSelectionRange(pos, pos); }, 250); } });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "pw") tryLogin(); });

(async () => {
  const saved = ls.get("vf-admin-key");
  if (!saved) return renderLogin();
  try { KEY = b64.from(saved); RAW = await fetchEnc(); D = await decrypt(RAW, KEY); render(); }
  catch { ls.set("vf-admin-key", null); KEY = null; renderLogin(); }
})();
setInterval(() => KEY && reload(true), 3 * 60e3);
setInterval(() => KEY && loadBot(), 60e3); setTimeout(loadBot, 1500);
matchMedia("(min-width:900px)").addEventListener("change", () => { panelKeep = ""; if (D) render(); });
</script>
