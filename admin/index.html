<style>
  /* 토스 스타일 (10/6 사용자 요청): 회색 바탕 + 흰 카드, 큰 글씨 한 문장, 목록 + 아래에서 올라오는 창, 아래 탭바 */
  :root{--ease-out:cubic-bezier(0.23,1,0.32,1);--bg:#f2f4f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--sub:#66717f;--line:#f2f4f6;--line2:#e5e8eb;--blue:#1b64da;--blue-soft:#e8f3ff;
    --green:#037a4a;--green-soft:#e5f8ef;--red:#dc2633;--red-soft:#fdecee;--amber:#8a5a00;--amber-soft:#fff4dc;--press:#f9fafb;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--card:#202027;--ink:#f9fafb;--ink2:#c3c9d1;--sub:#8b95a1;--line:#2c2c35;--line2:#33333d;--blue:#4593fc;--blue-soft:#1f2b3e;
    --green:#15c47e;--green-soft:#183027;--red:#ff5b68;--red-soft:#3a2023;--amber:#ffb331;--amber-soft:#3a3020;--press:#26262e;color-scheme:dark}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
  button,input,select{font:inherit;color:inherit} button{border:0;background:none;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:12px 24px calc(96px + env(safe-area-inset-bottom))} /* 여백 가이드 1111 */
  .top{display:flex;align-items:center;padding:8px 4px 18px}
  .top .logo{font-weight:800;font-size:17px} .top .logo b{color:var(--blue)}
  .top .r{margin-left:auto;display:flex;gap:4px}
  .ic{height:40px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2)}
  .ic:active{background:var(--line2)}
  .card{background:var(--card);border-radius:22px;padding:22px 20px;margin-bottom:12px}
  .eyebrow{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:8px}
  .headline{font-size:24px;font-weight:700;line-height:1.38;letter-spacing:-.6px}
  .headline em{font-style:normal;color:var(--blue)} .headline em.r{color:var(--red)}
  .caption{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.5}
  .bar{height:10px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:18px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s}
  .sec{font-size:18px;font-weight:700;margin:32px 4px 16px;display:flex;align-items:baseline;gap:6px} .sec small{font-size:14px;color:var(--sub);font-weight:600}
  .list{background:var(--card);border-radius:22px;padding:6px 0;margin-bottom:12px}
  .item{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%;text-align:left}
  .item:active{background:var(--press)}
  .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:var(--line);color:var(--ink2)}
  .av.good{background:var(--green-soft);color:var(--green)} .av.warn{background:var(--amber-soft);color:var(--amber)} .av.bad{background:var(--red-soft);color:var(--red)} .av.blue{background:var(--blue-soft);color:var(--blue)}
  .item .tx{flex:1;min-width:0} .item .tx b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .item .tx span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
  .item .val{text-align:right;flex:none} .item .val b{display:block;font-size:16px;font-weight:700} .item .val span{font-size:12px;font-weight:600}
  .t-good{color:var(--green)} .t-warn{color:var(--amber)} .t-bad{color:var(--red)} .t-sub{color:var(--sub)}
  .chev{color:var(--line2);font-size:18px;flex:none;margin-left:-4px}
  .empty{padding:18px 20px;color:var(--sub);font-size:14px}
  .btn{height:56px;border-radius:16px;font-weight:700;font-size:17px;background:var(--blue);color:#fff;width:100%}
  .btn.sec2{background:var(--blue-soft);color:var(--blue)} .btn.gray{background:var(--line2);color:var(--ink2)} .btn.red{background:var(--red-soft);color:var(--red)}
  .btn:disabled{opacity:.4}

  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line2);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
  .nav div{display:flex;width:100%;max-width:560px}

  /* 아래에서 올라오는 창 */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .dim.on{display:flex}
  .sheet{background:var(--card);width:min(560px,100%);border-radius:26px 26px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .28s cubic-bezier(0.32,0.72,0,1)}

  .sheet .list{background:none;padding:0;margin:14px -22px 0} .sheet .item{padding:13px 22px}
  .lbl{font-size:14px;font-weight:600;color:var(--sub);margin:22px 0 10px}
  .in{width:100%;height:54px;border-radius:14px;border:0;background:var(--line);padding:0 16px;font-size:17px;outline:none}
  .in:focus{box-shadow:inset 0 0 0 2px var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{height:40px;padding:0 15px;border-radius:12px;background:var(--line);font-size:15px;font-weight:600;color:var(--ink2)}
  .chip.on{background:var(--blue);color:#fff}
  .chips.hs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-24px;margin-right:-24px;padding:0 24px}.chips.hs::-webkit-scrollbar{display:none}.chips.hs .chip{flex:none}

  .seg button{flex:1;height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--sub)} .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--blue-soft);color:var(--blue);margin:6px 4px 0 0}
  .tag.gray{background:var(--line);color:var(--sub)}
  .item .tx span.tag{display:inline-block;margin-top:6px}
  .sw{width:46px;height:28px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:.2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .sw.on{background:var(--blue)} .sw.on::after{left:21px}
  .sticky{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 24px;z-index:15;pointer-events:none}

  .spark{display:block;width:100%;height:56px;margin-top:14px}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;opacity:0;z-index:60;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#191f28;color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:70;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .login{padding-top:14vh} .login .headline{margin-bottom:28px}
  .report{white-space:pre-wrap;font:15px/1.6 "Pretendard Variable",Pretendard,sans-serif;background:var(--line);border-radius:16px;padding:16px 18px;margin-top:16px}
  .search{position:relative} .search .in{padding-left:44px} .search svg{position:absolute;left:15px;top:16px;width:22px;height:22px;color:var(--sub)}
  /* ── PC 배치 (10/12, 900px 이상): 폰 화면은 그대로, 넓은 화면에서는 왼쪽 메뉴 + 요약 + 두 열 ── */
  .warn{color:var(--red);font-weight:600;background:var(--red-soft);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:14px;line-height:1.5}
  .okline{color:var(--green);font-weight:700;margin-top:14px;font-size:15px}
  /* 1116 특이건 */ .spbox{background:var(--blue-soft);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:14px;line-height:1.6}.spbox b{color:var(--blue);font-size:15px}.spbox b small{font-weight:600;color:var(--sub);margin-left:8px;font-size:13px}.spbox p{margin:2px 0 0;color:var(--ink)}.spbox>small{display:block;color:var(--sub);font-size:13px;margin-top:4px}
  .sptag{flex:none;font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}.dot.sp{background:var(--blue)}
  .pchead{margin-bottom:16px}.pchead h1{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.3}.pchead .caption{margin:4px 0 0}
  .av svg{width:22px;height:22px}
  .stk{--pb:calc(22px + env(safe-area-inset-bottom));position:sticky;bottom:calc(0px - var(--pb));z-index:2;margin:16px -22px calc(0px - var(--pb));padding:12px 22px var(--pb);background:var(--card);box-shadow:0 -1px 0 var(--line2)}@media (min-width:900px){.stk{--pb:26px}}.panel .stk{--pb:28px;margin-left:-28px;margin-right:-28px;padding-left:28px;padding-right:28px}
  .bdgp{margin-top:16px}.bdgp .gt{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:8px}.bdgp .gt b{color:var(--ink);font-weight:700}.bdgp .gc{display:flex;flex-wrap:wrap;gap:8px}
  .bdn{display:inline-flex;align-items:center;height:42px;padding:0 15px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;transition:transform .12s var(--ease-out)}.bdn:active{transform:scale(.97)}.bdn.act{background:var(--blue-soft);color:var(--blue)}.bdn.no{box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--ink2)}.bdn.ok{background:var(--green-soft);color:var(--green)}.bdn.wt{background:var(--bg);color:var(--sub)}.bdn.hot{background:var(--red-soft);color:var(--red)}@media (hover:hover) and (pointer:fine){.bdn{cursor:pointer}.bdn:hover{filter:brightness(.97)}}
  .bdg{display:grid;grid-template-columns:minmax(58px,120px) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch}.bdg .hd{font-size:14px;font-weight:700;text-align:center;padding:0 0 2px}.bdg .hd small{display:block;font-size:12px;font-weight:600;color:var(--sub)}.bdg .br{display:flex;align-items:center;padding-left:6px;font-size:15px;font-weight:700;min-width:0}
  .bdc{display:block;width:100%;min-width:0;min-height:56px;padding:9px 11px;border-radius:12px;text-align:left;text-decoration:none;background:var(--bg);transition:transform .12s var(--ease-out)}.bdc:active{transform:scale(.97)}.bdc b,.bdc span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bdc b{font-size:14px;font-weight:700}.bdc span{font-size:12px;font-weight:600;margin-top:2px}
  .bdc.no{background:none;box-shadow:inset 0 0 0 1.5px var(--line2)}.bdc.ok{background:var(--green-soft)}.bdc.act{background:var(--blue-soft)}.bdc.hot{background:var(--red-soft)}@media (hover:hover) and (pointer:fine){.bdc{cursor:pointer}.bdc:hover{filter:brightness(.97)}}
  .nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;margin-left:6px;line-height:1}.nav button{position:relative}.nav .nbadge{position:absolute;top:1px;left:calc(50% + 6px);margin:0}.subnav .nbadge{vertical-align:1px}
  /* 11/5 블로그 탭: 점유 막대, 줄 등장, 버튼 눌림. 움직임 줄이기 설정이면 옮기는 움직임은 뺀다 */
  .sbar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:8px}.sbar i{display:block;height:100%;border-radius:99px;background:var(--blue)}.sbar i.pk{background:var(--blue)}
  :is(.wrap,.main,.narrow)>.chips{gap:12px}:is(.wrap,.main,.narrow)>.chips .chip:not(.on){background:var(--card);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink)}:is(.wrap,.main,.narrow)>.chips .chip.on{box-shadow:0 2px 8px rgba(27,100,218,.28)}
  .kwrow .tx b{white-space:normal;line-height:1.35}.kwrow{align-items:flex-start}
  .btn,.chip,.subnav button{transition:transform .12s var(--ease-out)}.btn:active,.chip:active,.subnav button:active{transform:scale(.97)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes reveal{from{clip-path:inset(0 100% 0 0 round 99px)}to{clip-path:inset(0 0 0 0 round 99px)}}
  .enter .anim{animation:rise .24s var(--ease-out) both;animation-delay:calc(var(--i,0)*40ms)}.enter .sbar i{animation:reveal .3s var(--ease-out) both;animation-delay:calc(var(--i,0)*40ms + 80ms)}
  @media (prefers-reduced-motion:reduce){.enter .anim{animation:fadein .2s ease both}.enter .sbar i{animation:none}.btn:active,.chip:active,.subnav button:active,.bdc:active,.bdn:active{transform:none}.sheet{animation:fadein .2s ease}}
  @media (max-width:899px){.pchead{display:block}.sec{flex-wrap:wrap}}
  @media (min-width:900px){.chips.hs{flex-wrap:wrap;overflow:visible;margin:0;padding:0}}
  @media (min-width:900px) and (max-width:1199px){.clgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:900px){
    .wrap{max-width:none;padding:0}
    .nav{display:none!important}
    .login{max-width:420px;margin:0 auto;padding-top:22vh}
    .shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
    .side{position:sticky;top:0;height:100vh;padding:30px 16px 24px;background:var(--card);border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
    .side .logo{font-size:19px;font-weight:800;padding:0 12px 26px;letter-spacing:-.4px} .side .logo b{color:var(--blue)}
    .navb{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:14px;font-size:15px;font-weight:600;color:var(--ink2);width:100%;text-align:left;transition:background .15s}
    .navb svg{width:22px;height:22px;flex:none} .navb:hover{background:var(--press)} .navb.on{background:var(--blue-soft);color:var(--blue)}
    .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px} .side .foot .navb{font-size:14px;height:42px}
    .main{padding:38px 44px 80px;max-width:1320px;width:100%}

    .kpi{background:var(--card);border-radius:22px;padding:22px 24px 20px;min-height:122px;text-align:left;transition:transform .15s,box-shadow .15s;display:block}
    button.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.07)}

    .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}

    .panel .list{background:none;padding:0;margin:14px -28px 0} .panel .item{padding:13px 28px}
    .panel .btns .btn{height:50px;font-size:16px}
    .item{cursor:pointer} .item:hover{background:var(--press)}
    .sec{margin-top:32px}

    .sticky{left:236px;bottom:28px} .sticky .btn{max-width:480px}
    .toast{bottom:40px}
  }
/* 10/19 네이버, 직원웹을 안에 띄우기: PC는 오른쪽 전체, 폰은 위 막대와 아래 메뉴 사이 전체 */
.main.embm{padding:0;max-width:none;height:100vh;display:flex;flex-direction:column}
.emb{flex:1;width:100%;border:0;display:block;min-height:0;height:calc(100vh - 128px)}
.main.embm .emb{height:auto}
.embar{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line2);flex:none}
.embar .chip{flex:none;padding:10px 12px;border-radius:10px;background:var(--bg);font-weight:600;font-size:14px;color:var(--ink2)}
.embar .chip.on{background:var(--blue);color:#fff}
.subnav.sub2{margin-top:-6px;gap:6px}.subnav.sub2 button{height:38px;font-size:14px;background:none;border-color:transparent;color:var(--sub)}.subnav.sub2 button.on{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.subnav.emsub{flex:none;margin:0;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line2)}
@keyframes dockin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.dim.dock .sheet{animation:fadein .2s ease}}
@media (min-width:1400px){body.docked .main{max-width:calc(100vw - 236px - 460px)}}
@media (min-width:1400px) and (max-width:1799px){body.docked .clgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ops td small{display:block;font-size:11px;font-weight:600}
/* 10/19 KPI: 버튼 36px 14px, 숫자 24px, 표 14px 40px, 홈 상위/하위 두 칸 */
.kbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}

<script>

<div class="ptlab">판매가</div><input class="ptin" id="plNp" inputmode="numeric" placeholder="숫자만" value="${esc(k.price)}">
${canCost() ? `<div class="ptlab">원가 (포스에만 들어가요)</div><input class="ptin" id="plNo" inputmode="numeric" placeholder="숫자만" value="${esc(k.cost)}">` : `<div class="pllock">원가 칸은 한섭이사, 보혜 기기에서만 보여요. 지금은 ${esc(me())} 화면이에요.</div>`}
<div class="ptlab">제조사 바코드 (없으면 비워 두세요. 지점마다 매장 번호로 만들어요)</div><input class="ptin" id="plNb" inputmode="numeric" maxlength="14" value="${esc(k.bc)}">
<div class="ptlab">넣을 지점</div><div class="ptpick"><button class="chip ${k.br.length === BR.length ? "on" : ""}" data-pl="nball">전 지점</button>${BR.map((b, i) => `<button class="chip ${k.br.includes(b) ? "on" : ""}" data-pl="nbr" data-b="${b}">${i + 1} ${b}</button>`).join("")}</div>
<div class="btns"><button class="btn gray" data-x style="flex:0 0 96px">닫기</button><button class="btn" data-pl="nwgo">등록 준비하기</button></div>`);
  }
  const keep = () => { const k = PL.nw; if (!k || !$("#plNn")) return; k.name = $("#plNn").value; k.cat = $("#plNc").value; k.grp = $("#plNg").value; k.price = $("#plNp").value; if ($("#plNo")) k.cost = $("#plNo").value; k.bc = $("#plNb").value; };
  const csv = (rows) => "﻿" + rows.map((r) => r.map((v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\r\n");
  const save = (name, text) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
  document.addEventListener("input", (e) => { if (e.target.id === "plq") { PL.q = e.target.value; PL.n = 60; const l = $("#pllist"); if (l) l.innerHTML = listHtml(); } });
  document.addEventListener("change", (e) => { if (e.target.id === "plcat") { PL.cat = e.target.value; PL.n = 60; render(); } if (e.target.id === "plgrp") { PL.grp = e.target.value; PL.n = 60; render(); } });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-pl]"); if (!t || t.disabled) return; const a = t.dataset.pl;
    if (a === "open") return detail(t.dataset.n);
    if (a === "more") { PL.n += 60; const l = $("#pllist"); if (l) l.innerHTML = listHtml(); return; }
    if (a === "only") { PL.only = t.dataset.v; PL.n = 60; return render(); }
    if (a === "new") { PL.nw = null; return newSheet(); }
    if (a === "nball") { keep(); PL.nw.br = PL.nw.br.length === BR.length ? [] : [...BR]; return newSheet(); }
    if (a === "nbr") { keep(); const b = t.dataset.b, L = PL.nw.br; L.includes(b) ? L.splice(L.indexOf(b), 1) : L.push(b); PL.nw.br = BR.filter((x) => L.includes(x)); return newSheet(); }
    if (a === "nwgo") { keep(); const k = PL.nw; k.name = k.name.trim(); k.price = String(k.price).replace(/[^\d]/g, ""); k.cost = String(k.cost || "").replace(/[^\d]/g, ""); k.bc = String(k.bc).replace(/[^\d]/g, "");
      if (!k.name) return toast("상품 이름을 적어 주세요"); if (!k.price) return toast("판매가를 숫자로 적어 주세요"); if (!k.br.length) return toast("넣을 지점을 골라 주세요"); if (k.bc && ![8, 12, 13, 14].includes(k.bc.length)) return toast("제조사 바코드 자릿수가 맞지 않아요 (8, 12, 13, 14자리)", 3400);
      const dup = PL.list.find((o) => o.n === k.name); if (dup) return toast(`같은 이름이 이미 ${dup.k}곳 포스에 있어요. 목록에서 찾아 주세요`, 3600);
      PL.NEW.unshift({ ...k }); PL.nw = null; closeSheet(true); toast("등록 준비 목록에 넣었어요 (예시). 파일을 받아 포스에 올리면 돼요", 3600); return render(); }
    if (a === "drop") { PL.NEW.splice(+t.dataset.i, 1); return render(); }
    if (a === "file") { const x = PL.NEW[+t.dataset.i], head = ["지점", "상품명", "분류", "그룹", "판매가", ...(x.cost ? ["원가"] : []), "바코드"]; save(`신규상품_${x.name}.csv`, csv([head, ...x.br.map((b) => [`${BR.indexOf(b) + 1}호 ${b}`, x.name, x.cat, x.grp, x.price, ...(x.cost ? [x.cost] : []), x.bc || "포스 등록 뒤 매장 번호로 만듦"])])); return toast(`신규상품_${x.name}.csv 로 받았어요`, 3200); }
  });
})();

</script>
</body>
</html>
