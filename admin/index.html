<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f4f6">
<title>베이프렌드 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 토스 스타일 (10/6 사용자 요청): 회색 바탕 + 흰 카드, 큰 글씨 한 문장, 목록 + 아래에서 올라오는 창, 아래 탭바 */
  :root{--bg:#f2f4f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--sub:#8b95a1;--line:#f2f4f6;--line2:#e5e8eb;--blue:#3182f6;--blue-soft:#e8f3ff;
    --green:#03b26c;--green-soft:#e5f8ef;--red:#f04452;--red-soft:#fdecee;--amber:#b77700;--amber-soft:#fff4dc;--press:#f9fafb;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--card:#202027;--ink:#f9fafb;--ink2:#c3c9d1;--sub:#8b95a1;--line:#2c2c35;--line2:#33333d;--blue:#4593fc;--blue-soft:#1f2b3e;
    --green:#15c47e;--green-soft:#183027;--red:#ff5b68;--red-soft:#3a2023;--amber:#ffb331;--amber-soft:#3a3020;--press:#26262e;color-scheme:dark}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
  button,input,select{font:inherit;color:inherit} button{border:0;background:none;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;padding:8px 4px 18px}
  .top .logo{font-weight:800;font-size:17px} .top .logo b{color:var(--blue)}
  .top .r{margin-left:auto;display:flex;gap:4px}
  .ic{height:34px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2)}
  .ic:active{background:var(--line2)}
  .card{background:var(--card);border-radius:22px;padding:22px 20px;margin-bottom:12px}
  .eyebrow{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:8px}
  .headline{font-size:24px;font-weight:700;line-height:1.38;letter-spacing:-.6px}
  .headline em{font-style:normal;color:var(--blue)} .headline em.r{color:var(--red)}
  .caption{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.5}
  .bar{height:10px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:18px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s}
  .sec{font-size:18px;font-weight:700;margin:26px 4px 10px;display:flex;align-items:baseline;gap:6px} .sec small{font-size:14px;color:var(--sub);font-weight:600}
  .list{background:var(--card);border-radius:22px;padding:6px 0;margin-bottom:12px}
  .item{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%;text-align:left}
  .item:active{background:var(--press)}
  .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:var(--line);color:var(--ink2)}
  .av.good{background:var(--green-soft);color:var(--green)} .av.warn{background:var(--amber-soft);color:var(--amber)} .av.bad{background:var(--red-soft);color:var(--red)} .av.blue{background:var(--blue-soft);color:var(--blue)}
  .item .tx{flex:1;min-width:0} .item .tx b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .item .tx span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
  .item .val{text-align:right;flex:none} .item .val b{display:block;font-size:16px;font-weight:700} .item .val span{font-size:12px;font-weight:600}
  .t-good{color:var(--green)} .t-warn{color:var(--amber)} .t-bad{color:var(--red)} .t-sub{color:var(--sub)}
  .chev{color:var(--line2);font-size:18px;flex:none;margin-left:-4px}
  .empty{padding:18px 20px;color:var(--sub);font-size:14px}
  .btn{height:56px;border-radius:16px;font-weight:700;font-size:17px;background:var(--blue);color:#fff;width:100%}
  .btn.sec2{background:var(--blue-soft);color:var(--blue)} .btn.gray{background:var(--line2);color:var(--ink2)} .btn.red{background:var(--red-soft);color:var(--red)}
  .btn:disabled{opacity:.4}
  .btns{display:flex;gap:8px;margin-top:20px}
  /* 아래 탭바 */
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line2);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
  .nav div{display:flex;width:100%;max-width:560px}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--sub)}
  .nav button svg{width:24px;height:24px} .nav button.on{color:var(--ink)}
  /* 아래에서 올라오는 창 */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .dim.on{display:flex}
  .sheet{background:var(--card);width:min(560px,100%);border-radius:26px 26px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.35} .sheet .caption{margin-top:6px}
  .sheet .list{background:none;padding:0;margin:14px -22px 0} .sheet .item{padding:13px 22px}
  .lbl{font-size:14px;font-weight:600;color:var(--sub);margin:22px 0 10px}
  .in{width:100%;height:54px;border-radius:14px;border:0;background:var(--line);padding:0 16px;font-size:17px;outline:none}
  .in:focus{box-shadow:inset 0 0 0 2px var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{height:40px;padding:0 15px;border-radius:12px;background:var(--line);font-size:15px;font-weight:600;color:var(--ink2)}
  .chip.on{background:var(--blue);color:#fff}
  .chips.hs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}.chips.hs::-webkit-scrollbar{display:none}.chips.hs .chip{flex:none}
  .seg{display:flex;background:var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--sub)} .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--blue-soft);color:var(--blue);margin:6px 4px 0 0}
  .tag.gray{background:var(--line);color:var(--sub)}
  .item .tx span.tag{display:inline-block;margin-top:6px}
  .sw{width:46px;height:28px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:.2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .sw.on{background:var(--blue)} .sw.on::after{left:21px}
  .sticky{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 16px;z-index:15;pointer-events:none}
  .sticky .btn{max-width:528px;pointer-events:auto;box-shadow:0 6px 20px rgba(49,130,246,.3)}
  .spark{display:block;width:100%;height:56px;margin-top:14px}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;opacity:0;z-index:60;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#191f28;color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:70;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .login{padding-top:14vh} .login .headline{margin-bottom:28px}
  .search{position:relative} .search .in{padding-left:44px} .search svg{position:absolute;left:15px;top:16px;width:22px;height:22px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" style="display:none"><div>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5.5v-6h5v6H20a1 1 0 0 0 1-1v-9.6z"/></svg>홈</button>
  <button data-tab="tasks"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h8v2h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3zm2 0v3h4V3zm5.3 7.3-4.3 4.3-2.3-2.3-1.4 1.4 3.7 3.7 5.7-5.7z"/></svg>업무</button>
  <button data-tab="must"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v4H4zm0 6h16v10H4zm5 3v2h6v-2z"/></svg>추가 필수</button>
</div></nav>
<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script>
// 베이프렌드 관리자 페이지 — 데이터는 운영봇이 비밀번호로 암호화해서 올린 admin/data.enc.json 을 이 기기에서 풀어서 봄
// 저장(필수 상품·업무)은 디스코드 웹훅 → 운영봇. 같은 키로 서명해서 봇이 비밀번호를 아는 사람의 요청인지 확인함
const HOOK = "https://discord.com/api/webhooks/1555156884753743905/BLK7tRBQACouQrOE_hvOkm2-iD44gnfnxdJvQXxiBAJKXJU3MG4bjnACFsXgDkDWLBrh";
const SRC = ["https://api.github.com/repos/officialvafriend/vape/contents/admin/data.enc.json", "data.enc.json"];
const BR = ["동성로", "수성", "본점", "율하", "반월당", "상인", "광장코아", "현풍"];
const ho = (b) => `${BR.indexOf(b) + 1}호 ${b}`;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const b64 = { to: (u8) => btoa(String.fromCharCode(...u8)), from: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
const WD = "일월화수목금토";
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }
// 결품률 상태 — 글자와 같이 보여줌(색만으로 구분 안 함). 기준은 시험값
const ST = (r) => r == null ? null : r <= 5 ? { k: "good", t: "좋아요" } : r <= 15 ? { k: "warn", t: "주의" } : { k: "bad", t: "위험" };

let RAW = null, KEY = null, D = null, tab = ls.get("vf-admin-tab") || "home", mustB = ls.get("vf-admin-mustb") || "본점", mustCat = "", mustQ = "", draft = null, editTask = null;

async function fetchEnc() {
  try { const r = await fetch(SRC[0] + "?t=" + Date.now(), { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" }); if (r.ok) return await r.json(); } catch {}
  return (await fetch(SRC[1] + "?t=" + Date.now(), { cache: "no-store" })).json();
}
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64.from(salt), iterations: iter }, base, 256));
}
async function decrypt(raw, keyBytes) {
  const k = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64.from(raw.iv) }, k, b64.from(raw.ct))));
}
async function sign(op, ts, data) {
  const k = await crypto.subtle.importKey("raw", KEY, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return [...new Uint8Array(await crypto.subtle.sign("HMAC", k, new TextEncoder().encode(`${op}|${ts}|${JSON.stringify(data)}`)))].map((x) => x.toString(16).padStart(2, "0")).join("");
}
async function sendOp(op, data) {
  const ts = Date.now(), sig = await sign(op, ts, data);
  const r = await fetch(HOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ content: JSON.stringify({ type: "admin", op, data, ts, sig }), allowed_mentions: { parse: [] } }) });
  if (!r.ok) throw new Error("응답 " + r.status);
}
const openSheet = (h) => { $("#sheet").innerHTML = h; $("#dim").classList.add("on"); };
const closeSheet = () => $("#dim").classList.remove("on");

function renderLogin(msg) {
  $("#nav").style.display = "none";
  $("#app").innerHTML = `<div class="login"><div class="headline">베이프렌드 관리자<br><span style="color:var(--sub);font-size:18px;font-weight:600">${msg || "비밀번호를 넣어 주세요"}</span></div>
    <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
    <label style="display:flex;gap:8px;align-items:center;margin:16px 4px;font-size:15px;color:var(--ink2)"><input type="checkbox" id="remember" checked style="width:18px;height:18px;accent-color:var(--blue)"> 이 기기에서 기억하기</label>
    <button class="btn" id="go">열기</button></div>`;
  $("#pw").focus();
}
async function tryLogin() {
  const pw = $("#pw").value.trim(); if (!pw) return;
  $("#go").disabled = true; $("#go").textContent = "여는 중…";
  try {
    RAW = RAW || await fetchEnc();
    const key = await deriveKey(pw, RAW.salt, RAW.iter);
    D = await decrypt(RAW, key); KEY = key;
    if ($("#remember").checked) ls.set("vf-admin-key", b64.to(key));
    render();
  } catch (e) { renderLogin(e?.name === "OperationError" ? "비밀번호가 맞지 않아요" : "불러오지 못했어요. 인터넷을 확인해 주세요"); }
}
async function reload(quiet) {
  try { RAW = await fetchEnc(); D = await decrypt(RAW, KEY); if (!draft && !$("#dim").classList.contains("on")) render(); if (!quiet) toast("새로 불러왔어요"); }
  catch (e) { if (!quiet) toast("불러오지 못했어요"); }
}

// ── 그리기 ──
function render() {
  if (!D) return;
  $("#nav").style.display = "";
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  const [, hh, mm] = D.at.match(/(\d{2}):(\d{2})$/) || [];
  $("#app").innerHTML = `<div class="top"><div class="logo">VAFRIEND <b>관리자</b></div><div class="r"><button class="ic" data-act="reload">${hh ? `${hh}:${mm} 기준 ↻` : "새로고침"}</button><button class="ic" data-act="logout">잠그기</button></div></div>
    ${tab === "home" ? homeHtml() : tab === "tasks" ? tasksHtml() : mustHtml()}`;
}
function totals() {
  const con = D.branches.filter((x) => x.connected && x.must);
  const must = con.reduce((a, x) => a + x.must, 0), out = con.reduce((a, x) => a + x.out.length, 0);
  return { con, must, out, rate: must ? Math.round((out / must) * 1000) / 10 : null };
}
// 그룹 (본점 포스 소분류, 상품 이름으로 전 지점 공통) — 프리미엄 A그룹은 절대 떨어지면 안 되는 상품
const G = (x, g) => (x.groups || []).find((y) => y.g === g) || { g, total: 0, out: [] };
const GNAME = { "프리미엄 A": "A그룹", "프리미엄 B": "B그룹", "일회용": "일회용", "기기 A": "기기 A" };
function homeHtml() {
  const con = D.branches.filter((x) => x.connected);
  const aOut = con.flatMap((x) => G(x, "프리미엄 A").out.map((o) => ({ ...o, b: x.b }))), aTotal = G(con[0] || {}, "프리미엄 A").total;
  const tDone = D.branches.reduce((a, x) => a + x.tasks.done, 0), tAll = D.branches.reduce((a, x) => a + x.tasks.total, 0);
  const hero = `<div class="eyebrow">프리미엄 A그룹 · ${aOut.length ? '<span class="t-bad">위험</span>' : '<span class="t-good">좋아요</span>'}</div>
     <div class="headline">${aOut.length ? `절대 떨어지면 안 되는 상품이<br><em class="r">${new Set(aOut.map((o) => o.n)).size}종 품절</em>이에요` : `절대 떨어지면 안 되는 상품이<br><em>모두 있어요</em>`}</div>
     <div class="caption">A그룹 ${aTotal}종 · 지점 ${con.length}곳 기준${aOut.length ? "" : " · 빌런·릭·베이퍼·크래프트 포도"}</div>
     ${aOut.length ? `<div class="list" style="margin:14px -20px -8px;background:none">${[...new Set(aOut.map((o) => o.n))].map((n) => { const xs = aOut.filter((o) => o.n === n), has = [...new Set(xs.flatMap((o) => o.others))];
       return `<div class="item"><div class="av bad">${xs.length}</div><div class="tx"><b>${esc(n)}</b><span>${xs.map((o) => esc(o.b)).join("·")}에서 품절</span>
       <div>${has.length ? has.map((ob) => `<span class="tag">${esc(ob)}에 있어요</span>`).join("") : '<span class="tag gray">재고 있는 지점이 없어요</span>'}</div></div></div>`; }).join("")}</div>` : ""}`;
  const groupCard = `<div class="sec">그룹별 품절 <small>지점 ${con.length}곳 합계</small></div><div class="list">${["프리미엄 B", "일회용", "기기 A"].map((g) => {
    const n = con.reduce((a, x) => a + G(x, g).out.length, 0), t = con.reduce((a, x) => a + G(x, g).total, 0);
    return `<div class="item"><div class="av blue">${esc(GNAME[g][0])}</div><div class="tx"><b>${esc(GNAME[g])}</b><span>${con.map((x) => `${x.b} ${G(x, g).out.length}`).join(" · ")}</span></div><div class="val"><b>${n}개</b><span class="t-sub">${t ? Math.round((n / t) * 100) : 0}% 품절</span></div></div>`; }).join("")}</div>`;
  const pct = tAll ? Math.round((tDone / tAll) * 100) : 0;
  const order = [...D.branches].sort((a, c) => (c.connected - a.connected) || ((c.rate ?? -1) - (a.rate ?? -1)));
  return `<div class="card">${hero}</div>
    <div class="sec">지점별</div>
    <div class="list">${order.map(branchRow).join("")}</div>
    ${groupCard}
    <div class="card" style="margin-top:12px"><div class="eyebrow">오늘 할 일</div>
      <div class="headline">${tAll ? (tDone === tAll ? `<em>모두 끝났어요</em>` : `${tAll}개 중 <em>${tDone}개</em> 끝났어요`) : "오늘 예정된 일이 없어요"}</div>
      ${tAll ? `<div class="bar"><i style="width:${pct}%"></i></div>` : `<div class="btns"><button class="btn sec2" data-tab="tasks">업무 나눠 주기</button></div>`}</div>
    ${D.matrix.length ? `<div class="sec">오늘 할 일 <small>${D.matrix.length}개</small></div><div class="list">${D.matrix.map(taskRow).join("")}</div>` : ""}
    <div class="caption" style="text-align:center;margin-top:18px">그룹은 본점 포스 소분류 기준 · 상품 이름으로 전 지점 공통 적용</div>`;
}
function branchRow(x) {

function sparkSvg(h) {

  });
}

async function saveMust() {
  const saved = new Set(D.must[mustB] || []), add = [...draft.set].filter((n) => !saved.has(n)), del = [...saved].filter((n) => !draft.set.has(n));

  const btn = document.querySelector('[data-act="msave"]'); btn.disabled = true; btn.textContent = "저장하는 중…";
  try {
    for (const c of chunks(add)) { await sendOp("mustAdd", { b: mustB, names: c }); await new Promise((r) => setTimeout(r, 700)); }
    for (const c of chunks(del)) { await sendOp("mustDel", { b: mustB, names: c }); await new Promise((r) => setTimeout(r, 700)); }
    D.must[mustB] = [...draft.set]; draft = null; render(); toast("저장했어요. 결품률은 1~2분 뒤에 바뀌어요");
    setTimeout(() => reload(true), 90e3);
  } catch (e) { btn.disabled = false; btn.textContent = "다시 저장하기"; toast("저장하지 못했어요. 다시 눌러 주세요"); }
}
