<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>베이프렌드 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--page:#f9f9f7;--surface:#fcfcfb;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--base:#c3c2b7;--ring:rgba(11,11,11,.10);
    --accent:#2a78d6;--accent-soft:#e8f1fc;--good:#0ca30c;--good-ink:#006300;--warn:#fab219;--crit:#d03b3b;--chip:#f1f0ec;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0d0d0d;--surface:#1a1a19;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--base:#383835;--ring:rgba(255,255,255,.10);
    --accent:#3987e5;--accent-soft:#1d2a3a;--good-ink:#0ca30c;--chip:#252523;color-scheme:dark}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header h1{font-size:20px;letter-spacing:-.3px} header h1 b{color:var(--accent)}
  .at{color:var(--muted);font-size:13px;margin-left:auto}
  .tabs{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:4px}
  .tabs button{padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2)}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}
  .card{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--ring);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:700;margin-bottom:4px} .card .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
  .hero{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
  .hero .num{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
  .hero .num small{font-size:24px;font-weight:700;letter-spacing:0;margin-left:2px}
  .st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--ink2)}
  .st i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .tile{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--ring);padding:14px 14px 10px;position:relative}
  .tile .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
  .tile .v{font-size:30px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px}
  .tile .v small{font-size:15px;font-weight:700}
  .tile .meta{font-size:12px;color:var(--muted)}
  .tile.off{opacity:.55}
  .spark{display:block;width:100%;height:40px;margin-top:8px}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:6px 8px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:30;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--grid)}
  td{padding:9px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:6px 11px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;color:var(--ink2)}
  .chip.on{background:var(--accent);color:#fff}
  .mini{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;margin:0 4px 2px 0;display:inline-block}
  .muted{color:var(--muted)}
  .ok{color:var(--good-ink);font-weight:700}
  .btn{height:40px;padding:0 16px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5}
  .in{height:40px;border-radius:10px;border:1px solid var(--grid);background:var(--surface);padding:0 12px;font-size:15px;width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .lbl{font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 6px}
  .plist{max-height:60vh;overflow:auto;border-top:1px solid var(--grid)}
  .prow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--grid);cursor:pointer;font-size:14px}
  .prow input{width:18px;height:18px;accent-color:var(--accent)}
  .prow .c{margin-left:auto;font-size:12px;color:var(--muted)}
  .prow .x{font-size:11px;font-weight:700;color:var(--crit)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.2s;z-index:40;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  .login{max-width:360px;margin:12vh auto;text-align:center}
  .login h1{font-size:22px;margin-bottom:6px} .login p{color:var(--muted);font-size:14px;margin-bottom:18px}
  .login .in{text-align:center;margin-bottom:10px}
  .login label{font-size:13px;color:var(--ink2);display:flex;gap:6px;justify-content:center;align-items:center;margin:4px 0 14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.two{grid-template-columns:1fr}.hero .num{font-size:48px}}
  .task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--grid)}
  .task:last-child{border-bottom:0}
  .task .t{flex:1;min-width:0} .task b{display:block} .task span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script>
// 베이프렌드 관리자 페이지 (10/6) — 데이터는 운영봇이 비밀번호로 암호화해서 올린 admin/data.enc.json 을 이 기기에서 풀어서 봄
// 저장(필수 상품·업무)은 디스코드 웹훅 → 운영봇. 같은 키로 서명해서 봇이 비밀번호를 아는 사람의 요청인지 확인함
const HOOK = "https://discord.com/api/webhooks/1555156884753743905/BLK7tRBQACouQrOE_hvOkm2-iD44gnfnxdJvQXxiBAJKXJU3MG4bjnACFsXgDkDWLBrh";
const SRC = ["https://api.github.com/repos/officialvafriend/vape/contents/admin/data.enc.json", "data.enc.json"];
const BR = ["동성로", "수성", "본점", "율하", "반월당", "상인", "광장코아", "현풍"];
const ho = (b) => `${BR.indexOf(b) + 1}호 ${b}`;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const b64 = { to: (u8) => btoa(String.fromCharCode(...u8)), from: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2800); }
// 결품률 상태 (아이콘+글자와 함께, 색만으로 구분하지 않음) — 기준은 시험값
const STATUS = (r) => r == null ? null : r <= 5 ? { c: "var(--good)", t: "좋음", i: "✓" } : r <= 15 ? { c: "var(--warn)", t: "주의", i: "!" } : { c: "var(--crit)", t: "위험", i: "!!" };
const stChip = (r) => { const s = STATUS(r); return s ? `<span class="st"><i style="background:${s.c}"></i>${s.i} ${s.t}</span>` : ""; };

let RAW = null, KEY = null, D = null, tab = ls.get("vf-admin-tab") || "home", mustB = ls.get("vf-admin-mustb") || "본점", mustCat = "", mustQ = "", draft = null, editTask = null, outFilter = "";

async function fetchEnc() {
  try { const r = await fetch(SRC[0] + "?t=" + Date.now(), { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" }); if (r.ok) return await r.json(); } catch {}
  return (await fetch(SRC[1] + "?t=" + Date.now(), { cache: "no-store" })).json();
}
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64.from(salt), iterations: iter }, base, 256));
}
async function decrypt(raw, keyBytes) {
  const k = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64.from(raw.iv) }, k, b64.from(raw.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function sign(op, ts, data) {
  const k = await crypto.subtle.importKey("raw", KEY, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sig = new Uint8Array(await crypto.subtle.sign("HMAC", k, new TextEncoder().encode(`${op}|${ts}|${JSON.stringify(data)}`)));
  return [...sig].map((x) => x.toString(16).padStart(2, "0")).join("");
}
async function sendOp(op, data) {
  const ts = Date.now(), sig = await sign(op, ts, data);
  const r = await fetch(HOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ content: JSON.stringify({ type: "admin", op, data, ts, sig }), allowed_mentions: { parse: [] } }) });
  if (!r.ok) throw new Error("응답 " + r.status);
}

function renderLogin(msg) {
  $("#app").innerHTML = `<div class="login card"><h1>베이프렌드 관리자</h1><p>${msg || "비밀번호를 넣어 주세요"}</p>
    <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
    <label><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
    <button class="btn primary" id="go" style="width:100%">열기</button></div>`;
  $("#pw").focus();
}
async function tryLogin() {
  const pw = $("#pw").value.trim(); if (!pw) return;
  $("#go").disabled = true; $("#go").textContent = "여는 중…";
  try {
    RAW = RAW || await fetchEnc();
    const key = await deriveKey(pw, RAW.salt, RAW.iter);
    D = await decrypt(RAW, key); KEY = key;
    if ($("#remember").checked) ls.set("vf-admin-key", b64.to(key));
    render();
  } catch (e) { renderLogin(e?.name === "OperationError" ? "비밀번호가 맞지 않아요" : "불러오지 못했어요 · 인터넷을 확인해 주세요"); }
}
async function reload(quiet) {
  try { RAW = await fetchEnc(); D = await decrypt(RAW, KEY); if (!draft && !editTask) render(); if (!quiet) toast("새로 불러왔어요 · " + D.at); }
  catch (e) { if (!quiet) toast("불러오지 못했어요"); }
}

// ── 그리기 ──
function render() {
  if (!D) return;
  const tabs = [["home", "현황"], ["tasks", "업무 분배"], ["must", "필수 상품"]];
  $("#app").innerHTML = `<header><h1>VAFRIEND <b>관리자</b></h1>
      <div class="tabs">${tabs.map(([k, n]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${n}</button>`).join("")}</div>
      <div class="at">${esc(D.at)} 기준 · <button data-act="reload" style="color:var(--accent);font-weight:600">새로고침</button> · <button data-act="logout" class="muted">잠그기</button></div></header>
    ${tab === "home" ? homeHtml() : tab === "tasks" ? tasksHtml() : mustHtml()}`;
  if (tab === "home") bindSparks();
}
function homeHtml() {
  const con = D.branches.filter((x) => x.connected && x.must);
  const must = con.reduce((a, x) => a + x.must, 0), out = con.reduce((a, x) => a + x.out.length, 0);
  const rate = must ? Math.round((out / must) * 1000) / 10 : null;
  const tDone = D.branches.reduce((a, x) => a + x.tasks.done, 0), tAll = D.branches.reduce((a, x) => a + x.tasks.total, 0);
  const outs = D.branches.flatMap((x) => x.out.map((o) => ({ ...o, b: x.b }))).filter((o) => !outFilter || o.b === outFilter);
  const noMust = D.branches.filter((x) => x.connected && !x.must);
  return `<div class="two">
    <div class="card"><h2>전체 결품률</h2><div class="sub">꼭 있어야 할 상품 중 포스 재고가 0인 비율 · 포스 연결된 지점만</div>
      <div class="hero"><div class="num">${rate == null ? "—" : rate}<small>${rate == null ? "" : "%"}</small></div>
      <div style="padding-bottom:8px">${stChip(rate)}<div class="muted" style="font-size:13px;margin-top:6px">${rate == null ? "필수 상품을 먼저 정해 주세요" : `필수 ${must}개 중 <b style="color:var(--ink)">${out}개</b> 품절`}</div></div></div>
      ${noMust.length ? `<div class="muted" style="font-size:13px;margin-top:12px">필수 상품이 아직 없는 지점: ${noMust.map((x) => esc(ho(x.b))).join(", ")} → <button data-tab="must" style="color:var(--accent);font-weight:600">정하기</button></div>` : ""}</div>
    <div class="card"><h2>오늘 업무</h2><div class="sub">관리자가 나눠 준 업무 중 직원앱에서 [완료]한 것</div>
      <div class="hero"><div class="num">${tDone}<small>/${tAll}</small></div><div class="muted" style="padding-bottom:10px;font-size:13px">${tAll ? `${Math.round((tDone / tAll) * 100)}% 완료` : "오늘 예정된 업무가 없어요"}</div></div>
      <div style="height:8px;border-radius:99px;background:var(--accent-soft);margin-top:14px;overflow:hidden"><div style="height:100%;width:${tAll ? (tDone / tAll) * 100 : 0}%;background:var(--accent);border-radius:99px"></div></div></div>
  </div>
  <div class="card"><h2>지점별 결품률</h2><div class="sub">선은 최근 14일 (하루 마지막 값) · 기준: 5% 이하 좋음 · 15% 초과 위험 (시험값)</div>
    <div class="tiles">${D.branches.map(tileHtml).join("")}</div></div>
  <div class="card"><h2>품절된 필수 상품 <span class="muted" style="font-weight:600">${outs.length}개</span></h2><div class="sub">'다른 지점'은 그 상품이 포스 재고에 있는 지점 — 지점 이동 요청할 때 참고</div>
    <div class="chips" style="margin-bottom:10px"><button class="chip ${!outFilter ? "on" : ""}" data-of="">전체</button>${D.branches.filter((x) => x.out.length).map((x) => `<button class="chip ${outFilter === x.b ? "on" : ""}" data-of="${x.b}">${esc(ho(x.b))} ${x.out.length}</button>`).join("")}</div>
    ${outs.length ? `<div class="scroll"><table><thead><tr><th>지점</th><th>상품</th><th>분류</th><th>다른 지점 재고</th></tr></thead><tbody>
      ${outs.map((o) => `<tr><td style="white-space:nowrap">${esc(ho(o.b))}</td><td><b>${esc(o.n)}</b></td><td class="muted">${esc(o.m)}</td><td>${o.others.length ? o.others.map((b) => `<span class="mini">${esc(ho(b))}</span>`).join("") : '<span class="muted">없음</span>'}</td></tr>`).join("")}
    </tbody></table></div>` : '<div class="muted">품절된 필수 상품이 없어요</div>'}</div>
  <div class="card"><h2>오늘 업무 현황</h2><div class="sub">✓ 완료(이름·시각) · ○ 아직 · — 오늘 대상 아님</div>${matrixHtml()}</div>`;
}
function tileHtml(x) {
  const h = D.hist[x.b] || [];
  if (!x.connected) return `<div class="tile off"><div class="nm">${esc(ho(x.b))}</div><div class="v">—</div><div class="meta">포스 연결 전 (지점 로그인하면 붙어요)</div></div>`;
  if (!x.must) return `<div class="tile"><div class="nm">${esc(ho(x.b))}</div><div class="v">—</div><div class="meta">필수 상품을 정해 주세요 · 재고 ${esc(x.stockAt || "")}</div></div>`;
  return `<div class="tile"><div class="nm">${esc(ho(x.b))} ${stChip(x.rate)}</div><div class="v">${x.rate}<small>%</small></div>
    <div class="meta">필수 ${x.must} · 품절 ${x.out.length}${x.gone.length ? ` · 포스에 없음 ${x.gone.length}` : ""} · 재고 ${esc(x.stockAt || "")}</div>
    ${sparkSvg(h)}<div class="meta">오늘 업무 ${x.tasks.done}/${x.tasks.total}</div></div>`;
}
function sparkSvg(h) {
  const pts = h.filter(([, v]) => v != null);
  if (pts.length < 2) return `<div class="meta" style="height:40px;display:flex;align-items:center">추이는 이틀 이상 쌓이면 보여요</div>`;
  const W = 200, H = 40, max = Math.max(10, ...pts.map(([, v]) => v)), n = h.length;
  const xy = h.map(([d, v], i) => v == null ? null : [4 + (i / (n - 1)) * (W - 8), H - 4 - (v / max) * (H - 8), d, v]).filter(Boolean);
  const path = xy.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join("");
  const last = xy.at(-1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-pts='${JSON.stringify(xy.map(([x, , d, v]) => [x, d, v]))}'>
    <line x1="0" x2="${W}" y1="${H - 4}" y2="${H - 4}" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--accent)" stroke="var(--card)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function bindSparks() {
  const tip = $("#tip");
  document.querySelectorAll(".spark").forEach((s) => {
    const pts = JSON.parse(s.dataset.pts);
    s.addEventListener("pointermove", (e) => {
      const r = s.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width) * 200;
      const p = pts.reduce((a, c) => (Math.abs(c[0] - x) < Math.abs(a[0] - x) ? c : a));
      tip.textContent = `${p[1].slice(5).replace("-", "/")} · 결품률 ${p[2]}%`; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY - 30 + "px"; tip.style.opacity = 1;
    });
    s.addEventListener("pointerleave", () => (tip.style.opacity = 0));
  });
}
function matrixHtml() {
  if (!D.matrix.length) return '<div class="muted">등록된 업무가 없어요 · <button data-tab="tasks" style="color:var(--accent);font-weight:600">업무 분배</button>에서 만들어요</div>';
  return `<div class="scroll"><table><thead><tr><th>업무</th>${BR.map((b) => `<th style="text-align:center">${esc(ho(b))}</th>`).join("")}</tr></thead><tbody>
    ${D.matrix.map((t) => `<tr><td><b>${esc(t.title)}</b>${t.time ? ` <span class="muted">${esc(t.time)}</span>` : ""}</td>${BR.map((b) => { const v = t.br[b];
      return `<td style="text-align:center;font-size:13px">${v === undefined || v === null ? '<span class="muted">—</span>' : v === false ? '<span class="muted">○</span>' : `<span class="ok">✓</span><br><span class="muted">${esc(v.by)} ${esc(v.t)}</span>`}</td>`; }).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}
const REP_TXT = (t) => t.rep === "once" ? `${t.date.slice(5).replace("-", "/")} 한 번` : t.rep === "daily" ? "매일" : t.rep === "weekly" ? `매주 ${(t.dow || []).map((d) => "일월화수목금토"[d]).join("·")}` : `매월 ${t.dom}일`;
function tasksHtml() {
  const t = editTask || { id: "", title: "", note: "", time: "", br: [], rep: "once", date: D.d, dow: [], dom: 1 };
  editTask = t;
  return `<div class="two"><div class="card"><h2>${t.id ? "업무 고치기" : "새 업무"}</h2><div class="sub">저장하면 대상 지점 직원앱 '오늘 할 일'에 떠요 (1~2분)</div>
    <div class="lbl">무엇을</div><input class="in" id="tTitle" maxlength="60" placeholder="예) 진열장 유리 닦기" value="${esc(t.title)}">
    <div class="lbl">메모 (선택)</div><input class="in" id="tNote" maxlength="200" placeholder="예) 사진 찍어서 디스코드에" value="${esc(t.note)}">
    <div class="lbl">어느 지점</div><div class="chips"><button class="chip ${t.br.length === 8 ? "on" : ""}" data-tball>전체</button>${BR.map((b) => `<button class="chip ${t.br.includes(b) ? "on" : ""}" data-tb="${b}">${esc(ho(b))}</button>`).join("")}</div>
    <div class="lbl">언제</div><div class="chips">${[["once", "한 번"], ["daily", "매일"], ["weekly", "매주"], ["monthly", "매월"]].map(([k, n]) => `<button class="chip ${t.rep === k ? "on" : ""}" data-trep="${k}">${n}</button>`).join("")}</div>
    <div style="margin-top:10px">${t.rep === "once" ? `<input class="in" type="date" id="tDate" value="${esc(t.date)}" style="max-width:200px">`
      : t.rep === "weekly" ? `<div class="chips">${[1, 2, 3, 4, 5, 6, 0].map((d) => `<button class="chip ${t.dow.includes(d) ? "on" : ""}" data-tdow="${d}">${"일월화수목금토"[d]}</button>`).join("")}</div>`
      : t.rep === "monthly" ? `<div class="row"><input class="in" type="number" id="tDom" min="1" max="31" value="${t.dom}" style="max-width:100px"> <span class="muted">일</span></div>` : ""}</div>
    <div class="lbl">시각 (선택)</div><input class="in" type="time" id="tTime" value="${esc(t.time)}" style="max-width:160px">
    <div class="row" style="margin-top:16px"><button class="btn primary" data-act="tsave">저장</button>${t.id ? `<button class="btn" data-act="tnew">새로 만들기</button><button class="btn" data-act="tdel" style="color:var(--crit)">삭제</button>` : ""}</div></div>
  <div class="card"><h2>등록된 업무 <span class="muted" style="font-weight:600">${D.tasks.length}개</span></h2><div class="sub">누르면 고칠 수 있어요</div>
    ${D.tasks.length ? D.tasks.map((x) => `<div class="task"><div class="t"><b>${esc(x.title)}</b><span>${esc(REP_TXT(x))}${x.time ? " · " + esc(x.time) : ""} · ${x.br.length === 8 ? "전 지점" : x.br.map((b) => esc(ho(b))).join(", ")}</span></div><button class="btn" data-tedit="${x.id}">고치기</button></div>`).join("") : '<div class="muted">아직 없어요</div>'}
  </div></div>
  <div class="card"><h2>오늘 업무 현황</h2>${matrixHtml()}</div>`;
}
function mustHtml() {
  const prods = D.products[mustB] || [];
  if (!draft || draft.b !== mustB) draft = { b: mustB, set: new Set(D.must[mustB] || []) };
  const cats = [...new Set(prods.map(([, m]) => m))];
  const words = mustQ.split(/\s+/).filter(Boolean);
  const list = prods.filter(([n, m]) => (!mustCat || m === mustCat) && words.every((w) => n.replace(/\s/g, "").includes(w)));
  const saved = new Set(D.must[mustB] || []), changed = [...draft.set].filter((n) => !saved.has(n)).length + [...saved].filter((n) => !draft.set.has(n)).length;
  const gone = [...draft.set].filter((n) => !prods.some(([p]) => p === n));
  return `<div class="card"><h2>꼭 있어야 할 상품</h2><div class="sub">지점마다 '이건 떨어지면 안 된다'는 상품을 체크하세요. 결품률은 이 목록 기준이에요.</div>
    <div class="chips" style="margin-bottom:12px">${BR.map((b) => `<button class="chip ${mustB === b ? "on" : ""}" data-mb="${b}">${esc(ho(b))} ${(D.must[b] || []).length || ""}</button>`).join("")}</div>
    ${!prods.length ? `<div class="muted">${esc(ho(mustB))}는 아직 포스 상품 목록이 없어요 (지점 로그인 후 생겨요)</div>` : `
    <div class="row"><input class="in" id="mq" placeholder="상품 찾기 (예: 빌런 자두)" value="${esc(mustQ)}" style="max-width:320px">
      <select class="in" id="mcat" style="max-width:220px"><option value="">분류 전체</option>${cats.map((c) => `<option ${c === mustCat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <button class="btn" data-act="mall">보이는 것 모두 체크</button><button class="btn" data-act="mnone">보이는 것 모두 해제</button>
      <select class="in" id="mcopy" style="max-width:200px"><option value="">다른 지점 목록 가져오기</option>${BR.filter((b) => b !== mustB && (D.must[b] || []).length).map((b) => `<option value="${b}">${esc(ho(b))} (${D.must[b].length})</option>`).join("")}</select></div>
    <div class="row"><b>${draft.set.size}개 체크</b><span class="muted">${changed ? `· 바뀐 것 ${changed}개 (저장 전)` : "· 저장된 상태"}</span>
      <button class="btn primary" data-act="msave" ${changed ? "" : "disabled"} style="margin-left:auto">저장</button></div>
    ${gone.length ? `<div class="muted" style="font-size:13px;margin-bottom:8px">⚠ 포스 목록에 없는 필수 상품 ${gone.length}개: ${gone.map(esc).join(", ")}</div>` : ""}
    <div class="plist">${list.slice(0, 600).map(([n, m]) => `<label class="prow"><input type="checkbox" data-mn="${esc(n)}" ${draft.set.has(n) ? "checked" : ""}><span>${esc(n)}</span><span class="c">${esc(m)}</span></label>`).join("") || '<div class="muted" style="padding:12px 0">없어요</div>'}
    ${list.length > 600 ? `<div class="muted" style="padding:10px 0">${list.length - 600}개 더 있어요 · 검색이나 분류로 좁혀 주세요</div>` : ""}</div>`}</div>`;
}
// 필수 상품 저장: 디스코드 메시지 길이(2000자) 때문에 나눠서 보냄
async function saveMust() {
  const saved = new Set(D.must[mustB] || []), add = [...draft.set].filter((n) => !saved.has(n)), del = [...saved].filter((n) => !draft.set.has(n));
  const chunks = (arr) => { const out = []; let cur = []; for (const n of arr) { if (JSON.stringify([...cur, n]).length > 1200) { out.push(cur); cur = []; } cur.push(n); } if (cur.length) out.push(cur); return out; };
  const btn = document.querySelector('[data-act="msave"]'); btn.disabled = true; btn.textContent = "저장 중…";
  try {
    for (const c of chunks(add)) { await sendOp("mustAdd", { b: mustB, names: c }); await new Promise((r) => setTimeout(r, 700)); }
    for (const c of chunks(del)) { await sendOp("mustDel", { b: mustB, names: c }); await new Promise((r) => setTimeout(r, 700)); }
    D.must[mustB] = [...draft.set]; draft = null; render(); toast("저장했어요 · 결품률은 1~2분 뒤 반영돼요");
    setTimeout(() => reload(true), 90e3);
  } catch (e) { btn.disabled = false; btn.textContent = "저장"; toast("저장 못 했어요 · 다시 눌러 주세요"); }
}
function readTaskForm() {
  const t = editTask; t.title = $("#tTitle").value.trim(); t.note = $("#tNote").value.trim(); t.time = $("#tTime").value;
  if ($("#tDate")) t.date = $("#tDate").value; if ($("#tDom")) t.dom = +$("#tDom").value || 1;
}
async function saveTask() {
  readTaskForm(); const t = editTask;
  if (!t.title) return toast("무엇을 할지 적어 주세요"); if (!t.br.length) return toast("지점을 골라 주세요");
  if (t.rep === "weekly" && !t.dow.length) return toast("요일을 골라 주세요");
  t.id ||= Date.now().toString(36);
  try { await sendOp("task", t); const i = D.tasks.findIndex((x) => x.id === t.id); i >= 0 ? (D.tasks[i] = { ...t }) : D.tasks.push({ ...t }); editTask = null; render(); toast("저장했어요 · 직원앱에는 1~2분 뒤 떠요"); setTimeout(() => reload(true), 90e3); }
  catch (e) { toast("저장 못 했어요 · 다시 눌러 주세요"); }
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button,[data-mn]"); if (!t) return;
  if (t.id === "go") return tryLogin();
  if (t.dataset.tab) { tab = t.dataset.tab; ls.set("vf-admin-tab", tab); return render(); }
  const a = t.dataset.act;
  if (a === "reload") return reload();
  if (a === "logout") { ls.set("vf-admin-key", null); KEY = D = null; return renderLogin("잠갔어요"); }
  if (t.dataset.of !== undefined) { outFilter = t.dataset.of; return render(); }
  // 업무
  if (t.dataset.tball !== undefined) { readTaskForm(); editTask.br = editTask.br.length === 8 ? [] : [...BR]; return render(); }
  if (t.dataset.tb) { readTaskForm(); const b = t.dataset.tb, s = new Set(editTask.br); s.has(b) ? s.delete(b) : s.add(b); editTask.br = BR.filter((x) => s.has(x)); return render(); }
  if (t.dataset.trep) { readTaskForm(); editTask.rep = t.dataset.trep; return render(); }
  if (t.dataset.tdow) { readTaskForm(); const d = +t.dataset.tdow, s = new Set(editTask.dow); s.has(d) ? s.delete(d) : s.add(d); editTask.dow = [...s]; return render(); }
  if (t.dataset.tedit) { editTask = JSON.parse(JSON.stringify(D.tasks.find((x) => x.id === t.dataset.tedit))); editTask.dow ||= []; return render(); }
  if (a === "tnew") { editTask = null; return render(); }
  if (a === "tsave") return saveTask();
  if (a === "tdel") { if (!confirm(`'${editTask.title}' 업무를 지울까요?`)) return; try { await sendOp("taskdel", { id: editTask.id }); D.tasks = D.tasks.filter((x) => x.id !== editTask.id); editTask = null; render(); toast("지웠어요"); } catch { toast("못 지웠어요"); } return; }
  // 필수 상품
  if (t.dataset.mb) { mustB = t.dataset.mb; ls.set("vf-admin-mustb", mustB); mustCat = ""; mustQ = ""; draft = null; return render(); }
  if (a === "mall" || a === "mnone") { document.querySelectorAll("[data-mn]").forEach((c) => (a === "mall" ? draft.set.add(c.dataset.mn) : draft.set.delete(c.dataset.mn))); return render(); }
  if (a === "msave") return saveMust();
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.mn !== undefined) { e.target.checked ? draft.set.add(e.target.dataset.mn) : draft.set.delete(e.target.dataset.mn); const y = $(".plist").scrollTop; render(); $(".plist").scrollTop = y; return; }
  if (e.target.id === "mcat") { mustCat = e.target.value; return render(); }
  if (e.target.id === "mcopy" && e.target.value) { const from = new Set(D.must[e.target.value] || []), names = new Set((D.products[mustB] || []).map(([n]) => n)); let k = 0; for (const n of from) if (names.has(n) && !draft.set.has(n)) { draft.set.add(n); k++; } render(); toast(`${k}개 더했어요 · 저장을 눌러야 반영돼요`); }
});
let qT; document.addEventListener("input", (e) => { if (e.target.id === "mq") { clearTimeout(qT); qT = setTimeout(() => { mustQ = e.target.value.trim(); const pos = e.target.selectionStart; render(); const el = $("#mq"); el.focus(); el.setSelectionRange(pos, pos); }, 250); } });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "pw") tryLogin(); });

(async () => {
  const saved = ls.get("vf-admin-key");
  if (!saved) return renderLogin();
  try { KEY = b64.from(saved); RAW = await fetchEnc(); D = await decrypt(RAW, KEY); render(); }
  catch { ls.set("vf-admin-key", null); KEY = null; renderLogin(); }
})();
setInterval(() => KEY && reload(true), 3 * 60e3);
</script>
