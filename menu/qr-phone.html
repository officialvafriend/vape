<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F4">
<title>포스 주문 QR</title>
<script src="qrcode.js"></script>
<style>
:root{--bg:#F2F2F4;--card:#fff;--ink:#15120f;--grey:#6b6b70;--red:#e8262c;--ok:#1f8a4c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--grey);margin-bottom:12px}
.top b{color:var(--ink);font-size:17px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:14px}
.wait{text-align:center;padding:60px 20px}
.wait b{display:block;font-size:24px;margin-bottom:10px}
.wait span{display:block;font-size:17px;color:var(--grey);line-height:1.6}
.code{display:inline-block;margin-top:14px;font-size:30px;font-weight:800;letter-spacing:.12em;background:var(--bg);border-radius:12px;padding:8px 18px}
.hd b{display:block;font-size:24px;line-height:1.3}
.hd em{display:block;font-style:normal;font-size:16px;color:var(--grey);margin-bottom:4px}
.memo{display:inline-block;margin-top:8px;font-size:16px;font-weight:700;background:#fff3d6;color:#7a4b00;border-radius:10px;padding:6px 10px;line-height:1.4}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tab{flex:0 0 auto;min-width:120px;border:2px solid #ddd;background:#fff;border-radius:14px;padding:10px 12px;text-align:left}
.tab b{display:block;font-size:19px}
.tab span{display:block;font-size:15px;color:var(--grey);margin-top:2px}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
.tab.on span{color:#ddd}
.hd span{display:block;font-size:15px;color:var(--grey);margin-top:4px;line-height:1.5}
.step{font-size:18px;font-weight:800;margin:18px 0 8px}
.step.svc{color:var(--red)}
.qr{text-align:center}
.qr svg{width:100%;max-width:440px;height:auto}
.qr i{display:block;font-style:normal;font-size:17px;font-weight:700;margin-top:6px}
.done{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;height:68px;border:0;border-radius:18px;background:var(--ink);color:#fff;font-size:22px;font-weight:800}
.done:disabled{opacity:.4}
.more{font-size:16px;color:var(--grey);text-align:center;margin-top:8px}
select,.btn{width:100%;height:60px;border-radius:14px;font-size:20px;border:1px solid #ddd;background:#fff;margin-top:12px}
.btn{background:var(--ink);color:#fff;border:0;font-weight:800}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* 11/12 포스 옆 공기계: 상담패드가 보낸 주문의 QR만 크게 보여 줌. 승인된 기기만 주문을 읽음 (온라인팀 슈파베이스 qr_* 함수) */
const SB_URL = "https://bjjlmnkyhedtutogzliq.supabase.co", SB_KEY = "sb_publishable_i8rfcm_zAnwV75joN58FCw_8tHgFUKr";
const BR_LIST = ["본점", "동성로", "율하", "수성", "반월당", "상인", "광장코아", "현풍", "동성로2"];
const QR_MAX = 10;
const $ = (id) => document.getElementById(id), app = $("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const won = (n) => (n || 0).toLocaleString() + "원";
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let dev = ls.get("vf-qr-dev"), branch = ls.get("vf-qr-branch"), state = "boot", orders = [], busy = false;
if (!dev) { const a = new Uint8Array(18); crypto.getRandomValues(a); dev = [...a].map((b) => b.toString(16).padStart(2, "0")).join(""); ls.set("vf-qr-dev", dev); }
const short = () => dev.slice(0, 6).toUpperCase();
const rpc = async (fn, body) => { const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) }); if (!r.ok) throw new Error(r.status); return r.status === 204 ? null : r.json(); };
const qrSvg = (list) => { const q = qrcode(0, "M"); q.addData(list.join("\r") + "\r", "Byte"); q.make(); return q.createSvgTag({ cellSize: 6, margin: 4, scalable: true }); };
const chunks = (l) => { const o = []; for (let i = 0; i < l.length; i += QR_MAX) o.push(l.slice(i, i + QR_MAX)); return o; };
let wake = null; const keepAwake = async () => { try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) {} };
document.addEventListener("visibilitychange", () => { if (!document.hidden) { keepAwake(); tick(); } });

function draw() {
  const top = `<div class="top"><span>포스 주문 QR</span><b>${esc(branch || "")}</b></div>`;
  if (!branch) { app.innerHTML = top + `<div class="card"><div class="hd"><b>이 휴대폰은 어느 지점인가요?</b><span>한 번만 고르면 돼요</span></div><select id="br">${BR_LIST.map((b) => `<option>${b}</option>`).join("")}</select><button class="btn" id="brOk">이 지점으로 쓰기</button></div>`;
    $("brOk").onclick = () => { branch = $("br").value; ls.set("vf-qr-branch", branch); state = "boot"; draw(); tick(); }; return; }
  if (state === "wait") { app.innerHTML = top + `<div class="card wait"><b>승인을 기다리고 있어요</b><span>관리자가 이 휴대폰을 승인하면 바로 열려요.<br>아래 기기 코드를 알려 주세요.</span><div class="code">${short()}</div></div>`; return; }
  if (state === "err") { app.innerHTML = top + `<div class="card wait"><b>연결이 안 돼요</b><span>와이파이를 확인해 주세요.<br>잠시 뒤 다시 연결해요.</span></div>`; return; }
  if (!orders.length) { app.innerHTML = top + `<div class="card wait"><b>주문 기다리는 중</b><span>상담패드에서 [포스 옆 휴대폰으로 보내기]를 누르면 여기에 QR이 떠요</span></div>`; return; }
  const o = orders.find((x) => x.id === sel) || orders[0]; sel = o.id;
  const codes = o.codes || [], svc = o.svc || [], pq = chunks(codes), sq = chunks(svc), t = new Date(o.created_at), c = o.cust || null;
  const part = (k, n) => n > 1 ? ` ${k + 1}/${n}` : "";
  /* 11/12 액상덕후 "주문이 여러 건이면 클로드98 010-1234-1234님의 주문": 손님 이름, 번호, 회원 할 일 */
  const who = c ? `${c.nm ? esc(c.nm) + " " : ""}${esc(phFmt(c.ph))}님의 주문` : "손님 정보 없는 주문";
  const memo = !c ? "" : c.t === "new" ? (c.st === "ok" ? "새 회원, 포스에 회원등록 됐어요" : c.st === "dup" ? "이미 회원이에요, 번호로 찾아 주세요" : "새 회원, 포스에서 회원등록 해 주세요") + (c.sms === "Y" ? " (쿠폰 문자 동의)" : " (문자 받기 안 함)")
    : c.st === "found" ? "회원 확인됐어요, 번호로 찾아 주세요" : c.st === "none" ? "회원 없음, 번호로 다시 확인해 주세요" : "회원이에요, 번호로 찾아 주세요";
  const tabs = orders.length > 1 ? `<div class="tabs">${orders.map((x) => `<button class="tab${x.id === o.id ? " on" : ""}" data-id="${x.id}"><b>${x.id % 1000}번</b><span>${x.cust ? esc((x.cust.nm || "회원") + " " + String(x.cust.ph || "").slice(-4)) : "손님 정보 없음"}</span></button>`).join("")}</div>` : "";
  app.innerHTML = top + tabs + `<div class="card"><div class="hd"><em>${o.id % 1000}번 주문, ${t.getHours()}시 ${String(t.getMinutes()).padStart(2, "0")}분${o.total ? ", " + won(o.total) : ""}</em><b>${who}</b>${memo ? `<div class="memo">${memo}</div>` : ""}<span>${esc(o.summary || "")}</span></div>
    ${pq.map((l, k) => `<div class="step">결제 QR 찍기${part(k, pq.length)}</div><div class="qr">${qrSvg(l)}<i>${l.length}개 찍힘</i></div>`).join("")}
    ${sq.map((l, k) => `<div class="step svc">서비스 QR 찍기${part(k, sq.length)}</div><div class="qr">${qrSvg(l)}<i>찍은 뒤 새로 들어온 ${l.length}개는 서비스(0원) 처리</i></div>`).join("")}
    </div>
    <button class="done" id="done">${o.id % 1000}번 다 찍었어요, 완료</button>`;
  app.querySelectorAll(".tab").forEach((b) => b.onclick = () => { sel = Number(b.dataset.id); draw(); window.scrollTo(0, 0); });
  $("done").onclick = async () => { const b = $("done"); b.disabled = true; try { await rpc("qr_done", { p_dev: dev, p_id: o.id }); orders = orders.filter((x) => x.id !== o.id); sel = null; draw(); window.scrollTo(0, 0); tick(); } catch (e) { b.disabled = false; b.textContent = "다시 눌러 주세요"; } };
}
const phFmt = (p) => { p = String(p || "").replace(/\D/g, ""); return p.length >= 10 ? p.slice(0, 3) + "-" + p.slice(3, p.length - 4) + "-" + p.slice(-4) : p; };
let sel = null;
let lastKey = "";
async function tick() {
  if (busy || !branch) return; busy = true;
  try {
    const h = await rpc("qr_hello", { p_dev: dev, p_branch: branch, p_label: navigator.userAgent.slice(0, 50) });
    if (!String(h).startsWith("ok:")) { if (state !== "wait") { state = "wait"; draw(); } return; }
    const b = String(h).slice(3); if (b !== branch) { branch = b; ls.set("vf-qr-branch", b); }
    const list = await rpc("qr_pending", { p_dev: dev }) || [];
    const key = list.map((x) => x.id).join(",");
    if (state !== "ok" || key !== lastKey) { const gone = !list.some((x) => x.id === sel); orders = list; lastKey = key; state = "ok"; if (gone) sel = null; const y = window.scrollY; draw(); window.scrollTo(0, gone ? 0 : y); } /* 11/12 보던 주문은 그대로, 새 주문은 위 번호 칸에 추가 */
  } catch (e) { if (state !== "err") { state = "err"; draw(); } }
  finally { busy = false; }
}
draw(); keepAwake(); tick(); setInterval(tick, 2000);
</script>
</body>
</html>
