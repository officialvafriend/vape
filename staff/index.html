<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191f28">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>베이프렌드 직원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f2f4f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--sub:#8b95a1;--line:#e5e8eb;--blue:#3182f6;--blue-soft:#e8f3ff;--green:#03b26c;--green-soft:#e5f8ef;--red:#f04452;--red-soft:#fdecee;--amber:#b77700;--amber-soft:#fff4dc;--dark:#191f28}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .logo{font-weight:800;font-size:18px} .logo b{color:var(--blue)}
  .store{background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
  .date{margin-left:auto;color:var(--sub);font-size:14px;font-weight:500}
  .hero{background:var(--dark);color:#fff;border-radius:22px;padding:22px;margin-bottom:12px}
  .hero h1{font-size:22px;letter-spacing:-.4px;line-height:1.35}
  .hero p{color:#b0b8c1;margin-top:6px;font-size:14px}
  .hero .bar{height:8px;background:rgba(255,255,255,.15);border-radius:99px;margin-top:16px;overflow:hidden}
  .hero .bar i{display:block;height:100%;background:#64a8ff;border-radius:99px;transition:width .3s}
  .card{background:var(--card);border-radius:20px;padding:6px 18px;margin-bottom:12px}
  .card h2{font-size:15px;color:var(--sub);font-weight:700;padding:14px 0 4px}
  .step{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .card h2+.step{border-top:0}
  .num{width:34px;height:34px;border-radius:50%;background:#f2f4f6;color:var(--ink2);display:grid;place-items:center;font-weight:800;flex:none}
  .step.done .num{background:var(--green-soft);color:var(--green)}
  .step .tx{flex:1;min-width:0} .step .tx b{display:block;font-size:16px} .step .tx span{font-size:13px;color:var(--sub)}
  .step .tx span.w{color:var(--amber)}
  .act{height:42px;padding:0 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;flex:none;text-decoration:none;display:inline-flex;align-items:center}
  .act.gray{background:#f2f4f6;color:var(--ink2)}
  .links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .links a{background:var(--card);border-radius:18px;padding:16px;text-decoration:none;color:var(--ink);font-weight:700}
  .tile{background:#f2f4f6;border-radius:16px;padding:16px;text-align:left;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;display:block}.tile span{display:block;font-size:13px;color:var(--sub);font-weight:500;margin-top:4px}
  .card .links{margin-bottom:0}
  .links a span{display:block;font-size:13px;color:var(--sub);font-weight:500;margin-top:4px}
  .foot{font-size:12px;color:var(--sub);text-align:center;margin-top:18px;line-height:1.6}
  .foot button{color:var(--blue);font-weight:600;font-size:12px}
  /* 지점 고르기 */
  .pick h1{font-size:22px;margin:20px 4px 6px} .pick p{color:var(--sub);margin:0 4px 16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid button{background:var(--card);border-radius:18px;padding:20px 16px;text-align:left;font-weight:700;font-size:17px}
  .grid button span{display:block;font-size:13px;color:var(--sub);font-weight:600}
  /* 아래에서 올라오는 창 */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .dim.on{display:flex}
  .sheet{background:#fff;width:min(560px,100%);border-radius:24px 24px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h2{font-size:21px;letter-spacing:-.4px} .sheet .desc{color:var(--sub);margin-top:6px;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{padding:11px 15px;border-radius:12px;background:#f2f4f6;font-weight:600}
  .chip.on{background:var(--blue);color:#fff}
  .input{margin-top:12px;width:100%;height:52px;border-radius:14px;border:1px solid var(--line);padding:0 16px;font:inherit;font-size:16px;outline:none}
  .input:focus{border-color:var(--blue)}
  .check{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:16px;width:100%;text-align:left}
  .check:first-of-type{border-top:0;margin-top:8px}
  .check i{width:26px;height:26px;border-radius:8px;border:2px solid #d1d6db;display:grid;place-items:center;flex:none;font-style:normal;color:#fff;font-size:15px}
  .check.on i{background:var(--blue);border-color:var(--blue)}
  .btns{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;height:54px;border-radius:14px;font-weight:700;font-size:16px;background:#f2f4f6}
  .btn.primary{background:var(--blue);color:#fff} .btn:disabled{opacity:.5}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .reqs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .reqs button{text-align:left;padding:14px;border-radius:14px;background:#f2f4f6}
  .reqs b{display:block;font-size:16px}.reqs span{font-size:13px;color:#8b95a1}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  textarea.input{height:auto;padding-top:12px;font:inherit}
  .qrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .qrow div{flex:1;min-width:0}.qrow b{display:block}.qrow span{display:block;font-size:13px;color:var(--ink2)}.qrow em{font-style:normal;font-size:13px;color:var(--blue);font-weight:700}
  .qres{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .qr{text-align:left;padding:12px 14px;border-radius:12px;background:#f2f4f6;font-weight:600}.qr i{float:right;font-style:normal;color:var(--blue);font-weight:800}
  .qitems{margin-top:10px}.qit{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
  .qst{display:flex;align-items:center;gap:4px}.qst button{width:40px;height:40px;border-radius:10px;background:#f2f4f6;font-size:20px;font-weight:800}.qst b{min-width:26px;text-align:center}
  .qr small,.qit small{display:inline-block;margin-left:6px;font-size:12px;color:var(--blue);font-weight:700;background:var(--blue-soft);padding:2px 6px;border-radius:6px}
  .done1{display:flex;flex-direction:column;gap:4px}.done1 b{color:var(--green);font-size:16px}.done1 span{font-size:13px;color:var(--ink2)}
  /* 고객요청, 인수인계 (10/6) */
  .crow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .card h2+.crow,.sheet .desc+.crow{border-top:0}
  .crow>div{flex:1;min-width:0}.crow b{display:block;font-size:15px}.crow span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}.crow em{display:block;font-style:normal;font-size:13px;font-weight:700;color:var(--blue);margin-top:3px}
  .crow.late{box-shadow:inset 3px 0 0 var(--red);padding-left:10px}.crow.late span{color:var(--red)}
  .crow.arr{background:var(--amber-soft);border-radius:12px;padding:12px;border-top:0;margin:4px 0}.crow.arr em{color:var(--amber)}
  /* 재고조사 (10/6) */
  .sv-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .sv-row b{flex:1;font-size:15px;font-weight:600;min-width:0}
  .sv-row input{width:76px;height:44px;border-radius:12px;border:1px solid var(--line);text-align:center;font:inherit;font-size:18px;font-weight:700;outline:none}
  .sv-row input:focus{border-color:var(--blue)} .sv-row.done input{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue)}
  .sv-bar{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:#fff;padding:12px 0 calc(4px + env(safe-area-inset-bottom));margin-top:8px}
  .pill{font-style:normal;font-weight:700;font-size:12px;padding:1px 6px;border-radius:6px}.pill.ok{background:var(--green-soft);color:var(--green)}.pill.no{background:var(--red-soft);color:var(--red)}
  /* 관리자 페이지 틀 (10/14) — 폰: 아래 메뉴 / PC: 왼쪽 메뉴 + 요약 4칸 + 메뉴별 화면 */
  .side,.phead,.pconly{display:none}
  .mainv{padding-bottom:84px}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:700;color:var(--sub)}
  .bnav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.6}.bnav button.on{color:var(--ink)}.bnav button.on i{filter:none;opacity:1}
  .bnav button i{position:relative}.bnav .bd,.navb .bd{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;font-style:normal;margin-left:4px}
  .todo .crow b{font-size:15px}.todo .crow em{font-style:normal;font-size:12px;font-weight:700}.todo .tbtn{display:flex;gap:6px;flex-shrink:0}
  .say{background:var(--blue-soft);color:var(--ink);border-radius:14px;padding:16px;font-size:18px;font-weight:800;line-height:1.5;margin:12px 0}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border-radius:18px;padding:14px 16px;text-align:left}
  .kpi span{display:block;font-size:13px;color:var(--sub);font-weight:700}.kpi b{display:block;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
  .kpi em{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi.red b,.kpi.red em{color:var(--red)}
  @media (min-width:900px){
    .app{max-width:none;padding:0}
    .bnav,.mtop{display:none!important}
    .shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
    .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:28px 14px 22px;background:var(--card);border-right:1px solid var(--line)}
    .side .logo{font-size:19px;padding:0 12px 14px}
    .navb{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:14px;font-size:15px;font-weight:600;color:var(--ink2);width:100%;text-align:left;text-decoration:none}
    .navb i{font-style:normal;font-size:19px;width:24px;text-align:center}.navb:hover{background:#f2f4f6}.navb.on{background:var(--blue-soft);color:var(--blue)}
    .sfoot{margin-top:auto;display:flex;flex-direction:column;gap:2px}.sfoot .navb{font-size:14px;height:42px}
    .mainv{padding:28px 34px 40px;max-width:1240px;width:100%}
    .phead{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}.phead h1{font-size:26px;letter-spacing:-.5px}.phead span{color:var(--sub);font-size:14px}
    .pconly{display:block}
    .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
    .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
    .cols.one{grid-template-columns:minmax(0,760px)}
  }
  .cash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
  .cash label{display:block}.cash span{display:block;font-size:13px;color:var(--sub);font-weight:700;margin-top:10px}.cash .input{margin-top:4px}
  .cashsum{margin-top:14px;background:#f2f4f6;border-radius:14px;padding:12px 14px}
  .cashsum div{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}.cashsum div span{color:var(--ink2)}.cashsum .hi b{color:var(--blue);font-size:18px}
  .cashsum p{font-size:12px;color:var(--sub);margin-top:4px}
  /* 마감 보고 간단히 (10/19 저녁): 5만, 1만 큰 칸 60px 22px / 잔돈 5칸 한 줄 48px */
  .cash.big .input{height:60px;font-size:22px;font-weight:700}
  .cash.coins{grid-template-columns:repeat(5,minmax(0,1fr));gap:0 6px}.cash.coins .input{height:48px;padding:0 6px;text-align:center;font-size:15px}.cash.coins span{font-size:12px;text-align:center}
  .morebtn{display:block;margin:18px auto 4px;font-size:13px;color:var(--sub);text-decoration:underline;background:none}
  /* 마감 보고 (10/19): 묶음 제목 14px 700, 묶음 사이 20px, 차액 22px 800, KPI 2열 카드 */
  .sheet .grp{font-size:14px;font-weight:700;color:var(--ink);margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .sheet .grp small{font-weight:500;color:var(--sub);font-size:12px;margin-left:4px}
  .cash span small{font-weight:500}
  em.req{color:var(--red);font-style:normal}
  .cashsum .hi b{font-weight:800}
  .cashsum .diff{margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
  .cashsum .diff b{font-size:22px;font-weight:800}
  .cashsum .diff.good b{color:var(--green)} .cashsum .diff.bad b{color:var(--red)} .cashsum .diff:not(.good):not(.bad) b{font-size:14px;font-weight:600;color:var(--sub)}
  .kpig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
  .kpig div{background:#f2f4f6;border-radius:14px;padding:10px 12px}
  .kpig span{display:block;font-size:13px;color:var(--sub)} .kpig b{font-size:18px;font-weight:800}
  .exrow{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;align-items:center}
  .exrow .input{margin-top:8px} .exdel{height:52px;margin-top:8px;border-radius:14px;background:#f2f4f6;color:var(--sub);font-weight:700}
  .btn.sm{flex:none;height:44px;padding:0 16px;font-size:15px;margin-top:10px}
  .btn:disabled{opacity:.45}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="../menu/pos.js"></script>
<script>
const VER = "10.20-5";
// 실제 사이트(깃허브)에선 옆 폴더, 내 컴퓨터 미리보기에선 실제 사이트 주소로 (재고보고, 메뉴판 링크)
const SITE = location.hostname.endsWith("github.io") ? "../" : "https://officialvafriend.github.io/vape/";
const BR = ["동성로", "수성", "본점", "율하", "반월당", "상인", "광장코아", "현풍"];
// 오픈 체크가 오픈 시간보다 늦은 분 (안 늦었으면 0)
const lateMin = (t) => { const [h, m] = (t || "").split(":").map(Number), [oh, om] = (OPEN_AT[B] || "").split(":").map(Number); const d = h * 60 + m - (oh * 60 + om); return d > 0 && d < 600 ? d : 0; };
const OPEN_AT = { 동성로: "11:00", 수성: "10:30", 본점: "11:00", 율하: "10:30", 반월당: "10:30", 상인: "10:30", 광장코아: "11:00", 현풍: "11:00" };
// 운영봇(운영봇_시험.mjs)의 CHECK와 같은 목록이어야 기록이 맞아요
const CHECK = {
  open: ["바닥 쓸기/닦기, 유리, 거울 닦기", "진열장, 포스, 단말기 먼지 제거", "입/폐/일회용 기기 배터리 체크", "시연대 정리정돈", "자판기 청소, 작동 체크", "매장 환기", "유니폼 착용"],
  close: ["액상, 기기, 소모품 진열 채우기", "시연팟 체크, 코일 교환", "기기 배터리 체크", "수납공간 정리", "드립팁 세척, 종량제 확인", "자판기 체크(마감 전)", "매장 외부 청소", "순회점검표, 환기대장 작성"],
};
// 보내기: 디스코드 웹훅(🔌패드연결) → 운영봇이 받아 지점 보고 채널, 팀장보고, 시트에 기록
const HOOK = "https://discord.com/api/webhooks/1555156884753743905/BLK7tRBQACouQrOE_hvOkm2-iD44gnfnxdJvQXxiBAJKXJU3MG4bjnACFsXgDkDWLBrh";

const ls = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const now = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
// 10/19 영업일 기준: 새벽 5시 전은 전날 (금, 토 야간 근무자가 자정 넘어 퇴근해도 그날 기록으로). 봇 today()와 같은 기준
const todayKey = () => { const d = new Date(Date.now() - 5 * 3600e3); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ho = (b) => `${BR.indexOf(b) + 1}호 ${b}`;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }

const qs = new URLSearchParams(location.search);
// 10/19 시험 모드(?test=1): 신호에 test 표시 → 봇이 시험_ 탭에만 기록, 디스코드 알림 없음. 이 기기 기록도 따로
const TEST = qs.get("test") === "1";
const LEADER = qs.get("leader") === "1"; // 10/20 팀장 화면: 전 지점 넘어온 고객요청, 인수인계
// ?pick=1 이면 저장된 지점이 있어도 지점 고르기 화면부터 (드라이브 링크용)
let B = qs.has("pick") ? null : BR.includes(qs.get("branch")) ? qs.get("branch") : ls.get("vf-app-branch", null);
if (B) ls.set("vf-app-branch", B);
const dayKey = () => `vf-app-${TEST ? "test-" : ""}${B}-${todayKey()}`;
// 이 기기 기록 + 봇이 올린 오늘 현황(today.json)을 합쳐서 보여줌 — 다른 기기, 브라우저에서 한 것도 보이게 (10/5)
let SRV = null;
const st = () => {

    <div class="btns" style="margin-top:10px"><button class="btn" id="asCopy">문자 양식 복사</button>${r[AC.phone] ? `<a class="btn" style="display:grid;place-items:center;text-decoration:none;color:inherit" href="sms:${esc(r[AC.phone].replace(/[^0-9]/g, ""))}?body=${encodeURIComponent(asSmsText(r))}">문자 보내기</a>` : ""}</div>`;

    <div class="hero" style="margin:14px 0 4px;padding:14px 16px;border-radius:16px"><p style="margin:0;line-height:1.7">${AS_SHORT.map((s, k) => (k <= i ? `<b style="color:#fff">${s}</b>` : s)).join(" → ")}</p><div class="bar"><i style="width:${(i / 6) * 100}%"></i></div></div>

    ${extra}
    ${i < 6 && !can ? `<div class="desc" style="margin-top:12px">다음 단계(${AS_SHORT[i + 1]})는 ${AS_HQ_STEP[i] ? "본점" : "지점"}에서 처리해요.</div>` : ""}

  const cp = $("#asCopy"); if (cp) cp.onclick = async () => { const t = $("#asSms").value; try { await navigator.clipboard.writeText(t); } catch { $("#asSms").select(); document.execCommand("copy"); } toast("문자 양식을 복사했어요"); };
}
async function doAsNext(t) {

async function doAsAdd(t) {

  const brOn = document.querySelector("[data-asbr].on");
  t.disabled = true; t.textContent = "접수 중…";
  try { const j = await asApi({ action: "asAdd", branch: brOn ? brOn.dataset.asbr : (AS.who && AS.who.branch) || B, by, name: v("#asName"), phone: v("#asPhone"), device: v("#asDev"), bought: v("#asBought"), symptom: v("#asSym"), loan: v("#asLoan") }); closeSheet(); toast(`접수했어요, ${j.no}, 본점에 떠요`); asLoad(true); }

  if (go === "expadd") { const eb = $("#expBtn"); if (eb) eb.textContent = "＋ 지출 하나 더"; }

  if (t.id === "okSv") return doSurvey();
  if (t.dataset.go === "creq") return sheetCreq();
  if (t.dataset.go === "memo") return sheetMemo();

  if (t.dataset.mok) return doMemoOk(t.dataset.mok, !!t.dataset.keep);
  if (t.dataset.cradd) { const n = t.dataset.cradd; const it = cr.items.find((x) => x[0] === n); it ? it[1]++ : cr.items.push([n, 1]); $("#crFind").value = ""; $("#crRes").innerHTML = ""; return crDraw(); }
  if (t.dataset.crm) { const i = +t.dataset.crm; cr.items[i][1]--; if (cr.items[i][1] < 1) cr.items.splice(i, 1); return crDraw(); }
  if (t.dataset.crpl) { cr.items[+t.dataset.crpl][1]++; return crDraw(); }
  if (t.dataset.crh) { cr.how = t.dataset.crh; document.querySelectorAll("[data-crh]").forEach((x) => x.classList.toggle("on", x === t)); return; }

  if (t.dataset.crst) { cr.step = t.dataset.crst; cr.manual = true; document.querySelectorAll("[data-crst]").forEach((x) => x.classList.toggle("on", x === t)); crDueSync(); return; }

document.addEventListener("input", (e) => {
  if (e.target.id === "rqAddr") onAddr();
  if (CASH.some(([id]) => id === e.target.id)) { e.target.value = e.target.value.replace(/\D/g, "").slice(0, e.target.id === "cEtc" ? 8 : 4); closeCalc(); }
  // 마감 보고: 금액 칸은 쉼표 넣어 보여주고, 개수 칸은 숫자만
  if (MONEY.includes(e.target.id)) { const d = e.target.value.replace(/\D/g, "").slice(0, 10); e.target.value = d ? (+d).toLocaleString() : ""; closeCalc(); }
  if (KPI_IN.some(([id]) => id === e.target.id)) { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); closeCalc(); }
  if (e.target.id === "cWhy") closeCalc();
  if (e.target.id === "opPrep") { const d = e.target.value.replace(/\D/g, "").slice(0, 9); e.target.value = d ? (+d).toLocaleString() : ""; }
  if (e.target.dataset.exn !== undefined) CX[+e.target.dataset.exn].n = e.target.value;
  if (e.target.dataset.exa !== undefined) { const d = e.target.value.replace(/\D/g, "").slice(0, 8); e.target.value = d ? (+d).toLocaleString() : ""; CX[+e.target.dataset.exa].a = +d || 0; closeCalc(); }

  if (e.target.id === "crFind") { const q = e.target.value.trim(); $("#crRes").innerHTML = q ? qkFind(q).map((n) => `<button class="qr" data-cradd="${esc(n)}">${esc(n)}<small>${esc(QPOS()[n]?.[4] || "")}</small>${OUTS.has(n) ? '<small style="color:var(--red);background:var(--red-soft)">품절</small>' : ""} <i>+</i></button>`).join("") || '<div class="desc">못 찾았어요, 아래 칸에 직접 적어 주세요</div>' : ""; }
