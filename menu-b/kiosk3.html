<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=1280, user-scalable=no">
<script>
/* 폰 가로 화면(패드보다 옆으로 긴 화면)에서도 높이가 800으로 맞게: 화면 비율이 16:10보다 길면 폭을 그만큼 넓게 잡음. 패드에서는 1280 그대로 (11/20) */
(function () { var fit = function () { var r = window.innerWidth / Math.max(1, window.innerHeight), w = r > 1.62 ? Math.round(800 * r) : 1280; var m = document.getElementById("vp"), c = "width=" + w + ", user-scalable=no"; if (m && m.content !== c) m.content = c; };
  fit(); window.addEventListener("resize", fit); window.addEventListener("orientationchange", function () { setTimeout(fit, 250); }); })();
</script>
<title>상담패드 키오스크 시제품 3판 (크림, 캐릭터)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* 11/18 키오스크 시제품 2판, 가로 기본 (갤럭시 탭 A11 가로). 화면 폭을 1280 으로 고정해 어느 패드에서도 같은 비율로 보임.
   왼쪽은 무대(큰 사진, 질문), 오른쪽은 선택. 자료와 가격 계산은 B안(menu_b.html)을 뒤에 숨겨 열어 그대로 씀 */
:root{--bg:#FBF3E4;--card:#fff;--ink:#1B1A18;--g1:#6B6459;--g2:#A39A8C;--line:#EADFCB;--pt:#D81F2A;--ptbg:#FDECEC;--stage:#F4E4C6;--r:22px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;letter-spacing:-.015em;overflow:hidden;font-size:20px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
em{font-style:normal;color:var(--pt)}
#app{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}

header{flex:none;height:68px;background:var(--card);border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;gap:14px}
.logo{font-size:30px;font-weight:900;color:var(--pt);font-style:italic;letter-spacing:-.04em;margin-right:6px}
.steps{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden}
.steps button{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 7px;border-radius:23px;font-size:19px;font-weight:700;color:var(--g2);background:var(--bg);white-space:nowrap}
.steps button i{font-style:normal;width:32px;height:32px;border-radius:50%;background:#DDD;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.steps button.on{background:var(--ink);color:#fff}.steps button.on i{background:#fff;color:var(--ink)}
.steps button.done{color:var(--ink)}.steps button.done i{background:var(--pt)}
.steps .br{font-size:19px;font-weight:700;color:var(--g1)}
.home{flex:none;height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);font-size:18px;font-weight:700;color:var(--g1)}

main{flex:1;min-height:0;padding:20px 24px;display:flex;flex-direction:column}
.sp2{flex:1;min-height:0;display:grid;grid-template-columns:55fr 45fr;gap:24px}
.sp2.shop{grid-template-columns:1fr 348px}
.L,.R,.full{min-height:0;overflow-y:auto;scrollbar-width:none}.L::-webkit-scrollbar,.R::-webkit-scrollbar,.full::-webkit-scrollbar{display:none}
.full{flex:1}
.mid{display:flex;flex-direction:column;justify-content:center}
.q{font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1.22}
.q.s{font-size:34px}
.qs{font-size:22px;color:var(--g1);margin-top:10px;line-height:1.45}
.demo{background:#FFF7E0;border-radius:14px;padding:14px 18px;font-size:18px;color:#6B5200;margin-top:16px;line-height:1.5}

/* 시작 무대: 진짜 제품 사진이 천천히 바뀜 */
.stage{position:relative;height:100%;border-radius:28px;overflow:hidden;background:#111}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:show 20s linear infinite}
.stage img:nth-child(2){animation-delay:5s}.stage img:nth-child(3){animation-delay:10s}.stage img:nth-child(4){animation-delay:15s}
@keyframes show{0%{opacity:0;transform:scale(1.04)}4%{opacity:1}25%{opacity:1}30%{opacity:0;transform:scale(1.12)}100%{opacity:0}}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0) 55%)}
.stage .hi{position:absolute;left:34px;right:34px;bottom:30px;z-index:1;color:#fff}
.stage .hi b{display:block;font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.stage .hi span{display:block;font-size:23px;opacity:.85;margin-top:8px}

/* 큰 선택 버튼 */
.big{display:grid;gap:16px}
.big button{display:flex;align-items:center;gap:20px;min-height:150px;padding:24px 30px;border-radius:var(--r);background:var(--card);text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.06);width:100%;overflow:hidden;position:relative}
.big button.p{background:var(--pt);color:#fff;box-shadow:0 6px 16px rgba(216,31,42,.28)}
.big button:active{transform:scale(.985)}
.big .tx{flex:1;position:relative;z-index:1}
.big b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em}
.big .tx span{display:block;font-size:21px;color:var(--g1);margin-top:6px;line-height:1.4}
.big button.p .tx span{color:rgba(255,255,255,.75)}
.big.tall button{min-height:190px}.big.tall b{font-size:48px}
.big .arr{font-size:44px;color:var(--g2);font-weight:300}
.big button.p .arr{color:#fff}
.txtb{display:block;margin:18px auto 0;height:56px;padding:0 24px;font-size:21px;font-weight:700;color:var(--g1);text-decoration:underline;text-underline-offset:5px}
/* 무엇을 찾으세요: 사진 카드 3장 */
.tri{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.tri button{position:relative;border-radius:26px;overflow:hidden;background:#222;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;color:#fff;min-height:0}
.tri img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.tri button::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0) 60%)}
.tri b,.tri span{position:relative;z-index:1}.tri b{font-size:40px;font-weight:800;letter-spacing:-.03em}.tri span{font-size:21px;opacity:.88;margin-top:4px}
.tri button:active img{transform:scale(1.05)}

/* 쓰는 기기 고르기: 이름 버튼 5칸 */
.dvh{display:flex;align-items:center;gap:20px}.dvh > div{flex:1;min-width:0}
.dvh .dk{flex:none;height:72px;padding:0 30px;border-radius:16px;border:2px solid var(--ink);background:var(--card);font-size:24px;font-weight:800}
.dvr{flex:1;min-height:0;display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;margin:16px -24px 0;padding:4px 24px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.dvr button{flex:none;width:262px;border-radius:26px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;padding:16px;text-align:left;scroll-snap-align:start;scroll-margin-left:24px}
.dvr button:active{transform:scale(.985)}
.dvr .im{flex:1;min-height:0;border-radius:18px;background:#fff;/*dvwhite*/overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--g2);font-size:20px}
.dvr .im img{width:100%;height:100%;object-fit:contain}
.dvr b{flex:none;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:12px}
.dvr small{flex:none;font-size:17px;color:var(--g2);font-weight:600;height:24px}
/* 번호 누르기 */
.num{background:var(--card);border-radius:var(--r);margin-top:22px;padding:22px;text-align:center;font-size:50px;font-weight:800;letter-spacing:.02em}
.num.e{color:#CCC}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:100%}
.pad button{border-radius:18px;background:var(--card);font-size:38px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.05);min-height:84px}
.pad button:active{background:#EEE}
.pad .s{font-size:23px;color:var(--g1)}
.pad .ok{background:var(--pt);color:#fff;font-size:27px;font-weight:800}
.pad .ok:disabled{background:#E5E5E5;color:#AAA}

/* 문답 */
.prog{display:flex;gap:8px;margin:0 0 26px}.prog i{flex:1;height:10px;border-radius:5px;background:#E2E2E4}.prog i.on{background:var(--pt)}
.ans{display:grid;gap:12px}
.ans button{display:flex;align-items:center;gap:18px;min-height:100px;padding:18px 26px;border-radius:var(--r);background:var(--card);text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.06);width:100%;border:3px solid transparent}
.ans button.on{border-color:var(--ink)}
.ans button:active{transform:scale(.985)}
.ans .ic{flex:none;width:56px;font-size:40px;text-align:center}
.ans b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em}.ans span span{display:block;font-size:20px;color:var(--g1);margin-top:3px}
.wait{margin:auto;text-align:center;font-size:30px;font-weight:700;color:var(--g1)}
.wait i{display:block;width:64px;height:64px;border-radius:50%;border:6px solid #E2E2E4;border-top-color:var(--pt);margin:0 auto 22px;animation:turn 1s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

/* VS */
.vs{display:grid;grid-template-columns:1fr 64px 1fr;align-items:stretch;margin-top:18px}
.vs .mid2{align-self:center;text-align:center;font-size:32px;font-weight:900;color:var(--g2)}
.vsc{position:relative;display:flex;gap:22px;background:var(--card);border-radius:26px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:3px solid transparent}
.vsc.got{border-color:var(--ink)}
.vsc .im{flex:none;width:250px;height:250px;border-radius:20px;background:#F7F0E3;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px;color:var(--g2)}
.vsc .im img{width:100%;height:100%;object-fit:contain}
.vsc .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.vsc small{font-size:19px;color:var(--g2);font-weight:600}
.vsc b.nm{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin:4px 0}
.vsc .f{font-size:21px;color:var(--g1);line-height:1.4}
.vsc .pr{font-size:28px;font-weight:800;margin:auto 0 12px;padding-top:10px}
.vsc .hot{position:absolute;left:34px;top:34px;background:var(--pt);color:#fff;font-size:20px;font-weight:800;border-radius:8px;padding:6px 14px;z-index:1;font-style:normal}
.vsc.none{border:2px dashed var(--line);background:none;box-shadow:none;align-items:center;justify-content:center;color:var(--g2);font-size:22px;text-align:center}
.why{background:var(--card);border-radius:var(--r);padding:18px 24px;margin-top:16px;font-size:21px;line-height:1.55;color:var(--g1);box-shadow:0 2px 8px rgba(0,0,0,.05)}.why b{display:block;font-size:24px;color:var(--ink);margin-bottom:4px}

/* 칩, 묶음 안내 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.chips button{height:56px;padding:0 22px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:21px;font-weight:700;color:var(--g1)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.evp{background:var(--bg);border-radius:16px;padding:14px 16px;margin-top:12px}
.evp b{font-size:19px;font-weight:800;line-height:1.35;display:block}.evp span{display:block;font-size:16px;color:var(--g1);margin-top:3px}
.dots{display:flex;gap:5px;margin-top:10px}.dots i{flex:1;height:10px;border-radius:5px;background:#DDD}.dots i.on{background:var(--pt)}

/* 상품 카드: 3칸 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.cd{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;flex-direction:column;position:relative;text-align:left}
.cd.got{box-shadow:0 0 0 3px var(--ink)}
.cd .im{height:176px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;font-size:19px;color:var(--g2);background:#F7F0E3;text-align:center;padding:6px}
.cd .im img{max-width:100%;max-height:100%;object-fit:contain}
.cd small{font-size:16px;color:var(--g2);font-weight:600}
.cd b{font-size:23px;font-weight:800;line-height:1.25;margin:2px 0;display:block;letter-spacing:-.03em}
.cd .f{font-size:17px;color:var(--g1);min-height:23px}
.cd .pr{font-size:23px;font-weight:800;margin:8px 0 10px}
.rkb{position:absolute;left:22px;top:22px;background:var(--pt);color:#fff;font-size:18px;font-weight:800;border-radius:8px;padding:4px 11px;z-index:1;font-style:normal}
.evb{position:absolute;right:22px;top:22px;background:var(--ink);color:#fff;font-size:18px;font-weight:800;border-radius:8px;padding:4px 11px;z-index:1;font-style:normal}
.add{width:100%;height:64px;border-radius:14px;background:var(--ink);color:#fff;font-size:23px;font-weight:800}
.add.line{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.add:disabled{background:#CCC}
.stp{display:flex;align-items:center;height:64px;border-radius:14px;border:2px solid var(--ink);overflow:hidden}
.stp button{width:74px;height:100%;font-size:34px;font-weight:700;background:var(--card)}
.stp button:active{background:#EEE}
.stp b{flex:1;text-align:center;font-size:27px!important;margin:0!important}
.cd.sold{opacity:.8}.cd.sold .im img{filter:grayscale(1)}
.cd .soldt{font-size:18px;font-weight:800;color:var(--pt);margin:8px 0 10px}

.grid.top4{grid-template-columns:repeat(2,1fr);gap:16px}.grid.top4 .cd{padding:16px}.grid.top4 .im{height:250px}.grid.top4 b{font-size:30px}.grid.top4 .pr{font-size:26px}.grid.top4 small{font-size:18px}.grid.top4 .rkb{font-size:20px;padding:5px 13px}
/* 기기 사진은 흰 배경 jpg 라 크림 바탕에서 흰 네모로 보임. 겹쳐 곱하기로 흰색만 바탕색에 녹임 (devblend1120) */
.cd[data-dev] .im{background:radial-gradient(circle at 50% 42%,#fff 0,#fff 42%,#EEEBE6 100%)}
.cd[data-dev] .im img{max-width:none;max-height:none;width:112%;height:112%;flex:none;object-fit:contain}.sw img{transform:scale(1.25)}
.cd[data-dev] .im img,.hero img,.sw img,.dvr .im img{mix-blend-mode:multiply}
.dvr .im{background:radial-gradient(circle at 50% 42%,#fff 0,#fff 42%,#EEEBE6 100%)!important}
.sheet.wide{width:1100px}
.dv3{display:grid;grid-template-columns:46fr 54fr;gap:26px;align-items:stretch}
.hero{background:radial-gradient(circle at 50% 42%,#fff 0,#fff 42%,#EEEBE6 100%);border-radius:24px;height:480px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero img{width:100%;height:100%;flex:none;object-fit:contain;animation:pop2 .4s cubic-bezier(.2,.8,.2,1) both}
.dvt{display:flex;flex-direction:column;min-width:0}
.dvt small{font-size:19px;color:var(--g1);font-weight:600}
.dvt h3{font-size:42px!important;margin:2px 0 6px!important}
.dpr{font-size:34px;font-weight:800;letter-spacing:-.03em}
.dlb{font-size:20px;color:var(--g1);font-weight:600;margin:20px 0 10px}.dlb b{color:var(--ink);margin-left:6px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.sw button{background:var(--card);border-radius:16px;border:3px solid transparent;padding:8px 6px 10px;font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(120,90,40,.1)}
.sw button.on{border-color:var(--ink)}
.sw span{width:100%;height:72px;border-radius:10px;background:#F4F2EE;display:block;overflow:hidden}.sw img{width:100%;height:100%;object-fit:contain}
.dtip{font-size:18px;color:var(--g1);margin-top:12px}
.dadd{margin-top:auto;padding-top:18px}.dadd .add,.dadd .stp{height:76px}.dadd .add{font-size:26px;background:var(--pt)}
.cmpb{position:absolute;right:22px;top:22px;z-index:2;height:48px;padding:0 16px;border-radius:24px;background:#fff;border:2px solid var(--ink);font-size:19px;font-weight:800}
.cmpb.on{background:var(--ink);color:#fff}
.vq{font-size:30px;font-weight:800;letter-spacing:-.03em}
.vsay{background:var(--pt);color:#fff;border-radius:18px;padding:11px 20px;font-size:24px;font-weight:700;margin-bottom:12px}.vsay b{font-weight:900}
.vg{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;align-items:stretch}
.vm{align-self:center;text-align:center;font-size:28px;font-weight:900;color:var(--g2)}
.vh{position:relative;background:var(--card);border-radius:22px;padding:10px 14px;display:grid;grid-template-columns:130px 1fr;column-gap:16px;align-content:center;align-items:center;border:3px solid transparent;box-shadow:0 2px 8px rgba(120,90,40,.08)}
.vh.pick{border-color:var(--pt)}
.vh .hero{grid-row:1 / 3}.vh b{font-size:30px;font-weight:800;align-self:end}.vh span{font-size:22px;font-weight:700;color:var(--g1);align-self:start}.vh .rkb{position:absolute!important;left:auto;right:12px;top:12px}
.hero.sm{height:124px;width:130px;border-radius:14px}
.vt{display:grid;grid-template-columns:1fr 150px 1fr;margin-top:12px;background:var(--card);border-radius:18px;padding:4px 16px}
.vt > *{padding:9px 0;text-align:center;font-size:22px;font-weight:700;border-top:1px solid var(--line)}
.vt > *:nth-child(-n+3){border-top:0}
.vt span{font-size:18px;color:var(--g1);font-weight:600}
.vt .w{color:var(--pt);font-weight:900}
.vf{display:grid;grid-template-columns:1fr 150px 1fr;gap:12px}.vf .add{font-size:22px}.vf .add:not(.line){background:var(--pt)}
#say3{flex:none;display:flex;align-items:center;gap:14px;height:58px;padding:0 24px;background:var(--stage);font-size:23px;font-weight:700;letter-spacing:-.02em;overflow:hidden;white-space:nowrap}
body.nosay #say3{display:none}
#say3 i,.sayin i{flex:none;font-style:normal;background:var(--pt);color:#fff;font-size:16px;font-weight:800;border-radius:8px;padding:5px 10px}
#say3 span{overflow:hidden;text-overflow:ellipsis}
.sayin{display:flex;align-items:center;gap:12px;background:var(--stage);border-radius:14px;padding:10px 16px;font-size:21px;font-weight:700;margin-bottom:14px}
.st3 .big.tall button{min-height:166px}
.hero{height:430px!important}.hero.sm{height:124px!important}
.dvl{display:flex;flex-direction:column;gap:12px;min-width:0}.dvl .hero{height:350px!important}
.vsw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.vsw span{font-size:18px;font-weight:700;color:var(--g1);margin-right:4px}
.vsw button{height:56px;padding:0 18px;border-radius:14px;background:var(--card);border:2px solid var(--ink);font-size:20px;font-weight:800}
.cmpg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cmpg button{background:var(--card);border-radius:22px;border:3px solid transparent;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(120,90,40,.08)}
.cmpg button.on{border-color:var(--pt)}
.cmpg .hero.sm{width:100%!important;height:230px!important;margin-bottom:8px}
.cmpg b{font-size:26px;font-weight:800}.cmpg small{font-size:20px;font-weight:700;color:var(--g1)}
/* 액상 목표 칸: 캐릭터가 5병, 11병을 권함. 병 아이콘이 하나씩 차오름 */
.goal{position:relative;background:var(--stage);border-radius:18px;padding:12px;margin-top:10px;display:grid;grid-template-columns:92px 1fr;column-gap:10px;align-items:center}
.goal.hit{background:#FDE3E1}
.gch{width:92px;height:84px;object-fit:contain}
.gch.hop{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.08)}100%{transform:none}}

.pkf button{height:54px;padding:0 20px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:21px;font-weight:800;color:var(--g1)}
.pkf button.on{background:var(--ink);border-color:var(--ink);color:#fff}.pkf .more{border-style:dashed;font-weight:700}
.pkf span{margin-left:auto;font-size:19px;font-weight:700;color:var(--pt)}
.pk strong small{font-size:22px;font-weight:800;color:var(--g1);margin-left:6px;letter-spacing:0}
.pkg{margin-top:24px!important}.pk{padding:16px 22px 16px!important;gap:3px!important}.pm{font-size:38px!important}.pk strong{font-size:42px!important;margin-top:4px!important}.pv{margin-top:6px!important;padding:7px 16px!important}.ps{margin-top:4px!important}.pb{height:60px!important;margin-top:8px!important}
.chk3{grid-template-columns:1fr 1fr 1fr 1.25fr!important;gap:14px!important}
.chk{padding:22px!important}.chk strong{font-size:40px!important}.chk b{font-size:25px!important}.chk span{font-size:18px!important}
.chk.todo{background:var(--ink);color:#fff}.chk.todo > i{background:var(--pt)}
.chk.todo ul{list-style:none;margin-top:12px;display:grid;gap:8px}
.chk.todo li{font-size:19px;font-weight:700;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.chk.todo u{flex:none;text-decoration:none;background:#fff;color:var(--ink);font-size:14px;font-weight:800;border-radius:7px;padding:2px 8px;margin-top:2px;white-space:nowrap}
.chh{display:flex;align-items:center;justify-content:space-between;gap:16px}.chh img{width:150px;height:96px;object-fit:contain;flex:none}
/* 오른쪽 담은 상품 */
.cp{background:var(--card);border-radius:var(--r);height:100%;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden}
.cp h4{flex:none;font-size:22px;font-weight:800;padding:18px 18px 8px}.cp h4 em{margin-left:4px}
.cpl{flex:1;min-height:0;overflow-y:auto;padding:0 18px;scrollbar-width:none}.cpl::-webkit-scrollbar{display:none}
.cl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.cl:first-child{border-top:0}
.cl .im{flex:none;width:52px;height:52px;border-radius:10px;background:#F7F0E3;overflow:hidden}.cl .im img{width:100%;height:100%;object-fit:contain}
.cl .tx{flex:1;min-width:0;font-size:18px;font-weight:700;line-height:1.25}
.cl .mq{flex:none;display:flex;align-items:center;gap:2px}.cl .mq button{width:44px;height:44px;border-radius:50%;background:var(--bg);font-size:24px;font-weight:700}.cl .mq i{font-style:normal;font-size:20px;font-weight:800;min-width:26px;text-align:center}
.cpe{padding:26px 0;text-align:center;font-size:19px;color:var(--g2);line-height:1.5}
.cpf{flex:none;padding:6px 18px 18px}
.cpt{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:19px;font-weight:700}
.cpt strong{font-size:34px;font-weight:900;letter-spacing:-.03em}

/* 묶음 상자, 줄 */
.box{background:var(--card);border-radius:var(--r);padding:6px 24px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.box:first-child{margin-top:0}
.box h4{font-size:24px;font-weight:800;padding:16px 0 8px}
.box p{font-size:20px;color:var(--g1);line-height:1.6;padding:4px 0 16px}
.ln{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.box h4 + .ln,.ln:first-child{border-top:0}
.ln .im{flex:none;width:84px;height:84px;border-radius:14px;background:#F7F0E3;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ln .im img{width:100%;height:100%;object-fit:contain;padding:4px}
.ln .tx{flex:1;min-width:0}.ln .tx b{display:block;font-size:23px;font-weight:800;letter-spacing:-.03em}.ln .tx span{font-size:18px;color:var(--g1)}
.ln .stp{width:210px;flex:none}.ln .stp button{width:66px}
.ln .add{width:150px;flex:none}
.sum{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-top:1px solid var(--line);font-size:22px}
.sum strong{font-size:38px;font-weight:800}
.bdg{display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;background:var(--ptbg);color:var(--pt);font-size:17px;font-weight:800}
.fld{margin:6px 0 14px}.fld label{display:block;font-size:20px;font-weight:700;margin-bottom:8px}
.fld input{width:100%;height:72px;border-radius:14px;border:2px solid var(--line);padding:0 20px;font-size:26px;background:var(--card);outline:none}
.fld input:focus{border-color:var(--ink)}
.ck{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;text-align:left;font-size:20px;font-weight:600;border-top:1px solid var(--line)}
.ck i{flex:none;width:38px;height:38px;border-radius:10px;border:2px solid #CCC;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;color:#fff}
.ck.on i{background:var(--pt);border-color:var(--pt)}
.empty{padding:34px 0;text-align:center;font-size:21px;color:var(--g1)}
.say{background:#F2F6FF;border-radius:16px;padding:18px 22px;font-size:23px;line-height:1.6;margin-top:16px}

/* 직원 확인: 세 칸 */
.chk3{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
.chk{background:var(--card);border-radius:26px;padding:26px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-direction:column}
.chk > i{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-size:25px;font-weight:800;display:flex;align-items:center;justify-content:center}
.chk b{font-size:28px;font-weight:800;margin-top:16px}
.chk span{font-size:20px;color:var(--g1);margin-top:8px;line-height:1.5}
.chk strong{margin-top:auto;padding-top:14px;font-size:50px;font-weight:900;letter-spacing:-.035em}
.chk strong.r{color:var(--pt)}

.selr{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px}
.selr b{font-size:22px;font-weight:800;margin-right:6px}
.selr button{height:60px;padding:0 26px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:23px;font-weight:800;color:var(--g1)}
.selr button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.selr span{font-size:20px;color:var(--pt);font-weight:700;margin-left:6px}
/* 키캡 클리커 (keycap1119) */
.kcs{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:40px}
.kc{position:relative;width:236px;height:250px;border-radius:38px;background:#26262A;box-shadow:0 16px 26px rgba(0,0,0,.22);touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.kct{position:absolute;left:16px;right:16px;top:8px;height:204px;border-radius:28px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 0 #0E0E10,inset 0 -8px 0 rgba(0,0,0,.07);transition:transform .05s ease-out,box-shadow .05s ease-out}
.kct img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.kct b{font-size:72px;font-weight:900;font-style:italic;color:var(--pt);letter-spacing:-.04em}
.kc.dn .kct{transform:translateY(10px);box-shadow:0 2px 0 #0E0E10,inset 0 -8px 0 rgba(0,0,0,.07)}
.kcc{flex:none;text-align:center;font-size:24px;font-weight:700;color:var(--g1);padding-bottom:4px}
.kcc b{font-size:56px;font-weight:900;color:var(--ink);margin-right:8px;letter-spacing:-.03em}
/* 룰렛 (예시) */
.whl{width:400px;height:400px;border-radius:50%;margin:0 auto;position:relative;background:conic-gradient(#111 0 60deg,#fff 60deg 120deg,#D81F2A 120deg 180deg,#fff 180deg 240deg,#111 240deg 300deg,#fff 300deg 360deg);box-shadow:0 0 0 10px var(--card),0 6px 24px rgba(0,0,0,.15);transition:transform 3.4s cubic-bezier(.12,.75,.1,1)}
.whl span{position:absolute;left:50%;top:50%;width:0;height:0;font-size:34px;font-weight:900}
.whl span u{position:absolute;left:-20px;top:-165px;width:40px;text-align:center;text-decoration:none;color:#fff;mix-blend-mode:difference}
.pin{width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--pt);margin:0 auto -20px;position:relative;z-index:2}

/* 아래 띠 */
footer{flex:none;height:96px;background:var(--card);border-top:1px solid var(--line);padding:0 24px;display:none;align-items:center;gap:14px}
body.ft footer{display:flex}
footer .bk{height:68px;padding:0 26px;border-radius:16px;border:2px solid var(--line);font-size:23px;font-weight:700;color:var(--g1);flex:none}
footer .tt{flex:1;min-width:0;text-align:center}
footer .tt span{font-size:19px;color:var(--g1);font-weight:600;margin-right:10px}
footer .tt b{font-size:32px;font-weight:800;letter-spacing:-.03em}
footer .nx{height:68px;padding:0 34px;border-radius:16px;background:var(--pt);color:#fff;font-size:26px;font-weight:800;flex:none;min-width:280px}

/* 가운데 창 */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:5}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:760px;max-height:88%;background:var(--bg);border-radius:28px;display:none;flex-direction:column;z-index:6;overflow:hidden}
body.sp .dim{display:block}body.sp .sheet{display:flex;animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
.sh-b{flex:1;overflow-y:auto;padding:24px 24px 18px}
.sh-b h3{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-bottom:14px}
.sh-f{flex:none;padding:14px 24px 20px;background:var(--card);border-top:1px solid var(--line)}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(17,17,17,.94);color:#fff;font-size:23px;font-weight:700;padding:16px 28px;border-radius:16px;z-index:9;display:none;white-space:nowrap}
.load{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--g1);z-index:20}
#eng{position:absolute;left:-9999px;top:0;width:1280px;height:760px;visibility:hidden;border:0}
body.stf #eng{left:0;top:0;width:100%;height:100%;visibility:visible;z-index:30}
#back{display:none;position:absolute;left:16px;bottom:16px;z-index:31;height:56px;padding:0 22px;border-radius:28px;background:var(--ink);color:#fff;font-size:20px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25)}
body.stf #back{display:block}

/* 움직임: 화면이 바뀔 때만 아래에서 올라옴 */
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.94)}100%{opacity:1;transform:translate(-50%,-50%)}}
@keyframes pop2{0%{opacity:0;transform:scale(.92)}60%{transform:scale(1.02)}100%{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
main.in .an{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
main.in .an.d1{animation-delay:.08s}main.in .an.d2{animation-delay:.16s}main.in .an.d3{animation-delay:.24s}main.in .an.d4{animation-delay:.32s}
main.in .ans button,main.in .big button,main.in .tri button{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
main.in .ans button:nth-child(2),main.in .big button:nth-child(2),main.in .tri button:nth-child(2){animation-delay:.08s}
main.in .ans button:nth-child(3),main.in .tri button:nth-child(3){animation-delay:.16s}main.in .ans button:nth-child(4){animation-delay:.24s}
main.in .vsc{animation:pop2 .55s cubic-bezier(.2,.8,.2,1) both}main.in .vsc.b{animation-delay:.22s}
.big .arr{animation:nudge 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){main.in .an,main.in .ans button,main.in .big button,main.in .tri button,main.in .vsc,.big .arr,.stage img{animation:none!important}.stage img:first-child{opacity:1}}

/* 3판 시작 화면 (11/20): 큰 포스터 대신 캐릭터 무대 + 아래 아이콘 띠. 색은 크림 바탕, 빨강은 가장 먼저 누를 버튼에만 */
.st3{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.st3 .sp2{grid-template-columns:40fr 60fr}
.stg3{position:relative;height:100%;border-radius:28px;background:var(--stage);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:26px 22px 0}
.bub{position:relative;background:var(--pt);color:#fff;border-radius:26px;padding:16px 28px;font-size:36px;font-weight:800;letter-spacing:-.03em;text-align:center;line-height:1.25;box-shadow:0 6px 14px rgba(216,31,42,.22)}
.bub::after{content:"";position:absolute;left:68%;bottom:-14px;width:28px;height:28px;background:var(--pt);border-radius:6px;transform:rotate(45deg)}
.bub small{display:block;font-size:20px;font-weight:600;opacity:.9;margin-top:2px}
.bub2{position:absolute;left:26px;top:178px;background:var(--ink);color:#fff;border-radius:18px;padding:8px 20px;font-size:26px;font-weight:800}
.stg3 img{margin-top:auto;width:96%;display:block;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.band{flex:none;height:124px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.band button{position:relative;white-space:nowrap;background:var(--card);border-radius:22px;box-shadow:0 2px 8px rgba(120,90,40,.08);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 10px;font-size:24px;font-weight:800;letter-spacing:-.03em}
.band button:active{transform:scale(.97)}
.band img{width:76px;height:76px;object-fit:contain;flex:none}
.band i{position:absolute;right:10px;top:8px;font-style:normal;font-size:14px;font-weight:700;color:var(--g2)}
@media (prefers-reduced-motion: reduce){.stg3 img{animation:none}}

/* ══ 디자인 다듬기 (3판 11/20). 화면을 다 만든 뒤 한 번에 맞춤. 규칙은 여기 한 곳에:
   색      크림 바탕(--bg), 한 단계 진한 크림(--stage)은 무대와 안내 칸, 흰색(--card)은 누르는 칸, 글자 --ink, 흐린 글자 --g1.
           빨강(--pt)은 "권하는 것"과 "돈 얘기"에만: 가장 먼저 누를 단추, 할인, 선물. 분홍(--ptbg)은 할인, 혜택 칸 바탕.
   고름    고른 칸은 검정 테두리 3px. 빨강 테두리는 "권하는 것" 하나에만.
   모서리  칸 24, 단추와 작은 칸 16, 알약 10.
   그림자  하나만(--sh, 따뜻한 갈색). 검은 그림자, 검은 칸은 안 씀.
   글자    제목 34, 큰 숫자 40~58, 칸 제목 23~30, 본문 19~22, 작은 글씨 16~18. 돈은 같은 폭 숫자.
   누름    누르면 살짝 작아짐(.97). 화면이 바뀔 때만 아래에서 올라옴 ══ */
:root{--r:24px;--r2:16px;--sh:0 2px 10px rgba(120,90,40,.10);--ptbg:#FDE3E1}
.big button,.ans button,.cd,.cp,.box,.why,.vsc,.pad button,.dvr button,.chk,.num,.plg button,.crw div,.svo,.pk,.vh,.vt,.cal,.czc,.pkl,.band button,.sw button,.p1g button,.cmpg button{box-shadow:var(--sh)!important}
.cd,.cp,.box,.why,.chk,.num,.svo,.ans button,.big button{border-radius:var(--r)!important}
.add,.stp,.chips button,.selr button,.fld input,.pad button,.pkf button,.vsw button,.miss button,footer .bk,footer .nx,.home{border-radius:var(--r2)!important}
.pr,.cpt strong,.sum strong,.chk strong,footer .tt b,.dpr,.svc b,.pk strong,.csave b,.czf b,.vh span,.cbox span{font-variant-numeric:tabular-nums}
button{transition:transform .12s ease-out,background-color .15s,border-color .15s,box-shadow .15s}
.add:active,.chips button:active,.sw button:active,.tabs button:active,.pkf button:active,.vsw button:active,.miss button:active,.svo .add:active,footer .nx:active,footer .bk:active,.plg button:active,.cmpg button:active,.home:active{transform:scale(.97)}
/* 고른 칸은 검정 테두리로 통일 */
.cd.got{box-shadow:0 0 0 3px var(--ink),var(--sh)!important}
.svo.on,.cmpg button.on{border-color:var(--ink)!important}
/* 검은 칸 없애기: 직원이 챙길 것, 쿠폰 오늘 칸은 분홍 바탕 */
.chk.todo{background:var(--ptbg)!important;color:var(--ink)!important}
.chk.todo u{background:var(--pt)!important;color:#fff!important}
.crw .h{background:var(--ptbg)!important}.crw .h b{color:var(--ink)!important}.crw .h i{background:var(--pt)!important;color:#fff!important}
.crw .h.ok{background:var(--pt)!important}.crw .h.ok b{color:#fff!important}.crw .h.ok i{background:#fff!important;color:var(--pt)!important}
.goal.hit,.svc,.ben,.p1,.czf{background:var(--ptbg)!important}
/* 위 줄: 흰 바탕 대신 크림으로 이어지게, 단추는 조용하게 */
header{background:var(--bg)!important;border-bottom:0!important;height:64px!important}
.home{border:0!important;background:rgba(255,255,255,.7)!important;font-size:17px!important;height:44px!important;padding:0 16px!important}
.steps button{background:rgba(255,255,255,.6)!important}.steps button.on{background:var(--ink)!important}
#say3{border-radius:0;box-shadow:inset 0 -1px 0 rgba(120,90,40,.08)}
footer{background:var(--bg)!important;border-top:1px solid var(--line)!important}
footer .bk{background:var(--card);border-color:var(--line)!important}
footer .nx{box-shadow:0 6px 16px rgba(216,31,42,.28)}
/* 질문 화면(오늘 어떻게, 문진, 번호, 성함, 회원 확인): 왼쪽을 무대 칸으로 만들고 캐릭터를 세움. 첫 화면, 재방문, 유지비처럼 */
.sp2:not(.shop) > .L.mid:not(:has(.stg3,.rvl)){position:relative;background:var(--stage);border-radius:28px;padding:34px 34px 230px;justify-content:flex-start;overflow:hidden}
.sp2:not(.shop) > .L.mid:not(:has(.stg3,.rvl))::after{content:"";position:absolute;left:0;right:0;bottom:0;height:220px;background:url(kiosk3_img/char_hi.png) center bottom / auto 100% no-repeat;pointer-events:none}
body[data-scr="quiz"] .sp2 > .L.mid::after{background-image:url(kiosk3_img/char_wait.png)!important}
body[data-scr="phone"] .sp2 > .L.mid::after,body[data-scr="mname"] .sp2 > .L.mid::after{background-image:url(kiosk3_img/char_rec.png)!important}
body[data-scr="hello"] .sp2 > .L.mid::after{background-image:url(kiosk3_img/char_thx.png)!important}
.prog i{background:rgba(255,255,255,.7)!important}.prog i.on{background:var(--pt)!important}
.num{margin-top:18px!important;font-variant-numeric:tabular-nums}
.ans button{min-height:96px!important}.ans button.on{border-color:var(--ink)!important}
.pad button{background:var(--card)}
/* 칩: 고른 것만 검정, 나머지는 흰 칸 */
.chips button{border:0!important;box-shadow:var(--sh)}
/* 담은 상품 칸 */
.cp h4{font-size:21px!important}.cl .mq button{background:var(--bg)!important}
.evp{background:var(--stage)!important}
/* 가운데 창 */
.sheet{border-radius:32px!important;box-shadow:0 24px 60px rgba(60,40,10,.28)}
.dim{background:rgba(60,45,20,.42)!important}
.sh-f{background:var(--bg)!important;border-top:0!important;padding-top:6px!important}

  liq: () => { const n = liqN(), T = TIER(), x = toTop(n, T); return DEAL && n === 6 ? `5+1 기획전 적용됐어요. 6병에 ${won(T.pa + DEAL_ADD)}이에요.` : !T.dev && n === 5 && setDone() ? "기획전 5병을 다 담으셔서, 100원에 한 병 더 가져가실 수 있어요." : n >= T.b ? `${T.b}병 구성 완성됐어요. ${pct(T.b * ONE, T.pb)}% 할인 들어갔어요.` : n >= 5 ? (!plain() ? `${x.more}병 더 고르시면 ${T.b}병 ${won(T.pb)}이에요.` : x.extra < 0 ? `${x.more}병 더 담으시면 ${won(-x.extra)}이 더 할인돼요. ${T.b}병으로 맞춰 드릴까요?` : x.extra === 0 ? `${x.more}병 더 담으셔도 같은 값이에요. ${T.b}병으로 맞춰 드릴까요?` : `${won(x.extra)} 추가하시면 ${x.more}병을 더 가져가실 수 있어요. ${T.b}병으로 맞춰 드릴까요?`) : n ? `${5 - n}병만 더 고르시면 5병 ${won(T.pa)}, ${pct(5 * ONE, T.pa)}% 할인이에요. 맛은 섞으셔도 돼요.` : T.dev ? `기기랑 같이 사시면 액상 5병이 ${won(T.pa)}, 10병이 ${won(T.pb)}이에요.` : `맛은 섞어서 고르셔도 돼요. 5병이면 ${won(T.pa)}이에요.`; },
  pod: () => { const rec = podRec(podFamNow()), have = podHave(); return have >= rec ? "팟까지 잘 챙기셨어요. 이제 같이 확인해 볼게요." : rec > 1 ? `액상 ${liqN()}병이시면 팟 ${rec}팩 챙겨 가시는 걸 권해 드려요.` : "팟은 소모품이라 같이 챙겨 가시면 다시 오실 일이 줄어요."; },
  _podnudge: () => "팟이 없으면 금방 다시 오셔야 해서 한 번 여쭤봐요. 편하신 대로 하셔도 돼요.",
  dsp: () => { const g = D.dsp.find((x) => x.mn === S.dspM), ev = g && g.ev; return !g ? "뜯으면 바로 쓰는 것부터 보여 드릴게요. 여러 개 사시면 더 드리는 행사도 있어요." : ev && ev[3] !== "DSP-AIRX" ? `${ev[0]}개 고르시면 ${ev[1]}개 더 드려요. 맛은 섞으셔도 돼요.` : ev ? `팟 ${ev[0]}개 고르시면 팟 ${ev[1]}개를 더 드리거나 기기를 드려요.` : "필요하신 만큼 담아 주세요."; },
  sum: () => { const save = Math.max(0, (CT.unit || 0) - (CT.total || 0)); return save ? `오늘 ${won(save)} 할인 받으셨어요. 빠진 건 없는지 같이 볼게요.` : "고르신 것 같이 확인해 볼게요. 빠진 건 없으세요?"; },
  revisit: () => { const n = liqN(); return n ? `액상 ${n}병이면 보통 ${n}주쯤 쓰세요. 다음에 오실 날을 정해 두시면 잊지 않게 챙겨 드릴게요.` : "다음에 오실 날을 정해 두시면 잊지 않게 챙겨 드릴게요."; },
  check: () => "네 번째 칸을 위에서부터 하나씩 챙기고, 금액이 맞으면 포스로 보내 주세요.",
  phone: () => "휴대폰 번호 눌러 주시겠어요?",
  mname: () => "성함도 알려 주시겠어요?",
  hello: () => { const m = S.mem || {}; return m.s === "found" && (m.orders || []).length ? "확인됐어요. 지난번에 사신 그대로 담아 드릴까요?" : m.s === "name" ? "성함을 다시 한 번 알려 주시겠어요?" : m.s === "none" ? "이 번호로는 회원이 없으세요. 오늘 등록해 드릴까요?" : "확인됐어요. 오늘은 어떤 걸 보러 오셨어요?"; },
  _dev: () => "기기랑 같이 사시면 액상이 반값이에요. 색상은 어떤 게 끌리세요?",
  _nudge: () => "조금만 더 담으시면 훨씬 이득이라 한 번 말씀드려요. 편하신 대로 하셔도 돼요.",
  plan: () => { const n = liqN(), T = TIER(), d51 = !T.dev; return DEAL ? `5+1 기획전 적용됐어요. 6병에 ${won(T.pa + DEAL_ADD)}이에요.` : d51 && n === 5 && setDone() ? "5병 다 담으셨어요. 이제 100원에 한 병 더 골라 보세요." : !S.plan ? (d51 ? `5병 담으시면 한 병을 100원에 더 드리는 기획전이에요. 6병에 ${won(T.pa + DEAL_ADD)}이에요.` : `5병을 한 번에 담는 구성이에요. 기기랑 같이면 5병 ${won(T.pa)}이에요.`) : n >= 5 ? SAY.liq() : n ? `${5 - n}병만 더 고르시면 ${d51 ? "100원에 한 병을 더 드려요." : `5병 ${won(T.pa)}이에요.`}` : d51 ? `한 번에 담기를 누르시면 5병이 담겨요. 그다음 100원에 한 병 더 고르시면 돼요.` : `한 번에 담기를 누르시면 5병이 담겨요.`; },
  coupon: () => { const add = cpToday(), hint = cpHint(); return cpPack() ? "기기를 사시는 날은 도장이 안 찍혀요. 다음에 액상 사러 오실 때부터 찍어 드려요." : hint ? `${hint} 찍어 드려요. 도장은 한 번에 ${won(CP_MIN)} 이상 사실 때 찍어요.` : add ? `오늘 ${add}칸 찍어 드릴게요. 세 번째와 여섯 번째에 액상 한 병씩, 열 번째에 액상 세 병을 드려요.` : `한 번에 ${won(CP_MIN)} 이상 사시면 한 칸씩 찍어 드려요. 세 번째와 여섯 번째에 액상 한 병씩, 열 번째에 액상 세 병을 드려요.`; },
  calc: () => { const cig = CIG_PACK * CIG_DAYS; return `하루 한 갑이시면 연초는 한 달에 ${won(cig)}쯤 쓰세요. 전자담배는 기기값을 넣어도 첫 달부터 덜 들어요.`; },
  pack: () => "한 달, 두 달, 석 달 치를 한 번에 챙기는 구성이에요. 두 달 치를 가장 많이 권해 드려요.",
  svc: () => { const left = S.pack.pick - svcN(); return left ? `서비스를 ${left}개 더 고르실 수 있어요. 같은 걸 여러 번 고르셔도 돼요.` : "서비스 다 고르셨어요. 이제 같이 확인해 볼게요."; },
  _cmp: () => "두 개 중에 고민되시면 나란히 놓고 보여 드릴게요.",
  _vs: () => "어떤 게 더 중요하세요? 하나만 골라 주시면 맞는 쪽을 알려 드릴게요.",
};
let SAYON = true; try { SAYON = localStorage.getItem("vf-kiosk-say") !== "0"; } catch (e) {}
const sayIn = (k) => SAYON && SAY[k] ? `<div class="sayin"><i>직원 멘트</i>${esc(SAY[k]())}</div>` : "";

/* ── 기획전 (3판 11/20). 액상덕후: "본점에 재고 많은 것, 특히 (한) 제품들로, 기존 5병 49,500원 기획에 맞춰서".
   그래서 한 기획전 = 딱 5병 구성. 한 번에 담으면 5병 값이 바로 적용됨. 값 계산은 정식 5병 규칙 그대로.
   고른 기준: 11/20 15:38 본점 포스 재고가 많은 (한) 제품.
   얌 알로에 322, 얌 포도 317, 얌멘솔 255, 얌 복숭아 239, 얌 레몬 123 / 아이스샷 229, 트리플라임 148, 레드포카리 121, 와 블루레몬 110, 블루스카이 76.
   재고가 바뀌면 아래 이름만 바꾸면 됨. 품절된 맛은 화면에서 저절로 빠짐 ── */
/* 11/20 추가: 빌런(과일멘솔), 릭(노멘솔 과일)도 5+1. 이 둘은 이름 목록 대신 "지금 재고 있는 맛 가운데 이 지점에서 많이 나간 순서로 5개"를 그때그때 고름 */
const PLAN_SETS = [
  ["villain", "과일멘솔 인기액상 빌런 5+1", "시원한 과일 맛, 가장 많이 찾는 5가지", /^VF 빌런 /],
  ["lick", "노멘솔 과일 인기액상 릭 5+1", "멘솔 없는 과일 맛, 가장 많이 찾는 5가지", /^VF 릭 /],
  ["yam", "얌 5+1 기획전", "알로에, 포도, 멘솔, 복숭아, 레몬", ["(한) 얌 알로에", "(한) 얌 포도", "(한) 얌멘솔", "(한) 얌 복숭아", "(한) 얌 레몬"]],
  ["cool", "갈증해소 5+1 기획전", "라임, 레몬, 포카리, 시원한 멘솔", ["(한) 아이스샷", "(한) 트리플라임", "(한) 레드포카리", "(한) 와 블루레몬", "(한) 블루스카이"]],
];
const planItems = (P) => { if (Array.isArray(P[3])) return P[3].map((n) => D.liq.find((x) => x.n === n)).filter((x) => x && !x.out); const rk = rankMap("liq"); return D.liq.filter((x) => !x.out && P[3].test(x.n)).sort((a, b) => (rk.get(a.id) || 99) - (rk.get(b.id) || 99) || (a.no || 1e4) - (b.no || 1e4)).slice(0, 5); };
const PLANS = () => PLAN_SETS.map((P) => ({ k: P[0], t: P[1], sub: P[2], items: planItems(P) })).filter((P) => P.items.length);

/* ── 달 패키지 (3판 11/20, 값과 서비스는 클로드 제안안이고 아직 확정 전. 근거 문서는 따로 있음).
   11/20 액상덕후 "왜 저렇게 쌈?" + "한 달 5병쯤 맞아": 한 달 5병에 딱 맞춰 5병 묶음을 달 수만큼. 5병 49,500 / 10병 99,000 / 15병 148,500 (정식 계산도 같은 값). 팟은 정가. 이득은 서비스 고르기로.
   서비스에 팟은 넣지 않음. 서비스는 장바구니에 안 담기고 직원 확인 화면에 글로만 보임(포스에서 서비스 처리) ── */
const PACKS = [
  { m: 1, liq: 5, lp: 49500, pod: 2, pick: 1, of: ["액상 1병 더", "케이스", "드립팁커버"] },
  { m: 2, liq: 10, lp: 99000, pod: 4, pick: 2, of: ["액상 1병 더", "케이스", "드립팁커버"], best: true },
  { m: 3, liq: 15, lp: 148500, pod: 6, pick: 3, of: ["액상 1병 더", "케이스", "드립팁커버", "드립팁", "레이저 각인"] },
];
/* 팟 값은 기기마다 다름(11/20 액상덕후). 쓰는 기기를 고르기 전에는 팟 값을 넣지 않고 액상 값만 보여 줌 */
const packPod = () => { const l = D.pod.filter((x) => x.fam === podFamNow()).map((x) => x.price); if (!l.length) return 0; const cnt = {}; l.forEach((v) => cnt[v] = (cnt[v] || 0) + 1); return +Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || b - a)[0]; }; /* 그 기기 팟 가운데 가장 흔한 값 (빈 팟처럼 싼 것 하나에 끌려가지 않게) */
const PACK_FAMS = () => ["말론", "말론S", "발라리안 맥스프로", "하복2"].filter((f) => D.fams.includes(f));
const svcN = () => Object.values(S.svc || {}).reduce((a, b) => a + b, 0);
const svcText = () => Object.entries(S.svc || {}).filter(([, q]) => q).map(([t, q]) => q > 1 ? `${t} ${q}개` : t).join(", ");

/* ── 재방문 쿠폰 (3판 11/20, 칸 수와 보상은 클로드 추천안).
   10칸, 올 때마다 1칸(포스 포인트 1점과 같은 단위). 3칸 액상 1병, 6칸 액상 1병, 10칸 액상 3병. 선물은 전부 액상으로.
   이유: 5병 사면 5주쯤 뒤에 오니 1년에 10번쯤. 첫 선물을 3번째에 둬서 금방 한 번 받게 하고, 끝 선물을 가장 크게.
   지금은 지난 칸 수를 읽어 올 곳이 없어서 "오늘 찍히는 첫 칸"만 보여 줌. 포스 포인트를 읽게 되면 CP_HAVE 만 바꾸면 됨 ── */
/* 도장 기준 (11/20):
   한 번에 49,500원(액상 5병 값) 이상 사면 1칸, 100,000원 이상이면 2칸. 하루에 한 번. 선물은 다음에 살 때 같이 드림.
   이러면 10칸을 채우는 데 최소 495,000원이 들고, 1병만 사는 손님은 5병으로 올라올 이유가 생김 */
const CP_MIN = 49500, CP_TWO = 100000;
/* 기기와 같이 사는 기기패키지는 도장 없음 (11/20 액상덕후 "기기랑 같이 구매하는 패키지는 안 찍히게") */
const cpPack = () => devInCart().length > 0 || /기기패키지/.test(CT.how || ""); /* 기기만 사도 도장 없음 (11/20 "기기만 사도 안 찍어") */
const cpToday = () => cpPack() ? 0 : (CT.total || 0) >= CP_TWO ? 2 : (CT.total || 0) >= CP_MIN ? 1 : 0;
const cpHint = () => { const t = CT.total || 0; return !CN || cpPack() ? "" : t < CP_MIN ? `${won(CP_MIN - t)} 더 담으면 오늘 한 칸` : t < CP_TWO && t >= CP_TWO - 30000 ? `${won(CP_TWO - t)} 더 담으면 오늘 두 칸` : ""; };
const CP_N = 10, CP_RW = { 3: "액상 1병", 6: "액상 1병", 10: "액상 3병" }, CP_HAVE = 0;
/* ── 유지비 계산 (3판 11/20 "연초 1갑 기준"). 연초 한 갑 4,500원, 하루 한 갑, 한 달 30일.
   전자담배 한 달은 액상 5병(지금 5병 값) + 팟 2팩. 기기값은 따로 보여 줌 ── */
const CIG_PACK = 4500, CIG_DAYS = 30;

/* ── 화면 ── */
const V = {
  start: () => `<div class="st3">${split(`<div class="stg3"><div class="bub an">어서 오세요!<small>베이프렌드 ${esc(D.branch)}</small></div><img src="kiosk3_img/char_hi.png" alt=""></div>`,

    <button data-who="mem"><span class="tx"><b>회원이에요</b><span>번호와 성함으로 지난 주문을 불러와요</span></span><span class="arr">›</span></button></div>
    <div class="st3b"><button class="txtb" data-who="guest">그냥 둘러볼게요</button><button class="scanb" data-scan="1"><i>📷</i>사진으로 담기</button></div>`)}
    <div class="band an d2">${[["dev", "기기", "ic_dev"], ["liq", "액상", "ic_liq"], ["dsp", "일회용", "ic_dsp"]].map(([k, t, ic]) => `<button data-cat="${k}"><img src="kiosk3_img/${ic}.png" alt="">${t}</button>`).join("")}<button data-go="pack"><img src="kiosk3_img/ic_gift.png" alt="">달 패키지</button><button data-go="calc"><img src="kiosk3_img/ic_calc.png" alt="">유지비</button><button data-go="coupon"><img src="kiosk3_img/ic_coupon.png" alt="">쿠폰</button></div></div>`,
  phone: () => split(`<div class="q an">휴대폰 번호를<br>눌러 주세요</div><div class="num an d1 ${S.phone ? "" : "e"}">${S.phone ? fmtPhone(S.phone) : "010-0000-0000"}</div>`,

  /* 회원: 번호 다음에 성함 (액상덕후 "전화번호 + 성함으로 조회하면 다른 고객님 정보가 뜨진 않을 거 아니야") */
  mname: () => split(`<div class="q an">성함을<br>알려 주세요</div><div class="qs an d1">${fmtPhone(S.phone)}</div>`,
