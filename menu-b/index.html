<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>베이프렌드 상담패드 B안 (세로 뼈대)</title>
<link rel="stylesheet" href="brand.css">
<!-- 포스터 글자용 글꼴: 하복2 기기 이름 = 나눔명조, 나머지 = 카페24 오스퀘어, 작은 글씨 = Pretendard -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* B안 세로 뼈대 10/27: 기준 800×1280. 1번 레퍼런스 = 연회색 바탕 + 흰 카드, 빨강은 가격과 버튼만 */
:root{
  --bg:#F2F2F4; --card:#fff; --ink:#15120f; --grey:#8d887f; --line:#e6e6ea;
  --red:#d81f2a; --black:#15120f; --r:24px; --gap:16px; --pad:24px;
  --kr:"NanumSquare","Pretendard","Malgun Gothic",sans-serif;
  --num:"KBLJump","Arial Black","NanumSquare",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
.app{height:100%;display:flex;flex-direction:column;max-width:800px;margin:0 auto}

/* 위 줄 64px */
.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 var(--pad)}
.logo{font-family:var(--num);font-size:20px;letter-spacing:.02em}
.logo{cursor:pointer;white-space:nowrap}
.logo span{display:inline-block;vertical-align:bottom;max-width:1.3em;transition:max-width .5s cubic-bezier(.6,0,.25,1),opacity .3s,transform .5s;transition-delay:calc(var(--j, 0) * .06s)}
.logo.noT span{transition:none}
/* 다 나오고 잠시 뒤 VF만 남김: D부터 거꾸로 접히며 F가 V 옆으로 붙음 */
.logo.mini .x{max-width:0;opacity:0;transform:scaleX(.3)}
/* 합쳐지면서 V, F가 굵어짐: 같은 색 외곽선을 0 → .1em으로 키움 */
.logo .r{-webkit-text-stroke:0 var(--red);transition:-webkit-text-stroke-width .7s cubic-bezier(.3,1.4,.5,1) .35s,transform .7s cubic-bezier(.3,1.4,.5,1) .35s,max-width .5s}
.logo.mini .r{-webkit-text-stroke-width:.08em;-webkit-text-stroke-linejoin:round;transform:scale(1.12) skewX(-9deg);transform-origin:left bottom}
.logo .m.r{transition:-webkit-text-stroke-width .7s cubic-bezier(.3,1.4,.5,1) .35s,transform .7s cubic-bezier(.3,1.4,.5,1) .35s,max-width .5s,margin-left .7s cubic-bezier(.3,1.4,.5,1) .35s}
.logo.mini .m.r{margin-left:.16em}.logo .r{color:var(--red)}
/* 로고 연출 10/27: V가 먼저 톡 → AFRIEN이 V 뒤에서 늘어지며 펼쳐짐 → D가 위에서 떨어져 찌그러졌다 튀어 오름(픽사 램프처럼) */
.logo.play .v{animation:lgV .45s cubic-bezier(.34,1.56,.64,1) both}
.logo.play .m{transform-origin:left bottom;animation:lgM .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.3s + var(--i) * .055s)}
.logo.play .d{transform-origin:center bottom;animation:lgD .7s ease-out both .78s}
@keyframes lgV{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
@keyframes lgM{0%{opacity:0;transform:translateX(calc(var(--i) * -15px - 14px)) scaleX(.15)}55%{opacity:1;transform:translateX(2px) scaleX(1.22)}100%{opacity:1;transform:none}}
@keyframes lgD{0%{opacity:0;transform:translateY(-30px) scale(.65,1.4)}40%{opacity:1;transform:translateY(0) scale(1.35,.65)}62%{transform:translateY(-10px) scale(.9,1.15)}80%{transform:translateY(0) scale(1.1,.9)}100%{opacity:1;transform:none}}
.srch{flex:1;height:44px;border-radius:22px;background:var(--card);display:flex;align-items:center;padding:0 18px;color:var(--grey);font-size:15px}
.home-btn{height:44px;padding:0 18px;border-radius:22px;background:var(--card);font-size:15px;font-weight:700}

/* 탭 줄 56px (첫 화면에선 숨김) */
.tabs{height:56px;flex:none;padding:0 var(--pad) 8px;display:flex}
.seg{flex:1;display:flex;background:#e4e4e8;border-radius:16px;padding:4px}
.seg button{flex:1;border-radius:12px;font-size:17px;font-weight:700;color:var(--grey)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
body[data-v=home] .tabs{display:none}

/* 본문 */
.body{flex:1;overflow-y:auto;padding:0 var(--pad) var(--pad)}
.view{display:none}
body[data-v=home] #vHome,body[data-v=dev] #vDev,body[data-v=liq] #vLiq,body[data-v=dsp] #vDsp{display:block}
.card{background:var(--card);border-radius:var(--r)}
.h{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 14px}
.price{font-family:var(--num);color:var(--red)}
.slot{display:flex;align-items:flex-end;padding:18px;border:2px dashed #d4d4da;color:var(--grey);font-size:12px}

/* 첫 화면: 포스터 752×940 + 3갈래 */
.poster{width:100%;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:#ddd;position:relative}
/* 포스터 = 글자 없는 그림(pst_c_) + 화면 글자. 1080×1350 기준으로 짜고 포스터 크기에 맞게 줄임 (디자인작업/261027_상담패드B안/gpt/compose.html과 같은 배치) */
@font-face{font-family:Ohsquare;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/Cafe24Ohsquare.woff) format("woff");font-display:swap}
.pv{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;font-family:Pretendard,var(--kr);color:#15120f;letter-spacing:-.025em;overflow:hidden}
.pv .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv .t{position:absolute;left:84px;right:84px;top:72px}.pv .t.c{text-align:center}
.pv .p{position:absolute;left:0;right:0;bottom:0;padding:150px 84px 72px;background:linear-gradient(to bottom,rgba(242,242,244,0),rgba(242,242,244,.94) 55%)}
.pv .eye{font-size:28px;font-weight:600;color:#6e6e73;letter-spacing:0}
.pv .ti{font-size:100px;font-weight:800;line-height:1.02;margin-top:14px;letter-spacing:-.04em}
.pv .sub{font-size:34px;font-weight:600;margin-top:16px;line-height:1.35}
.pv .r1{display:flex;gap:16px;align-items:center;margin-bottom:12px}.pv .r1 s{font-size:30px;color:#8d887f}.pv .r1 .l{font-size:28px;font-weight:600;color:#6e6e73}
.pv .pl{background:#d81f2a;color:#fff;border-radius:999px;padding:8px 20px 9px;font-size:28px;font-weight:800}
.pv .pb{display:block;font-size:120px;color:#d81f2a;letter-spacing:-.045em;line-height:1}.pv .pb small{font-size:56px}
.pv.oh .ti,.pv.oh .pb,.pv.oh .sub{font-family:Ohsquare;font-weight:400;letter-spacing:-.02em}
.pv.mj .ti{font-family:"Nanum Myeongjo";font-weight:800;letter-spacing:-.04em;font-size:108px}.pv.mj .eye{letter-spacing:.2em}
.pv.big .ti{font-size:150px}.pv.big .pb{font-size:170px}.pv.big .pb small{font-size:70px}
.pv.dk .t{color:#fff}.pv.dk .eye{color:rgba(255,255,255,.85)}.pv.dk .p{background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.55) 55%,rgba(0,0,0,.7))}
.pv.dk .pb{color:#fff}.pv.dk .r1 s,.pv.dk .r1 .l{color:rgba(255,255,255,.85)}
/* 등장: 바뀔 때 한 번만, 제목 → 설명 → 가격 순서로 아래에서 살짝 (가격도 0.3초 안에 시작) */
@keyframes pvUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pvBg{from{transform:scale(1.05)}to{transform:none}}
.pv.go .bg{animation:pvBg 1.4s cubic-bezier(.2,.8,.2,1) both}
.pv.go .eye,.pv.go .ti,.pv.go .sub,.pv.go .r1,.pv.go .pb{animation:pvUp .6s cubic-bezier(.2,.8,.2,1) both}
.pv.go .ti{animation-delay:.06s}.pv.go .sub{animation-delay:.14s}.pv.go .r1{animation-delay:.2s}.pv.go .pb{animation-delay:.26s}
@media (prefers-reduced-motion:reduce){.pv.go *{animation:none!important}}
.dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.5)}
.dots i.on{width:24px;background:#fff}
.go3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-top:var(--gap)}
.go3 button{height:160px;border-radius:var(--r);background:var(--card);text-align:left;padding:20px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.go3 b{font-size:30px;font-weight:800;letter-spacing:-.02em;position:relative}
.go3 small{font-size:13px;color:var(--grey);position:relative}
.go3 .tag{position:absolute;right:12px;bottom:14px;font-size:11px;color:#b5b5bb;border:1px dashed #cfcfd5;border-radius:8px;padding:2px 6px}

/* 기기: 큰 카드 + 썸네일 줄 + 패키지 3칸 */
.hero{padding:24px}
.hero .ph{height:360px;border-radius:18px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.hero .ph img{max-height:330px;max-width:100%;object-fit:contain}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:20px}
.hero .nm{font-size:32px;font-weight:800;letter-spacing:-.02em}
.hero .sub{font-size:14px;color:var(--grey);margin-top:4px}
.colors{display:flex;gap:12px;margin-top:16px}
.colors button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.colors button.on{outline:2px solid var(--ink);outline-offset:3px}
.thumbs{display:flex;gap:12px;overflow-x:auto;margin:var(--gap) calc(var(--pad)*-1) 0;padding:0 var(--pad) 4px}
.thumbs button{flex:none;width:112px;height:132px;border-radius:18px;background:var(--card);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700}
.thumbs button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.thumbs img{width:96px;height:88px;object-fit:contain}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:var(--gap)}
.pk button{height:120px;border-radius:18px;background:var(--card);text-align:left;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.pk button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.pk b{font-size:17px}
.pk .price{font-size:20px}
.pk s{font-size:13px;color:var(--grey)}
.cta{width:100%;height:64px;border-radius:18px;background:var(--red);color:#fff;font-size:20px;font-weight:800;margin-top:var(--gap)}

/* 액상, 일회용: 맛 태그 칩 + 4칸 진열 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--gap)}
.chips button{height:44px;padding:0 18px;border-radius:22px;background:var(--card);font-size:16px;font-weight:700;color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.it{background:var(--card);border-radius:20px;padding:10px 10px 12px;position:relative}
.it .im{aspect-ratio:1;border-radius:14px;background:#f6f6f8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.it .im img{width:100%;height:100%;object-fit:contain}
.it .nm{font-size:16px;font-weight:800;margin-top:10px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .fl{font-size:13px;color:var(--grey);margin-top:2px}
.it .bt{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.it .price{font-size:17px}
.it .add{width:36px;height:36px;border-radius:50%;background:var(--black);color:#fff;font-size:22px;line-height:36px}
.badge{position:absolute;left:16px;top:16px;background:var(--red);color:#fff;font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px}
.evbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;margin-bottom:var(--gap)}
.evbar b{font-size:20px}
.evbar span{font-size:14px;color:var(--grey)}

/* 아래 담은 상품 줄 88px */
.cart{height:88px;flex:none;background:var(--card);display:flex;align-items:center;gap:16px;padding:0 var(--pad);box-shadow:0 -1px 0 var(--line)}
.cart .cnt{font-size:16px;font-weight:700}
.cart .cnt em{font-style:normal;display:inline-block;min-width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;text-align:center;line-height:26px;font-size:14px;margin-left:6px}
.cart .sum{flex:1;text-align:right;font-size:28px}
.cart .show{height:56px;padding:0 24px;border-radius:16px;background:var(--black);color:#fff;font-size:17px;font-weight:800}

/* 담은 상품 시트 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:800px;height:70%;background:var(--card);border-radius:28px 28px 0 0;transform:translate(-50%,100%);transition:transform .45s cubic-bezier(.22,1,.36,1);padding:12px var(--pad) var(--pad);display:flex;flex-direction:column}
body.open .dim{opacity:1;pointer-events:auto}
body.open .sheet{transform:translate(-50%,0)}
.grab{width:48px;height:5px;border-radius:3px;background:#d4d4da;margin:0 auto 16px}
.lines{flex:1;overflow-y:auto}
.ln{display:flex;align-items:center;gap:12px;height:64px;border-bottom:1px solid var(--line)}
.ln img{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#f6f6f8}
.ln .n{flex:1;font-size:15px;font-weight:700}
.ln .q{font-size:15px;color:var(--grey)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0}
.tot span{font-size:16px;color:var(--grey)}
.tot .price{font-size:32px}
.note{font-size:12px;color:#b5b5bb;margin-top:20px;line-height:1.6}
/* 판매 연결 10/27 */
.cname{font-size:14px;font-weight:700;color:var(--grey);align-self:center;margin-left:4px}
.thumbs button.off{opacity:.45}.thumbs small{font-size:11px;color:var(--red)}
.cta:disabled{background:#c9c9cf}
.goal{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin-bottom:var(--gap);box-shadow:inset 0 0 0 2px var(--ink)}
.goal b{font-size:18px}.goal span{font-size:14px;color:var(--grey)}
.it.got{box-shadow:inset 0 0 0 2px var(--ink)}
.it.sold{opacity:.45}.badge.so{background:#8d887f}
.qb{display:flex;align-items:center;gap:10px}.qb button{width:32px;height:32px;border-radius:50%;background:var(--bg);font-size:18px;font-weight:700}
.ln .price{min-width:96px;text-align:right;font-size:17px}
.stp{display:flex;gap:12px;align-items:center;margin:18px 0 10px}.stp i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.stp b{font-size:17px}.stp span{display:block;font-size:13px;color:var(--grey);margin-top:2px}
.scan{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.scan .hd{display:flex;justify-content:space-between;font-size:16px}.scan .s{font-size:13px;color:var(--grey);margin:2px 0 6px}
.scan svg{display:block;max-width:100%;height:auto}
.warn{display:block;font-size:12.5px;color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ln .n small{display:block;font-size:12px;font-weight:400;color:var(--grey);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
/* 이벤트 구매 화면 */
.evs{position:fixed;left:50%;bottom:0;width:100%;max-width:800px;height:92%;background:var(--bg);border-radius:28px 28px 0 0;transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;z-index:20;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
body.evon .evs{transform:translate(-50%,0)}body.evon .dim{opacity:1;pointer-events:auto}
.evh{display:flex;justify-content:space-between;align-items:center;padding:22px var(--pad) 12px}
.evh small{display:block;font-size:14px;font-weight:700;color:var(--red)}.evh b{font-size:28px;font-weight:800;letter-spacing:-.02em}
.evh button{width:48px;height:48px;border-radius:50%;background:var(--card);font-size:20px}
.evb{flex:1;overflow-y:auto;padding:0 var(--pad) var(--pad)}
.evf{padding:12px var(--pad) 20px;background:var(--card);box-shadow:0 -1px 0 var(--line)}
.evbar{height:6px;border-radius:3px;background:var(--line);margin-bottom:12px;overflow:hidden}.evbar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.evhero{display:flex;gap:16px;align-items:center;padding:16px;margin-bottom:var(--gap)}
.evhero img{width:132px;height:165px;object-fit:cover;border-radius:16px}
.evhero .pr s{font-size:15px;color:var(--grey)}.evhero .pr .price{font-size:34px;display:block}
.evsec{font-size:18px;font-weight:800;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
.evsec button{font-size:14px;font-weight:700;padding:8px 14px;border-radius:12px;background:var(--card)}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt2 button{background:var(--card);border-radius:18px;padding:18px;text-align:left}.opt2 button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.opt2 b{font-size:22px;display:block}.opt2 span{font-size:14px;color:var(--grey)}
.it .mn{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:18px;font-weight:800}
.it.free::after{content:"서비스";position:absolute;left:16px;bottom:56px;font-size:11px;font-weight:800;color:#fff;background:#2f9e5a;border-radius:6px;padding:2px 6px}
/* 밤 모드 */
body[data-theme=dark]{--bg:#0f1012;--card:#1c1d20;--ink:#f1f1f3;--grey:#9b9ba3;--line:#2c2d31}
body[data-theme=dark] .seg{background:#26272b}body[data-theme=dark] .seg button.on{background:#3a3b40;color:#fff}
body[data-theme=dark] .add,body[data-theme=dark] .cart .show,body[data-theme=dark] .chips button.on,body[data-theme=dark] .stp i{background:#f1f1f3;color:#15120f}
body[data-theme=dark] .shbtn .b1{background:#f1f1f3;color:#15120f}
/* 결제 흐름: 금액 요약, 회원, 버튼 */
.shbtn{display:flex;gap:10px}.shbtn button{flex:1;height:60px;border-radius:16px;font-size:17px;font-weight:800}
.shbtn .b1{background:var(--ink);color:var(--card)}.shbtn .b2{background:var(--bg);color:var(--ink)}.shbtn .rd{background:var(--red);color:#fff}
.shbtn button:disabled{opacity:.4}
.sum2{background:var(--bg);border-radius:16px;padding:14px 16px;margin:14px 0}
.sum2 .r{display:flex;justify-content:space-between;font-size:15px;padding:3px 0;color:var(--grey)}.sum2 .r.off b{color:var(--red)}
.sum2 .save{font-size:14px;font-weight:800;color:var(--red);text-align:right;margin-top:4px}
.mem{background:var(--bg);border-radius:16px;padding:14px 16px;margin:10px 0 4px}
.mem .t{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between}.mem .t button{font-size:13px;color:var(--grey);text-decoration:underline}

<script>
const $ = id => document.getElementById(id);
// 로고: 새로고침, 처음 버튼, 로고 누를 때 재생 → 2.7초 뒤 VF만 남김
let lgT;
function logoPlay(){ const l = $('logo'); clearTimeout(lgT); l.classList.add('noT'); l.classList.remove('mini', 'play');
  void l.offsetWidth; l.classList.remove('noT'); l.classList.add('play');
  lgT = setTimeout(() => { l.classList.remove('play'); l.classList.add('mini'); }, 2700); }
logoPlay();
function go(v){ if (v === 'home' && document.body.dataset.v !== 'home') logoPlay(); document.body.dataset.v = v; $('body').scrollTop = 0;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }

// 첫 화면 포스터 10/27: 이벤트 3개(하복2, 대량, 일회용), 새로고침마다 이벤트별 시안 중 하나를 골라 보여 줌 (pst_b_*.jpg, 디자인작업/261027_상담패드B안/gpt)
const PB = { H: [1,2,3,4,5], B: [1,2,3,4,5], D: [1,2,3,4] }; // 10/27 v3: B 빛과 그림자, D 톤온톤 (D5는 사장님 "어떻게 해도 별로"라 뺌)
const PB_OLD = { H: "pst_havok2_v7.jpg", B: "pst_bulk3050.jpg", D: "pst_dsp105.jpg" };
const PID = Object.keys(PB).map(k => PB[k].length ? k + PB[k][Math.floor(Math.random() * PB[k].length)] : null); // 예: ["H3", "B1", "D4"]
const PST = PID.map((id, i) => id ? "pst_b_" + id + ".jpg" : PB_OLD[Object.keys(PB)[i]]); // 글자 박힌 판 (이벤트 화면 썸네일용)
// 글자 (10/27 확정 문구, 가격은 사장님 확인값): 위 = 작은 글 + 제목 + 설명 / 아래 = 빨간 딱지 + 큰 숫자
const PTX = {
  H: { cls: "mj oh", top: `<div class="eye">베이프렌드 기기패키지</div><div class="ti">HAVOK II</div><div class="sub">하복2 + 입호흡 액상 10병</div>`, pr: `<div class="r1"><span class="pl">15,000원 할인</span><s>179,000원</s></div><b class="pb">164,000<small>원</small></b>` },
  B: { cls: "oh big", top: `<div class="eye">빌런, 릭, 디오, 아이스샷, 토바코샷 섞어서</div><div class="ti">대량 특가</div><div class="sub">30병 210,000원 &nbsp;|&nbsp; 50병 340,000원</div>`, pr: `<div class="r1"><span class="pl">병당 최저</span><span class="l">50병 기준</span></div><b class="pb">6,800<small>원</small></b>` },
  D: { cls: "oh", top: `<div class="eye">팜팜바, 모스바 원하는 맛으로 15개</div><div class="ti">10개 사면<br>5개 더</div>`, pr: `<div class="r1"><span class="pl">최대 할인</span><span class="l">15개 중 5개 서비스</span></div><b class="pb">33<small>%</small></b>` },
};
// 그림마다 제목 정렬, 흰 글자 (그림 밝기 보고 정함): c = 가운데, w = 어두운 그림
const POPT = { H1: "", H2: "c", H3: "c", H4: "", H5: "c", B1: "c", B2: "c w", B3: "c w", B4: "c w", B5: "c w", D1: "c", D2: "c", D3: "c", D4: "c" };
const pvFit = () => { const pv = $('pv'); pv.style.transform = `scale(${$('poster').clientWidth / 1080})`; };
new ResizeObserver(pvFit).observe($('poster'));
let pi = 0;
function showP(i){ pi = (i + PST.length) % PST.length; const id = PID[pi], pv = $('pv');
  if (!id) { pv.className = "pv"; pv.innerHTML = `<img class="bg" src="${PST[pi]}" alt="">`; }
  else { const tx = PTX[id[0]], o = POPT[id] || "c";
    pv.className = "pv " + tx.cls + (o.includes("w") ? " dk" : "");
    pv.innerHTML = `<img class="bg" src="pst_c_${id}.jpg" alt=""><div class="t ${o.includes("c") ? "c" : ""}">${tx.top}</div><div class="p">${tx.pr}</div>`; }
  void pv.offsetWidth; pv.classList.add("go"); pvFit();
  $('dots').innerHTML = PST.map((_, k) => `<i class="${k === pi ? 'on' : ''}"></i>`).join(''); }
showP(0); setInterval(() => { if (document.body.dataset.v === 'home') showP(pi + 1); }, 5000);
const PST_K = Object.keys(PB); // PST 순서 = 이벤트 키 (H 하복2, B 대량, D 일회용)
$('poster').onclick = (e) => { if (e.target.closest('#dots')) return showP(pi + 1); openEv(PST_K[pi]); };
$('dots').onclick = (e) => { e.stopPropagation(); showP(pi + 1); };
// 손가락으로 밀어 넘기기
let sx = null; $('poster').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
$('poster').addEventListener('touchend', (e) => { if (sx == null) return; const d = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(d) > 50) { e.preventDefault(); showP(pi + (d < 0 ? 1 : -1)); } });

// 낮, 밤 모드 (이 기기에 기억)
function setTheme(t) { document.body.dataset.theme = t; $('themeBtn').textContent = t === "dark" ? "☀ 낮" : "🌙 밤"; try { localStorage.setItem("vf-b-theme", t); } catch (e) {} }
setTheme((() => { try { return localStorage.getItem("vf-b-theme") || "light"; } catch (e) { return "light"; } })());
$('themeBtn').onclick = () => setTheme(document.body.dataset.theme === "dark" ? "light" : "dark");

// ── 지점, 데이터 (지금 판 menu.html과 같은 방식) ──
const BRANCH = (() => { const u = new URLSearchParams(location.search).get("branch"); try { if (u) localStorage.setItem("vf-menu-branch", u); return u || localStorage.getItem("vf-menu-branch") || "본점"; } catch (e) { return u || "본점"; } })();
const POSB = (window.POS || {})[BRANCH] || {};
const posOf = (n) => POSB[n]; // [상품코드, 바코드, 형식, 바코드 등록 여부, 분류]
const GDS = (window.GOODS_BY || {})[BRANCH] || window.GOODS || [];
const won = (n) => n.toLocaleString() + "원";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1800); }

// ── A그룹 (본점 포스 소분류 '프리미엄 액상 A', '입호흡기기 A' = 회사가 밀어주는 메인 판매 상품, 매장운영 정리 부록D 6장) ──
const A_DEV = ["하복2", "발라맥스프로", "맥스프로 스티그마", "조바"];
const DEV_IMG = { 하복2: { 실버: "dev_havok2_silver.png", 블랙: "dev_havok2_black.png", 네이비: "dev_havok2_navy.png", 올리브: "dev_havok2_olive.png" },
  발라맥스프로: { 블랙: "dev_v017.jpg", 블루: "dev_v018.jpg", 실버: "dev_v019.jpg", 퍼플: "dev_v020.jpg", 핑크: "dev_v021.jpg" },
  "맥스프로 스티그마": { 네이비: "dev_v010.jpg", 블루: "dev_v011.jpg" }, 조바: { 골드: "dev_v044.jpg", 블랙: "dev_v045.jpg", 퍼플: "dev_v046.jpg" } };
const DEV_SUB = { 하복2: "입호흡, 폐호흡 겸용", 발라맥스프로: "입호흡", "맥스프로 스티그마": "입호흡", 조바: "입호흡" };
const HEX = { 실버: "#c9c9cc", 블랙: "#222", 네이비: "#26324d", 올리브: "#6b6a4a", 블루: "#2f6fd0", 핑크: "#f2a7c3", 퍼플: "#7a4fb5", 골드: "#c9a55a", 화이트: "#f4f4f4" };
const A_LIQ = [...["자두", "청포도", "레즈애플", "청사과", "레몬", "파인애플", "보석바", "바나나라무네", "석류"].map((f) => "VF 빌런 " + f),
  ...["자두", "청포도", "적사과", "청사과", "레몬", "파인애플", "바나나", "석류", "소다"].map((f) => "VF 릭 " + f), "베이퍼 시가812", "베이퍼 쿨멘솔"];
const LIQ_IMG = { "VF 빌런 레몬": "vl_sq_lemon.jpg", "VF 빌런 레즈애플": "vl_sq_redsapple.jpg", "VF 빌런 바나나라무네": "vl_sq_banana.jpg", "VF 빌런 보석바": "vl_sq_bosukbar.jpg", "VF 빌런 석류": "vl_sq_pomegranate.jpg", "VF 빌런 자두": "vl_sq_plum.jpg", "VF 빌런 청사과": "vl_sq_greenapple.jpg", "VF 빌런 청포도": "vl_sq_greengrape.jpg", "VF 빌런 파인애플": "vl_sq_pineapple.jpg",
  "VF 릭 바나나": "lk_sq_banana.jpg", "VF 릭 청사과": "lk_sq_greenapple.jpg", "VF 릭 청포도": "lk_sq_greengrape.jpg", "VF 릭 레몬": "lk_sq_lemon.jpg", "VF 릭 파인애플": "lk_sq_pineapple.jpg", "VF 릭 자두": "lk_sq_plum.jpg", "VF 릭 석류": "lk_sq_pomegranate.jpg", "VF 릭 적사과": "lk_sq_redapple.jpg", "VF 릭 소다": "lk_sq_soda.jpg",
  "베이퍼 시가812": "ph_032.jpg", "베이퍼 쿨멘솔": "ph_033.jpg" };
const LQ = A_LIQ.map((n) => (window.LIQ || []).find((x) => x.n === n)).filter(Boolean);
const isVL = (x) => /^VF (빌런|릭) /.test(x.n);
const short = (n) => n.replace(/^VF /, "");

// ── 가격 규칙 (지금 판과 같음, 사장님 10/2, 10/7 확인) ──
// 프리미엄 1병 15,000 / 5병 49,500 / 11병 90,000 (빌런, 릭, 베이퍼 섞어도 됨)
// 하복2 89,000 / 베이프렌드 기기패키지 = 하복2 + 빌런, 릭 5병 30,000 / 프리미엄 기기패키지 = 하복2 + 프리미엄 5병 40,000, 10병 75,000
const MAIN_PRICE = 89000, ADD = { vl5: 30000, pr5: 40000, pr10: 75000 };
const best = (n, deals, unit) => { const memo = {}; const f = (k) => { if (k <= 0) return 0; if (memo[k] != null) return memo[k]; let b = k * unit; for (const [q, p] of deals) if (k >= q) b = Math.min(b, p + f(k - q)); return (memo[k] = b); }; return f(n); };
const prPrice = (n) => best(n, [[11, 90000], [5, 49500]], 15000);
function estimate(c) { // c = { dev: 하복2 대수, v: 빌런+릭, p: 다른 프리미엄 }
  let b = c.dev * MAIN_PRICE + prPrice(c.v + c.p), how = "";
  const tryPk = (need, add, label, onlyVL) => { if (!c.dev) return;
    for (let a = 0; a <= Math.min(need, c.v); a++) { if (need - a > (onlyVL ? 0 : c.p)) continue;
      const t = (c.dev - 1) * MAIN_PRICE + MAIN_PRICE + add + prPrice(c.v - a + c.p - (need - a)); if (t < b) { b = t; how = label; } } };
  tryPk(5, ADD.vl5, "베이프렌드 기기패키지", true); tryPk(5, ADD.pr5, "프리미엄 기기패키지", false); tryPk(10, ADD.pr10, "프리미엄 기기패키지 10병", false);
  return { total: b, how };
}

// ── 장바구니: key → { k: "dev"|"liq", n: 포스 상품명, label, img, unit, qty, model } ──
const cart = new Map();
const countCart = () => { const c = { dev: 0, v: 0, p: 0, other: 0 };
  for (const x of cart.values()) { if (x.items) { c.other += x.unit * x.qty; continue; } if (x.k === "dev") { if (x.model === "하복2") c.dev += x.qty; else c.other += x.unit * x.qty; } else if (isVL(x)) c.v += x.qty; else c.p += x.qty; } return c; };
const totalOf = () => { const c = countCart(), e = estimate(c); return { ...e, total: e.total + c.other, c }; };
function addItem(key, it, d = 1) { const cur = cart.get(key); const q = (cur ? cur.qty : 0) + d;
  if (q <= 0) cart.delete(key); else cart.set(key, { ...(cur || it), qty: q }); drawCart(); drawLiq(); drawGoal(); }
function drawCart() {
  const t = totalOf(), n = [...cart.values()].reduce((a, x) => a + x.qty, 0);
  $('cnt').textContent = n; $('sum').textContent = $('sum2').textContent = won(t.total);
  $('how').textContent = t.how ? "합계 (" + t.how + " 적용)" : "합계";
  if (staffOn) return;
  // 낱개로 샀을 때 금액 (액상 1병 15,000 / 대량구매는 병 수 × 15,000 / 일회용 10+5는 15개 정가) → 할인 보여 주기
  const unitAll = [...cart.values()].reduce((a, x) => a + (x.k === "bulk" ? x.items.reduce((s, [, , q]) => s + q * 15000, 0) * x.qty : x.k === "dsp15" ? x.items.reduce((s, [, , q, p]) => s + q * p, 0) * x.qty : x.unit * x.qty), 0);

const POS_BUNDLE = { pr10: ["입호흡 기기 패키지 75,000원 (10병)", "입호흡 패키지 75,000원 (10병)"], pr5: ["입호흡 패키지 40,000원 (5병)"], vl5: ["빌런,릭,디오 패키지 30,000원 (5병)", "빌런,릭 패키지 30,000원 (5병)"], p11: ["프리미엄 90,000원(11병)"], p5: ["프리미엄 49,500원(5병)"] };

const imgOf = (x) => LIQ_IMG[x.n] || EXTRA_IMG[x.n] || (x.img ? IMGBASE + x.img : "");
const BULK_POOL = [...LQ.filter(isVL), ...(window.LIQ || []).filter((x) => /^디오 /.test(x.n) && !/딸기망고|콜라/.test(x.n)), ...["(한) 아이스샷", "(한) 토바코샷"].map((n) => (window.LIQ || []).find((x) => x.n === n)).filter(Boolean)];
const BULK = { 30: 210000, 50: 340000 };
const DSP_POOL = () => GDS.filter((g) => g.c === "dsp" && /^(팜팜바|모스바)/.test(g.n));
const DSP_IMG = { 팜팜바: "dsp_farm.png", 모스바: "dsp_moss.png" };
let EV = null; // { k, need, pick: Map(id → 수), color }
const pickN = () => [...EV.pick.values()].reduce((a, n) => a + n, 0);
function openEv(k) {
  if (k === "H") { const o = devOpts("하복2"); if (!o.length) return toast(BRANCH + " 하복2 재고가 없어요"); EV = { k, need: 10, pick: new Map(), color: o[0].opt }; }
  if (k === "B") EV = { k, need: 30, pick: new Map() };
  if (k === "D") { if (!DSP_POOL().length) return toast(BRANCH + " 팜팜바, 모스바 재고가 없어요"); EV = { k, need: 15, pick: new Map() }; }
  document.body.classList.add('evon'); drawEv(); $('evB').scrollTop = 0;
}
function closeEv() { document.body.classList.remove('evon'); }
$('evX').onclick = closeEv;
const evCard = (id, img, name, sub, price, out) => { const q = EV.pick.get(id) || 0;
  return `<div class="it ${q ? "got" : ""} ${out ? "sold" : ""}" data-e="${out ? "" : id}">${out ? '<span class="badge so">품절</span>' : q ? `<span class="badge">${q}</span><button class="mn" data-em="${id}">−</button>` : ""}<div class="im"><img src="${img}" alt="" loading="lazy"></div><div class="nm">${esc(name)}</div><div class="fl">${esc(sub)}</div>${price ? `<div class="bt"><span class="price" style="font-size:15px">${won(price)}</span></div>` : ""}</div>`; };
function dspTotal() { // 15개 중 가장 싼 5개 서비스
  const units = []; for (const [id, n] of EV.pick) { const g = GDS.find((x) => x.id === id); for (let i = 0; i < n; i++) units.push(g.price); }
  units.sort((a, b) => a - b); const free = Math.floor(units.length / 15) * 5; return units.slice(free).reduce((a, p) => a + p, 0);
}
function drawEv() {
  const n = pickN(), done = n === EV.need; let h = "";
  if (EV.k === "H") {
    $('evEye').textContent = "베이프렌드 기기패키지"; $('evTi').textContent = "하복2 + 액상 10병";
    const o = devOpts("하복2");
    h += `<div class="card evhero"><img src="${PST.find((p) => /_H/.test(p)) || "pst_havok2_v7.jpg"}" alt=""><div class="pr"><s>179,000원</s><b class="price">164,000원</b><span style="font-size:14px;color:var(--grey)">하복2 89,000원 + 액상 10병 75,000원</span></div></div>`;
    h += `<div class="evsec">① 색상</div><div class="card" style="padding:16px;display:flex;gap:16px;align-items:center"><img src="${DEV_IMG.하복2[EV.color] || ""}" style="width:110px;height:130px;object-fit:contain"><div><div class="colors" id="evCol">${o.map((x) => `<button style="background:${HEX[x.opt]}" class="${x.opt === EV.color ? "on" : ""}" data-ec="${x.opt}"></button>`).join("")}</div><div style="margin-top:10px;font-size:16px;font-weight:700">${EV.color}</div></div></div>`;
    h += `<div class="evsec">② 액상 10병 (${n}/10)<button data-fill="1">빌런 인기 맛으로 채우기</button></div><div class="grid">${LQ.map((x) => evCard(x.id, imgOf(x), short(x.n), x.f || "", 0, !posOf(x.n))).join("")}</div>`;
    $('evGo').textContent = done ? `이 구성으로 담기, 164,000원` : `액상 ${EV.need - n}병 더 골라 주세요`;
  }
  if (EV.k === "B") {
    $('evEye').textContent = "베이프렌드 대량 특가"; $('evTi').textContent = "액상 대량구매";
    h += `<div class="evsec">① 몇 병?</div><div class="opt2">${[30, 50].map((q) => `<button class="${EV.need === q ? "on" : ""}" data-bq="${q}"><b>${q}병 <span class="price" style="font-size:22px;color:var(--red)">${won(BULK[q])}</span></b><span>병당 ${won(BULK[q] / q)}</span></button>`).join("")}</div>`;
    h += `<div class="evsec">② 맛 고르기 (${n}/${EV.need})<button data-fill="1">남은 병 골고루 채우기</button></div><div class="grid">${BULK_POOL.map((x) => evCard(x.id, imgOf(x), short(x.n), x.f || "", 0, !posOf(x.n))).join("")}</div>`;
    $('evGo').textContent = done ? `${EV.need}병 담기, ${won(BULK[EV.need])}` : `${EV.need - n}병 더 골라 주세요`;
  }
  if (EV.k === "D") {
    $('evEye').textContent = "베이프렌드 일회용 대량"; $('evTi').textContent = "10개 사면 5개 더";
    const pool = DSP_POOL();
    h += `<div class="card evhero" style="padding:20px"><div class="pr"><b style="font-size:20px">팜팜바, 모스바 원하는 맛으로 15개</b><span style="display:block;font-size:14px;color:var(--grey);margin-top:6px">15개 중 가장 싼 5개는 서비스(0원), 최대 33% 할인</span></div></div>`;
    h += `<div class="evsec">맛 고르기 (${n}/15)</div><div class="grid">${pool.map((g) => evCard(g.id, DSP_IMG[g.model] || "", g.n, g.model, g.price, false)).join("")}</div>`;
    $('evGo').textContent = done ? `15개 담기, ${won(dspTotal())}` : `${15 - n}개 더 골라 주세요`;
  }
  $('evB').innerHTML = h; $('evBar').style.width = Math.min(100, n / EV.need * 100) + "%"; $('evGo').disabled = !done;
}
$('evB').onclick = (e) => {
  const m = e.target.closest('[data-em]'), c = e.target.closest('[data-ec]'), q = e.target.closest('[data-bq]'), f = e.target.closest('[data-fill]'), it = e.target.closest('[data-e]');
  const st = $('evB').scrollTop;
  if (m) { const id = m.dataset.em, v = (EV.pick.get(id) || 0) - 1; v > 0 ? EV.pick.set(id, v) : EV.pick.delete(id); }
  else if (c) EV.color = c.dataset.ec;
  else if (q) { EV.need = +q.dataset.bq; while (pickN() > EV.need) { const last = [...EV.pick.keys()].pop(); const v = EV.pick.get(last) - 1; v > 0 ? EV.pick.set(last, v) : EV.pick.delete(last); } }
  else if (f) { const pool = (EV.k === "H" ? LQ.filter((x) => /빌런/.test(x.n)) : BULK_POOL.filter(isVL)).filter((x) => posOf(x.n)); let i = 0; while (pickN() < EV.need && pool.length) { const x = pool[i++ % pool.length]; EV.pick.set(x.id, (EV.pick.get(x.id) || 0) + 1); } }
  else if (it && it.dataset.e) { if (pickN() >= EV.need) return toast(`${EV.need}${EV.k === "D" ? "개" : "병"}을 다 골랐어요`); EV.pick.set(it.dataset.e, (EV.pick.get(it.dataset.e) || 0) + 1); }
  else return;
  drawEv(); $('evB').scrollTop = st;
};
$('evGo').onclick = () => { if (pickN() !== EV.need) return;
  if (EV.k === "H") { const d = devOpts("하복2").find((o) => o.opt === EV.color);
    addItem(d.id, { k: "dev", n: d.n, label: d.n, img: DEV_IMG.하복2[EV.color], unit: d.price, model: "하복2" });
    for (const [id, q] of EV.pick) { const x = LQ.find((y) => y.id === id); addItem(id, { k: "liq", n: x.n, label: short(x.n), img: imgOf(x), unit: 15000 }, q); } }
  if (EV.k === "B") { const items = [...EV.pick].map(([id, q]) => { const x = BULK_POOL.find((y) => y.id === id); return [x.n, short(x.n), q]; });
    addItem("bulk" + Date.now(), { k: "bulk", n: "대량구매 " + EV.need + "병", label: "대량구매 " + EV.need + "병", img: imgOf(BULK_POOL.find((y) => y.id === [...EV.pick.keys()][0])), unit: BULK[EV.need], items }); }
  if (EV.k === "D") { const items = [...EV.pick].map(([id, q]) => { const g = GDS.find((x) => x.id === id); return [g.n, g.n, q, g.price]; });
    addItem("dsp" + Date.now(), { k: "dsp15", n: "", label: "일회용 10+5 (15개)", img: DSP_IMG[GDS.find((x) => x.id === [...EV.pick.keys()][0]).model], unit: dspTotal(), items }); }
  closeEv(); toast("담았어요"); setTimeout(() => document.body.classList.add('open'), 350);
};
// 직원 화면: 이벤트 묶음
function evStaff(x, i) {
  if (x.k === "bulk") return stp(i, x.label + " 찍기", "묶음 상품으로 돈 받고, 액상은 전부 서비스(0원)") + blk(x.n, won(x.unit), x.n, x.qty) + x.items.map(([n, l, q]) => blk(l, '<b style="color:var(--red)">서비스(0원)</b>', n, q * x.qty, q * x.qty)).join("");
  // 일회용 10+5: 가장 싼 5개 서비스
  const units = x.items.flatMap(([n, l, q, p]) => Array(q).fill([n, p])).sort((a, b) => a[1] - b[1]); const free = {}; units.slice(0, 5).forEach(([n]) => free[n] = (free[n] || 0) + 1);
  return stp(i, "일회용 10+5 찍기", "포스 묶음 상품이 없어서 낱개로, 가장 싼 5개는 서비스(0원)") + x.items.map(([n, l, q, p]) => blk(l, won(p) + (free[n] ? ` <b style="color:var(--red)">서비스(0원) ${free[n] >= q ? "전부" : free[n] + "개"}</b>` : ""), n, q, free[n] || 0)).join("");
}
document.querySelector('.dim').addEventListener('click', closeEv);

// 일회용: A그룹 아님, 이번엔 보기만 (판매 연결은 다음 단계)
const dcard = (n, img, p) => `<div class="it"><span class="badge">10+5</span><div class="im"><img src="${img}" alt="" loading="lazy"></div><div class="nm">${n}</div><div class="fl">여러 맛</div><div class="bt"><span class="price">${won(p)}</span></div></div>`;
$('dspGrid').innerHTML = dcard("팜팜바", "dsp_farm.png", 24900) + dcard("모스바", "dsp_moss.png", 25000);
$('note').textContent = `B안 테스트 (${BRANCH} 기준). 기기, 액상은 A그룹만 판매 연결됨. 일회용과 다른 상품은 지금 판을 써 주세요.`;
drawDev(); drawLiq(); drawCart(); drawGoal();
</script>
