<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, viewport-fit=cover">
<script>/* 10/27 패드마다 크기 맞추기 + 가로, 세로 돌리기: 세로는 폭 800, 가로는 폭 1280 기준 화면을 기기 폭에 꽉 맞게 비율 조정
   (울트라는 작고 레노버 M11은 커 보여서). 돌리면 다시 계산하고 body에 land 표시 */
function vfFit(){var land=matchMedia("(orientation: landscape)").matches,a=screen.width,b=screen.height,w=land?Math.max(a,b):Math.min(a,b),base=land?1280:800,s=Math.round(w/base*1000)/1000,m=document.querySelector('meta[name=viewport]');
  m.setAttribute('content',!w||Math.abs(s-1)<.02?'width='+base+',viewport-fit=cover':'width='+base+',initial-scale='+s+',minimum-scale='+s+',maximum-scale='+s+',user-scalable=no,viewport-fit=cover');
  if(document.body)document.body.classList.toggle('land',land);}
vfFit();addEventListener('orientationchange',function(){setTimeout(vfFit,60);});addEventListener('resize',function(){clearTimeout(window.__vft);window.__vft=setTimeout(vfFit,120);});</script>

<title>베이프렌드 상담패드 B안 (세로 뼈대)</title>
<link rel="stylesheet" href="brand.css">
<!-- 홈 화면 앱으로 깔기 (10/27): 지점은 처음 연 주소의 ?branch= 를 이 기기에 기억 -->
<link rel="manifest" href="manifest-b.json"><meta name="theme-color" content="#F2F2F4"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<!-- 포스터 글자용 글꼴: 하복2 기기 이름 = 나눔명조, 나머지 = 카페24 오스퀘어, 작은 글씨 = Pretendard -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* B안 세로 뼈대 10/27: 기준 800×1280. 1번 레퍼런스 = 연회색 바탕 + 흰 카드, 빨강은 가격과 버튼만 */
:root{
  --bg:#F2F2F4; --card:#fff; --ink:#15120f; --grey:#8d887f; --line:#e6e6ea;
  --red:#d81f2a; --black:#15120f; --r:24px; --gap:16px; --pad:24px;
  --kr:"NanumSquare","Pretendard","Malgun Gothic",sans-serif;
  --num:"KBLJump","Arial Black","NanumSquare",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
.app{height:100%;display:flex;flex-direction:column;max-width:800px;margin:0 auto}

/* 위 줄 64px */
.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 var(--pad)}
.logo{font-family:var(--num);font-size:20px;letter-spacing:.02em}
.logo{cursor:pointer;white-space:nowrap}
.logo span{display:inline-block;vertical-align:bottom;max-width:1.3em;transition:max-width .5s cubic-bezier(.6,0,.25,1),opacity .3s,transform .5s;transition-delay:calc(var(--j, 0) * .06s)}
.logo.noT span{transition:none}
/* 다 나오고 잠시 뒤 VF만 남김: D부터 거꾸로 접히며 F가 V 옆으로 붙음 */
.logo.mini .x{max-width:0;opacity:0;transform:scaleX(.3)}
/* 합쳐지면서 V, F가 굵어짐: 같은 색 외곽선을 0 → .1em으로 키움 */
.logo .r{-webkit-text-stroke:0 var(--red);transition:-webkit-text-stroke-width .7s cubic-bezier(.3,1.4,.5,1) .35s,transform .7s cubic-bezier(.3,1.4,.5,1) .35s,max-width .5s}
.logo.mini .r{-webkit-text-stroke-width:.08em;-webkit-text-stroke-linejoin:round;transform:scale(1.12) skewX(-9deg);transform-origin:left bottom}
.logo .m.r{transition:-webkit-text-stroke-width .7s cubic-bezier(.3,1.4,.5,1) .35s,transform .7s cubic-bezier(.3,1.4,.5,1) .35s,max-width .5s,margin-left .7s cubic-bezier(.3,1.4,.5,1) .35s}
.logo.mini .m.r{margin-left:.16em}.logo .r{color:var(--red)}
/* 로고 연출 10/27: V가 먼저 톡 → AFRIEN이 V 뒤에서 늘어지며 펼쳐짐 → D가 위에서 떨어져 찌그러졌다 튀어 오름(픽사 램프처럼) */
.logo.play .v{animation:lgV .45s cubic-bezier(.34,1.56,.64,1) both}
.logo.play .m{transform-origin:left bottom;animation:lgM .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.3s + var(--i) * .055s)}
.logo.play .d{transform-origin:center bottom;animation:lgD .7s ease-out both .78s}
@keyframes lgV{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
@keyframes lgM{0%{opacity:0;transform:translateX(calc(var(--i) * -15px - 14px)) scaleX(.15)}55%{opacity:1;transform:translateX(2px) scaleX(1.22)}100%{opacity:1;transform:none}}
@keyframes lgD{0%{opacity:0;transform:translateY(-30px) scale(.65,1.4)}40%{opacity:1;transform:translateY(0) scale(1.35,.65)}62%{transform:translateY(-10px) scale(.9,1.15)}80%{transform:translateY(0) scale(1.1,.9)}100%{opacity:1;transform:none}}
.srch{flex:1;height:44px;border-radius:22px;background:var(--card);display:flex;align-items:center;padding:0 18px;color:var(--grey);font-size:15px}
.home-btn{height:44px;padding:0 18px;border-radius:22px;background:var(--card);font-size:15px;font-weight:700}

/* 탭 줄 56px (첫 화면에선 숨김) */
.tabs{height:56px;flex:none;padding:0 var(--pad) 8px;display:flex}
.seg{flex:1;display:flex;background:#e4e4e8;border-radius:16px;padding:4px}
.seg button{flex:1;border-radius:12px;font-size:17px;font-weight:700;color:var(--grey)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
body[data-v=home] .tabs{display:none}

/* 본문 */
.body{flex:1;overflow-y:auto;padding:0 var(--pad) var(--pad)}
.view{display:none}
body[data-v=home] #vHome,body[data-v=dev] #vDev,body[data-v=liq] #vLiq,body[data-v=dsp] #vDsp{display:block}
.card{background:var(--card);border-radius:var(--r)}
.h{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 14px}
.price{font-family:var(--num);color:var(--red)}
.slot{display:flex;align-items:flex-end;padding:18px;border:2px dashed #d4d4da;color:var(--grey);font-size:12px}

/* 첫 화면: 포스터 752×940 + 3갈래 */
.poster{touch-action:pan-y;user-select:none;-webkit-user-select:none;width:100%;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:#ddd;position:relative}
/* 포스터 = 글자 없는 그림(pst_c_) + 화면 글자. 1080×1350 기준으로 짜고 포스터 크기에 맞게 줄임 (디자인작업/261027_상담패드B안/gpt/compose.html과 같은 배치) */
@font-face{font-family:Ohsquare;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/Cafe24Ohsquare.woff) format("woff");font-display:swap}
.pv{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;font-family:Pretendard,var(--kr);color:#15120f;letter-spacing:-.025em;overflow:hidden}
.pv .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;pointer-events:none}
.pv .t{position:absolute;left:84px;right:84px;top:72px}.pv .t.c{text-align:center}
.pv .p{position:absolute;left:0;right:0;bottom:0;padding:150px 84px 72px;background:linear-gradient(to bottom,rgba(242,242,244,0),rgba(242,242,244,.94) 55%)}
.pv .eye{font-size:28px;font-weight:600;color:#6e6e73;letter-spacing:0}
.pv .ti{font-size:100px;font-weight:800;line-height:1.02;margin-top:14px;letter-spacing:-.04em}
.pv .sub{font-size:38px;font-weight:600;margin-top:16px;line-height:1.35}
/* 위 글자 뒤 그라데이션 (10/27 사장님 "잘 안 보여서": 하복2 설명 줄이 뒤 빛과 겹침) */
.pv::before{content:"";position:absolute;left:0;right:0;top:0;height:460px;background:linear-gradient(to bottom,rgba(244,244,246,.92),rgba(244,244,246,.6) 55%,rgba(244,244,246,0));z-index:1}
.pv.dk::before{background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,.3) 55%,rgba(0,0,0,0))}
.pv .t,.pv .p{z-index:2}.pv .bg{z-index:0}
.pv .r1{display:flex;gap:16px;align-items:center;margin-bottom:12px}.pv .r1 s{font-size:30px;color:#8d887f}.pv .r1 .l{font-size:28px;font-weight:600;color:#6e6e73}
.pv .pl{background:#d81f2a;color:#fff;border-radius:999px;padding:8px 20px 9px;font-size:28px;font-weight:800}
.pv .pb{display:block;font-size:120px;color:#d81f2a;letter-spacing:-.045em;line-height:1}.pv .pb small{font-size:56px}
.pv.oh .ti,.pv.oh .pb{font-family:Ohsquare;font-weight:400;letter-spacing:-.02em}
.pv .sub{font-family:Pretendard,var(--kr);font-weight:600;letter-spacing:-.01em} /* 설명 줄은 얇게 (사장님 "글이 너무 굵어서") */
.pv.mj .ti{font-family:"Nanum Myeongjo";font-weight:800;letter-spacing:-.04em;font-size:108px}.pv.mj .eye{letter-spacing:.2em}
.pv.big .ti{font-size:150px}.pv.big .pb{font-size:170px}.pv.big .pb small{font-size:70px}
.pv.dk .t{color:#fff}.pv.dk .eye{color:rgba(255,255,255,.85)}.pv.dk .p{background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.55) 55%,rgba(0,0,0,.7))}
.pv.dk .pb{color:#fff}.pv.dk .r1 s,.pv.dk .r1 .l{color:rgba(255,255,255,.85)}
/* 등장: 바뀔 때 한 번만, 제목 → 설명 → 가격 순서로 아래에서 살짝 (가격도 0.3초 안에 시작) */
@keyframes pvUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pvBg{from{transform:scale(1.05)}to{transform:none}}
.pv.go .bg{animation:pvBg 1.4s cubic-bezier(.2,.8,.2,1) both}
.pv.go .eye,.pv.go .ti,.pv.go .sub,.pv.go .r1,.pv.go .pb{animation:pvUp .6s cubic-bezier(.2,.8,.2,1) both}
.pv.go .ti{animation-delay:.06s}.pv.go .sub{animation-delay:.14s}.pv.go .r1{animation-delay:.2s}.pv.go .pb{animation-delay:.26s}
@media (prefers-reduced-motion:reduce){.pv.go *{animation:none!important}}
.dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.5)}
.dots i.on{width:24px;background:#fff}
.go3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-top:var(--gap)}
.go3 button{height:160px;border-radius:var(--r);background:var(--card);text-align:left;padding:20px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.go3 b{font-size:30px;font-weight:800;letter-spacing:-.02em;position:relative}
.go3 small{font-size:13px;color:var(--grey);position:relative}
/* 첫 화면 3갈래 카드: 포스터 그림을 배경으로 크게, 아래 어둡게 덮고 흰 글자 (10/27 사장님 "보기 이쁘게") */
.go3 button{height:210px;padding:18px 20px;justify-content:flex-end;gap:4px;background:#222}
.go3 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.9);transition:transform .5s}
.go3 button::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 35%,rgba(0,0,0,.62))}
.go3 b,.go3 small{z-index:1;color:#fff}.go3 small{color:rgba(255,255,255,.85);font-size:14px;font-weight:600}.go3 b{font-size:34px}
.go3 button:active img{transform:scale(1.8)}

/* 기기: 큰 카드 + 썸네일 줄 + 패키지 3칸 */
.hero{padding:24px}
.hero .ph{height:360px;border-radius:18px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.hero .ph img{max-height:330px;max-width:100%;object-fit:contain}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:20px}
.hero .nm{font-size:32px;font-weight:800;letter-spacing:-.02em}
.hero .sub{font-size:14px;color:var(--grey);margin-top:4px}
.colors{display:flex;gap:12px;margin-top:16px}
.colors button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.colors button.on{outline:2px solid var(--ink);outline-offset:3px}
.thumbs{display:flex;gap:12px;overflow-x:auto;margin:var(--gap) calc(var(--pad)*-1) 0;padding:0 var(--pad) 4px}
.thumbs button{flex:none;width:112px;height:132px;border-radius:18px;background:var(--card);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700}
.thumbs button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.thumbs img{width:96px;height:88px;object-fit:contain}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:var(--gap)}
.pk button{height:120px;border-radius:18px;background:var(--card);text-align:left;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.pk button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.pk b{font-size:17px}
.pk .price{font-size:20px}
.pk s{font-size:13px;color:var(--grey)}
.cta{width:100%;height:64px;border-radius:18px;background:var(--red);color:#fff;font-size:20px;font-weight:800;margin-top:var(--gap)}

/* 액상, 일회용: 맛 태그 칩 + 4칸 진열 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--gap)}
.chips button{height:44px;padding:0 18px;border-radius:22px;background:var(--card);font-size:16px;font-weight:700;color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.it{background:var(--card);border-radius:20px;padding:10px 10px 12px;position:relative}
.it .im{aspect-ratio:1;border-radius:14px;background:#f6f6f8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.it .im img{width:100%;height:100%;object-fit:contain}
.it .nm{font-size:16px;font-weight:800;margin-top:10px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .fl{font-size:13px;color:var(--grey);margin-top:2px}
.it .bt{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.it .price{font-size:17px}
.it .add{width:36px;height:36px;border-radius:50%;background:var(--black);color:#fff;font-size:22px;line-height:36px}
.badge{position:absolute;left:16px;top:16px;background:var(--red);color:#fff;font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px}
.evbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;margin-bottom:var(--gap)}
.evbar b{font-size:20px}
.evbar span{font-size:14px;color:var(--grey)}

/* 아래 담은 상품 줄 88px */
.cart{height:88px;flex:none;background:var(--card);display:flex;align-items:center;gap:16px;padding:0 var(--pad);box-shadow:0 -1px 0 var(--line)}
.cart .cnt{font-size:16px;font-weight:700}
.cart .cnt em{font-style:normal;display:inline-block;min-width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;text-align:center;line-height:26px;font-size:14px;margin-left:6px}
.cart .sum{flex:1;text-align:right;font-size:28px}
.cart .show{height:56px;padding:0 24px;border-radius:16px;background:var(--black);color:#fff;font-size:17px;font-weight:800}

/* 담은 상품 시트 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:800px;height:70%;background:var(--card);border-radius:28px 28px 0 0;transform:translate(-50%,100%);transition:transform .45s cubic-bezier(.22,1,.36,1);padding:12px var(--pad) var(--pad);display:flex;flex-direction:column}
body.open .dim{opacity:1;pointer-events:auto}
body.open .sheet{transform:translate(-50%,0)}
.grab{width:48px;height:5px;border-radius:3px;background:#d4d4da;margin:0 auto 16px}
.lines{flex:1;overflow-y:auto}
.ln{display:flex;align-items:center;gap:12px;height:64px;border-bottom:1px solid var(--line)}
.ln img{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#f6f6f8}
.ln .n{flex:1;font-size:15px;font-weight:700}
.ln .q{font-size:15px;color:var(--grey)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0}
.tot span{font-size:16px;color:var(--grey)}
.tot .price{font-size:32px}
.note{font-size:12px;color:#b5b5bb;margin-top:20px;line-height:1.6}
/* 판매 연결 10/27 */
.cname{font-size:14px;font-weight:700;color:var(--grey);align-self:center;margin-left:4px}
.thumbs button.off{opacity:.45}.thumbs small{font-size:11px;color:var(--red)}
.cta:disabled{background:#c9c9cf}
.goal{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin-bottom:var(--gap);box-shadow:inset 0 0 0 2px var(--ink)}
.goal b{font-size:18px}.goal span{font-size:14px;color:var(--grey)}
.it.got{box-shadow:inset 0 0 0 2px var(--ink)}
.it.sold{opacity:.45}.badge.so{background:#8d887f}
.qb{display:flex;align-items:center;gap:10px}.qb button{width:32px;height:32px;border-radius:50%;background:var(--bg);font-size:18px;font-weight:700}
.ln .price{min-width:96px;text-align:right;font-size:17px}
.stp{display:flex;gap:12px;align-items:center;margin:18px 0 10px}.stp i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.stp b{font-size:17px}.stp span{display:block;font-size:13px;color:var(--grey);margin-top:2px}
.scan{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.scan .hd{display:flex;justify-content:space-between;font-size:16px}.scan .s{font-size:13px;color:var(--grey);margin:2px 0 6px}
.scan svg{display:block;max-width:100%;height:auto}
.warn{display:block;font-size:12.5px;color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.nudge{display:block;background:var(--bg);border-radius:16px;padding:14px 16px;margin:10px 0}.nudge b{display:block;font-size:16px}.nudge span{font-size:13px;color:var(--grey)}.nudge.gift{background:var(--red);color:#fff}.nudge.gift span{color:rgba(255,255,255,.85)}
.bar2{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--red)}
.upsell{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ink);color:var(--card);border-radius:16px;padding:16px 18px;margin:10px 0}.upsell span{flex:1}.upsell b{display:block;font-size:17px}.upsell small{font-size:13px;opacity:.8}.upsell i{font-style:normal;font-size:22px}

  try { const r = await fetch(ASK_API, { cache: "no-store", headers: { Accept: "application/vnd.github.raw+json", ...(askEtag ? { "If-None-Match": askEtag } : {}) } });
    if (r.status === 304) return askRows; if (r.ok) { askEtag = r.headers.get("ETag") || ""; askRows = await r.json(); return askRows; } } catch (e) {}
  return askRows;
}
async function loadAskAns() { askChip(); if (!askList().length) return;
  const rows = await askFetch(); if (!Array.isArray(rows)) return; const next = {};
  for (const r of rows) if (r.from === BRANCH && asked.has(r.item) && r.at >= asked.get(r.item) - 120e3) next[r.item] = { yes: r.yes || [], no: r.no || [] };
  const changed = JSON.stringify(next) !== JSON.stringify(ASKANS); ASKANS = next; if (!changed) return;
  askChip(); for (const [n, v] of Object.entries(next)) if (v.yes.length) toast(n.replace(/^VF /, "") + ", " + v.yes.join(", ") + "에 있대요");
  if (document.body.classList.contains('askon')) drawAsk(); }
setInterval(loadAskAns, 15e3); loadAskAns();
document.addEventListener('click', (e) => { const a = e.target.closest('[data-ask]'); if (a && !e.target.closest('#askB')) { e.stopPropagation(); askOpen(a.dataset.ask); } }, true);

// ── 실재고 불러오기 ──
async function loadStock() {
  try { const j = await (await fetch(STOCK_URL + "?t=" + Math.floor(Date.now() / 60e3), { cache: "no-store" })).json(); STOCK_ALL = j;
    const b = j[BRANCH]; if (!b) return; const before = STOCK_AT + OUT.size; OUT = new Set(b.out || []); STOCK_AT = b.at || "";
    if (before === STOCK_AT + OUT.size) return;
    drawDev(); drawLiq(); if (document.body.classList.contains('evon')) drawEv(); if (document.body.classList.contains('srchon')) drawSearch(); if (document.body.classList.contains('askon')) drawAsk();
    const sa = document.getElementById('stockAt'); if (sa) sa.textContent = `${BRANCH} 재고 ${STOCK_AT.split(" ").pop()} 기준`;
  } catch (e) {}
}
setTimeout(loadStock, 0); setInterval(loadStock, 10 * 60e3);

// 일회용: A그룹 아님, 이번엔 보기만 (판매 연결은 다음 단계)
const dcard = (n, img, p) => `<div class="it"><span class="badge">10+5</span><div class="im"><img src="${img}" alt="" loading="lazy"></div><div class="nm">${n}</div><div class="fl">여러 맛</div><div class="bt"><span class="price">${won(p)}</span></div></div>`;
$('dspGrid').innerHTML = dcard("팜팜바", "dsp_farm.png", 24900) + dcard("모스바", "dsp_moss.png", 25000);
drawDev(); drawLiq(); drawCart(); drawGoal();
// 가로판: 담은 상품 판 늘 보이게, 포스터 크기 다시
new MutationObserver(() => pvFit()).observe(document.body, { attributes: true, attributeFilter: ['class'] });
// 키보드 조작 (10/27 사장님 "키보드 조작도 가능하게"): 패드에 키보드 붙였을 때
// / 또는 Ctrl+F = 검색, Esc = 창 닫기(검색 지우기), ←→ = 포스터 넘기기, Enter = 첫 화면 포스터 구매 창
// 1 기기 / 2 액상 / 3 일회용 / 0 처음, C = 담은 상품, S = 직원 화면, Q = QR
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === "Escape") { if (typing) { document.activeElement.blur(); if ($('q').value) { $('q').value = ""; drawSearch(); } return; }
    if (document.body.classList.contains('askon')) return document.body.classList.remove('askon');
    if (document.body.classList.contains('evon')) return closeEv();
    if (document.body.classList.contains('open')) { document.body.classList.remove('open'); return cartViewBack(); }
    if ($('q').value) { $('q').value = ""; return drawSearch(); } return go('home'); }
  if (typing || e.altKey || e.metaKey) return;
  if (e.key === "/" || (e.ctrlKey && e.key.toLowerCase() === "f")) { e.preventDefault(); $('q').focus(); return; }
  if (e.ctrlKey) return;
  if (/^Arrow/.test(e.key)) { e.preventDefault(); return navMove(e.key.slice(5).toLowerCase()); }
  if (e.key === "Enter" && kf && document.contains(kf)) { e.preventDefault(); return navPress(kf); }
  const k = { "1": "dev", "2": "liq", "3": "dsp", "0": "home" }[e.key]; if (k) { closeEv(); return go(k); }
  const c = e.key.toLowerCase();
  if (c === "c") { document.body.classList.add('open'); return cartViewBack(); }
  if (c === "s" && cart.size) { document.body.classList.add('open'); return staffView(); }
  if (c === "q" && cart.size) { document.body.classList.add('open'); return qrView(); }
});
// ── 방향키 커서 (10/27 사장님 "방향키로 커서 움직이는 것처럼"): 지금 보이는 층(구매 창 > 재고 창 > 담은 상품 > 화면)에서
// 가리킨 칸이 커지고 빨간 테두리, Enter = 누르기. 첫 화면 포스터를 가리킨 상태에선 ←→ = 포스터 넘기기
const NAV = ".poster, .go3 button, #seg button, .chips button, .it, .sr, .thumbs button, .colors button, .pk button, .pkb, #devAdd, .combo button, .opt2 button, #evGo, .evh button, .shbtn button, .scan, .upsell, .engr button, .mem button, .qb button, .askrow button, [data-asksend], .home-btn, .srch";
let kf = null;
function navLayer() { const b = document.body.classList;
  if (b.contains('evon')) return $('ev'); if (b.contains('askon')) return $('ask'); if (b.contains('srchon')) return $('sres');
  if (b.contains('open') && !b.contains('land')) return document.querySelector('.sheet'); return document; }
function navList() { const L = navLayer(), out = [];
  for (const el of (L === document ? document.querySelectorAll(NAV) : L.querySelectorAll(NAV))) { const r = el.getBoundingClientRect();
    if (r.width < 4 || r.height < 4 || getComputedStyle(el).visibility === "hidden") continue;
    if (L === document && (el.closest('.evs') || el.closest('.asks') || (el.closest('.sheet') && !document.body.classList.contains('land')))) continue;
    if (el.closest('.view') && !el.closest('.view').offsetParent) continue; out.push(el); }
  return out; }
function navSet(el) { if (kf) kf.classList.remove('kf'); kf = el; if (!el) return; el.classList.add('kf'); el.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" }); }
function navMove(dir) {
  if (kf && kf.matches('.poster') && document.contains(kf) && (dir === "left" || dir === "right")) return showP(pi + (dir === "right" ? 1 : -1));
  const list = navList(); if (!list.length) return;
  if (!kf || !document.contains(kf) || !list.includes(kf)) return navSet(list.find((el) => !el.closest(".top")) || list[0]); // 처음엔 위 줄 말고 화면 첫 칸부터
  const a = kf.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2; let best = null, bd = 1e9;
  for (const el of list) { if (el === kf) continue; const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, dx = x - ax, dy = y - ay;
    const ok = dir === "right" ? dx > 8 : dir === "left" ? dx < -8 : dir === "down" ? dy > 8 : dy < -8; if (!ok) continue;
    if ((dir === "left" || dir === "right") && Math.abs(dy) > (a.height + r.height) / 2 + 30) continue; // 좌우는 같은 줄에서만
    const main = dir === "left" || dir === "right" ? Math.abs(dx) : Math.abs(dy), side = dir === "left" || dir === "right" ? Math.abs(dy) : Math.abs(dx);
    const d = main + side * 2.5; if (d < bd) { bd = d; best = el; } }
  if (best) navSet(best);
}
function navPress(el) {
  if (el.matches('.poster')) return openEv(PST_K[pi]);
  if (el.matches('.srch')) { navSet(null); return $('q').focus(); }
  const inner = el.matches('.it, .sr') ? el.querySelector('[data-a], [data-s], [data-ask], .add, .askb') : null;
  (inner || el).click(); setTimeout(() => { const l = navList(); if (kf && !document.contains(kf)) navSet(l[0] || null); }, 120);
}
document.addEventListener('pointerdown', () => navSet(null)); // 손가락으로 누르면 커서 숨김

// 오프라인 저장 + 앱 설치 (sw-b.js)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw-b.js").catch(() => {});
</script>
