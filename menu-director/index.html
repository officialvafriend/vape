<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, viewport-fit=cover">
<script>/* 패드 크기 맞추기: 세로 폭 800, 가로 폭 1280 기준 (menu-b와 같은 방식) */
function vfFit(){var land=matchMedia("(orientation: landscape)").matches,a=screen.width,b=screen.height,w=land?Math.max(a,b):Math.min(a,b),base=land?1280:800,s=Math.round(w/base*1000)/1000,m=document.querySelector('meta[name=viewport]');
  m.setAttribute('content',!w||Math.abs(s-1)<.02?'width='+base+',viewport-fit=cover':'width='+base+',initial-scale='+s+',minimum-scale='+s+',maximum-scale='+s+',user-scalable=no,viewport-fit=cover');
  if(document.body)document.body.classList.toggle('land',land);}
vfFit();addEventListener('orientationchange',function(){setTimeout(vfFit,60);});addEventListener('resize',function(){clearTimeout(window.__vft);window.__vft=setTimeout(vfFit,120);});</script>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6E1F2A">
<title>베이프렌드 상담패드 director</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- 입호흡 액상 목록은 정식 menu 폴더 자료를 읽기만 함 (고치지 않음) -->
<script src="../menu/data.js"></script>
<script src="../menu/lung.js"></script>
<script src="lung_img.js"></script>
<script src="../menu/goods.js"></script>
<style>
/* menu-director: 새 상담패드. 이 폴더 안에서만 고친다 (menu, menu-b는 손대지 않음)
   11/16 첫 화면: 플랜핏 온보딩 참고 = 위에 큰 질문 한 줄 + 작은 설명, 아래에 둥근 선택 카드를 쌓음.
   바탕은 VAFRIEND 빨강보다 차분한 버건디.
   11/16 2번 입호흡: 맛 계열 → 멘솔/니코틴 → 추천 목록(이번 주 판매 많은 순) */
:root{
  --bg:#6E1F2A;            /* 버건디 바탕 */
  --bg2:#5A1822;           /* 아래쪽 살짝 진하게 */
  --card:rgba(255,255,255,.10);
  --card-on:rgba(255,255,255,.22);
  --ink:#fff; --sub:rgba(255,255,255,.72);
  --accent:#FFB4B9;        /* 연한 빨강: 번호, 진행 막대, 눌렀을 때 테두리 */
  --r:28px; --pad:48px;
  --kr:"Pretendard","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);font-family:var(--kr);
  -webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{height:100%;padding:56px var(--pad) 48px}
.pane{height:100%;display:flex;flex-direction:column}

/* 맨 위: 뒤로 / 제목 / 처음으로 + 진행 막대 */
.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.top .ttl{font-size:24px;font-weight:700;color:var(--sub)}
.brand{font-size:22px;font-weight:800;letter-spacing:.18em;color:var(--sub)}
.ib{width:56px;height:56px;border:0;border-radius:50%;background:var(--card);font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}
.ib.txt{width:auto;padding:0 22px;border-radius:999px;font-size:19px;font-weight:700}
.ib.hide{visibility:hidden}
.bar{margin-top:24px;height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}

.q{margin-top:72px}
.q h1{font-size:56px;font-weight:800;line-height:1.25;letter-spacing:-.03em}
.q p{margin-top:20px;font-size:24px;color:var(--sub);line-height:1.5}
.opts{margin-top:auto;display:flex;flex-direction:column;gap:20px}
.opt{display:flex;align-items:center;gap:28px;width:100%;min-height:120px;padding:26px 36px;
  background:var(--card);border:2px solid transparent;border-radius:var(--r);
  text-align:left;transition:background .15s,border-color .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt.on{background:var(--card-on);border-color:var(--accent)}
.opt .n{flex:none;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--accent)}
.opt .t{display:block;font-size:31px;font-weight:800;letter-spacing:-.02em}
.opt .d{display:block;margin-top:8px;font-size:21px;color:var(--sub)}

/* 추천 목록 */
.res .q{margin-top:40px}
.res .q h1{font-size:44px}
.chips{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.chips span{padding:8px 16px;border-radius:999px;background:var(--card);font-size:18px;font-weight:700}
.ev{margin-top:20px;padding:16px 22px;border-radius:18px;background:rgba(255,180,185,.16);font-size:19px;line-height:1.45}
.ev b{color:var(--accent)}
.grid{margin-top:24px;flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start;grid-auto-rows:max-content;
  padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.item{background:#fff;color:#15120f;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.item .ph{position:relative;aspect-ratio:1/1;background:#f2f2f4}
.item .ph .tile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-size:24px;font-weight:800;color:#6E1F2A;background:#f6e9ea;line-height:1.3}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .rk{position:absolute;left:10px;top:10px;padding:5px 11px;border-radius:999px;background:#d81f2a;color:#fff;font-size:15px;font-weight:800}
.item .tg{position:absolute;right:10px;top:10px;padding:5px 10px;border-radius:999px;background:rgba(21,18,15,.75);color:#fff;font-size:14px;font-weight:700}
.item .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.item .br{font-size:15px;color:#6c675f;font-weight:700}
.item .nm{font-size:20px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.item .pr{margin-top:auto;padding-top:6px;font-size:20px;font-weight:800;color:#d81f2a}
.item .lc{font-size:14px;color:#6c675f}
.sq{margin-top:22px;width:100%;height:76px;border:0;border-radius:22px;padding:0 28px;font:700 26px var(--kr);color:#15120f;background:#fff;outline:none;-webkit-user-select:text;user-select:text}
.grid.list{grid-template-columns:1fr;gap:12px}
.row{display:flex;align-items:center;gap:20px;width:100%;padding:12px 24px 12px 12px;border:0;border-radius:20px;background:var(--card);text-align:left}
.row img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#fff;flex:none}
.row span{flex:1;display:flex;flex-direction:column;gap:4px}.row b{font-size:23px}.row small{font-size:17px;color:var(--sub)}
.row i{font-style:normal;font-size:34px;color:var(--sub)}
.call{display:flex;align-items:center;justify-content:center;height:200px;border-radius:var(--r);background:#fff;color:var(--bg);font-size:52px;font-weight:800;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.97);opacity:.85}}
body.land .grid.list{grid-template-columns:1fr 1fr}
body.land .call{height:150px;font-size:44px}
.rec{margin-top:24px;display:flex;gap:24px;align-items:stretch;background:#fff;color:#15120f;border-radius:var(--r);padding:20px}
.rec .dv{flex:none;width:200px;border-radius:18px;overflow:hidden;background:#f2f2f4}
.rec .dv img{width:100%;height:100%;object-fit:cover;display:block}
.rec .info{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.rec .info h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.rec .why{font-size:19px;line-height:1.5;color:#4a4540}
.pk{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:14px;background:#f6e9ea;font-size:20px;font-weight:700}
.pk b{color:#d81f2a;white-space:nowrap}
.pk.alt{background:#f2f2f4;font-weight:600}
.small{font-size:16px;color:#6c675f}
.sec{grid-column:1/-1;font-size:24px;font-weight:800}
.acts{display:flex;gap:14px;margin-top:16px}
.acts button{flex:1;height:72px;border:0;border-radius:20px;background:var(--card);font-size:22px;font-weight:800}
.acts button.main{background:#fff;color:var(--bg)}
body.land .rec .dv{width:170px}
body.land .newres{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto 1fr auto;column-gap:32px}
body.land .newres .top,body.land .newres .bar,body.land .newres .acts{grid-column:1/-1}
body.land .newres .q{grid-column:1;overflow:auto}
body.land .newres .grid{grid-column:2;grid-row:3;margin-top:24px;grid-template-columns:repeat(3,1fr);min-height:0}
body.land .newres .item .nm{font-size:17px}body.land .newres .item .pr{font-size:17px}
.empty{grid-column:1/-1;padding:48px 0;text-align:center;font-size:22px;color:var(--sub)}

.toast{position:fixed;left:50%;top:40px;transform:translate(-50%,-20px);opacity:0;padding:18px 28px;border-radius:999px;
  background:#fff;color:var(--bg);font-size:20px;font-weight:700;white-space:nowrap;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 가로로 돌리면: 질문은 왼쪽, 선택 카드는 오른쪽 */
body.land .screen{padding:40px 72px}
body.land .ask{display:grid;grid-template-columns:1fr 1.1fr;grid-template-rows:auto auto 1fr;column-gap:64px;align-items:start}
body.land .ask .top,body.land .ask .bar{grid-column:1/-1}
body.land .ask .q{margin-top:64px}
body.land .ask .opts{margin-top:32px;gap:12px;align-self:start}
body.land .opt{min-height:0;padding:14px 26px;gap:22px}
body.land .opt .n{width:46px;height:46px;font-size:22px}
body.land .opt .t{font-size:25px}
body.land .opt .d{font-size:18px;margin-top:4px}
body.land .res .q{margin-top:24px}
body.land .res .q h1{font-size:38px}
body.land .grid{grid-template-columns:repeat(5,1fr)}
</style>
</head>
<body>
<main class="screen" id="app"></main>
<div class="toast" id="toast"></div>
<script>
/* ---------- 자료 ---------- */
var LIQ = window.LIQ || [];
var PRICE = {"프리미엄":15000,"프라임":20000,"폐호흡":30000};           // menu-b 기준 1병 가격
var RANK = {};                                             // 이름 → 이번 주 판매 수
var params = new URLSearchParams(location.search);
var BRANCH = params.get('branch') || (function(){try{return localStorage.getItem('vfDirBranch')}catch(e){return null}})() || '';
if (params.get('branch')) try{localStorage.setItem('vfDirBranch',BRANCH)}catch(e){}
/* 폐호흡: 지점 포스 30,000원 액상 (menu/lung.js). 맛 계열은 이름 속 단어로 나눔 */
var LUNGL = (function(){
  var src = window.LUNG || {}, rows = BRANCH && src[BRANCH] ? src[BRANCH] : [].concat.apply([], Object.values(src)), seen = {}, out = [];
  var G = [["시가·타바코",/타바코|시가/],["멘솔·민트",/민트|멘솔|쿨|고드름|폴로|스피아/],
    ["디저트·음료",/우유|밀크|팝콘|콜라|레드불|아메리카노|커피|초코|스콘|피넛|컵콘|포테이토|모로나민|포카리|스프라이트|사이다|캔디|스크류바|초바쉐|도초바|소다킹/],
    ["과일",/포도|레몬|라임|망고|피치|복숭아|알로에|애플|사과|베리|석류|파인|멜론|리치|용과|자몽|딸기|구아바|(^|\s)배|오이|청포도|코코|패션|마르키사|라이문|그레이프|과일|트로피칼/],
    ["디저트·음료",/소다|슬러쉬|펀치|보석바/]];
  rows.forEach(function(r, i){ var n=r[0]; if (seen[n]) return; seen[n]=1;
    var dn = n.replace(/\s*\(?모드\)?\s*/g,' ').replace(/^모드\s*/,'').trim();
    var g = (G.filter(function(x){return x[1].test(dn)})[0]||["기타"])[0];
    var mg = (dn.match(/\d+\s*MG/i)||[''])[0];
    out.push({id:'L'+i, n:n, dn:dn, br:'폐호흡', f:mg?'니코틴 '+mg:'', g:g, t:['일반'], line:'폐호흡',
      cool:/민트|멘솔|쿨|고드름|아이스|프로즌|얼음/.test(dn), src:(window.LUNG_IMG||{})[n]||''});
  });
  return out;
})();
fetch('../menu/rank.json?t='+Date.now()).then(function(r){return r.json()}).then(function(j){
  var bs = j.branches||{}, list = BRANCH && bs[BRANCH] ? [bs[BRANCH]] : Object.values(bs);  // 지점 모르면 전 지점 합계
  list.forEach(function(b){(b.liq||[]).concat(b.lung||[]).forEach(function(x){RANK[x[0]]=(RANK[x[0]]||0)+(+x[1]||0)})});
  if (/^mtl-(res|rank|like|pack-res)/.test(state.view)) render();
}).catch(function(){});

/* ---------- 화면 정의 ---------- */
var FLAVOR = [
  {v:"과일",t:"과일",d:"청포도, 자두, 자몽처럼 상큼달달"},
  {v:"멘솔·민트",t:"멘솔 · 민트",d:"쿨하고 깔끔하게"},
  {v:"디저트·음료",t:"디저트 · 음료",d:"소다, 커피, 아이스크림처럼 달콤하게"},
  {v:"시가·타바코",t:"시가 · 타바코",d:"연초랑 비슷한 묵직한 맛"},
  {v:"",t:"잘 모르겠어요",d:"요즘 많이 찾는 맛으로 보여드릴게요"}
];
/* 폐호흡은 샤크, 홀리, 오니처럼 맛 이름 없이 별명만 있는 액상이 많아서 따로 묶음 */
var FLAVOR_DL = FLAVOR.slice(0,4).concat([{v:"기타",t:"샤크 · 홀리 · 오니 등",d:"맛 이름 대신 별명으로 부르는 액상"}], FLAVOR.slice(4));
function FL(){ return state.kind==='dl' ? FLAVOR_DL : FLAVOR; }
var COOL = [
  {v:"",t:"상관없어요",d:"시원한 것도, 아닌 것도 다 보여드려요"},
  {v:"노멘솔",t:"시원한 건 싫어요",d:"멘솔 없는 노멘솔 액상"},
  {v:"무니코틴",t:"니코틴 없이",d:"무니코틴 액상"}
];
var state = {view:'home', hist:[], flavor:null, cool:null, kind:'mtl'};
function DATA(){ return state.kind==='dl' ? LUNGL : LIQ; }
function KT(){ return state.view.indexOf('new')===0 ? '처음 오신 분' : state.kind==='dl' ? '폐호흡 액상' : '입호흡 액상'; }

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function won(n){return n.toLocaleString('ko-KR')+'원'}
function go(v){state.hist.push(state.view); state.view=v; render();}
function back(){state.view=state.hist.pop()||'home'; render();}
function home(){state={view:'home',hist:[],flavor:null,cool:null,q:'',base:null,pack:null,kind:'mtl',ans:{}}; render();}

function topBar(title, step, total){
  return '<div class="top">'+
    (state.view==='home' ? '<div class="brand">VAFRIEND</div>' : '<button class="ib" data-act="back" aria-label="뒤로">‹</button>')+
    '<div class="ttl">'+esc(title||'')+'</div>'+
    (state.view==='home' ? '<span class="ib hide"></span>' : '<button class="ib txt" data-act="home">처음으로</button>')+
  '</div>'+(total ? '<div class="bar"><i style="width:'+Math.round(step/total*100)+'%"></i></div>' : '');
}
function ask(o){ // 질문 한 화면: o = {title, step, total, h, p, opts:[{t,d,act}], sel}
  return '<div class="pane ask">'+topBar(o.title,o.step,o.total)+
    '<section class="q"><h1>'+o.h+'</h1>'+(o.p?'<p>'+o.p+'</p>':'')+'</section>'+
    '<section class="opts">'+o.opts.map(function(x,i){
      return '<button class="opt'+(o.sel===(x.i!=null?x.i:i)?' on':'')+'" data-act="'+x.act+'" data-i="'+(x.i!=null?x.i:i)+'"><span class="n">'+(i+1)+'</span><span><span class="t">'+esc(x.t)+'</span><span class="d">'+esc(x.d)+'</span></span></button>';
    }).join('')+'</section></div>';
}

function pick(f,c){ return DATA().filter(function(x){
    if (f && x.g!==f) return false;
    if (c==='노멘솔' && x.cool!==undefined) return !x.cool;
    if (c && (x.t||[]).indexOf(c)<0) return false;
    return true; }); }
function byRank(arr){ return arr.map(function(x,i){return {x:x, s:RANK[x.n]||0, i:i}})
    .sort(function(a,b){return b.s-a.s || (a.x.line===b.x.line?0:a.x.line==="프리미엄"?-1:1) || a.i-b.i}).map(function(o){return o.x}); }
var EV_DL = '<div class="ev"><b>폐호흡</b> 1병 30,000원 · <b>3병마다 40,000원</b> · 맛 섞어도 돼요</div>';
var EV = '<div class="ev"><b>프리미엄</b> 1병 15,000원 · 5병 49,500원 · 11병 90,000원 &nbsp;|&nbsp; <b>프라임</b> 1병 20,000원 · 3병 50,000원 · 10병 160,000원</div>';
function card(x, badge){
  var tag=(x.t||[]).filter(function(t){return t!=="일반"}).join(' · ');
  var src = x.src!=null ? x.src : '../img/'+x.img;
  return '<div class="item"><div class="ph">'+(src?'<img loading="lazy" src="'+esc(src)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<span class="tile">'+esc(x.dn||x.n)+'</span>')+
    (badge?'<span class="rk">'+esc(badge)+'</span>':'')+(tag?'<span class="tg">'+esc(tag)+'</span>':'')+'</div>'+
    '<div class="bd"><span class="br">'+esc([x.br,x.f].filter(Boolean).join(' · '))+'</span><span class="nm">'+esc(x.dn||x.n)+'</span>'+
    '<span class="pr">'+(PRICE[x.line]?won(PRICE[x.line]):'')+'</span><span class="lc">'+esc(x.line)+(x.loc?' · 위치 '+esc(x.loc.split('|')[0]):'')+'</span></div></div>';
}
/* 목록 한 화면: o = {step,total,h,chips,list,top(인기 표시 몇 위까지),note(위 안내),empty} */
function listPane(o){
  var n=o.top||3, rk=0;
  return '<div class="pane res">'+topBar(KT(),o.step,o.total)+
    '<section class="q"><h1>'+o.h+'</h1>'+
      '<div class="chips">'+(o.chips||[]).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'<span>'+o.list.length+'개</span></div>'+
      (o.note||(state.kind==='dl'?EV_DL:EV))+
    '</section>'+
    '<section class="grid">'+(o.list.length ? o.list.slice(0,60).map(function(x){
      var hot = (RANK[x.n]||0)>0 && rk<n; if (hot) rk++;
      return card(x, hot?'인기 '+rk+'위':'');

function similar(base){
  var words=(state.kind==='dl' ? (base.dn.match(/포도|레몬|라임|망고|피치|복숭아|알로에|애플|사과|베리|석류|파인|멜론|리치|용과|자몽|딸기|구아바|민트|소다|우유|밀크|콜라|커피|초코|캔디|청포도|코코|콘/g)||[]) : (base.f||'').split(/[+·,\s]+/)).filter(function(w){return w.length>1});
  return byRank(DATA().filter(function(x){return x.id!==base.id})).map(function(x){
    var sc=0; if (x.g===base.g) sc+=2;
    words.forEach(function(w){ if ((x.f||'').indexOf(w)>=0 || (x.dn||x.n).indexOf(w)>=0) sc+=3; });
    if (base.cool!==undefined && x.cool===base.cool) sc+=1;
    (base.t||[]).forEach(function(t){ if (t!=="일반" && (x.t||[]).indexOf(t)>=0) sc+=2; });
    if (x.br===base.br) sc+=1;
    return {x:x,sc:sc};
  }).filter(function(o){return o.sc>=3}).sort(function(a,b){return b.sc-a.sc}).map(function(o){return o.x});
}
function searchList(){
  var q=(state.q||'').replace(/\s/g,'');

  list = byRank(list).slice(0,30);
  return list.length?list.map(function(x){
      return '<button class="row" data-act="base" data-id="'+esc(x.id)+'"><img loading="lazy" src="'+esc(x.src!=null?x.src:'../img/'+x.img)+'" alt="" onerror="this.style.visibility=\'hidden\'"><span><b>'+esc(x.dn||x.n)+'</b><small>'+esc([x.br,x.f].filter(Boolean).join(' · '))+'</small></span><i>›</i></button>';

}

  if (a==='pack') { state.pack=i; return on('mtl-pack-res'); }
});

/* 2분 동안 아무도 안 만지면 첫 화면으로 */
var idleT; function idle(){clearTimeout(idleT); idleT=setTimeout(function(){ if(state.view!=='home') home(); },120000);}
['pointerdown','scroll'].forEach(function(ev){addEventListener(ev,idle,true)}); idle();
render();
</script>
