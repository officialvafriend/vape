<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<script>/* 패드 크기 맞추기: 세로 폭 800, 가로 폭 1280 기준 (menu-b와 같은 방식) */
function vfFit(){var land=matchMedia("(orientation: landscape)").matches,a=screen.width,b=screen.height,w=land?Math.max(a,b):Math.min(a,b),base=land?1440:900,s=Math.round(w/base*1000)/1000,m=document.querySelector('meta[name=viewport]');
  m.setAttribute('content',!w||Math.abs(s-1)<.02?'width='+base+',viewport-fit=cover':'width='+base+',initial-scale='+s+',minimum-scale='+s+',maximum-scale='+s+',user-scalable=no,viewport-fit=cover');
  if(document.body)document.body.classList.toggle('land',land);
  document.documentElement.classList.toggle('pc',matchMedia('(pointer:fine)').matches);}
vfFit();document.addEventListener('DOMContentLoaded',vfFit);addEventListener('orientationchange',function(){setTimeout(vfFit,60);});addEventListener('resize',function(){clearTimeout(window.__vft);window.__vft=setTimeout(vfFit,120);});</script>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3B5F8F">
<link rel="icon" href="vf_logo.png">
<title>베이프렌드 상담패드 director</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- 입호흡 액상 목록은 정식 menu 폴더 자료를 읽기만 함 (고치지 않음) -->
<script src="../menu/data.js"></script>
<script src="../menu/lung.js"></script>
<script src="lung_img.js"></script>
<script src="../menu/goods.js"></script>
<script src="../menu/devinfo.js"></script>
<script src="dev_img.js"></script>
<style>
/* 11/16 글씨체: 여기어때 잘난체 (굵기 하나뿐이라 제목, 버튼, 가격, 이름에만. 작은 설명은 Pretendard) */
@font-face{font-family:'Jalnan';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');font-weight:normal;font-display:swap}
/* menu-director: 새 상담패드. 이 폴더 안에서만 고친다 (menu, menu-b는 손대지 않음)
   11/16 첫 화면: 플랜핏 온보딩 참고 = 위에 큰 질문 한 줄 + 작은 설명, 아래에 둥근 선택 카드를 쌓음.
   바탕은 VAFRIEND 빨강보다 차분한 버건디.
   11/16 2번 입호흡: 맛 계열 → 멘솔/니코틴 → 추천 목록(이번 주 판매 많은 순) */
:root{
  /* 11/16 차분한 블루그레이 + 흰색 투톤. 밝은 하늘색은 눈이 피곤해서 채도를 낮춤 */
  --bg:#3B5F8F;            /* 차분한 블루그레이 바탕 */
  --bg2:#3B5F8F;
  --deep:#2B5689;          /* 흰 카드 위 강조 글씨, 가격, 아끼는 금액 */
  --tint:#EDF2F8;          /* 흰 카드 안 연한 하늘색 */
  --card:rgba(255,255,255,.16);
  --card-on:rgba(255,255,255,.3);
  --ink:#fff; --sub:rgba(255,255,255,.92);
  --accent:#FFFFFF;
  --r:28px; --pad:48px;
  --kr:"Pretendard","Malgun Gothic",sans-serif;
  --jal:"Jalnan","Pretendard","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* PC 브라우저: 화면 전체를 85%로 줄여서 한눈에 (zoom은 브라우저마다 달라서 transform으로) */
html.pc{overflow:hidden}
html.pc body{position:absolute;left:0;top:0;width:calc(100vw / .85);height:calc(100vh / .85);transform:scale(.85);transform-origin:0 0}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);
  -webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{height:100%;padding:56px var(--pad) 48px}
.pane{height:100%;display:flex;flex-direction:column}

/* 맨 위: 뒤로 / 제목 / 처음으로 + 진행 막대 */
.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.top .ttl{font-size:24px;font-weight:700;color:#fff}
.brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:900;font-style:italic;letter-spacing:.02em;color:#fff}
.brand img{height:44px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ib{width:56px;height:56px;border:0;border-radius:50%;background:rgba(255,255,255,.22);font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}
.ib.txt{width:auto;padding:0 22px;border-radius:999px;font-size:19px;font-weight:700}
.ib.hide{visibility:hidden}
.bar{margin-top:24px;height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}

.q{margin-top:72px}
.q h1{font-size:56px;font-weight:800;line-height:1.25;letter-spacing:-.03em}
.q p{margin-top:20px;font-size:24px;color:var(--sub);line-height:1.5}
.opts{margin-top:auto;display:flex;flex-direction:column;gap:20px}
.opt{display:flex;align-items:center;gap:22px;width:100%;min-height:112px;padding:20px 26px;
  background:#fff;color:#191f28;border:2px solid transparent;border-radius:var(--r);box-shadow:0 4px 14px rgba(0,50,110,.18);
  text-align:left;transition:background .15s,border-color .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--deep);background:var(--tint)}
.opt::after{content:'›';margin-left:auto;padding-left:8px;font-size:40px;line-height:1;color:#b0b8c1}
.opt .n{flex:none;width:68px;height:68px;border-radius:22px;background:var(--tint);
  display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:var(--deep)}
.opt .t{display:block;font-size:29px;font-weight:800;letter-spacing:-.03em;color:#191f28}
.opt .d{display:block;margin-top:6px;font-size:21px;color:#4e5968}

/* 추천 목록 */
.res .q{margin-top:40px}
.res .q h1{font-size:44px}
.chips{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.chips span{padding:8px 16px;border-radius:999px;background:var(--card);font-size:18px;font-weight:700}
.ev{margin-top:20px;padding:16px 22px;border-radius:18px;background:rgba(255,255,255,.22);font-size:19px;line-height:1.45}
.ev b{color:var(--accent)}
.grid{margin-top:24px;flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;align-content:start;grid-auto-rows:max-content;
  padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.item{background:#fff;color:#15120f;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.item .ph{position:relative;aspect-ratio:1/1;background:#f2f2f4}
.ph .tile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-size:24px;font-weight:800;color:var(--deep);background:var(--tint);line-height:1.3}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .rk{position:absolute;left:10px;top:10px;padding:5px 11px;border-radius:999px;background:var(--deep);color:#fff;font-size:15px;font-weight:800}
.item .tg{position:absolute;right:10px;top:10px;padding:5px 10px;border-radius:999px;background:rgba(21,18,15,.75);color:#fff;font-size:14px;font-weight:700}
.item .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.item .br{font-size:15px;color:#6c675f;font-weight:700}
.item .nm{font-size:20px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.item .pr{margin-top:auto;padding-top:6px;font-size:20px;font-weight:800;color:var(--deep)}
.item .lc{font-size:14px;color:#6c675f}
.sq{margin-top:22px;width:100%;height:76px;border:0;border-radius:22px;padding:0 28px;font:700 26px var(--kr);color:#15120f;background:#fff;outline:none;-webkit-user-select:text;user-select:text}
.grid.list{grid-template-columns:1fr;gap:12px}
.row{display:flex;align-items:center;gap:20px;width:100%;padding:12px 24px 12px 12px;border:0;border-radius:20px;background:var(--card);text-align:left}
.row img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#fff;flex:none}
.row span{flex:1;display:flex;flex-direction:column;gap:4px}.row b{font-size:23px}.row small{font-size:17px;color:var(--sub)}
.row i{font-style:normal;font-size:34px;color:var(--sub)}
.call{display:flex;align-items:center;justify-content:center;height:200px;border-radius:var(--r);background:#fff;color:var(--deep);font-size:52px;font-weight:800;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.97);opacity:.85}}
body.land .grid.list{grid-template-columns:1fr 1fr}
body.land .call{height:150px;font-size:44px}
.rec{margin-top:24px;display:flex;gap:24px;align-items:stretch;background:#fff;color:#15120f;border-radius:var(--r);padding:20px}
.rec .dv{flex:none;width:200px;border-radius:18px;overflow:hidden;background:#f2f2f4}
.rec .dv img{width:100%;height:100%;object-fit:cover;display:block}
.rec .info{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.rec .info h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.rec .why{font-size:19px;line-height:1.5;color:#4a4540}
.pk{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:14px;background:var(--tint);font-size:20px;font-weight:700}
.pk b{color:var(--deep);white-space:nowrap}
.pk.alt{background:#f2f2f4;font-weight:600}
.small{font-size:16px;color:#6c675f}
.sec{grid-column:1/-1;font-size:24px;font-weight:800}
.acts{display:flex;gap:14px;margin-top:16px}
.acts button{flex:1;height:72px;border:2px solid rgba(255,255,255,.6);border-radius:20px;background:transparent;color:#fff;font-size:22px;font-weight:800}
.acts button.main{border-color:#fff}
.acts button.main{background:#fff;color:var(--deep)}
body.land .rec .dv{width:170px}
body.land .newres{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto 1fr auto;column-gap:32px}
body.land .newres .top,body.land .newres .bar,body.land .newres .acts{grid-column:1/-1}
body.land .newres .q{grid-column:1;overflow:auto}
body.land .newres .grid{grid-column:2;grid-row:3;margin-top:24px;grid-template-columns:repeat(3,1fr);min-height:0}
body.land .newres .item .nm{font-size:17px}body.land .newres .item .pr{font-size:17px}
.dgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dcard{border:0;background:#fff;color:#15120f;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.dtabs{flex-wrap:wrap}.dtabs small{opacity:.7;font-size:.85em}
.dcard .ph{aspect-ratio:1/1;background:#f2f2f4;position:relative;overflow:hidden;min-height:0}
.dcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dcard b{padding:10px 12px 12px;font-size:17px;line-height:1.3}
.dtl{margin-top:28px;display:flex;gap:28px;background:#fff;color:#15120f;border-radius:var(--r);padding:24px;min-height:0;overflow:auto}
.dtl .ph{flex:none;width:260px;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#f2f2f4;position:relative}
.dtl .ph img{width:100%;height:100%;object-fit:cover;display:block}
.dtl .info{flex:1;display:flex;flex-direction:column;gap:12px}
.dtl h2{font-size:32px;font-weight:800;letter-spacing:-.02em}
.dtl dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:19px}
.dtl dt{color:#6c675f;font-weight:700}.dtl dd{font-weight:700}
.dtl dd.red{color:var(--deep)}
.dtl p{font-size:19px;line-height:1.55;color:#4a4540}
.tipbox{margin-top:28px;padding:28px;border-radius:var(--r);background:#fff;color:#15120f}
.tipbox li{margin:0 0 14px 28px;font-size:23px;line-height:1.5}
.tipbox li:last-child{margin-bottom:0}
body.land .dgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
body.land .dtl .ph{width:220px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{padding:8px 16px;border-radius:999px;border:2px solid #e6e6ea;background:#fff;color:#15120f;font-size:17px;font-weight:700}
.colors button.on{border-color:var(--deep);color:var(--deep)}
.dcard .pr{padding:0 12px 12px;font-size:17px;font-weight:800;color:var(--deep)}
.dcard b{padding-bottom:4px}
/* 입호흡 맛 지도 (커피 취향 탐색 참고) */
.mapf{margin-top:18px;display:flex;gap:10px}
.mapf button{padding:10px 20px;border-radius:999px;border:0;background:var(--card);font-size:19px;font-weight:700}
.mapf button.on{background:#fff;color:var(--deep)}
.tmap{position:relative;margin:24px auto 0;width:100%;max-width:704px;aspect-ratio:1/1;border-radius:24px;background:rgba(0,0,0,.22);padding:44px}
.tmap .qd{position:absolute;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:center;justify-items:center;padding:30px 18px;
  border:1.5px dashed rgba(255,255,255,.35);border-radius:16px;background:rgba(255,255,255,.04);transition:background .15s}
.tmap .qd:active,.tmap .qd.on{background:rgba(255,255,255,.26);border-color:var(--accent)}
.tmap .qd.tl{left:44px;top:44px;right:calc(50% + 10px);bottom:calc(50% + 10px)}
.tmap .qd.tr{right:44px;top:44px;left:calc(50% + 10px);bottom:calc(50% + 10px)}
.tmap .qd.bl{left:44px;bottom:44px;right:calc(50% + 10px);top:calc(50% + 10px)}
.tmap .qd.br{right:44px;bottom:44px;left:calc(50% + 10px);top:calc(50% + 10px)}
.tmap .qd.dim{opacity:.35}
.tmap .qd.dim::after{content:"없어요";grid-column:1/-1;font-size:18px;font-weight:700}
.tmap .qd i{display:block;width:58px;height:58px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tmap .qd i img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.tmap .qd .ql{position:absolute;left:12px;top:8px;font-size:15px;font-weight:800;color:rgba(255,255,255,.85)}
.tmap .ax{position:absolute;width:96px;height:96px;border-radius:50%;background:#fff;color:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2;pointer-events:none}
.tmap .ax small{font-size:13px;font-weight:700;color:#4f6f90}
.tmap .ax.t{left:50%;top:0;transform:translate(-50%,-30%)}
.tmap .ax.b{left:50%;bottom:0;transform:translate(-50%,30%)}
.tmap .ax.l{left:0;top:50%;transform:translate(-30%,-50%)}
.tmap .ax.r{right:0;top:50%;transform:translate(30%,-50%)}
.tmap .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;padding:10px 18px;border-radius:999px;
  background:rgba(0,60,130,.72);font-size:18px;font-weight:800;white-space:nowrap}
body.land .pane.res:has(.mapwrap){display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr;column-gap:40px}
body.land .pane.res:has(.mapwrap) .top,body.land .pane.res:has(.mapwrap) .bar{grid-column:1/-1}
body.land .mapwrap{grid-column:2;grid-row:3;min-height:0;padding:28px 0 8px}
body.land .mapwrap .tmap{margin:0;height:calc(100vh - 190px);width:calc(100vh - 190px);max-width:none;padding:40px}
body.land .tmap .qd i{width:46px;height:46px}
body.land .tmap .qd{padding:26px 12px 10px;gap:6px}
.pksz{margin-top:16px;display:flex;gap:12px}
.pksz button{flex:1;height:64px;border-radius:18px;border:2px solid transparent;background:var(--card);font-size:21px;font-weight:800}
.pksz button.on{background:#fff;color:var(--deep);border-color:var(--accent)}
.save{margin-top:18px;display:flex;align-items:center;gap:18px;background:#fff;color:#191f28;border-radius:24px;padding:20px 24px;box-shadow:0 4px 14px rgba(0,50,110,.18)}
.save .em{font-size:46px;line-height:1}
.save .tx{flex:1;min-width:0}
.save .l{font-size:19px;font-weight:700;color:#4e5968}
.save .big{margin-top:2px;font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--deep)}
.save .pr{margin-top:4px;font-size:18px;color:#6b7684}.save .pr s{color:#b0b8c1}.save .pr b{color:#191f28}
.save .pct{flex:none;padding:8px 14px;border-radius:999px;background:var(--tint);color:var(--deep);font-size:22px;font-weight:800}
.pk .pp{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.pk .pp s{font-size:15px;color:#9a9a9a;font-weight:600}
.pk em{display:block;margin-top:3px;font-style:normal;font-size:15px;font-weight:800;color:var(--deep)}
.item .unit{font-size:14px;font-weight:700;color:var(--deep);background:var(--tint);border-radius:8px;padding:4px 8px;align-self:flex-start}
/* 첫 화면 회원등록 띠 */
.memban{margin-top:28px;display:flex;align-items:center;gap:18px;width:100%;padding:18px 22px;border:0;border-radius:22px;background:rgba(255,255,255,.14);text-align:left}
.memban .em{font-size:38px}.memban b{display:block;font-size:24px;font-weight:800}.memban small{display:block;margin-top:4px;font-size:18px;color:var(--sub)}
.memban i{margin-left:auto;font-style:normal;font-size:36px;color:var(--sub)}
/* 회원등록 입력 */
.form{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.form label{font-size:19px;font-weight:700;color:var(--sub)}
.form .fi{display:flex;align-items:center;gap:12px}
.form input{width:100%;height:76px;border:3px solid transparent;border-radius:20px;padding:0 24px;font:800 28px var(--kr);color:#191f28;background:#fff;outline:none;-webkit-user-select:text;user-select:text}
.form input:focus{border-color:var(--accent)}.form input.bad{border-color:#ff8a8a}
.form .fi span{font-size:24px;font-weight:800;white-space:nowrap}
.ck{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border:0;border-radius:18px;background:var(--card);font-size:21px;font-weight:700;text-align:left}
.ck i{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px}
.ck.on i{background:#fff;color:var(--deep);border-color:#fff}.ck.on i::after{content:'✓'}.ck.bad{outline:3px solid #ff8a8a}
.cta{margin-top:auto;height:84px;border:0;border-radius:22px;background:#fff;color:var(--deep);font-size:27px;font-weight:800}
.pv{font-size:20px;color:var(--sub)}.pv b{color:#fff}
.done{margin-top:40px;background:#fff;color:#191f28;border-radius:var(--r);padding:32px;display:flex;flex-direction:column;gap:12px}
.done .big{font-size:40px;font-weight:800;letter-spacing:-.03em}.done .row2{display:flex;justify-content:space-between;font-size:24px;padding:14px 0;border-top:1px solid #eef0f3}
.done .row2 span{color:#6b7684}.done .row2 b{font-weight:800}
body.land .form{margin-top:12px;gap:6px}body.land .form label{font-size:16px}body.land .form input{height:54px;font-size:23px;border-radius:16px}
body.land .ck{padding:9px 16px;font-size:18px}body.land .ck i{width:28px;height:28px}body.land .cta{height:64px;font-size:23px}
body.land .done{margin-top:16px;padding:22px}body.land .done .big{font-size:32px}body.land .done .row2{padding:8px 0;font-size:21px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* 베이프렌드 캐릭터 (포토존 그림을 다시 그림): 빨간 동글이, 까만 네모 */
.chars{position:absolute;right:-8px;top:-122px;display:flex;align-items:flex-end;gap:2px;pointer-events:none}
.chars button{pointer-events:auto;border:0;background:none;padding:0;position:relative}
.chars button:active{transform:scale(.94)}
.chars .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);padding:3px 10px;border-radius:999px;background:#fff;color:var(--deep);font-size:14px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.chars svg{display:block}
.chars .bub{position:absolute;right:282px;top:22px;padding:10px 16px;border-radius:18px 18px 4px 18px;background:#fff;color:var(--deep);font-size:18px;font-weight:800;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:bob 2.4s ease-in-out infinite}
.q{position:relative}
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out .5s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.wv{transform-box:view-box;animation:wave 1.2s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-16deg)}}
.call{flex-direction:column;gap:6px;height:auto;padding:22px 0 18px}
.call svg{display:block}
body.land .chars{position:static;margin-top:36px;justify-content:flex-start}
body.land .chars .bub{position:relative;right:auto;top:auto;align-self:flex-start;margin-right:6px}
/* F, T 추천 */
.fthero{margin-top:18px;display:flex;align-items:flex-end;gap:14px}
.fthero .say{flex:1;position:relative;margin-bottom:34px;padding:20px 24px;border-radius:26px 26px 26px 6px;background:#fff;color:#191f28;font-size:23px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.fthero .say b{font-family:var(--jal);font-weight:normal;color:var(--deep)}
.ftc{margin-top:18px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:8px;scrollbar-width:none}
.ftc::-webkit-scrollbar{display:none}
.ftcard{background:#fff;color:#191f28;border-radius:24px;padding:24px 26px;flex:none;box-shadow:0 6px 18px rgba(0,30,70,.18)}
.ftcard h3{font-family:var(--jal);font-weight:normal;font-size:27px;margin-bottom:12px}
.ftcard .note{font-size:18px;color:#6b7684;margin:-4px 0 12px}
.ftrow{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid #eef0f3;width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;color:inherit}
.ftrow:first-of-type{border-top:0}
.ftrow img,.ftrow .ph0{flex:none;width:84px;height:84px;border-radius:18px;object-fit:cover;background:#f2f2f4}
.ftrow .tx{flex:1;min-width:0}.ftrow b{display:block;font-family:var(--jal);font-weight:normal;font-size:22px}
.ftrow small{display:block;margin-top:4px;font-size:19px;color:#333d4b;line-height:1.45}
.ftrow .rt{flex:none;text-align:right;font-family:var(--jal);font-size:21px;color:var(--deep)}.ftrow .rt s{display:block;font-family:var(--kr);font-size:15px;color:#b0b8c1}
.ftrow i{font-style:normal;font-size:30px;color:#b0b8c1}
.moods{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.moods button{padding:10px 16px;border-radius:999px;border:2px solid #eef0f3;background:#fff;font-size:18px;font-weight:700;color:#191f28}
.moods button.on{border-color:var(--deep);background:var(--tint);color:var(--deep)}
.tt{width:100%;border-collapse:collapse;font-size:20px}
.tt td{padding:10px 4px;border-top:1px solid #eef0f3}.tt tr:first-child td{border-top:0}
.tt td:last-child{text-align:right;font-family:var(--jal);color:#191f28}.tt tr.best td{color:var(--deep)}.tt tr.best td:last-child{color:var(--deep)}
.ftc .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ftc .grid3 .item{box-shadow:0 0 0 1px #eef0f3}
body.land .fthero svg{height:140px}
body.land .ftc{display:grid;grid-template-columns:1fr 1fr;align-content:start}
body.land .ftc .step:last-child:nth-child(odd){grid-column:1/-1}
/* 빨강이, 까망이에게 타자로 물어보기 */
.chat{margin-top:14px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 0 10px;scrollbar-width:none}
.chat::-webkit-scrollbar{display:none}
.msg{display:flex;align-items:flex-end;gap:10px;max-width:100%}
.msg .av{flex:none;width:64px}
.msg .av svg{display:block}
.msg .bb{background:#fff;color:#191f28;border-radius:22px 22px 22px 6px;padding:16px 20px;font-size:21px;line-height:1.5;max-width:calc(100% - 74px)}
.msg .bb .who{display:block;font-family:var(--jal);font-size:16px;color:var(--deep);margin-bottom:4px}
.msg.T .bb{background:#1f1f22;color:#fff}.msg.T .bb .who{color:#BFE0FF}
.msg.me{justify-content:flex-end}.msg.me .bb{background:var(--tint);color:var(--deep);border-radius:22px 22px 6px 22px;font-family:var(--jal)}
.msg .its{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.msg .its .item{box-shadow:0 0 0 1px #eef0f3}.msg.T .its .item{box-shadow:none}
.msg .its .item .nm{font-size:17px}.msg .its .item .pr{font-size:17px}
.msg .devs{margin-top:8px}.msg.T .ftrow{border-color:#333}.msg.T .ftrow small{color:#c9cdd2}.msg.T .ftrow b{color:#fff}
.sug{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.sug::-webkit-scrollbar{display:none}
.sug button{flex:none;padding:10px 16px;border-radius:999px;border:0;background:rgba(255,255,255,.16);font-size:18px;font-weight:700;white-space:nowrap}
.askbar{display:flex;gap:10px}
.askbar input{flex:1;height:72px;border:3px solid transparent;border-radius:22px;padding:0 22px;font:700 23px var(--kr);color:#191f28;background:#fff;outline:none;-webkit-user-select:text;user-select:text}
.askbar input:focus{border-color:var(--accent)}
.askbar button{flex:none;width:110px;border:0;border-radius:22px;background:var(--deep);color:#fff;font-family:var(--jal);font-size:22px}
.typing{display:inline-flex;gap:5px}.typing i{width:9px;height:9px;border-radius:50%;background:#c9cdd2;animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-6px);opacity:.5}}
body.land .msg .its{grid-template-columns:repeat(5,1fr)}
/* 떠 있는 회원등록 버튼: 첫 화면, 회원등록 화면 말고 어디서든 */
.fab{position:fixed;right:24px;bottom:24px;z-index:8;display:flex;align-items:center;gap:10px;padding:14px 22px 14px 16px;border:3px solid #fff;border-radius:999px;
  background:var(--deep);color:#fff;font-family:var(--jal);font-size:22px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:fabin .4s cubic-bezier(.2,1.6,.4,1)}
.fab .em{font-size:28px;animation:bob 2.4s ease-in-out infinite}
.fab:active{transform:scale(.95)}
.fab.up{bottom:24px}
body.fabon .screen{padding-bottom:108px}
.fab[hidden]{display:none}
.fab.home{right:auto;left:24px;background:#fff;color:var(--deep);border-color:var(--deep)}
.fab.home .em{animation:none}
@keyframes fabin{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
body.land .fab.up{bottom:20px}
body.land .fab{bottom:20px;padding:10px 20px 10px 14px;font-size:20px}
body.land.fabon .screen{padding-bottom:92px}

.banrow{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.banrow .memban{margin-top:0;padding:16px 18px;gap:12px}
.banrow .memban .em{font-size:32px}.banrow .memban b{font-size:21px}.banrow .memban small{font-size:16px}
.memban.cheap{background:#fff;color:#191f28}.memban.cheap small{color:#4e5968}.memban.cheap i{color:#b0b8c1}.memban.cheap b{color:var(--deep)}
.step{display:flex;gap:16px;align-items:flex-start}
.step .sn{flex:none;width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--deep);display:flex;align-items:center;justify-content:center;font-family:var(--jal);font-size:22px}
.step .sb{flex:1;min-width:0}.step h3{margin-bottom:6px}
.step p{font-size:21px;line-height:1.55;color:#333d4b}.step p b{color:var(--deep);font-family:var(--jal);font-weight:normal}
.step .go{margin-top:12px;padding:12px 18px;border:0;border-radius:14px;background:var(--tint);color:var(--deep);font-family:var(--jal);font-size:19px}
body.land .banrow{grid-template-columns:1fr}
.save{position:relative}
/* 화면 들어올 때 아래에서 톡톡 올라오기 (마지막 모양은 안 붙잡아서 눌림 효과는 그대로) */
.enter .q,.enter .opt,.enter .ftcard,.enter .item,.enter .save,.enter .acts,.enter .tmap,.enter .row,.enter .dcard,.enter .lab{animation:up .5s cubic-bezier(.2,.9,.3,1.15) backwards}
.enter .opt:nth-child(2),.enter .ftcard:nth-child(2),.enter .item:nth-child(2){animation-delay:.06s}
.enter .opt:nth-child(3),.enter .ftcard:nth-child(3),.enter .item:nth-child(3){animation-delay:.12s}
.enter .opt:nth-child(4),.enter .ftcard:nth-child(4),.enter .item:nth-child(4){animation-delay:.18s}
.enter .opt:nth-child(5),.enter .ftcard:nth-child(5),.enter .item:nth-child(5){animation-delay:.24s}
.enter .opt:nth-child(n+6),.enter .ftcard:nth-child(n+6),.enter .item:nth-child(n+6){animation-delay:.3s}
.enter .acts{animation-delay:.25s}
@keyframes up{0%{opacity:0;transform:translateY(36px)}100%{opacity:1;transform:none}}
button:active{filter:brightness(.96)}
/* 아끼는 금액 나올 때 폭죽 */
.boom{position:absolute;left:46px;top:50%;font-size:30px;pointer-events:none;animation:boom .9s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes boom{0%{transform:translate(0,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1) rotate(var(--r));opacity:0}}
.mapf .labbtn{margin-left:auto;background:#fff;color:var(--deep);animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:none}85%{transform:rotate(-5deg) scale(1.05)}90%{transform:rotate(5deg) scale(1.05)}95%{transform:rotate(-3deg)}}
/* 맛 섞기 실험실 */
.lab{flex:1;min-height:0;margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.flask{position:relative;width:300px;height:330px;flex:none;transition:transform .2s}
.flask.hot{transform:scale(1.06)}
.flask .neck{position:absolute;left:50%;top:0;width:110px;height:90px;margin-left:-55px;border:6px solid #fff;border-bottom:0;border-radius:14px 14px 0 0;background:rgba(255,255,255,.08)}
.flask .body{position:absolute;left:0;right:0;bottom:0;height:250px;border:6px solid #fff;border-radius:50% 50% 46% 46%/38% 38% 62% 62%;overflow:hidden;background:rgba(255,255,255,.1)}
.flask .liq{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .6s cubic-bezier(.3,1.4,.5,1),background .6s}
.flask .liq::before{content:'';position:absolute;left:-50%;top:-16px;width:200%;height:32px;background:inherit;border-radius:45%;animation:wave2 3s linear infinite;opacity:.8}
@keyframes wave2{100%{transform:translateX(25%)}}
.flask .bub{position:absolute;bottom:10px;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.7);animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-200px) scale(1.1);opacity:0}}
.flask .in{position:absolute;inset:auto 0 30px 0;display:flex;justify-content:center;gap:6px;z-index:2}
.flask .in button{border:0;background:#fff;border-radius:50%;width:66px;height:66px;font-size:38px;box-shadow:0 4px 12px rgba(0,0,0,.25);animation:drop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{0%{transform:translateY(-160px) scale(.6)}100%{transform:none}}
.flask .empty0{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:90px;font-family:var(--jal);font-size:22px;color:rgba(255,255,255,.85);text-align:center;line-height:1.4}
.flask.shake{animation:shake .45s}
@keyframes shake{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.labmsg{font-family:var(--jal);font-size:26px;text-align:center;min-height:36px}
.labmsg b{color:#FFE14D;font-weight:normal}
.ings{width:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:auto}
.ing{touch-action:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border:0;border-radius:22px;background:#fff;color:#191f28;font-family:var(--jal);font-size:18px;box-shadow:0 4px 12px rgba(0,30,70,.2);transition:opacity .2s,transform .2s}
.ing .e{font-size:44px;line-height:1}
.ing.used{opacity:.35;transform:scale(.92)}
.ing.drag{position:relative;z-index:20;transition:none;box-shadow:0 18px 36px rgba(0,0,0,.35);transform:scale(1.12) rotate(-6deg)}
.labacts{width:100%;display:flex;gap:12px}
.labacts button{height:76px;border:0;border-radius:22px;font-family:var(--jal);font-size:24px}
.labacts .clr{flex:none;width:150px;background:transparent;border:2px solid rgba(255,255,255,.6);color:#fff}
.labacts .go2{flex:1;background:#fff;color:var(--deep)}
.labacts .go2:disabled{opacity:.45}
body.land .cheapp .save .big{font-size:30px}body.land .cheapp .save .pct{display:none}
.mpp .q{margin-top:28px}.mpp .q h1{font-size:38px}
.mpp .save{margin-top:14px;padding:14px 20px}.mpp .save .em{font-size:36px}.mpp .save .big{font-size:28px}
.mpp .ev{margin-top:12px;padding:10px 16px;font-size:18px}
.mpp .pksz button{height:56px}
body.land .mpp{display:grid;grid-template-columns:420px 1fr;grid-template-rows:auto auto auto 1fr auto;column-gap:28px}
body.land .mpp .top,body.land .mpp .bar,body.land .mpp .acts{grid-column:1/-1}
body.land .mpp .q{grid-column:1;grid-row:3/5;overflow:auto}
body.land .mpp .q h1{font-size:30px}body.land .mpp .save .pct{display:none}body.land .mpp .save .big{font-size:26px;white-space:nowrap}
body.land .mpp .pksz{flex-direction:column}
body.land .mpp .grid{grid-column:2;grid-row:4;min-height:0;margin-top:12px}
.fbar{margin-top:14px;display:flex;flex-direction:column;gap:8px;flex:none}
.frow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.frow::-webkit-scrollbar{display:none}
.frow button{flex:none;padding:9px 16px;border-radius:999px;border:0;background:rgba(255,255,255,.18);color:#fff;font-family:var(--jal);font-size:18px;white-space:nowrap}
.frow button small{opacity:.7;font-size:.82em}
.frow button.on{background:#fff;color:var(--deep)}
.frow.ser button{background:transparent;border:2px solid rgba(255,255,255,.35);padding:7px 14px;font-size:17px}
.frow.ser button.on{background:#FFE14D;border-color:#FFE14D;color:#191f28}
.frow .lb{flex:none;align-self:center;font-family:var(--jal);font-size:16px;opacity:.8;margin-right:2px}
.fbar+.grid{margin-top:14px}
body.land .mpp .fbar{grid-column:2;grid-row:3;margin-top:24px;min-width:0}
body.land .cheapp{display:grid;grid-template-columns:520px 1fr;grid-template-rows:auto auto 1fr auto;column-gap:28px}
body.land .cheapp .top,body.land .cheapp .bar,body.land .cheapp .acts{grid-column:1/-1}
body.land .cheapp .q{grid-column:1;grid-row:3;margin-top:24px!important}
body.land .cheapp .ftc{grid-column:2;grid-row:3;display:flex;min-height:0}
body.land .labp .q{margin-top:14px!important}body.land .labp .q h1{font-size:36px}body.land .labp .q p{margin-top:8px;font-size:20px}
body.land .labp .lab{margin-top:10px}
body.land .labp .flask{transform:scale(.72);transform-origin:center}
body.land .labp .flask.hot{transform:scale(.78)}
body.land .ing{padding:8px 4px}body.land .ing .e{font-size:36px}
body.land .labacts button{height:64px}
body.land .lab{display:grid;grid-template-columns:330px 1fr;grid-template-rows:auto 1fr auto;column-gap:36px;align-items:center}
body.land .flask{grid-row:1/4;grid-column:1}
body.land .labmsg{grid-column:2}
body.land .ings{grid-column:2;margin-top:0}
body.land .labacts{grid-column:2}
.item .add{margin-top:8px;height:44px;border:0;border-radius:14px;background:var(--tint);color:var(--deep);font-family:var(--jal);font-size:17px}
.item .add.on,.item .add:active{background:var(--deep);color:#fff}
.item.lift{opacity:.4}
.item[data-id],.dcard[data-gid]{touch-action:pan-y;cursor:grab}
.dcard.lift{opacity:.4}
.item img{-webkit-user-drag:none;user-drag:none}
/* 떠 있는 장바구니 병: 오른쪽 가운데 */
.cartdock{position:fixed;right:12px;top:20px;bottom:100px;z-index:9;width:calc(33% - 12px);padding:12px;border-radius:26px;background:rgba(0,30,70,.28);display:flex;flex-direction:column;align-items:center;gap:8px}
.cartdock[hidden]{display:none}
.cartfab{position:relative;flex:none;width:118px;height:150px;border:0;background:none;padding:0;color:#fff;animation:fabin .4s cubic-bezier(.2,1.6,.4,1);transition:transform .2s}
.cartfab[hidden]{display:none}
.cartfab .neck{position:absolute;left:50%;top:0;width:40px;height:34px;margin-left:-20px;border:4px solid #fff;border-bottom:0;border-radius:8px 8px 0 0;background:rgba(43,86,137,.9)}
.cartfab .body{position:absolute;left:4px;right:4px;top:30px;height:96px;border:4px solid #fff;border-radius:50% 50% 46% 46%/40% 40% 60% 60%;overflow:hidden;background:rgba(43,86,137,.92);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.cartfab .liq{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#FFB38A,#FF4D6D);transition:height .5s cubic-bezier(.3,1.4,.5,1)}
.cartfab .liq::before{content:'';position:absolute;left:-50%;top:-8px;width:200%;height:16px;background:inherit;border-radius:45%;animation:wave2 3s linear infinite}
.cartfab .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--jal);font-size:19px;text-shadow:0 1px 3px rgba(0,0,0,.4);line-height:1.1;text-align:center}
.cartfab .badge{position:absolute;right:0;top:20px;min-width:36px;height:36px;padding:0 8px;border-radius:18px;background:#FFE14D;color:#191f28;font-family:var(--jal);font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.cartfab .badge:empty{display:none}
.cartfab .lb{position:absolute;left:0;right:0;bottom:0;font-family:var(--jal);font-size:16px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cartfab.hot{transform:scale(1.15)}
.cartfab.shake{animation:shake .45s}
.ghost{position:fixed;z-index:30;width:110px;height:110px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 14px 30px rgba(0,0,0,.4);pointer-events:none;transform:translate(-50%,-50%) rotate(-6deg)}
.ghost img{width:100%;height:100%;object-fit:cover}
.ghost.fly{transition:left .55s cubic-bezier(.5,0,.7,.4),top .55s cubic-bezier(.3,-.4,.6,1),transform .55s,opacity .55s;transform:translate(-50%,-50%) scale(.25);opacity:.6}
body.carton .screen{padding-right:calc(33% + 14px)!important}
.cartlist{width:100%;min-height:0;flex:1 1 auto;overflow-y:auto;background:#fff;color:#191f28;border-radius:18px;padding:6px 8px 8px;box-shadow:0 8px 22px rgba(0,0,0,.3);scrollbar-width:thin}
.cartlist:empty{display:none}
.cartlist:has(.cempty){background:none;box-shadow:none}
.cempty{color:#fff;text-align:center;font-size:17px;line-height:1.5;opacity:.9}
.ups{margin:6px 0 2px;display:flex;flex-direction:column;gap:6px}
.up1{padding:10px 12px;border-radius:14px;background:#FFF6D6;color:#5c4400;font-size:15px;line-height:1.4;animation:up .35s backwards}
.up1 b{font-family:var(--jal);font-weight:normal;color:#b45309}
.up1 button{display:block;margin-top:6px;width:100%;height:38px;border:0;border-radius:10px;background:#FFE14D;color:#191f28;font-family:var(--jal);font-size:16px}
.cartp .up1{font-size:18px}
.cl{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid #eef0f3;animation:up .3s backwards}
.cl:first-child{border-top:0}

.cl .q{flex:none;margin:0;font-family:var(--jal);font-size:18px;color:var(--deep)}
.cl .x{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:#ffe9ea;color:#e5313b;font-size:16px;font-weight:900;line-height:1}
.cl .x:active{background:#e5313b;color:#fff}
.clft{position:sticky;bottom:-8px;margin:4px -8px -8px;padding:8px;background:#fff;border-top:2px solid #eef0f3;border-radius:0 0 18px 18px}
.clft b{display:block;text-align:center;font-family:var(--jal);font-weight:normal;font-size:24px;color:var(--deep)}
.clft small{display:block;text-align:center;font-size:14px;color:#8b95a1}
.clft button{margin-top:8px;width:100%;height:50px;font-size:19px!important;border:0;border-radius:12px;background:var(--deep);color:#fff;font-family:var(--jal);font-size:16px}
.devadd{margin:4px 0 6px;height:56px;border:0;border-radius:16px;background:var(--deep);color:#fff;font-family:var(--jal);font-size:20px}
.item.gd .add{margin-top:8px}
.crow .ph0{display:flex;align-items:center;justify-content:center;font-size:32px}
/* 장바구니 화면 */
.crow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #eef0f3}
.crow:first-of-type{border-top:0}
.crow img,.crow .ph0{flex:none;width:72px;height:72px;border-radius:16px;object-fit:cover;background:#f2f2f4}
.crow .tx{flex:1;min-width:0}.crow b{display:block;font-family:var(--jal);font-weight:normal;font-size:21px}
.crow small{display:block;margin-top:2px;font-size:17px;color:#4e5968}
.qty{flex:none;display:flex;align-items:center;gap:6px}
.qty button{width:46px;height:46px;border:0;border-radius:14px;background:var(--tint);color:var(--deep);font-family:var(--jal);font-size:24px}
.qty span{min-width:34px;text-align:center;font-family:var(--jal);font-size:22px}
.cline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:20px;padding:6px 0}
.cline b{font-family:var(--jal);font-weight:normal;color:var(--deep)}
.cline s{color:#b0b8c1;font-size:16px;margin-right:6px}
.nudge{margin-top:10px;padding:12px 16px;border-radius:14px;background:#FFF6D6;color:#5c4400;font-size:18px;line-height:1.45}
.nudge b{font-family:var(--jal);font-weight:normal}
.cstaff .crow b{font-size:24px}.cstaff .loc{flex:none;padding:8px 14px;border-radius:12px;background:var(--deep);color:#fff;font-family:var(--jal);font-size:20px}
body.land .cartp{display:grid;grid-template-columns:440px 1fr;grid-template-rows:auto auto 1fr auto;column-gap:28px}
body.land .cartp .top,body.land .cartp .bar,body.land .cartp .acts{grid-column:1/-1}
body.land .cartp .q{grid-column:1;grid-row:3;overflow:auto}
body.land .cartp .ftc{grid-column:2;grid-row:3;display:flex}
body.land .cartdock{top:16px;bottom:84px}
body.land .cartp .save .pct{display:none}body.land .cartp .save .big{font-size:26px;white-space:nowrap}
.allban{grid-column:1/-1}
.alltabs{margin-top:16px;flex:none}
.alltabs button{padding:12px 20px;font-size:20px;background:rgba(255,255,255,.18)}
.alltabs button.on{background:#fff;color:var(--deep)}
.allp .fbar{margin-top:10px}
.allp .dtabs{margin-top:10px}
.item.gd .ph{aspect-ratio:16/9}
.item.gd .tile{flex-direction:column;gap:6px;font-size:19px}
.item.gd .ge{font-size:40px;line-height:1}
.empty{grid-column:1/-1;padding:48px 0;text-align:center;font-size:22px;color:var(--sub)}

.toast{position:fixed;left:50%;top:40px;transform:translate(-50%,-20px);opacity:0;padding:18px 28px;border-radius:999px;
  background:#fff;color:var(--deep);font-size:20px;font-weight:700;white-space:nowrap;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 가로로 돌리면: 질문은 왼쪽, 선택 카드는 오른쪽 */
body.land .screen{padding:40px 72px}
body.land .ask{display:grid;grid-template-columns:1fr 1.1fr;grid-template-rows:auto auto 1fr;column-gap:64px;align-items:start}
body.land .ask .top,body.land .ask .bar{grid-column:1/-1}
body.land .ask .q{margin-top:64px}
body.land .ask .opts{margin-top:32px;gap:12px;align-self:start}
body.land .opt{min-height:0;padding:14px 26px;gap:22px}
body.land .opt .n{width:52px;height:52px;border-radius:16px;font-size:28px}
body.land .opt .t{font-size:22px}
body.land .ask .q h1{font-size:46px}
body.land .opt .d{font-size:18px;margin-top:4px}
body.land .res .q{margin-top:24px}
body.land .res .q h1{font-size:38px}
body.land .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

<body>

<button class="fab home" id="fabh" hidden aria-label="처음으로"><span class="em">🏠</span>처음으로</button>
<div class="cartdock" id="cartdock" hidden><button class="cartfab" id="cartfab" aria-label="장바구니"><span class="neck"></span><span class="body"><span class="liq" id="cliq"></span><span class="ct" id="cct">담기</span></span><span class="badge" id="cbadge"></span><span class="lb">장바구니</span></button><div class="cartlist" id="cartlist"></div></div>
<script>
/* ---------- 자료 ---------- */
var LIQ = window.LIQ || [];
var PRICE = {"프리미엄":15000,"프라임":20000,"폐호흡":30000};           // menu-b 기준 1병 가격
var RANK = {};                                             // 이름 → 이번 주 판매 수
var params = new URLSearchParams(location.search);
var BRANCH = params.get('branch') || (function(){try{return localStorage.getItem('vfDirBranch')}catch(e){return null}})() || '';
if (params.get('branch')) try{localStorage.setItem('vfDirBranch',BRANCH)}catch(e){}
/* 폐호흡: 지점 포스 30,000원 액상 (menu/lung.js). 맛 계열은 이름 속 단어로 나눔 */
var LUNGL = (function(){
  var src = window.LUNG || {}, rows = BRANCH && src[BRANCH] ? src[BRANCH] : [].concat.apply([], Object.values(src)), seen = {}, out = [];
  var G = [["시가·타바코",/타바코|시가/],["멘솔·민트",/민트|멘솔|쿨|고드름|폴로|스피아/],
    ["디저트·음료",/우유|밀크|팝콘|콜라|레드불|아메리카노|커피|초코|스콘|피넛|컵콘|포테이토|모로나민|포카리|스프라이트|사이다|캔디|스크류바|초바쉐|도초바|소다킹/],
    ["과일",/포도|레몬|라임|망고|피치|복숭아|알로에|애플|사과|베리|석류|파인|멜론|리치|용과|자몽|딸기|구아바|(^|\s)배|오이|청포도|코코|패션|마르키사|라이문|그레이프|과일|트로피칼/],
    ["디저트·음료",/소다|슬러쉬|펀치|보석바/]];
  rows.forEach(function(r, i){ var n=r[0]; if (seen[n]) return; seen[n]=1;
    var dn = n.replace(/\s*\(?모드\)?\s*/g,' ').replace(/^모드\s*/,'').trim();
    var g = (G.filter(function(x){return x[1].test(dn)})[0]||["기타"])[0];
    var mg = (dn.match(/\d+\s*MG/i)||[''])[0];
    out.push({id:'L'+i, n:n, dn:dn, br:'폐호흡', f:mg?'니코틴 '+mg:'', g:g, t:['일반'], line:'폐호흡',
      cool:/민트|멘솔|쿨|고드름|아이스|프로즌|얼음/.test(dn), src:(window.LUNG_IMG||{})[n]||''});
  });
  return out;
})();
fetch('../menu/rank.json?t='+Date.now()).then(function(r){return r.json()}).then(function(j){
  var bs = j.branches||{}, list = BRANCH && bs[BRANCH] ? [bs[BRANCH]] : Object.values(bs);  // 지점 모르면 전 지점 합계
  list.forEach(function(b){(b.liq||[]).concat(b.lung||[]).forEach(function(x){RANK[x[0]]=(RANK[x[0]]||0)+(+x[1]||0)})});
  if (/^mtl-(res|rank|like|pack-res)/.test(state.view)) render();
}).catch(function(){});

/* ---------- 화면 정의 ---------- */
var FLAVOR = [
  {v:"과일",e:"🍇",t:"과일",d:"청포도, 자두, 자몽처럼 상큼달달"},
  {v:"멘솔·민트",e:"🧊",t:"멘솔 · 민트",d:"쿨하고 깔끔하게"},
  {v:"디저트·음료",e:"🥤",t:"디저트 · 음료",d:"소다, 커피, 아이스크림처럼 달콤하게"},
  {v:"시가·타바코",e:"🚬",t:"시가 · 타바코",d:"연초랑 비슷한 묵직한 맛"},
  {v:"",e:"🤔",t:"잘 모르겠어요",d:"요즘 많이 찾는 맛으로 보여드릴게요"}
];
/* 폐호흡은 샤크, 홀리, 오니처럼 맛 이름 없이 별명만 있는 액상이 많아서 따로 묶음 */
var FLAVOR_DL = FLAVOR.slice(0,4).concat([{v:"기타",e:"🦈",t:"샤크 · 홀리 · 오니 등",d:"맛 이름 대신 별명으로 부르는 액상"}], FLAVOR.slice(4));
function FL(){ return state.kind==='dl' ? FLAVOR_DL : FLAVOR; }
var COOL = [
  {v:"",e:"👌",t:"상관없어요",d:"시원한 것도, 아닌 것도 다 보여드려요"},
  {v:"노멘솔",e:"🙅",t:"시원한 건 싫어요",d:"멘솔 없는 노멘솔 액상"},
  {v:"무니코틴",e:"🌿",t:"니코틴 없이",d:"무니코틴 액상"}
];
var state = {view:'home', hist:[], flavor:null, cool:null, kind:'mtl'};
function DATA(){ return state.kind==='dl' ? LUNGL : LIQ; }
function KT(){ return state.view.indexOf('new')===0 ? '처음 오신 분' : state.kind==='dl' ? '폐호흡 액상' : '입호흡 액상'; }

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function won(n){return n.toLocaleString('ko-KR')+'원'}
function go(v){state.hist.push(state.view); state.view=v; state.fg=''; state.fs=''; var t=document.getElementById('toast'); if(t) t.classList.remove('show'); render();}
function back(){state.view=state.hist.pop()||'home'; state.fg=''; state.fs=''; render();}
function home(){state={view:'home',hist:[],flavor:null,cool:null,q:'',base:null,pack:null,kind:'mtl',ans:{}}; render();}

function topBar(title, step, total){
  return '<div class="top">'+
    (state.view==='home' ? '<div class="brand"><img src="vf_logo.png" alt="VF"><span>VAFRIEND</span></div>' : '<button class="ib" data-act="back" aria-label="뒤로">‹</button>')+
    '<div class="ttl">'+esc(title||'')+'</div>'+
    (state.view==='home' ? '<span class="ib hide"></span>' : '<button class="ib txt" data-act="home">처음으로</button>')+
  '</div>'+(total ? '<div class="bar"><i style="width:'+Math.round(step/total*100)+'%"></i></div>' : '');
}
function ask(o){ // 질문 한 화면: o = {title, step, total, h, p, opts:[{t,d,act}], sel}
  return '<div class="pane ask">'+topBar(o.title,o.step,o.total)+
    '<section class="q"><h1>'+o.h+'</h1>'+(o.p?'<p>'+o.p+'</p>':'')+(o.extra||'')+'</section>'+
    '<section class="opts">'+o.opts.map(function(x,i){
      return '<button class="opt'+(o.sel===(x.i!=null?x.i:i)?' on':'')+'" data-act="'+x.act+'" data-i="'+(x.i!=null?x.i:i)+'"><span class="n">'+(x.e||(i+1))+'</span><span><span class="t">'+esc(x.t)+'</span><span class="d">'+esc(x.d)+'</span></span></button>';
    }).join('')+'</section></div>';
}

function pick(f,c){ return DATA().filter(function(x){
    if (f && x.g!==f) return false;
    if (c==='노멘솔' && x.cool!==undefined) return !x.cool;
    if (c && (x.t||[]).indexOf(c)<0) return false;
    return true; }); }
function byRank(arr){ return arr.map(function(x,i){return {x:x, s:RANK[x.n]||0, i:i}})
    .sort(function(a,b){return b.s-a.s || (a.x.line===b.x.line?0:a.x.line==="프리미엄"?-1:1) || a.i-b.i}).map(function(o){return o.x}); }
var EV_DL = '<div class="ev">💡 <b>폐호흡 3병 40,000원</b> · 1병씩 사는 것보다 <b>50,000원 아껴요</b> · 맛 섞어도 돼요</div>';
var EV = '<div class="ev">💡 <b>프리미엄</b> 5병 49,500원 → <b>25,500원 아껴요</b> · 11병 90,000원 → <b>75,000원 아껴요</b> &nbsp;|&nbsp; <b>프라임</b> 3병 50,000원 → <b>10,000원 아껴요</b></div>';
var UNIT = {"프리미엄":"💸 5병 패키지면 1병 9,900원","프라임":"💸 3병이면 1병 16,667원","폐호흡":"💸 3병이면 1병 13,333원"};
function saveBox(label, full, price){ var off=full-price, pct=Math.round(off/full*100);
  return '<div class="save pop"><span class="em">🎉</span><div class="tx"><div class="l">'+esc(label)+'</div><div class="big"><span class="cnt" data-n="'+off+'">'+won(off)+'</span> 아껴요</div><div class="pr"><s>'+won(full)+'</s> → <b>'+won(price)+'</b></div></div><span class="pct">-'+pct+'%</span></div>'; }
function pkRow(name, price, full, alt){ var off=(full||0)-price;
  return '<div class="pk'+(alt?' alt':'')+'"><span>'+esc(name)+(off>0?'<em>💸 '+won(off)+' 아껴요</em>':'')+'</span><span class="pp">'+(off>0?'<s>'+won(full)+'</s>':'')+'<b>'+won(price)+'</b></span></div>'; }
function card(x, badge){
  var tag=(x.t||[]).filter(function(t){return t!=="일반"}).join(' · ');
  var src = x.src!=null ? x.src : '../img/'+x.img;
  return '<div class="item" data-id="'+esc(x.id||'')+'"><div class="ph">'+(src?'<img loading="lazy" src="'+esc(src)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<span class="tile">'+esc(x.dn||x.n)+'</span>')+
    (badge?'<span class="rk">'+esc(badge)+'</span>':'')+(tag?'<span class="tg">'+esc(tag)+'</span>':'')+'</div>'+
    '<div class="bd"><span class="br">'+esc([x.br,x.f].filter(Boolean).join(' · '))+'</span><span class="nm">'+esc(x.dn||x.n)+'</span>'+
    '<span class="pr">'+(PRICE[x.line]?won(PRICE[x.line]):'')+'</span>'+(UNIT[x.line]?'<span class="unit">'+UNIT[x.line]+'</span>':'')+'<span class="lc">'+esc(x.line)+(x.loc?' · 위치 '+esc(x.loc.split('|')[0]):'')+'</span>'+(x.id&&PRICE[x.line]?'<button class="add" data-act="add" data-id="'+esc(x.id)+'">'+((state.cart||{})[x.id]?'✓ '+state.cart[x.id]+'병 담음 · 하나 더':'🛒 담기')+'</button>':'')+'</div></div>';
}
/* 목록 한 화면: o = {step,total,h,chips,list,top(인기 표시 몇 위까지),note(위 안내),empty} */
/* ---------- 맛 분류 + 시리즈(브랜드)로 나눠 보기: 액상 목록, 패키지 담기 화면 공통 ---------- */
var FGS = [['','✨ 전체'],['과일','🍑 과일'],['멘솔·민트','🧊 멘솔·민트'],['시가·타바코','🚬 담배맛'],['디저트·음료','🥤 디저트·음료']];
function filt(list){ return list.filter(function(x){ return (!state.fg||x.g===state.fg) && (!state.fs||x.br===state.fs); }); }
function filterBar(list){
  var byG=list.filter(function(x){return !state.fs||x.br===state.fs}), byS=list.filter(function(x){return !state.fg||x.g===state.fg}), cnt={};
  byS.forEach(function(x){ if(x.br) cnt[x.br]=(cnt[x.br]||0)+1; });
  var ser=Object.keys(cnt).sort(function(a,b){ return (a==='기타')-(b==='기타') || cnt[b]-cnt[a] || a.localeCompare(b); });
  if (state.fs && ser.indexOf(state.fs)<0) ser.unshift(state.fs);
  return '<div class="fbar"><div class="frow">'+FGS.map(function(o){ var n=o[0]?byG.filter(function(x){return x.g===o[0]}).length:byG.length; if(o[0]&&!n&&state.fg!==o[0]) return '';
      return '<button data-act="fg" data-v="'+o[0]+'" class="'+((state.fg||'')===o[0]?'on':'')+'">'+o[1]+' <small>'+n+'</small></button>'; }).join('')+'</div>'+
    (Object.keys(cnt).length>1||state.fs ? '<div class="frow ser"><span class="lb">시리즈</span><button data-act="fs" data-v="" class="'+(!state.fs?'on':'')+'">전체 <small>'+byS.length+'</small></button>'+
      ser.map(function(b){ return '<button data-act="fs" data-v="'+esc(b)+'" class="'+(state.fs===b?'on':'')+'">'+esc(b)+' <small>'+(cnt[b]||0)+'</small></button>'; }).join('')+'</div>' : '')+'</div>';
}
function listPane(o){
  var n=o.top||3, rk=0, all=o.list; o.list=filt(all);
  return '<div class="pane res lp">'+topBar(KT(),o.step,o.total)+
    '<section class="q"><h1>'+o.h+'</h1>'+
      '<div class="chips">'+(o.chips||[]).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'<span>'+o.list.length+'개</span></div>'+
      (o.note||(state.kind==='dl'?EV_DL:EV))+
    '</section>'+filterBar(all)+
    '<section class="grid">'+(o.list.length ? o.list.slice(0,60).map(function(x){
      var hot = (RANK[x.n]||0)>0 && rk<n; if (hot) rk++;
      return card(x, hot?'인기 '+rk+'위':'');
    }).join('') : '<div class="empty"><div class="bob" style="display:inline-block">'+chBlack(110)+'</div><br>'+(o.empty||'조건에 맞는 액상이 없어요. 뒤로 가서 다시 골라 주세요.')+'</div>')+'</section></div>';
}

function similar(base){
  var words=(state.kind==='dl' ? (base.dn.match(/포도|레몬|라임|망고|피치|복숭아|알로에|애플|사과|베리|석류|파인|멜론|리치|용과|자몽|딸기|구아바|민트|소다|우유|밀크|콜라|커피|초코|캔디|청포도|코코|콘/g)||[]) : (base.f||'').split(/[+·,\s]+/)).filter(function(w){return w.length>1});
  return byRank(DATA().filter(function(x){return x.id!==base.id})).map(function(x){
    var sc=0; if (x.g===base.g) sc+=2;
    words.forEach(function(w){ if ((x.f||'').indexOf(w)>=0 || (x.dn||x.n).indexOf(w)>=0) sc+=3; });
    if (base.cool!==undefined && x.cool===base.cool) sc+=1;
    (base.t||[]).forEach(function(t){ if (t!=="일반" && (x.t||[]).indexOf(t)>=0) sc+=2; });
    if (x.br===base.br) sc+=1;
    return {x:x,sc:sc};
  }).filter(function(o){return o.sc>=3}).sort(function(a,b){return b.sc-a.sc}).map(function(o){return o.x});
}
function searchList(){

  list = byRank(list).slice(0,30);
  return list.length?list.map(function(x){
      return '<button class="row" data-act="base" data-id="'+esc(x.id)+'"><img loading="lazy" src="'+esc(x.src!=null?x.src:'../img/'+x.img)+'" alt="" onerror="this.style.visibility=\'hidden\'"><span><b>'+esc(x.dn||x.n)+'</b><small>'+esc([x.br,x.f].filter(Boolean).join(' · '))+'</small></span><i>›</i></button>';
    }).join(''):'<div class="empty">찾는 액상이 없어요. 다른 글자로 찾아 보세요.</div>';
}

var DEV_ALIAS = {"발라맥스프로":"발라리안 맥스프로"};
var MODELS = (function(){
  var src = (BRANCH && window.GOODS_BY && window.GOODS_BY[BRANCH]) || GD, by = {}, out = [];
  src.filter(function(g){return g.c==='dev'}).forEach(function(g){ (by[g.model]=by[g.model]||[]).push(g); });
  Object.keys(by).forEach(function(m){
    var dn = m.replace(/ 기계$| 기기$/,'').replace(/ (블랙|네이비|화이트|실버)$/,'');
    var imgs = (window.DEV_IMG||{})[m] || (window.DEV_IMG||{})[dn] || (window.DEV_IMG||{})[m.split(' ')[0]] || {};
    var key = dn.replace(/\s/g,''), info = (window.DEVINFO||[]).filter(function(d){ var k=d.n.replace(/\s/g,''); return k===key || k===(DEV_ALIAS[dn]||'').replace(/\s/g,''); })[0];
    var pos = by[m][0].pos||'입호흡';
    var opts = by[m].map(function(g){ return {id:g.id, opt:g.opt||'', price:g.price, img:imgs[g.opt]||''}; });
    var first = opts.filter(function(o){return o.img})[0] || opts[0];
    out.push({id:'M'+out.length, model:m, dn:dn, opts:opts, price:Math.min.apply(null,opts.map(function(o){return o.price})),
      img:first.img || Object.values(imgs)[0] || '', info:info, pos:pos});
  });
  var top = ["말론","말론S","하복2"];
  return out.sort(function(a,b){ var x=top.indexOf(a.dn), y=top.indexOf(b.dn); return (x<0?9:x)-(y<0?9:y) || b.price-a.price; });
})();

var MPACKS = [

  {e:'🚬',t:'담배맛 패키지', d:'시가, 타바코처럼 구수하고 묵직한 맛 · 💸 최대 75,000원 아껴요', pool:function(P){return P.filter(function(x){return x.g==='시가·타바코'})}},
  {e:'🧊',t:'단일 멘솔 패키지', d:'다른 맛 없이 멘솔, 민트만 · 💸 최대 75,000원 아껴요', pool:function(P){return P.filter(function(x){return x.g==='멘솔·민트' && /멘솔|민트/.test(x.n) && !NOT_PLAIN.test(x.n) && !STRONG.test(x.n)})}},
  {e:'🌈',t:'처음이라 여러 가지 섞어서', d:'과일, 디저트, 멘솔, 담배맛 골고루 · 💸 최대 75,000원 아껴요', mix:true},
  {e:'🏆',t:'액상 랭킹으로 추천', d:'이번 주 많이 나간 순서대로 · 💸 최대 75,000원 아껴요', pool:function(P){return P}}
];
function mpackList(k, n){
  var P = byRank(LIQ.filter(function(x){return x.line==='프리미엄'}));
  if (!MPACKS[k].mix) return MPACKS[k].pool(P);
  var want = n>=11 ? {'과일':4,'디저트·음료':3,'멘솔·민트':2,'시가·타바코':2} : {'과일':2,'디저트·음료':1,'멘솔·민트':1,'시가·타바코':1}, top=[], rest=[];
  Object.keys(want).forEach(function(g){ var l=P.filter(function(x){return x.g===g}); top=top.concat(l.slice(0,want[g])); rest=rest.concat(l.slice(want[g],want[g]+4)); });
  return top.concat(rest);
}

   인터넷 AI 없이 패드 안에서 단어를 읽어서 고름 (맛, 멘솔, 니코틴, 입호흡/폐호흡, 기기/액상, 예산) */
var KW = {
  '과일':/과일|상큼|새콤|포도|사과|애플|복숭아|피치|망고|자두|레몬|라임|딸기|수박|워터멜론|멜론|메론|베리|석류|알로에|자몽|오렌지|파인|리치|용과|체리|키위|귤/,
  '멘솔·민트':/멘솔|민트|박하|시원|쿨|화한|화하|얼음|아이스|상쾌/,
  '디저트·음료':/달달|달콤|단\s?거|단맛|디저트|커피|콜라|사이다|소다|우유|밀크|초코|바닐라|요거트|녹차|홍차|티\b|음료|캔디|사탕|아이스크림/,
  '시가·타바코':/담배맛|연초|타바코|시가|구수|묵직|타격감|목넘김\s?(쎈|센|강)/
};
var WORDS = ['청포도','포도','사과','애플','복숭아','피치','망고','자두','레몬','라임','딸기','수박','워터멜론','멜론','블루베리','베리','석류','알로에','자몽','오렌지','파인','리치','용과','체리','콜라','사이다','소다','커피','초코','바닐라','요거트','우유','녹차','민트','시가','보석바'];
function parseAsk(q){
  var t=q.replace(/\s+/g,' '), o={raw:q, groups:[], words:[], kind:'mtl'};
  Object.keys(KW).forEach(function(g){ if (KW[g].test(t)) o.groups.push(g); });
  o.noMint = /노멘솔|멘솔\s?(없|싫|빼|말고|노)|안\s?시원|시원한\s?(거|건)?\s?(싫|별로|말고)|민트\s?(싫|빼)/.test(t);
  if (o.noMint) o.groups = o.groups.filter(function(g){return g!=='멘솔·민트'});
  o.noNic = /무니코틴|니코틴\s?(없|0|빼|노)|노\s?니코틴/.test(t);
  if (/폐호흡|폐로|폐\s|구름|연기\s?(많|크|빵빵)|모드/.test(t)) o.kind='dl';
  o.dev = /기기|기계|디바이스|본체|팟\s?(기기)?\s?추천|뭐\s?사|입문\s?세트|하복|말론|플러키|조바/.test(t);
  o.cheap = /싸|저렴|가성비|싼|돈|아끼|할인|패키지|얼마|가격|최저/.test(t);
  o.first = /처음|입문|초보|안\s?피워|끊|모르겠/.test(t);
  o.rank = /인기|잘\s?나가|많이\s?팔|랭킹|베스트|1위|유명/.test(t);
  var m = t.match(/(\d+(?:\.\d+)?)\s*(만\s?원|만|원)/); if (m) { var n=parseFloat(m[1]); o.budget = /만/.test(m[2]) ? n*10000 : n; }
  WORDS.forEach(function(w){ if (t.indexOf(w)>=0 && !o.words.some(function(x){return x.indexOf(w)>=0})) o.words.push(w); });
  return o;
}
function answer(q){
  var o=parseAsk(q), F='', T='', items=[], devs=[], data = o.kind==='dl' ? LUNGL : LIQ;
  var pool = data.filter(function(x){
    if (o.groups.length && o.groups.indexOf(x.g)<0) return false;
    if (o.noMint && (x.cool!==undefined ? x.cool : ((x.t||[]).indexOf('노멘솔')<0 && x.g==='멘솔·민트'))) return false;
    if (o.noMint && x.cool===undefined && /멘솔|민트|쿨|아이스/.test(x.n)) return false;
    if (o.noNic && (x.t||[]).indexOf('무니코틴')<0) return false;
    return true; });
  if (o.words.length) { var w = pool.filter(function(x){ return o.words.some(function(k){ return ((x.dn||x.n)+(x.f||'')).indexOf(k)>=0; }); }); if (w.length) pool = w; }
  pool = byRank(pool);
  var cond = [o.kind==='dl'?'폐호흡':'입호흡'].concat(o.words.length?o.words:o.groups.map(function(g){return g.replace('·',' ')})).concat(o.noMint?['노멘솔']:[]).concat(o.noNic?['무니코틴']:[]);
  var unit = o.kind==='dl' ? '3병 40,000원이면 병당 13,333원' : '5병 49,500원이면 병당 9,900원, 11병이면 8,182원';

  if (o.dev || (o.first && !o.groups.length && !o.words.length)) {
    var list = MODELS.filter(function(M){ return !o.budget || M.price<=o.budget; });
    if (o.kind==='dl') list = list.filter(function(M){ return /하복/.test(M.dn); }).concat(list.filter(function(M){ return !/하복/.test(M.dn); }));
    var fPick = F_DEV.map(function(d){return d.dn}).filter(function(dn){ return list.some(function(M){return M.dn===dn}); }).slice(0,2);
    var tPick = list.slice().sort(function(a,b){return a.price-b.price}).slice(0,2);
    devs = {F:fPick.map(function(dn){ return [dn, (F_DEV.filter(function(d){return d.dn===dn})[0]||{}).say||'']; }),
            T:tPick.map(function(M){ return [M.dn, '기기 '+won(M.price)+(/^말론/.test(M.dn)?' · 액상 10병 패키지면 '+won(M.price+75000):'')]; })};
    F = (o.first?'처음이시구나~ 설레겠다! 🥰 ':'')+(o.budget?won(o.budget)+' 안에서 ':'')+'제가 보기엔 들고 다닐 때 제일 예쁜 건 이거예요 💖';
    T = (o.budget?'예산 '+won(o.budget)+' 이하 기준. ':'')+'기기 값 낮은 순 2개입니다. 액상까지 살 거면 기기 패키지가 따로 사는 것보다 최대 75,000원 쌉니다. 📊';
    if (!list.length) { F='앗 그 예산엔 딱 맞는 기기가 없어요 🥲 직원한테 같이 물어봐요!'; T='조건 '+won(o.budget)+' 이하 기기: 0개. 예산을 올리거나 직원에게 문의하십시오.'; devs={F:[],T:[]}; }
    return {F:F, T:T, devs:devs, items:[]};
  }
  if (!o.groups.length && !o.words.length && !o.noMint && !o.noNic && !o.rank && !o.cheap) {
    return {F:'음~ 무슨 맛이 좋은지 조금만 더 알려 줄래요? 🤔 "달달한 거", "시원한 과일"처럼요!', T:'입력에서 조건을 찾지 못했습니다. 맛(과일/멘솔/달달/담배맛), 멘솔 여부, 기기, 예산 중 하나를 넣어 주십시오.', items:[]};
  }
  items = pool.slice(0,3);
  if (!items.length) return {F:'헉 딱 맞는 게 없어요 😢 조건을 하나만 빼 볼까요?', T:'조건 '+cond.join(' + ')+' → 0개. 조건을 줄이십시오.', items:[]};
  var g0 = o.groups[0] || (items[0]&&items[0].g);
  var fLine = {'과일':'상큼달달해서 한 모금이면 기분이 확 좋아져요 🍑🌈','멘솔·민트':'머리까지 시원해지는 그 느낌! 상쾌함 그 자체예요 🧊🌊','디저트·음료':'달달해서 하루 끝에 나한테 주는 선물 같아요 🍰💕','시가·타바코':'구수하고 묵직해서 연초 생각날 때 딱이에요 🍂😌'}[g0] || '제 마음에 쏙 드는 걸로 골랐어요 💖';
  F = (o.words.length?o.words.join(', ')+' 좋아하시는구나~ ':'')+fLine;
  var top = items[0], sold = RANK[top.n]||0;
  T = '조건: '+cond.join(' + ')+' → '+pool.length+'개 중 판매량 순 상위 '+items.length+'개입니다.'+(sold?' 1위는 이번 주 '+(BRANCH?BRANCH+'에서 ':'전 지점 ')+sold+'병 팔렸습니다.':'')+' '+unit+'. 💡';
  return {F:F, T:T, items:items};
}

  var askf=document.getElementById('askf'); if(askf){ askf.addEventListener('submit',function(e){ e.preventDefault(); var q=document.getElementById('askq').value; state.askq=''; chatSend(q); });

  var sq=document.getElementById('sq'); if(sq) sq.addEventListener('input',function(){ state.q=sq.value; document.getElementById('sres').innerHTML=searchList(); });

var toastT;

document.getElementById('app').addEventListener('click',function(e){

  if (a==='mem') { b.classList.add('on'); return go('mem'); }

  if (a==='ft' && state.view==='home') { var k=b.dataset.k;
    state.chat = k==='F' ? [{who:'F',text:'안녕하세요! 저는 빨강이(F)예요 🥰 예쁘고 기분 좋은 걸로 골라 드릴게요. 편하게 타자로 물어봐 주세요 💖'},{who:'T',text:'까망이(T)입니다. 🤖 저는 가격과 판매량으로만 답합니다. 맛은 취향이니까요.'}]

    return go('chat'); }
  if (a==='sug') return chatSend(b.dataset.t);
  if (a==='ft') { state.ft=b.dataset.k; state.ftm=0; if (state.view==='ft') { render(); return; } return go('ft'); }
  if (a==='ftm') { state.ftm=i; return render(); }
  if (a==='ftdev') { var mi=MODELS.map(function(m){return m.dn}).indexOf(b.dataset.dn); if (mi<0) return; state.model=mi; state.mopt=0; return go('dev-dtl'); }
  if (a==='ft11') { state.kind='mtl'; state.mpack=4; state.mpn=11; return go('mtl-mpack'); }
  if (a==='dev') { state.devcat=''; return on('dev'); }
  if (a==='mpick') { state.model=i; state.mopt=0; return go('dev-dtl'); }
  if (a==='mopt') { state.mopt=i; return render(); }
  if (a==='mcall') { var M=MODELS[state.model], op=(M.opts[state.mopt||0]||{}).opt;
    state.staffT='기기 보기'; state.staffH='직원이 바로<br>보여 드릴게요!'; state.staffP='"'+esc(M.dn+(op?' '+op:''))+'" 보러 오셨다고 전해 드릴게요.<br>잠깐만 기다려 주세요.'; return go('help-staff'); }
  if (a==='help') { state.staffT=null; return on('help'); }
  if (a==='h-pod' || a==='h-use') { state.helpMode=a==='h-pod'?'pod':'use'; state.dq=''; return on('help-dev'); }
  if (a==='h-fix') return on('help-fix');
  if (a==='h-mem' || a==='h-etc') { state.staffH='직원이 바로<br>도와드릴게요!'; state.staffP=a==='h-mem'?'회원 조회, 적립, 결제는 직원이 포스에서 바로 해 드려요.<br>카운터로 와 주시거나 잠깐만 기다려 주세요.':'카운터 쪽 직원에게 이 화면을 보여 주시거나<br>잠깐만 기다려 주세요.'; return on('help-staff'); }
  if (a==='devpick') { state.dev=b.dataset.id; return go('help-dev-dtl'); }
  if (a==='fixpick') { state.fix=i; if (!FIX[i].tips.length) { state.staffH='직원이 바로<br>봐 드릴게요!'; state.staffP='기기를 가지고 카운터로 와 주시거나<br>잠깐만 기다려 주세요.'; return on('help-staff'); } return on('help-fix-res'); }
  if (a==='help-call') { var dd=state.view==='help-dev-dtl'?DEVL.filter(function(x){return x.id===state.dev})[0]:null;
    state.staffH='직원이 바로<br>도와드릴게요!'; state.staffP=dd?'"'+esc(dd.n)+'" '+(state.helpMode==='pod'?'팟 찾으신다고 전해 드릴게요.':'사용법 알려 드릴게요.')+'<br>잠깐만 기다려 주세요.':'"'+esc(FIX[state.fix].t)+'" 증상, 직원이 바로 봐 드릴게요.<br>기기를 가지고 카운터로 와 주세요.'; return go('help-staff'); }
  if (a==='new') { state.ans={}; return on('new-now'); }

  if (a==='new-more') { state.kind=b.dataset.k; return go('mtl'); }
  if (a==='mtl' || a==='dl') { state.kind=a; return on('mtl'); }
  if (a==='m-self') { state.flavor=null; state.cool=null; if (state.kind!=='dl') { state.mapf=''; return on('mtl-map'); } return on('mtl-flavor'); }

  if (a==='cq') { var cc=state.cart||{}, id=b.dataset.id; cc[id]=(cc[id]||0)+(+b.dataset.d); if(cc[id]<=0) delete cc[id]; var ft=document.querySelector('.ftc'), y=ft?ft.scrollTop:0; render(); ft=document.querySelector('.ftc'); if(ft) ft.scrollTop=y; return; }
  if (a==='cartgo') return go('cart-staff');

  if (a==='devcat') { state.devcat=b.dataset.v; return render(); }
  if (a==='lab') { state.mix=[]; return go('mix'); }

  if (a==='labclr') { state.mix=[]; return labPaint(false); }
  if (a==='labgo') return go('mix-res');

  if (a==='mpk') { state.mpack=i; state.mpn=5; return on('mtl-mpack'); }
