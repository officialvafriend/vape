<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, viewport-fit=cover">
<script>/* 패드 크기 맞추기: 세로 폭 800, 가로 폭 1280 기준 (menu-b와 같은 방식) */
function vfFit(){var land=matchMedia("(orientation: landscape)").matches,a=screen.width,b=screen.height,w=land?Math.max(a,b):Math.min(a,b),base=land?1280:800,s=Math.round(w/base*1000)/1000,m=document.querySelector('meta[name=viewport]');
  m.setAttribute('content',!w||Math.abs(s-1)<.02?'width='+base+',viewport-fit=cover':'width='+base+',initial-scale='+s+',minimum-scale='+s+',maximum-scale='+s+',user-scalable=no,viewport-fit=cover');
  if(document.body)document.body.classList.toggle('land',land);}
vfFit();addEventListener('orientationchange',function(){setTimeout(vfFit,60);});addEventListener('resize',function(){clearTimeout(window.__vft);window.__vft=setTimeout(vfFit,120);});</script>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6E1F2A">
<link rel="icon" href="vf_logo.png">
<title>베이프렌드 상담패드 director</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- 입호흡 액상 목록은 정식 menu 폴더 자료를 읽기만 함 (고치지 않음) -->
<script src="../menu/data.js"></script>
<script src="../menu/lung.js"></script>
<script src="lung_img.js"></script>
<script src="../menu/goods.js"></script>
<script src="../menu/devinfo.js"></script>
<script src="dev_img.js"></script>
<style>
/* 11/16 글씨체: 여기어때 잘난체 (굵기 하나뿐이라 제목, 버튼, 가격, 이름에만. 작은 설명은 Pretendard) */
@font-face{font-family:'Jalnan';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');font-weight:normal;font-display:swap}
/* menu-director: 새 상담패드. 이 폴더 안에서만 고친다 (menu, menu-b는 손대지 않음)
   11/16 첫 화면: 플랜핏 온보딩 참고 = 위에 큰 질문 한 줄 + 작은 설명, 아래에 둥근 선택 카드를 쌓음.
   바탕은 VAFRIEND 빨강보다 차분한 버건디.
   11/16 2번 입호흡: 맛 계열 → 멘솔/니코틴 → 추천 목록(이번 주 판매 많은 순) */
:root{
  --bg:#6E1F2A;            /* 버건디 바탕 */
  --bg2:#5A1822;           /* 아래쪽 살짝 진하게 */
  --card:rgba(255,255,255,.10);
  --card-on:rgba(255,255,255,.22);
  --ink:#fff; --sub:rgba(255,255,255,.72);
  --accent:#FFB4B9;        /* 연한 빨강: 번호, 진행 막대, 눌렀을 때 테두리 */
  --r:28px; --pad:48px;
  --kr:"Pretendard","Malgun Gothic",sans-serif;
  --jal:"Jalnan","Pretendard","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);font-family:var(--kr);
  -webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{height:100%;padding:56px var(--pad) 48px}
.pane{height:100%;display:flex;flex-direction:column}

/* 맨 위: 뒤로 / 제목 / 처음으로 + 진행 막대 */
.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.top .ttl{font-size:24px;font-weight:700;color:var(--sub)}
.brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:900;font-style:italic;letter-spacing:.02em;color:#fff}
.brand img{height:44px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ib{width:56px;height:56px;border:0;border-radius:50%;background:var(--card);font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}
.ib.txt{width:auto;padding:0 22px;border-radius:999px;font-size:19px;font-weight:700}
.ib.hide{visibility:hidden}
.bar{margin-top:24px;height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}

.q{margin-top:72px}
.q h1{font-size:56px;font-weight:800;line-height:1.25;letter-spacing:-.03em}
.q p{margin-top:20px;font-size:24px;color:var(--sub);line-height:1.5}
.opts{margin-top:auto;display:flex;flex-direction:column;gap:20px}
.opt{display:flex;align-items:center;gap:22px;width:100%;min-height:112px;padding:20px 26px;
  background:#fff;color:#191f28;border:2px solid transparent;border-radius:var(--r);box-shadow:0 4px 14px rgba(40,0,10,.18);
  text-align:left;transition:background .15s,border-color .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--bg);background:#fff6f7}
.opt::after{content:'›';margin-left:auto;padding-left:8px;font-size:40px;line-height:1;color:#b0b8c1}
.opt .n{flex:none;width:68px;height:68px;border-radius:22px;background:#fbeff0;
  display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:var(--bg)}
.opt .t{display:block;font-size:29px;font-weight:800;letter-spacing:-.03em;color:#191f28}
.opt .d{display:block;margin-top:6px;font-size:20px;color:#6b7684}

/* 추천 목록 */
.res .q{margin-top:40px}
.res .q h1{font-size:44px}
.chips{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.chips span{padding:8px 16px;border-radius:999px;background:var(--card);font-size:18px;font-weight:700}
.ev{margin-top:20px;padding:16px 22px;border-radius:18px;background:rgba(255,180,185,.16);font-size:19px;line-height:1.45}
.ev b{color:var(--accent)}
.grid{margin-top:24px;flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start;grid-auto-rows:max-content;
  padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.item{background:#fff;color:#15120f;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.item .ph{position:relative;aspect-ratio:1/1;background:#f2f2f4}
.ph .tile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-size:24px;font-weight:800;color:#6E1F2A;background:#f6e9ea;line-height:1.3}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .rk{position:absolute;left:10px;top:10px;padding:5px 11px;border-radius:999px;background:#d81f2a;color:#fff;font-size:15px;font-weight:800}
.item .tg{position:absolute;right:10px;top:10px;padding:5px 10px;border-radius:999px;background:rgba(21,18,15,.75);color:#fff;font-size:14px;font-weight:700}
.item .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.item .br{font-size:15px;color:#6c675f;font-weight:700}
.item .nm{font-size:20px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.item .pr{margin-top:auto;padding-top:6px;font-size:20px;font-weight:800;color:#d81f2a}
.item .lc{font-size:14px;color:#6c675f}
.sq{margin-top:22px;width:100%;height:76px;border:0;border-radius:22px;padding:0 28px;font:700 26px var(--kr);color:#15120f;background:#fff;outline:none;-webkit-user-select:text;user-select:text}
.grid.list{grid-template-columns:1fr;gap:12px}
.row{display:flex;align-items:center;gap:20px;width:100%;padding:12px 24px 12px 12px;border:0;border-radius:20px;background:var(--card);text-align:left}
.row img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#fff;flex:none}
.row span{flex:1;display:flex;flex-direction:column;gap:4px}.row b{font-size:23px}.row small{font-size:17px;color:var(--sub)}
.row i{font-style:normal;font-size:34px;color:var(--sub)}
.call{display:flex;align-items:center;justify-content:center;height:200px;border-radius:var(--r);background:#fff;color:var(--bg);font-size:52px;font-weight:800;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.97);opacity:.85}}
body.land .grid.list{grid-template-columns:1fr 1fr}
body.land .call{height:150px;font-size:44px}
.rec{margin-top:24px;display:flex;gap:24px;align-items:stretch;background:#fff;color:#15120f;border-radius:var(--r);padding:20px}
.rec .dv{flex:none;width:200px;border-radius:18px;overflow:hidden;background:#f2f2f4}
.rec .dv img{width:100%;height:100%;object-fit:cover;display:block}
.rec .info{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.rec .info h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.rec .why{font-size:19px;line-height:1.5;color:#4a4540}
.pk{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:14px;background:#f6e9ea;font-size:20px;font-weight:700}
.pk b{color:#d81f2a;white-space:nowrap}
.pk.alt{background:#f2f2f4;font-weight:600}
.small{font-size:16px;color:#6c675f}
.sec{grid-column:1/-1;font-size:24px;font-weight:800}
.acts{display:flex;gap:14px;margin-top:16px}
.acts button{flex:1;height:72px;border:0;border-radius:20px;background:var(--card);font-size:22px;font-weight:800}
.acts button.main{background:#fff;color:var(--bg)}
body.land .rec .dv{width:170px}
body.land .newres{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto 1fr auto;column-gap:32px}
body.land .newres .top,body.land .newres .bar,body.land .newres .acts{grid-column:1/-1}
body.land .newres .q{grid-column:1;overflow:auto}
body.land .newres .grid{grid-column:2;grid-row:3;margin-top:24px;grid-template-columns:repeat(3,1fr);min-height:0}
body.land .newres .item .nm{font-size:17px}body.land .newres .item .pr{font-size:17px}
.dgrid{grid-template-columns:repeat(4,1fr)}
.dcard{border:0;background:#fff;color:#15120f;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.dcard .ph{aspect-ratio:4/5;background:#f2f2f4;position:relative;overflow:hidden;min-height:0}
.dcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dcard b{padding:10px 12px 12px;font-size:17px;line-height:1.3}
.dtl{margin-top:28px;display:flex;gap:28px;background:#fff;color:#15120f;border-radius:var(--r);padding:24px;min-height:0;overflow:auto}
.dtl .ph{flex:none;width:260px;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#f2f2f4;position:relative}
.dtl .ph img{width:100%;height:100%;object-fit:cover;display:block}
.dtl .info{flex:1;display:flex;flex-direction:column;gap:12px}
.dtl h2{font-size:32px;font-weight:800;letter-spacing:-.02em}
.dtl dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:19px}
.dtl dt{color:#6c675f;font-weight:700}.dtl dd{font-weight:700}
.dtl dd.red{color:#d81f2a}
.dtl p{font-size:19px;line-height:1.55;color:#4a4540}
.tipbox{margin-top:28px;padding:28px;border-radius:var(--r);background:#fff;color:#15120f}
.tipbox li{margin:0 0 14px 28px;font-size:23px;line-height:1.5}
.tipbox li:last-child{margin-bottom:0}
body.land .dgrid{grid-template-columns:repeat(6,1fr)}
body.land .dtl .ph{width:220px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{padding:8px 16px;border-radius:999px;border:2px solid #e6e6ea;background:#fff;color:#15120f;font-size:17px;font-weight:700}
.colors button.on{border-color:#d81f2a;color:#d81f2a}
.dcard .pr{padding:0 12px 12px;font-size:17px;font-weight:800;color:#d81f2a}
.dcard b{padding-bottom:4px}
/* 입호흡 맛 지도 (커피 취향 탐색 참고) */
.mapf{margin-top:18px;display:flex;gap:10px}
.mapf button{padding:10px 20px;border-radius:999px;border:0;background:var(--card);font-size:19px;font-weight:700}
.mapf button.on{background:#fff;color:var(--bg)}
.tmap{position:relative;margin:24px auto 0;width:100%;max-width:704px;aspect-ratio:1/1;border-radius:24px;background:rgba(0,0,0,.22);padding:44px}
.tmap .qd{position:absolute;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:center;justify-items:center;padding:30px 18px;
  border:1.5px dashed rgba(255,255,255,.35);border-radius:16px;background:rgba(255,255,255,.04);transition:background .15s}
.tmap .qd:active,.tmap .qd.on{background:rgba(255,180,185,.22);border-color:var(--accent)}
.tmap .qd.tl{left:44px;top:44px;right:calc(50% + 10px);bottom:calc(50% + 10px)}
.tmap .qd.tr{right:44px;top:44px;left:calc(50% + 10px);bottom:calc(50% + 10px)}
.tmap .qd.bl{left:44px;bottom:44px;right:calc(50% + 10px);top:calc(50% + 10px)}
.tmap .qd.br{right:44px;bottom:44px;left:calc(50% + 10px);top:calc(50% + 10px)}
.tmap .qd.dim{opacity:.35}
.tmap .qd.dim::after{content:"없어요";grid-column:1/-1;font-size:18px;font-weight:700}
.tmap .qd i{display:block;width:58px;height:58px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tmap .qd i img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.tmap .qd .ql{position:absolute;left:12px;top:8px;font-size:15px;font-weight:800;color:rgba(255,255,255,.85)}
.tmap .ax{position:absolute;width:96px;height:96px;border-radius:50%;background:#fff;color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2;pointer-events:none}
.tmap .ax small{font-size:13px;font-weight:700;color:#8a5a60}
.tmap .ax.t{left:50%;top:0;transform:translate(-50%,-30%)}
.tmap .ax.b{left:50%;bottom:0;transform:translate(-50%,30%)}
.tmap .ax.l{left:0;top:50%;transform:translate(-30%,-50%)}
.tmap .ax.r{right:0;top:50%;transform:translate(30%,-50%)}
.tmap .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;padding:10px 18px;border-radius:999px;
  background:rgba(40,10,15,.75);font-size:18px;font-weight:800;white-space:nowrap}
body.land .pane.res:has(.mapwrap){display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr;column-gap:40px}
body.land .pane.res:has(.mapwrap) .top,body.land .pane.res:has(.mapwrap) .bar{grid-column:1/-1}
body.land .mapwrap{grid-column:2;grid-row:3;min-height:0;padding:28px 0 8px}
body.land .mapwrap .tmap{margin:0;height:calc(100vh - 190px);width:calc(100vh - 190px);max-width:none;padding:40px}
body.land .tmap .qd i{width:46px;height:46px}
body.land .tmap .qd{padding:26px 12px 10px;gap:6px}
.pksz{margin-top:16px;display:flex;gap:12px}
.pksz button{flex:1;height:64px;border-radius:18px;border:2px solid transparent;background:var(--card);font-size:21px;font-weight:800}
.pksz button.on{background:#fff;color:var(--bg);border-color:var(--accent)}
.save{margin-top:18px;display:flex;align-items:center;gap:18px;background:#fff;color:#191f28;border-radius:24px;padding:20px 24px;box-shadow:0 4px 14px rgba(40,0,10,.18)}
.save .em{font-size:46px;line-height:1}
.save .tx{flex:1;min-width:0}
.save .l{font-size:18px;font-weight:700;color:#6b7684}
.save .big{margin-top:2px;font-size:34px;font-weight:800;letter-spacing:-.03em;color:#e5313b}
.save .pr{margin-top:4px;font-size:18px;color:#6b7684}.save .pr s{color:#b0b8c1}.save .pr b{color:#191f28}
.save .pct{flex:none;padding:8px 14px;border-radius:999px;background:#ffe9ea;color:#e5313b;font-size:22px;font-weight:800}
.pk .pp{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.pk .pp s{font-size:15px;color:#9a9a9a;font-weight:600}
.pk em{display:block;margin-top:3px;font-style:normal;font-size:15px;font-weight:800;color:#e5313b}
.item .unit{font-size:14px;font-weight:700;color:#e5313b;background:#ffeef0;border-radius:8px;padding:4px 8px;align-self:flex-start}
/* 첫 화면 회원등록 띠 */
.memban{margin-top:28px;display:flex;align-items:center;gap:18px;width:100%;padding:18px 22px;border:0;border-radius:22px;background:rgba(255,255,255,.14);text-align:left}
.memban .em{font-size:38px}.memban b{display:block;font-size:24px;font-weight:800}.memban small{display:block;margin-top:4px;font-size:18px;color:var(--sub)}
.memban i{margin-left:auto;font-style:normal;font-size:36px;color:var(--sub)}
/* 회원등록 입력 */
.form{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.form label{font-size:19px;font-weight:700;color:var(--sub)}
.form .fi{display:flex;align-items:center;gap:12px}
.form input{width:100%;height:76px;border:3px solid transparent;border-radius:20px;padding:0 24px;font:800 28px var(--kr);color:#191f28;background:#fff;outline:none;-webkit-user-select:text;user-select:text}
.form input:focus{border-color:var(--accent)}.form input.bad{border-color:#ff8a8a}
.form .fi span{font-size:24px;font-weight:800;white-space:nowrap}
.ck{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border:0;border-radius:18px;background:var(--card);font-size:21px;font-weight:700;text-align:left}
.ck i{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px}
.ck.on i{background:#fff;color:var(--bg);border-color:#fff}.ck.on i::after{content:'✓'}.ck.bad{outline:3px solid #ff8a8a}
.cta{margin-top:auto;height:84px;border:0;border-radius:22px;background:#fff;color:var(--bg);font-size:27px;font-weight:800}
.pv{font-size:20px;color:var(--sub)}.pv b{color:#fff}
.done{margin-top:40px;background:#fff;color:#191f28;border-radius:var(--r);padding:32px;display:flex;flex-direction:column;gap:12px}
.done .big{font-size:40px;font-weight:800;letter-spacing:-.03em}.done .row2{display:flex;justify-content:space-between;font-size:24px;padding:14px 0;border-top:1px solid #eef0f3}
.done .row2 span{color:#6b7684}.done .row2 b{font-weight:800}
body.land .form{margin-top:12px;gap:6px}body.land .form label{font-size:16px}body.land .form input{height:54px;font-size:23px;border-radius:16px}
body.land .ck{padding:9px 16px;font-size:18px}body.land .ck i{width:28px;height:28px}body.land .cta{height:64px;font-size:23px}
body.land .done{margin-top:16px;padding:22px}body.land .done .big{font-size:32px}body.land .done .row2{padding:8px 0;font-size:21px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* 베이프렌드 캐릭터 (포토존 그림을 다시 그림): 빨간 동글이, 까만 네모 */
.chars{position:absolute;right:-8px;top:-122px;display:flex;align-items:flex-end;gap:2px;pointer-events:none}
.chars button{pointer-events:auto;border:0;background:none;padding:0;position:relative}
.chars button:active{transform:scale(.94)}
.chars .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);padding:3px 10px;border-radius:999px;background:#fff;color:var(--bg);font-size:14px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.chars svg{display:block}
.chars .bub{position:absolute;right:282px;top:22px;padding:10px 16px;border-radius:18px 18px 4px 18px;background:#fff;color:var(--bg);font-size:18px;font-weight:800;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:bob 2.4s ease-in-out infinite}
.q{position:relative}
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out .5s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.wv{transform-box:view-box;animation:wave 1.2s ease-in-out infinite}

h1,h2,.brand span,.ttl,.ib.txt,.opt .t,.opt .n,.memban b,.save .big,.save .pct,.pk span:first-child,.pk b,.item .nm,.item .pr,.item .rk,.cta,.acts button,.call,

<body>
<main class="screen" id="app"></main>
<div class="toast" id="toast"></div>
<script>
/* ---------- 자료 ---------- */
var LIQ = window.LIQ || [];
var PRICE = {"프리미엄":15000,"프라임":20000,"폐호흡":30000};           // menu-b 기준 1병 가격
var RANK = {};                                             // 이름 → 이번 주 판매 수
var params = new URLSearchParams(location.search);
var BRANCH = params.get('branch') || (function(){try{return localStorage.getItem('vfDirBranch')}catch(e){return null}})() || '';
if (params.get('branch')) try{localStorage.setItem('vfDirBranch',BRANCH)}catch(e){}
/* 폐호흡: 지점 포스 30,000원 액상 (menu/lung.js). 맛 계열은 이름 속 단어로 나눔 */
var LUNGL = (function(){
  var src = window.LUNG || {}, rows = BRANCH && src[BRANCH] ? src[BRANCH] : [].concat.apply([], Object.values(src)), seen = {}, out = [];
  var G = [["시가·타바코",/타바코|시가/],["멘솔·민트",/민트|멘솔|쿨|고드름|폴로|스피아/],
    ["디저트·음료",/우유|밀크|팝콘|콜라|레드불|아메리카노|커피|초코|스콘|피넛|컵콘|포테이토|모로나민|포카리|스프라이트|사이다|캔디|스크류바|초바쉐|도초바|소다킹/],
    ["과일",/포도|레몬|라임|망고|피치|복숭아|알로에|애플|사과|베리|석류|파인|멜론|리치|용과|자몽|딸기|구아바|(^|\s)배|오이|청포도|코코|패션|마르키사|라이문|그레이프|과일|트로피칼/],
    ["디저트·음료",/소다|슬러쉬|펀치|보석바/]];
  rows.forEach(function(r, i){ var n=r[0]; if (seen[n]) return; seen[n]=1;
    var dn = n.replace(/\s*\(?모드\)?\s*/g,' ').replace(/^모드\s*/,'').trim();
    var g = (G.filter(function(x){return x[1].test(dn)})[0]||["기타"])[0];
    var mg = (dn.match(/\d+\s*MG/i)||[''])[0];
    out.push({id:'L'+i, n:n, dn:dn, br:'폐호흡', f:mg?'니코틴 '+mg:'', g:g, t:['일반'], line:'폐호흡',
      cool:/민트|멘솔|쿨|고드름|아이스|프로즌|얼음/.test(dn), src:(window.LUNG_IMG||{})[n]||''});
  });
  return out;
})();
fetch('../menu/rank.json?t='+Date.now()).then(function(r){return r.json()}).then(function(j){
  var bs = j.branches||{}, list = BRANCH && bs[BRANCH] ? [bs[BRANCH]] : Object.values(bs);  // 지점 모르면 전 지점 합계
  list.forEach(function(b){(b.liq||[]).concat(b.lung||[]).forEach(function(x){RANK[x[0]]=(RANK[x[0]]||0)+(+x[1]||0)})});
  if (/^mtl-(res|rank|like|pack-res)/.test(state.view)) render();
}).catch(function(){});

/* ---------- 화면 정의 ---------- */
var FLAVOR = [
  {v:"과일",e:"🍇",t:"과일",d:"청포도, 자두, 자몽처럼 상큼달달"},
  {v:"멘솔·민트",e:"🧊",t:"멘솔 · 민트",d:"쿨하고 깔끔하게"},
  {v:"디저트·음료",e:"🥤",t:"디저트 · 음료",d:"소다, 커피, 아이스크림처럼 달콤하게"},
  {v:"시가·타바코",e:"🚬",t:"시가 · 타바코",d:"연초랑 비슷한 묵직한 맛"},
  {v:"",e:"🤔",t:"잘 모르겠어요",d:"요즘 많이 찾는 맛으로 보여드릴게요"}
];
/* 폐호흡은 샤크, 홀리, 오니처럼 맛 이름 없이 별명만 있는 액상이 많아서 따로 묶음 */
var FLAVOR_DL = FLAVOR.slice(0,4).concat([{v:"기타",e:"🦈",t:"샤크 · 홀리 · 오니 등",d:"맛 이름 대신 별명으로 부르는 액상"}], FLAVOR.slice(4));
function FL(){ return state.kind==='dl' ? FLAVOR_DL : FLAVOR; }
var COOL = [
  {v:"",e:"👌",t:"상관없어요",d:"시원한 것도, 아닌 것도 다 보여드려요"},
  {v:"노멘솔",e:"🙅",t:"시원한 건 싫어요",d:"멘솔 없는 노멘솔 액상"},
  {v:"무니코틴",e:"🌿",t:"니코틴 없이",d:"무니코틴 액상"}
];
var state = {view:'home', hist:[], flavor:null, cool:null, kind:'mtl'};
function DATA(){ return state.kind==='dl' ? LUNGL : LIQ; }
function KT(){ return state.view.indexOf('new')===0 ? '처음 오신 분' : state.kind==='dl' ? '폐호흡 액상' : '입호흡 액상'; }

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function won(n){return n.toLocaleString('ko-KR')+'원'}
function go(v){state.hist.push(state.view); state.view=v; var t=document.getElementById('toast'); if(t) t.classList.remove('show'); render();}
function back(){state.view=state.hist.pop()||'home'; render();}
function home(){state={view:'home',hist:[],flavor:null,cool:null,q:'',base:null,pack:null,kind:'mtl',ans:{}}; render();}

function topBar(title, step, total){
  return '<div class="top">'+
    (state.view==='home' ? '<div class="brand"><img src="vf_logo.png" alt="VF"><span>VAFRIEND</span></div>' : '<button class="ib" data-act="back" aria-label="뒤로">‹</button>')+
    '<div class="ttl">'+esc(title||'')+'</div>'+
    (state.view==='home' ? '<span class="ib hide"></span>' : '<button class="ib txt" data-act="home">처음으로</button>')+
  '</div>'+(total ? '<div class="bar"><i style="width:'+Math.round(step/total*100)+'%"></i></div>' : '');
}
function ask(o){ // 질문 한 화면: o = {title, step, total, h, p, opts:[{t,d,act}], sel}
  return '<div class="pane ask">'+topBar(o.title,o.step,o.total)+
    '<section class="q"><h1>'+o.h+'</h1>'+(o.p?'<p>'+o.p+'</p>':'')+(o.extra||'')+'</section>'+
    '<section class="opts">'+o.opts.map(function(x,i){
      return '<button class="opt'+(o.sel===(x.i!=null?x.i:i)?' on':'')+'" data-act="'+x.act+'" data-i="'+(x.i!=null?x.i:i)+'"><span class="n">'+(x.e||(i+1))+'</span><span><span class="t">'+esc(x.t)+'</span><span class="d">'+esc(x.d)+'</span></span></button>';
    }).join('')+'</section></div>';
}

function pick(f,c){ return DATA().filter(function(x){
    if (f && x.g!==f) return false;
    if (c==='노멘솔' && x.cool!==undefined) return !x.cool;
    if (c && (x.t||[]).indexOf(c)<0) return false;
    return true; }); }
function byRank(arr){ return arr.map(function(x,i){return {x:x, s:RANK[x.n]||0, i:i}})
    .sort(function(a,b){return b.s-a.s || (a.x.line===b.x.line?0:a.x.line==="프리미엄"?-1:1) || a.i-b.i}).map(function(o){return o.x}); }
var EV_DL = '<div class="ev">💡 <b>폐호흡 3병 40,000원</b> · 1병씩 사는 것보다 <b>50,000원 아껴요</b> · 맛 섞어도 돼요</div>';
var EV = '<div class="ev">💡 <b>프리미엄</b> 5병 49,500원 → <b>25,500원 아껴요</b> · 11병 90,000원 → <b>75,000원 아껴요</b> &nbsp;|&nbsp; <b>프라임</b> 3병 50,000원 → <b>10,000원 아껴요</b></div>';
var UNIT = {"프리미엄":"💸 5병 패키지면 1병 9,900원","프라임":"💸 3병이면 1병 16,667원","폐호흡":"💸 3병이면 1병 13,333원"};
function saveBox(label, full, price){ var off=full-price, pct=Math.round(off/full*100);
  return '<div class="save pop"><span class="em">🎉</span><div class="tx"><div class="l">'+esc(label)+'</div><div class="big">'+won(off)+' 아껴요</div><div class="pr"><s>'+won(full)+'</s> → <b>'+won(price)+'</b></div></div><span class="pct">-'+pct+'%</span></div>'; }
function pkRow(name, price, full, alt){ var off=(full||0)-price;
  return '<div class="pk'+(alt?' alt':'')+'"><span>'+esc(name)+(off>0?'<em>💸 '+won(off)+' 아껴요</em>':'')+'</span><span class="pp">'+(off>0?'<s>'+won(full)+'</s>':'')+'<b>'+won(price)+'</b></span></div>'; }
function card(x, badge){
  var tag=(x.t||[]).filter(function(t){return t!=="일반"}).join(' · ');
  var src = x.src!=null ? x.src : '../img/'+x.img;
  return '<div class="item"><div class="ph">'+(src?'<img loading="lazy" src="'+esc(src)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<span class="tile">'+esc(x.dn||x.n)+'</span>')+
    (badge?'<span class="rk">'+esc(badge)+'</span>':'')+(tag?'<span class="tg">'+esc(tag)+'</span>':'')+'</div>'+
    '<div class="bd"><span class="br">'+esc([x.br,x.f].filter(Boolean).join(' · '))+'</span><span class="nm">'+esc(x.dn||x.n)+'</span>'+
    '<span class="pr">'+(PRICE[x.line]?won(PRICE[x.line]):'')+'</span>'+(UNIT[x.line]?'<span class="unit">'+UNIT[x.line]+'</span>':'')+'<span class="lc">'+esc(x.line)+(x.loc?' · 위치 '+esc(x.loc.split('|')[0]):'')+'</span></div></div>';
}
/* 목록 한 화면: o = {step,total,h,chips,list,top(인기 표시 몇 위까지),note(위 안내),empty} */
function listPane(o){
  var n=o.top||3, rk=0;
  return '<div class="pane res">'+topBar(KT(),o.step,o.total)+
    '<section class="q"><h1>'+o.h+'</h1>'+
      '<div class="chips">'+(o.chips||[]).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'<span>'+o.list.length+'개</span></div>'+
      (o.note||(state.kind==='dl'?EV_DL:EV))+
    '</section>'+
    '<section class="grid">'+(o.list.length ? o.list.slice(0,60).map(function(x){
      var hot = (RANK[x.n]||0)>0 && rk<n; if (hot) rk++;
      return card(x, hot?'인기 '+rk+'위':'');
    }).join('') : '<div class="empty"><div class="bob" style="display:inline-block">'+chBlack(110)+'</div><br>'+(o.empty||'조건에 맞는 액상이 없어요. 뒤로 가서 다시 골라 주세요.')+'</div>')+'</section></div>';
}

/* 3번: 전에 피던 액상 비슷한 거 = 같은 맛 계열 + 맛 이름 겹침 + 노멘솔/무니코틴 같음 + 같은 브랜드 */
function similar(base){
  var words=(state.kind==='dl' ? (base.dn.match(/포도|레몬|라임|망고|피치|복숭아|알로에|애플|사과|베리|석류|파인|멜론|리치|용과|자몽|딸기|구아바|민트|소다|우유|밀크|콜라|커피|초코|캔디|청포도|코코|콘/g)||[]) : (base.f||'').split(/[+·,\s]+/)).filter(function(w){return w.length>1});
  return byRank(DATA().filter(function(x){return x.id!==base.id})).map(function(x){
    var sc=0; if (x.g===base.g) sc+=2;
    words.forEach(function(w){ if ((x.f||'').indexOf(w)>=0 || (x.dn||x.n).indexOf(w)>=0) sc+=3; });
    if (base.cool!==undefined && x.cool===base.cool) sc+=1;
    (base.t||[]).forEach(function(t){ if (t!=="일반" && (x.t||[]).indexOf(t)>=0) sc+=2; });
    if (x.br===base.br) sc+=1;
    return {x:x,sc:sc};
  }).filter(function(o){return o.sc>=3}).sort(function(a,b){return b.sc-a.sc}).map(function(o){return o.x});
}
function searchList(){
  var q=(state.q||'').replace(/\s/g,'');
  var list = q ? DATA().filter(function(x){return (x.n+(x.dn||'')+x.br+(x.f||'')).replace(/\s/g,'').indexOf(q)>=0}) : DATA();

    opts:FL().map(function(o,i){ if (state.kind!=='dl') return {e:o.e,t:o.t,d:o.d,act:'flavor',i:i}; var n=pick(o.v,null).length; return n?{e:o.e,t:o.t,d:(o.v&&o.v!=='기타'?'':o.d+' ')+'('+n+'개)',act:'flavor',i:i}:null}).filter(Boolean)});
  else if (v==='mtl-cool') h = ask({title:KT(),step:3,total:4,h:'멘솔이나 니코틴은<br>어떻게 할까요?',p:'고르신 맛 안에서 골라 드릴게요.',
    sel:state.cool==null?null:COOL.map(function(o){return o.v}).indexOf(state.cool),
    opts:COOL.map(function(o,i){var n=pick(state.flavor,o.v).length; return n?{e:o.e,t:o.t,d:o.d+' ('+n+'개)',act:'cool',i:i}:null}).filter(Boolean)});
  else if (v==='mtl-res') h = listPane({step:state.kind==='dl'?4:3,total:state.kind==='dl'?4:3,h:'이런 맛 어떠세요? 😋',list:byRank(pick(state.flavor,state.cool)),
    chips:[state.flavor==='기타'?'샤크 · 홀리 · 오니 등':state.flavor||'모든 맛', state.cool?(state.cool==='노멘솔'?'노멘솔만':state.cool==='무니코틴'?'무니코틴만':state.cool):'전체']});
  else if (v==='mtl-staff') h = '<div class="pane ask">'+topBar(KT(),2,2)+
    '<section class="q"><h1>직원이 바로<br>도와드릴게요! 🙋</h1><p>카운터 쪽 직원에게 이 화면을 보여 주시거나<br>잠깐만 기다려 주세요.</p></section>'+
    '<section class="opts"><div class="call"><span class="bob">'+chBlack(130)+'</span>🔔 직원 호출</div>'+
    '<button class="opt" data-act="m-rank"><span class="n">🏆</span><span><span class="t">기다리면서 랭킹 구경하기</span><span class="d">이번 주 많이 나간 액상</span></span></button></section></div>';
  else if (v==='mtl-like') h = searchPane();
  else if (v==='mtl-like-res') { var base=DATA().filter(function(x){return x.id===state.base})[0];
    h = listPane({step:3,total:3,h:'"'+esc(base.dn||base.n)+'"랑<br>비슷한 맛이에요',list:similar(base),chips:[base.g, base.f||''].filter(function(t){return t&&t!=='기타'}),
      empty:'비슷한 맛을 못 찾았어요. 직원에게 물어봐 주세요.'}); }
  else if (v==='mtl-rank') h = listPane({step:2,total:2,h:'이번 주 액상 랭킹 🏆',top:10,
    list:byRank(DATA()).filter(function(x){return (RANK[x.n]||0)>0}).slice(0,30),
    chips:[BRANCH?BRANCH+' 기준':'전 지점 합계'], empty:'랭킹 자료를 불러오는 중이에요.'});
  else if (v==='mtl-pack' && state.kind!=='dl') h = ask({title:KT(),step:2,total:3,h:'어떤 패키지로<br>드릴까요? 🎁',p:'프리미엄 5병 49,500원 · 11병 90,000원, 맛은 바꿔도 돼요.',
    opts:MPACKS.map(function(o){return {e:o.e,t:o.t,d:o.d,act:'mpk'}})});
  else if (v==='mtl-pack') h = ask({title:KT(),step:2,total:3,h:'여러 병 사면<br>더 싸요! 💸',p:state.kind==='dl'?'폐호흡 액상은 1병 30,000원이에요.':'1병 값은 프리미엄 15,000원, 프라임 20,000원이에요.',
    opts:PK().map(function(o){return {e:o.e,t:o.t,d:o.d,act:'pack'}})});
  else if (v==='mtl-pack-res') { var pk=PK()[state.pack];
    h = listPane({step:3,total:3,h:pk.line+' 액상에서<br>'+pk.n+'병 골라 주세요',list:byRank(DATA().filter(function(x){return x.line===pk.line})),
      chips:[pk.t], note:saveBox(pk.t, PRICE[pk.line]*pk.n, pk.price)}); }
  var app=document.getElementById('app'); app.innerHTML=h; app.className='screen';
  var g=app.querySelector('.grid'); if(g) g.scrollTop=0;
  ['mName','mYear','mPhone'].forEach(function(id){ var el=document.getElementById(id); if(!el) return; el.addEventListener('input',function(){
    var m=M_(), k={mName:'name',mYear:'year',mPhone:'phone'}[id]; if (k!=='name') el.value=el.value.replace(/\D/g,''); m[k]=el.value; if (m.bad===k) { m.bad=''; el.classList.remove('bad'); }
    var pv=document.getElementById('mPv'), full=m.name.trim()?m.name.trim()+(m.year||''):''; if (pv) pv.innerHTML=full?'<b>'+esc(full)+'</b> 님으로 가입돼요 🙌':''; }); });
  var askf=document.getElementById('askf'); if(askf){ askf.addEventListener('submit',function(e){ e.preventDefault(); var q=document.getElementById('askq').value; state.askq=''; chatSend(q); });
    var aq=document.getElementById('askq'); aq.addEventListener('input',function(){ state.askq=aq.value; });
    var ch=document.getElementById('chat'); if(ch) ch.scrollTop=ch.scrollHeight; }
  var dq=document.getElementById('dq'); if(dq) dq.addEventListener('input',function(){ state.dq=dq.value; var l=(state.dq||'').replace(/\s/g,''); document.getElementById('dres').innerHTML=devCards(l?DEVL.filter(function(d){return (d.n+d.cp).replace(/\s/g,'').indexOf(l)>=0}):DEVL); });
  var sq=document.getElementById('sq'); if(sq) sq.addEventListener('input',function(){ state.q=sq.value; document.getElementById('sres').innerHTML=searchList(); });
}

var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1800);}

document.getElementById('app').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  var a=b.dataset.act, i=+b.dataset.i;
  function on(next){ b.classList.add('on'); setTimeout(function(){go(next)},150); }
  if (a==='back') return back();
  if (a==='home') return home();
  if (a==='soon') return toast('"'+b.querySelector('.t').textContent+'" 화면은 준비 중이에요');
  if (a==='mem') { b.classList.add('on'); return go('mem'); }
  if (a==='mem-new' || a==='mem-old') { state.memKind=a.slice(4); M_().bad=''; return on(a); }
  if (a==='mck') { var mm=M_(); mm[b.dataset.k]=!mm[b.dataset.k]; if (mm.bad==='agree') mm.bad=''; return render(); }
  if (a==='mem-send') { var m=M_(), need=function(k,msg){ m.bad=k; render(); toast(msg); var el=document.querySelector('.bad'); if(el&&el.focus) el.focus(); };
    if (state.memKind==='new') { if (!/^[가-힣a-zA-Z ]{1,12}$/.test(m.name.trim())) return need('name','성함을 알려 주세요 🙏'); if (!/^\d{2}$/.test(m.year)) return need('year','몇 년생인지 알려 주세요 🙏'); }
    if (!/^01[016789]\d{7,8}$/.test(m.phone)) return need('phone','휴대폰 번호를 확인해 주세요 📱');
    if (state.memKind==='new' && !m.agree) return need('agree','(필수) 동의를 눌러 주세요');
    m.bad=''; return go('mem-done'); }
  if (a==='ft' && state.view==='home') { var k=b.dataset.k;
    state.chat = k==='F' ? [{who:'F',text:'안녕하세요! 저는 빨강이(F)예요 🥰 예쁘고 기분 좋은 걸로 골라 드릴게요. 편하게 타자로 물어봐 주세요 💖'},{who:'T',text:'까망이(T)입니다. 🤖 저는 가격과 판매량으로만 답합니다. 맛은 취향이니까요.'}]
                         : [{who:'T',text:'까망이(T)입니다. 🤖 원하는 조건을 입력하십시오. 가격과 판매량 기준으로 답합니다.'},{who:'F',text:'저는 빨강이(F)! 🥰 까망이는 맨날 숫자 얘기만 해요~ 저는 기분 좋은 걸로 골라 드릴게요 💖'}];
    return go('chat'); }
  if (a==='sug') return chatSend(b.dataset.t);
  if (a==='ft') { state.ft=b.dataset.k; state.ftm=0; if (state.view==='ft') { render(); return; } return go('ft'); }
  if (a==='ftm') { state.ftm=i; return render(); }
  if (a==='ftdev') { var mi=MODELS.map(function(m){return m.dn}).indexOf(b.dataset.dn); if (mi<0) return; state.model=mi; state.mopt=0; return go('dev-dtl'); }
  if (a==='ft11') { state.kind='mtl'; state.mpack=4; state.mpn=11; return go('mtl-mpack'); }
  if (a==='dev') return on('dev');
  if (a==='mpick') { state.model=i; state.mopt=0; return go('dev-dtl'); }
  if (a==='mopt') { state.mopt=i; return render(); }
  if (a==='mcall') { var M=MODELS[state.model], op=(M.opts[state.mopt||0]||{}).opt;
    state.staffT='기기 보기'; state.staffH='직원이 바로<br>보여 드릴게요!'; state.staffP='"'+esc(M.dn+(op?' '+op:''))+'" 보러 오셨다고 전해 드릴게요.<br>잠깐만 기다려 주세요.'; return go('help-staff'); }
  if (a==='help') { state.staffT=null; return on('help'); }
  if (a==='h-pod' || a==='h-use') { state.helpMode=a==='h-pod'?'pod':'use'; state.dq=''; return on('help-dev'); }
  if (a==='h-fix') return on('help-fix');
  if (a==='h-mem' || a==='h-etc') { state.staffH='직원이 바로<br>도와드릴게요!'; state.staffP=a==='h-mem'?'회원 조회, 적립, 결제는 직원이 포스에서 바로 해 드려요.<br>카운터로 와 주시거나 잠깐만 기다려 주세요.':'카운터 쪽 직원에게 이 화면을 보여 주시거나<br>잠깐만 기다려 주세요.'; return on('help-staff'); }
  if (a==='devpick') { state.dev=b.dataset.id; return go('help-dev-dtl'); }
  if (a==='fixpick') { state.fix=i; if (!FIX[i].tips.length) { state.staffH='직원이 바로<br>봐 드릴게요!'; state.staffP='기기를 가지고 카운터로 와 주시거나<br>잠깐만 기다려 주세요.'; return on('help-staff'); } return on('help-fix-res'); }
  if (a==='help-call') { var dd=state.view==='help-dev-dtl'?DEVL.filter(function(x){return x.id===state.dev})[0]:null;
    state.staffH='직원이 바로<br>도와드릴게요!'; state.staffP=dd?'"'+esc(dd.n)+'" '+(state.helpMode==='pod'?'팟 찾으신다고 전해 드릴게요.':'사용법 알려 드릴게요.')+'<br>잠깐만 기다려 주세요.':'"'+esc(FIX[state.fix].t)+'" 증상, 직원이 바로 봐 드릴게요.<br>기기를 가지고 카운터로 와 주세요.'; return go('help-staff'); }
  if (a==='new') { state.ans={}; return on('new-now'); }
  if (a==='newans') { var k=state.view.slice(4), st, nx; state.ans[k]=NEWQ[k].a[i][0];
    if (k==='now') { delete state.ans.cig; delete state.ans.heat; }
    st=newSteps(); nx=st[st.indexOf(k)+1]; return on(nx ? 'new-'+nx : 'new-res'); }
  if (a==='new-more') { state.kind=b.dataset.k; return go('mtl'); }
  if (a==='mtl' || a==='dl') { state.kind=a; return on('mtl'); }
  if (a==='m-self') { state.flavor=null; state.cool=null; if (state.kind!=='dl') { state.mapf=''; return on('mtl-map'); } return on('mtl-flavor'); }
  if (a==='mapf') { state.mapf=b.dataset.v; return render(); }
  if (a==='quad') { state.flavor=b.dataset.g; state.cool=state.mapf||''; b.classList.add('on'); return setTimeout(function(){go('mtl-res')},150); }
  if (a==='mpk') { state.mpack=i; state.mpn=5; return on('mtl-mpack'); }
  if (a==='mpn') { state.mpn=i; return render(); }
  if (a==='mpcall') { state.staffT='입호흡 액상'; state.staffH='직원이 바로<br>담아 드릴게요!'; state.staffP='"'+esc(MPACKS[state.mpack].t)+' '+(state.mpn||5)+'병" 하신다고 전해 드릴게요.<br>잠깐만 기다려 주세요.'; return go('help-staff'); }
  if (a==='m-staff') return on('mtl-staff');
  if (a==='m-like') { state.q=''; return on('mtl-like'); }
  if (a==='m-rank') return on('mtl-rank');
  if (a==='m-pack') return on('mtl-pack');
  if (a==='flavor') { state.flavor=FL()[i].v; return on('mtl-cool'); }
  if (a==='cool') { state.cool=COOL[i].v; return on('mtl-res'); }
  if (a==='base') { state.base=b.dataset.id; return go('mtl-like-res'); }
  if (a==='pack') { state.pack=i; return on('mtl-pack-res'); }
});

/* 2분 동안 아무도 안 만지면 첫 화면으로 */
var idleT; function idle(){clearTimeout(idleT); idleT=setTimeout(function(){ if(state.view!=='home') home(); },120000);}
['pointerdown','scroll'].forEach(function(ev){addEventListener(ev,idle,true)}); idle();
render();
</script>
</body>
