<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191f28">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>베이프렌드 직원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f2f4f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--sub:#8b95a1;--line:#e5e8eb;--blue:#3182f6;--blue-soft:#e8f3ff;--green:#03b26c;--green-soft:#e5f8ef;--red:#f04452;--red-soft:#fdecee;--amber:#b77700;--amber-soft:#fff4dc;--dark:#191f28}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .logo{font-weight:800;font-size:18px} .logo b{color:var(--blue)}
  .store{background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
  .date{margin-left:auto;color:var(--sub);font-size:14px;font-weight:500}
  .hero{background:var(--dark);color:#fff;border-radius:22px;padding:22px;margin-bottom:12px}
  .hero h1{font-size:22px;letter-spacing:-.4px;line-height:1.35}
  .hero p{color:#b0b8c1;margin-top:6px;font-size:14px}
  .hero .bar{height:8px;background:rgba(255,255,255,.15);border-radius:99px;margin-top:16px;overflow:hidden}
  .hero .bar i{display:block;height:100%;background:#64a8ff;border-radius:99px;transition:width .3s}
  .card{background:var(--card);border-radius:20px;padding:6px 18px;margin-bottom:12px}
  .card h2{font-size:15px;color:var(--sub);font-weight:700;padding:14px 0 4px}
  .step{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .card h2+.step{border-top:0}
  .num{width:34px;height:34px;border-radius:50%;background:#f2f4f6;color:var(--ink2);display:grid;place-items:center;font-weight:800;flex:none}
  .step.done .num{background:var(--green-soft);color:var(--green)}
  .step .tx{flex:1;min-width:0} .step .tx b{display:block;font-size:16px} .step .tx span{font-size:13px;color:var(--sub)}
  .step .tx span.w{color:var(--amber)}
  .act{height:42px;padding:0 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;flex:none;text-decoration:none;display:inline-flex;align-items:center}
  .act.gray{background:#f2f4f6;color:var(--ink2)}
  .links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .links a{background:var(--card);border-radius:18px;padding:16px;text-decoration:none;color:var(--ink);font-weight:700}
  .links a span{display:block;font-size:13px;color:var(--sub);font-weight:500;margin-top:4px}
  .foot{font-size:12px;color:var(--sub);text-align:center;margin-top:18px;line-height:1.6}
  .foot button{color:var(--blue);font-weight:600;font-size:12px}
  /* 지점 고르기 */
  .pick h1{font-size:22px;margin:20px 4px 6px} .pick p{color:var(--sub);margin:0 4px 16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid button{background:var(--card);border-radius:18px;padding:20px 16px;text-align:left;font-weight:700;font-size:17px}
  .grid button span{display:block;font-size:13px;color:var(--sub);font-weight:600}
  /* 아래에서 올라오는 창 */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .dim.on{display:flex}
  .sheet{background:#fff;width:min(560px,100%);border-radius:24px 24px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h2{font-size:21px;letter-spacing:-.4px} .sheet .desc{color:var(--sub);margin-top:6px;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{padding:11px 15px;border-radius:12px;background:#f2f4f6;font-weight:600}
  .chip.on{background:var(--blue);color:#fff}
  .input{margin-top:12px;width:100%;height:52px;border-radius:14px;border:1px solid var(--line);padding:0 16px;font:inherit;font-size:16px;outline:none}
  .input:focus{border-color:var(--blue)}
  .check{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:16px;width:100%;text-align:left}
  .check:first-of-type{border-top:0;margin-top:8px}
  .check i{width:26px;height:26px;border-radius:8px;border:2px solid #d1d6db;display:grid;place-items:center;flex:none;font-style:normal;color:#fff;font-size:15px}
  .check.on i{background:var(--blue);border-color:var(--blue)}
  .btns{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;height:54px;border-radius:14px;font-weight:700;font-size:16px;background:#f2f4f6}
  .btn.primary{background:var(--blue);color:#fff} .btn:disabled{opacity:.5}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .reqs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .reqs button{text-align:left;padding:14px;border-radius:14px;background:#f2f4f6}
  .reqs b{display:block;font-size:16px}.reqs span{font-size:13px;color:#8b95a1}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  textarea.input{height:auto;padding-top:12px;font:inherit}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const VER = "10.05-2";
const BR = ["동성로", "수성", "본점", "율하", "반월당", "상인", "광장코아", "현풍"];
const OPEN_AT = { 동성로: "11:00", 수성: "10:30", 본점: "11:00", 율하: "10:30", 반월당: "10:30", 상인: "10:30", 광장코아: "11:00", 현풍: "11:00" };
// 운영봇(운영봇_시험.mjs)의 CHECK와 같은 목록이어야 기록이 맞아요
const CHECK = {
  open: ["바닥 쓸기/닦기, 유리·거울 닦기", "진열장·포스·단말기 먼지 제거", "입/폐/일회용 기기 배터리 체크", "시연대 정리정돈", "자판기 청소·작동 체크", "매장 환기", "유니폼 착용"],
  close: ["액상·기기·소모품 진열 채우기", "시연팟 체크·코일 교환", "기기 배터리 체크", "수납공간 정리", "드립팁 세척·종량제 확인", "자판기 체크(마감 전)", "매장 외부 청소", "순회점검표·환기대장 작성"],
};
// 보내기: 디스코드 웹훅(🔌패드연결) → 운영봇이 받아 지점 보고 채널·팀장보고·시트에 기록
const HOOK = "https://discord.com/api/webhooks/1555156884753743905/BLK7tRBQACouQrOE_hvOkm2-iD44gnfnxdJvQXxiBAJKXJU3MG4bjnACFsXgDkDWLBrh";

const ls = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const now = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ho = (b) => `${BR.indexOf(b) + 1}호 ${b}`;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }

const qs = new URLSearchParams(location.search);
// ?pick=1 이면 저장된 지점이 있어도 지점 고르기 화면부터 (드라이브 링크용)
let B = qs.has("pick") ? null : BR.includes(qs.get("branch")) ? qs.get("branch") : ls.get("vf-app-branch", null);
if (B) ls.set("vf-app-branch", B);
const dayKey = () => `vf-app-${B}-${todayKey()}`;
const st = () => ls.get(dayKey(), { ins: [], open: null, close: null });
const saveSt = (s) => ls.set(dayKey(), s);
// 재고보고는 재고보고 페이지(stock)가 이 기기에 남긴 기록으로 확인
const stockDone = () => { const x = ls.get(`vf-stock-${B}-last`, null); if (!x?.at) return null; const d = new Date(x.at); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` === todayKey() ? { t: `${pad(d.getHours())}:${pad(d.getMinutes())}`, by: x.by } : null; };

async function send(body) {
  const r = await fetch(HOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ content: JSON.stringify({ ...body, branch: B, ver: VER }), allowed_mentions: { parse: [] } }) });
  if (!r.ok) throw new Error("응답 " + r.status);
}
const fail = (e) => toast(`못 보냈어요 (${navigator.onLine ? e.message : "인터넷 끊김"}) · 다시 눌러 주세요`);

function render() {
  if (!B) return renderPick();
  const s = st(), sd = stockDone(), working = s.ins.filter((x) => !x.out);
  const d = new Date();
  const steps = [s.ins.length > 0, !!s.open, !!sd], done = steps.filter(Boolean).length;
  const title = done === 3 ? "오픈 완료! 팀장님께 자동으로 보고됐어요" : `오픈까지 ${3 - done}단계 남았어요`;
  const stepRow = (n, ok, name, info, btn) => `<div class="step ${ok ? "done" : ""}"><div class="num">${ok ? "✓" : n}</div><div class="tx"><b>${name}</b><span ${info.w ? 'class="w"' : ""}>${info.t}</span></div>${btn}</div>`;
  $("#app").innerHTML = `
    <div class="top"><div class="logo">VAFRIEND <b>직원</b></div><div class="store">${esc(ho(B))}</div><div class="date">${d.getMonth() + 1}/${d.getDate()} (${"일월화수목금토"[d.getDay()]})</div></div>
    <div class="hero"><h1>${title}</h1><p>오픈 ${OPEN_AT[B]} · 출근 → 오픈 체크 → 아침 재고보고</p><div class="bar"><i style="width:${(done / 3) * 100}%"></i></div></div>
    <div class="card"><h2>오픈</h2>
      ${stepRow(1, steps[0], "출근", { t: s.ins.length ? s.ins.map((x) => `${esc(x.name)} ${x.t}${x.out ? `~${x.out}` : ""}`).join(" · ") : "아직 안 함" }, `<button class="act ${steps[0] ? "gray" : ""}" data-go="in">${steps[0] ? "추가" : "출근"}</button>`)}
      ${stepRow(2, steps[1], "오픈 체크", s.open ? { t: `${s.open.t} 완료${s.open.missed.length ? ` · 못 한 것 ${s.open.missed.length}개` : ""}`, w: s.open.missed.length } : { t: "아직 안 함" }, `<button class="act ${steps[1] ? "gray" : ""}" data-go="open">${steps[1] ? "다시" : "체크"}</button>`)}
      ${stepRow(3, steps[2], "아침 재고보고", sd ? { t: `${sd.t} 완료 · ${esc(sd.by || "")}` } : { t: "아직 안 함" }, `<a class="act ${steps[2] ? "gray" : ""}" href="../stock/?branch=${encodeURIComponent(B)}&back=${encodeURIComponent(location.pathname)}">${steps[2] ? "다시" : "하기"}</a>`)}
    </div>
    <div class="card"><h2>마감</h2>
      ${stepRow("🌙", !!s.close, "마감 체크", s.close ? { t: `${s.close.t} 완료${s.close.missed.length ? ` · 못 한 것 ${s.close.missed.length}개` : ""}`, w: s.close.missed.length } : { t: "아직 안 함" }, `<button class="act ${s.close ? "gray" : ""}" data-go="close">${s.close ? "다시" : "체크"}</button>`)}
      ${stepRow("👋", s.ins.length > 0 && !working.length, "퇴근", { t: working.length ? `근무 중: ${working.map((x) => esc(x.name)).join(", ")}` : s.ins.length ? "모두 퇴근" : "출근 기록 없음" }, working.length ? `<button class="act gray" data-go="out">퇴근</button>` : "")}
    </div>
    <div class="card"><h2>요청 보내기</h2>
      <div class="reqs">
        <button data-req="parcel"><b>📦 고객 택배</b><span>택배로 보내기</span></button>
        <button data-req="quick"><b>🛵 고객 퀵</b><span>가까운 지점이 보내기</span></button>
        <button data-req="branch"><b>🔁 다른 지점에 요청</b><span>상품 옮기기</span></button>
        <button data-req="ask"><b>🔍 재고 확인</b><span>다른 지점에 있나요?</span></button>
      </div>
      <div class="desc" style="margin:10px 0 0">요청은 디스코드 🙋요청 채널에 카드로 올라가고, 단계별 버튼으로 진행돼요.</div>
    </div>
    <div class="links">
      <a href="../menu/?branch=${encodeURIComponent(B)}">🛍 판매용 메뉴판<span>손님 상담 화면</span></a>
      <a href="../stock/?branch=${encodeURIComponent(B)}&back=${encodeURIComponent(location.pathname)}">📦 재고보고<span>팟·코일·기기 개수</span></a>
    </div>
    <div class="foot">테스트판 ${VER} · 기록은 디스코드 지점 보고 채널과 시트에도 남아요<br>오늘 기록은 이 기기 기준이에요 (다른 기기에서 한 건 디스코드에서 확인)<br><button data-go="branch">지점 바꾸기</button></div>`;
}
function renderPick() {
  $("#app").innerHTML = `<div class="pick"><h1>어느 지점인가요?</h1><p>이 기기에 한 번만 고르면 돼요.</p>
    <div class="grid">${BR.map((b, i) => `<button data-b="${b}"><span>${i + 1}호</span>${b}</button>`).join("")}</div></div>`;
}

// ── 요청 보내기 (10/5) ── 고객 택배·퀵 / 지점 요청 / 재고 확인 → 웹훅 → 운영봇이 🙋요청 카드로
// 가까운 지점: 지도 API 없이 '구·읍면' 대략 위치로 계산 (정확한 거리 아님 — 순서만 참고)
const BR_POS = { 동성로: [35.8693, 128.5950], 수성: [35.8572, 128.6230], 본점: [35.8780, 128.6280], 율하: [35.8680, 128.6950], 반월당: [35.8655, 128.5930], 상인: [35.8180, 128.5370], 광장코아: [35.8550, 128.5470], 현풍: [35.6950, 128.4560] };
const AREA = [ // [주소에 들어가는 말, 대략 위치] — 앞에 있을수록 먼저 봄(읍면 > 구)
  [/현풍|유가|구지/, [35.69, 128.45]], [/논공/, [35.73, 128.43]], [/화원|옥포/, [35.80, 128.50]], [/다사|하빈/, [35.86, 128.46]], [/가창/, [35.80, 128.62]],
  [/안심|율하|반야월|동호|신서|각산/, [35.87, 128.70]], [/동대구|신천동|신암/, [35.88, 128.63]], [/상인|월배|진천|대곡|도원/, [35.82, 128.54]], [/감삼|두류|죽전|본리/, [35.85, 128.54]],
  [/중구/, [35.869, 128.600]], [/동구/, [35.886, 128.640]], [/서구/, [35.872, 128.559]], [/남구/, [35.846, 128.597]], [/북구/, [35.886, 128.583]],
  [/수성구/, [35.858, 128.631]], [/달서구/, [35.830, 128.533]], [/달성군/, [35.775, 128.431]], [/경산/, [35.825, 128.741]], [/칠곡/, [35.995, 128.402]],
];
const distKm = ([a, b], [c, d]) => { const R = 6371, x = (c - a) * Math.PI / 180, y = (d - b) * Math.PI / 180; const h = Math.sin(x / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(y / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const nearOrder = (addr) => { const p = (AREA.find(([re]) => re.test(addr || "")) || [])[1]; return p ? BR.map((b) => [b, distKm(p, BR_POS[b])]).sort((a, b) => a[1] - b[1]) : null; };
let rq = {};
function sheetReq(kind) {
  rq = { kind, how: kind === "quick" ? "퀵" : "택배", handler: B, to: null };
  const title = { parcel: "📦 고객 택배 요청", quick: "🛵 고객 퀵 요청", branch: "🔁 다른 지점에 요청", ask: "🔍 다른 지점 재고 확인" }[kind];
  const body = kind === "ask" ? `<div class="desc">상품 이름과 필요한 수량을 적으면 🙋요청 채널에 [있음][없음] 카드가 올라가요.</div>
      <input class="input" id="rqItem" placeholder="상품 이름 (예: 디오 콜라)" maxlength="40"><input class="input" id="rqQty" type="number" min="1" max="99" value="1" placeholder="필요 수량">`
    : kind === "branch" ? `<div class="desc">어느 지점에 요청할까요?</div><div class="chips" id="rqTo">${BR.filter((b) => b !== B).map((b) => `<button class="chip" data-to="${b}">${ho(b)}</button>`).join("")}</div>
      <input class="input" id="rqTitle" placeholder="품목·수량 (예: 디오 레몬 5병)" maxlength="40"><textarea class="input" id="rqInfo" placeholder="메모 (선택)" rows="2"></textarea>`
    : `<input class="input" id="rqTitle" placeholder="품목·수량 (예: 바닐라 30ml 3병)" maxlength="40">
      <input class="input" id="rqAddr" placeholder="고객 주소 (예: 대구 수성구 범어동 …)" maxlength="80">
      <input class="input" id="rqWho" placeholder="고객 이름·연락처 (선택)" maxlength="40">
      <div class="desc" style="margin-top:14px">보낼 지점 <span id="rqNearNote">· 주소를 넣으면 가까운 순으로 정렬돼요</span></div><div class="chips" id="rqHandler">${handlerChips(null)}</div>`;
  openSheet(`<h2>${title}</h2>${body}<div class="btns"><button class="btn" data-x>취소</button><button class="btn primary" id="okRq">요청 보내기</button></div>`);
}
function handlerChips(order) {
  const list = order ? order.map(([b, km]) => [b, km]) : BR.map((b) => [b, null]);
  return list.map(([b, km], i) => `<button class="chip ${rq.handler === b ? "on" : ""}" data-hd="${b}">${order && i === 0 ? "⭐ " : ""}${ho(b)}${km != null ? ` · 약 ${km < 1 ? "1" : Math.round(km)}km` : ""}</button>`).join("");
}
function onAddr() {
  const order = nearOrder($("#rqAddr").value);
  if (order) rq.handler = order[0][0];
  $("#rqHandler").innerHTML = handlerChips(order);
  $("#rqNearNote").textContent = order ? "· 가까운 순 (구·동 기준 대략 거리)" : "· 주소에서 구·동을 못 찾았어요 — 직접 골라 주세요";
}
async function doReq() {
  const v = (id) => ($(id)?.value || "").trim();
  let body;
  if (rq.kind === "ask") { if (!v("#rqItem")) return toast("상품 이름을 넣어 주세요"); body = { type: "stockask", item: v("#rqItem"), qty: Math.max(1, Math.min(99, +v("#rqQty") || 1)), pad: "직원앱" }; }
  else if (rq.kind === "branch") { if (!rq.to) return toast("요청할 지점을 골라 주세요"); if (!v("#rqTitle")) return toast("품목·수량을 넣어 주세요"); body = { type: "ticket", kind: "branch", to: rq.to, title: v("#rqTitle"), info: v("#rqInfo") }; }
  else { if (!v("#rqTitle")) return toast("품목·수량을 넣어 주세요"); if (!v("#rqAddr")) return toast("고객 주소를 넣어 주세요"); body = { type: "ticket", kind: "customer", how: rq.how, handler: rq.handler, title: v("#rqTitle"), info: [`방법: ${rq.how}`, `주소: ${v("#rqAddr")}`, v("#rqWho") && `고객: ${v("#rqWho")}`].filter(Boolean).join("\n") }; }
  body.by = st().ins.filter((x) => !x.out).map((x) => x.name).join(", ");
  $("#okRq").disabled = true;
  try { await send(body); closeSheet(); toast(rq.kind === "ask" ? "재고 확인 요청을 보냈어요 · 답은 디스코드로 와요" : "요청을 보냈어요 · 🙋요청 채널에 카드가 올라가요"); }
  catch (e) { $("#okRq").disabled = false; fail(e); }
}
function openSheet(html) { $("#sheet").innerHTML = html; $("#dim").classList.add("on"); }
const closeSheet = () => $("#dim").classList.remove("on");

function sheetIn() {
  const s = st(), recent = ls.get(`vf-app-${B}-names`, []).filter((n) => !s.ins.some((x) => x.name === n));
  openSheet(`<h2>출근</h2><div class="desc">이름을 고르거나 입력해 주세요.</div>
    ${recent.length ? `<div class="chips">${recent.map((n) => `<button class="chip" data-name="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}
    <input class="input" id="nm" placeholder="이름" maxlength="20">
    <div class="btns"><button class="btn" data-x>취소</button><button class="btn primary" id="okIn">출근 보내기</button></div>`);
}
async function doIn(name) {
  name = name.trim(); if (!name) return toast("이름을 넣어 주세요"); if (!/[가-힣a-zA-Z]{2,}/.test(name)) return toast("이름을 두 글자 이상 정확히 넣어 주세요"); // 10/5 '0'으로 출근 기록된 일
  const s = st(); if (s.ins.some((x) => x.name === name)) return toast("오늘 이미 출근했어요");
  $("#okIn").disabled = true;
  try {
    await send({ type: "clockin", name });
    s.ins.push({ name, t: now() }); saveSt(s);
    ls.set(`vf-app-${B}-names`, [name, ...ls.get(`vf-app-${B}-names`, []).filter((n) => n !== name)].slice(0, 12));
    closeSheet(); render(); toast(`${name}님 출근 ${now()}`);
  } catch (e) { $("#okIn").disabled = false; fail(e); }
}
function sheetCheck(kind) {
  const items = CHECK[kind];
  openSheet(`<h2>${kind === "open" ? "🌅 오픈 체크" : "🌙 마감 체크"}</h2><div class="desc">한 것을 눌러 체크하세요. 못 한 건 그대로 두고 보내면 '못 한 항목'으로 보고돼요.</div>
    ${items.map((x, i) => `<button class="check" data-ck="${i}"><i>✓</i>${esc(x)}</button>`).join("")}
    <div class="btns"><button class="btn" data-x>취소</button><button class="btn primary" id="okCk" data-kind="${kind}">보고 보내기</button></div>`);
}
async function doCheck(kind) {
  const items = CHECK[kind], on = [...document.querySelectorAll(".check")].map((el) => el.classList.contains("on"));
  const missed = items.filter((_, i) => !on[i]);
  if (missed.length && !confirm(`못 한 항목 ${missed.length}개:\n${missed.join("\n")}\n\n이대로 보고할까요?`)) return;
  $("#okCk").disabled = true;
  try {
    await send({ type: kind, missed });
    const s = st(); s[kind] = { t: now(), missed }; saveSt(s);
    closeSheet(); render(); toast(`${kind === "open" ? "오픈" : "마감"} 보고 완료`);
  } catch (e) { $("#okCk").disabled = false; fail(e); }
}
function sheetOut() {
  const w = st().ins.filter((x) => !x.out);
  openSheet(`<h2>👋 퇴근</h2><div class="desc">누가 퇴근하나요?</div><div class="chips">${w.map((x) => `<button class="chip" data-out="${esc(x.name)}">${esc(x.name)} (출근 ${x.t})</button>`).join("")}</div>
    <div class="btns"><button class="btn" data-x>취소</button></div>`);
}
async function doOut(name) {
  try {
    await send({ type: "clockout", name });
    const s = st(); const x = s.ins.find((y) => y.name === name); if (x) x.out = now(); saveSt(s);
    closeSheet(); render(); toast(`${name}님 퇴근 ${now()}`);
  } catch (e) { fail(e); }
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button,[data-x]"); if (!t) { if (e.target.id === "dim") closeSheet(); return; }
  if (t.dataset.b) { B = t.dataset.b; ls.set("vf-app-branch", B); return render(); }
  if (t.dataset.x !== undefined) return closeSheet();
  const go = t.dataset.go;
  if (go === "in") return sheetIn();
  if (go === "open" || go === "close") return sheetCheck(go);
  if (go === "out") return sheetOut();
  if (go === "branch") { B = null; return render(); }
  if (t.dataset.name) { $("#nm").value = t.dataset.name; return doIn(t.dataset.name); }
  if (t.id === "okIn") return doIn($("#nm").value);
  if (t.dataset.ck !== undefined) return t.classList.toggle("on");
  if (t.id === "okCk") return doCheck(t.dataset.kind);
  if (t.dataset.out) return doOut(t.dataset.out);
  if (t.dataset.req) return sheetReq(t.dataset.req);
  if (t.dataset.to) { rq.to = t.dataset.to; document.querySelectorAll("[data-to]").forEach((x) => x.classList.toggle("on", x === t)); return; }
  if (t.dataset.hd) { rq.handler = t.dataset.hd; document.querySelectorAll("[data-hd]").forEach((x) => x.classList.toggle("on", x === t)); return; }
  if (t.id === "okRq") return doReq();
});
document.addEventListener("input", (e) => { if (e.target.id === "rqAddr") onAddr(); });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "nm") doIn(e.target.value); });
// 재고보고 갔다 오면 다시 그리기
window.addEventListener("pageshow", render);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
render();
</script>
</body>
</html>
