<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181b">
<title>베이프렌드 본점 · 매장 재고 위치찾기</title>
<style>
  :root{
    --bg:#14181b; --panel:#1c2226; --line:#2c3438;
    --text:#eef1f2; --sub:#93a0a6; --red:#e0392f; --red-dim:#4a201d; --gold:#d9a441;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:14px 14px 40px;
  }
  h1{font-size:17px;margin:0 0 3px;font-weight:800;}
  .brandline{font-size:11px;color:var(--sub);letter-spacing:.08em;font-weight:700;margin-bottom:12px;}
  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap input{
    width:100%;padding:12px 40px 12px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-size:14px;outline:none;
  }
  .search-wrap input:focus{border-color:var(--red);}
  .floor{
    position:relative;
    background:#20272b;
    border:1px solid var(--line);
    border-radius:10px;
    height:560px;
    overflow:auto;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:20px 20px;
  }
  .floorInner{ position:relative; width:1400px; height:1000px; }
  .box{
    position:absolute;
    border-radius:7px;
    border:1.5px solid rgba(255,255,255,.25);
    background:var(--red);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;text-align:center;
    padding:3px;cursor:pointer;
    transition:filter .12s, opacity .15s, box-shadow .15s;
    user-select:none;
  }
  .box:hover{filter:brightness(1.15);}
  .box.dim{opacity:.15;}
  .box.match{box-shadow:0 0 0 3px #1a56db;z-index:4;}
  .box.empty{background:#3a4247;color:var(--sub);}
  .lineLayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .lineLayer line{stroke:#c0392b;stroke-width:2.5;opacity:.55;}
  .lineLayer text{font-size:12px;font-weight:700;fill:#e0392f;font-family:inherit;}
  .flow{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:8px;}

  .modal-backdrop{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:320px;width:100%;text-align:center;
  }
  .modal .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:9px;background:var(--red-dim);color:var(--red);
    font-weight:800;font-size:15px;margin-bottom:12px;
  }
  .modal .label{font-size:17px;font-weight:700;margin-bottom:18px;line-height:1.4;}
  .modal button{
    width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
    background:#2c3438;color:#fff;font-size:14px;cursor:pointer;
  }
  footer{text-align:center;color:var(--sub);font-size:11px;padding:18px 0 4px;}
</style>
</head>
<body>
  <h1>본점 매장 재고 위치찾기</h1>
  <div class="brandline">VAFRIEND · STAFF VIEW (조회 전용)</div>

  <div class="search-wrap">
    <input id="search" type="text" placeholder="상품명·구역 검색 (예: 릭, 소모품, 각인기)" autocomplete="off">
  </div>

  <div class="floor" id="floor">
    <div class="floorInner" id="floorInner">
      <svg class="lineLayer" id="lineLayer"></svg>
      <div id="boxLayer"></div>
    </div>
  </div>
  <div class="flow"><span>◂ 창고 방향(B-3)</span><span>입구·외부자판기 ▸</span></div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="num" id="modalNum"></div>
      <div class="label" id="modalLabel"></div>
      <button id="modalClose">닫기</button>
    </div>
  </div>

  <footer>손님 응대 아닌 직원 참고용 · 위치 수정은 관리자에게 문의</footer>

const LINES = [
  {x1:0.17,y1:66.75,x2:83.06,y2:66.83,label:"벽면"},

];

const floorInnerEl = document.getElementById('floorInner');
const boxLayer = document.getElementById('boxLayer');
const lineLayer = document.getElementById('lineLayer');
const searchEl = document.getElementById('search');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalNum = document.getElementById('modalNum');
const modalLabel = document.getElementById('modalLabel');

function renderBoxes(){
  boxLayer.innerHTML = '';
  BOXES.forEach(b=>{
    const el = document.createElement('div');
    el.className = 'box' + (b.label ? '' : ' empty');
    el.dataset.num = b.num;
    el.style.left = b.x + '%';
    el.style.top = b.y + '%';
    el.style.width = b.w + '%';
    el.style.height = b.h + '%';
    el.textContent = b.label || ('#' + b.num);
    el.addEventListener('click', ()=>{
      modalNum.textContent = b.num;
      modalLabel.textContent = b.label || '(이름 없음)';
      modalBackdrop.classList.add('open');
    });
    boxLayer.appendChild(el);
  });
}
function renderLines(){
  lineLayer.innerHTML = '';
  LINES.forEach(ln=>{
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', ln.x1+'%'); line.setAttribute('y1', ln.y1+'%');
    line.setAttribute('x2', ln.x2+'%'); line.setAttribute('y2', ln.y2+'%');
    lineLayer.appendChild(line);
    if(ln.label){
      const midX=(ln.x1+ln.x2)/2, midY=(ln.y1+ln.y2)/2;
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', midX+'%'); text.setAttribute('y', (midY-1)+'%');
      text.setAttribute('text-anchor','middle');
      text.textContent = ln.label;
      lineLayer.appendChild(text);
    }
  });
}
renderBoxes();
renderLines();

modalBackdrop.addEventListener('click', (e)=>{ if(e.target === modalBackdrop) modalBackdrop.classList.remove('open'); });
document.getElementById('modalClose').addEventListener('click', ()=> modalBackdrop.classList.remove('open'));

searchEl.addEventListener('input', ()=>{
  const q = searchEl.value.trim().toLowerCase();
  const boxEls = boxLayer.querySelectorAll('.box');
  let firstMatch = null;
  boxEls.forEach(el=>{
    const label = (el.textContent || '').toLowerCase();
    el.classList.remove('dim','match');
    if(!q) return;
    if(label.includes(q)){
      el.classList.add('match');
      if(!firstMatch) firstMatch = el;
    }else{
      el.classList.add('dim');
    }
  });
  if(firstMatch) firstMatch.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
});

document.addEventListener('keydown', (e)=>{
  if(e.key === '/' && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
  if(e.key === 'Escape'){
    if(modalBackdrop.classList.contains('open')) modalBackdrop.classList.remove('open');
    else { searchEl.value=''; searchEl.dispatchEvent(new Event('input')); searchEl.blur(); }
  }
});
