<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>베이프렌드 AS</title>
<style>
  :root{--red:#d81f2a;--ink:#15120f;--grey:#7a746d;--line:#e6e1d8;--bg:#f4f1eb;--ok:#067a46}
  *{box-sizing:border-box;margin:0}
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
  button{font:inherit;cursor:pointer}
  header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  header b{font-size:17px}
  header .br{font-size:12px;background:var(--red);border-radius:99px;padding:2px 9px}
  header .sp{flex:1}
  header input{height:38px;border-radius:10px;border:0;padding:0 12px;font-size:15px;width:min(260px,100%)}
  header .add{height:38px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:900;padding:0 14px;font-size:15px}
  header .lk{background:none;border:0;color:#cfc8bd;font-size:12px}
  .tabs{display:none;gap:6px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
  .tabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-weight:800;font-size:13px}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs i{font-style:normal;margin-left:4px;color:var(--red)}
  .tabs button.on i{color:#ffb3b8}
  #board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px}
  .col{background:#ebe6dd;border-radius:14px;padding:8px;min-height:200px}
  .col h3{font-size:13px;padding:4px 6px 8px;display:flex;justify-content:space-between}
  .col h3 span{color:var(--red)}
  .card{background:#fff;border-radius:12px;padding:10px 11px;margin-bottom:7px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;border-left:4px solid transparent}
  .card.late{border-left-color:var(--red);background:#fff7f7}
  .card b{font-size:15px;display:block}
  .card .d{font-size:13px;color:#3d3833;margin-top:2px}
  .card .m{font-size:11.5px;color:var(--grey);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
  .card .m .lt{color:var(--red);font-weight:800}
  .empty{color:#a8a095;font-size:13px;text-align:center;padding:20px 0}
  @media (max-width:899px){
    .tabs{display:flex}
    #board{display:block;padding:0 12px 24px}
    .col{display:none;background:none;padding:0}
    .col.on{display:block}
    .col h3{display:none}
  }
  #dim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
  #dim.on{display:flex}
  @media (min-width:900px){#dim{align-items:center}}
  #sheet{background:#fff;width:min(560px,100%);max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 24px}
  @media (min-width:900px){#sheet{border-radius:18px}}
  #sheet h2{font-size:19px;margin-bottom:4px}
  #sheet .sub{font-size:13px;color:var(--grey);margin-bottom:12px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:7px 10px;font-size:14px;margin:10px 0}
  .kv dt{color:var(--grey)}
  .steps{display:flex;gap:4px;margin:12px 0}
  .steps span{flex:1;height:6px;border-radius:99px;background:var(--line)}
  .steps span.on{background:var(--red)}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:900;font-size:16px;margin-top:10px}
  .btn.g{background:var(--ink)} .btn.w{background:#f1ede6;color:var(--ink)}
  .row2{display:flex;gap:8px} .row2 .btn{flex:1}
  label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}
  label em{color:var(--red);font-style:normal}
  input.f,textarea.f,select.f{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  textarea.f{min-height:80px;resize:vertical}
  .msg{margin-top:10px;font-size:14px;font-weight:700}
  .msg.bad{color:#b3261e} .msg.ok{color:var(--ok)}
  #login{max-width:380px;margin:12vh auto;background:#fff;border-radius:18px;padding:24px;text-align:center}
  #login h1{font-size:20px;margin-bottom:6px}
  #login p{font-size:13px;color:var(--grey);margin-bottom:14px}
  #login input{text-align:center;letter-spacing:.3em;font-size:24px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;z-index:40}
  #toast.on{opacity:1}
  #load{text-align:center;color:var(--grey);padding:30px;font-size:14px}
</style>
</head>
<body>
<div id="login" style="display:none">
  <h1>베이프렌드 AS</h1>
  <p>지점 매장 코드 6자리를 넣어 주세요.<br>이 기기에 기억돼서 다음부터는 안 물어봐요.</p>
  <input class="f" id="pin" inputmode="numeric" maxlength="6" autocomplete="off">
  <button class="btn" id="pinBtn">들어가기</button>
  <div class="msg" id="pinMsg"></div>
</div>
<div id="app" style="display:none">
  <header>
    <b>AS</b><span class="br" id="brName"></span>
    <span class="sp"></span>
    <input id="q" placeholder="이름 · 번호 뒷자리 · 기기 검색">
    <button class="add" id="addBtn">+ AS 접수</button>
    <button class="lk" id="allBtn">완료 포함</button>
    <button class="lk" id="outBtn">나가기</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="load">불러오는 중…</div>
  <div id="board"></div>
</div>
<div id="dim"><div id="sheet"></div></div>
<div id="toast"></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbwUuHXfCaIC6kHv6ACAduoXgbH5cAUE1Pcizb0F-dR3v7Qj9bsu6xpMpirLDlLp1BEIVg/exec";
const ST = ["AS 접수", "본점 수취 및 발송대기", "AS 발송완료", "AS완료 및 고객연락", "고객 전달 완료"];
const SHORT = ["접수", "본점 도착", "업체 발송", "고객 연락", "전달 완료"];
const BR = ["동성로", "수성", "본점", "율하", "반월당", "상인", "광장코아", "현풍"];
const RESULT = ["수리", "교환", "불가", "유상(고객 과실)", "보류"];
// 칸 번호(AS 목록 시트와 같은 순서)
const C = { no: 0, date: 1, br: 2, by: 3, name: 4, phone: 5, dev: 6, bought: 7, warr: 8, sym: 9, st: 10, loan: 11, hqIn: 12, vendor: 13, sent: 14, track: 15, result: 16, called: 17, caller: 18, done: 19, days: 20, memo: 21 };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800); };
let PIN = store.get("vf-as-pin"), ME = { branch: "", hq: false }, ROWS = [], showAll = false, tab = 0;

async function api(body) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify({ pin: PIN, ...body }) }); // text/plain 이라 구글 서버에 바로 감
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "실패");
  return j;
}
async function start() {
  if (!PIN) return showLogin();
  try { const w = await api({ action: "asWho" }); ME = w; $("brName").textContent = w.hq ? "본점 · 전 지점" : w.branch; $("login").style.display = "none"; $("app").style.display = ""; load(); }
  catch (e) { store.del("vf-as-pin"); PIN = null; showLogin(e.message); }
}
function showLogin(msg) { $("app").style.display = "none"; $("login").style.display = ""; $("pinMsg").textContent = msg || ""; $("pinMsg").className = "msg bad"; $("pin").focus(); }
$("pinBtn").onclick = async () => { const v = $("pin").value.replace(/\D/g, ""); if (v.length !== 6) return showLogin("6자리를 넣어 주세요"); PIN = v; store.set("vf-as-pin", v); start(); };
$("pin").onkeydown = (e) => { if (e.key === "Enter") $("pinBtn").click(); };
$("outBtn").onclick = () => { if (confirm("이 기기에서 매장 코드를 지울까요?")) { store.del("vf-as-pin"); PIN = null; showLogin(); } };
$("allBtn").onclick = () => { showAll = !showAll; $("allBtn").textContent = showAll ? "진행 중만" : "완료 포함"; load(); };

async function load() {
  $("load").style.display = "";
  try { const j = await api({ action: "asList", all: showAll }); ROWS = j.rows; render(); }
  catch (e) { $("load").textContent = "불러오지 못했어요: " + e.message; return; }
  $("load").style.display = "none";
}
const stIdx = (s) => Math.max(0, ST.indexOf(s));
function render() {
  const q = $("q").value.trim().toLowerCase();
  const list = ROWS.filter((x) => !q || [x.r[C.name], x.r[C.phone], x.r[C.dev], x.r[C.no]].join(" ").toLowerCase().includes(q));
  const by = ST.map(() => []); list.forEach((x) => by[stIdx(x.r[C.st])].push(x));
  by.forEach((l) => l.sort((a, b) => (+b.r[C.days] || 0) - (+a.r[C.days] || 0)));
  $("tabs").innerHTML = SHORT.map((s, i) => `<button class="${i === tab ? "on" : ""}" data-t="${i}">${s}<i>${by[i].length}</i></button>`).join("");
  $("board").innerHTML = ST.map((s, i) => `<div class="col ${i === tab ? "on" : ""}"><h3>${SHORT[i]} <span>${by[i].length}</span></h3>${by[i].length ? by[i].map(card).join("") : '<div class="empty">없음</div>'}</div>`).join("");
}
function card(x) {
  const r = x.r, late = r[C.st] !== ST[4] && +r[C.days] > 7;
  return `<div class="card ${late ? "late" : ""}" data-row="${x.row}"><b>${esc(r[C.name] || "(이름 없음)")}</b><div class="d">${esc(r[C.dev] || "")}${r[C.sym] ? " · " + esc(r[C.sym]).slice(0, 30) : ""}</div>
    <div class="m">${ME.hq ? `<span>${esc(r[C.br] || "지점?")}</span>` : ""}<span>${esc(r[C.date])}</span><span class="${late ? "lt" : ""}">${r[C.days] ? r[C.days] + "일째" : ""}</span>${r[C.loan] ? "<span>대여중</span>" : ""}</div></div>`;
}
$("q").oninput = render;
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-t]"); if (t) { tab = +t.dataset.t; render(); return; }
  const c = e.target.closest(".card"); if (c) return detail(+c.dataset.row);
  if (e.target.id === "dim") closeSheet();
});
const closeSheet = () => $("dim").classList.remove("on");
const open = (html) => { $("sheet").innerHTML = html; $("dim").classList.add("on"); $("sheet").scrollTop = 0; };

function detail(row) {
  const x = ROWS.find((y) => y.row === row); if (!x) return; const r = x.r, i = stIdx(r[C.st]);
  const kv = [["접수번호", r[C.no]], ["접수일", r[C.date]], ["지점", r[C.br]], ["접수자", r[C.by]], ["연락처", r[C.phone]], ["기기", r[C.dev]], ["구매일", r[C.bought] ? r[C.bought] + " · " + r[C.warr] : ""], ["증상", r[C.sym]], ["대여기기", r[C.loan]], ["업체", [r[C.vendor], r[C.sent], r[C.track]].filter(Boolean).join(" · ")], ["처리 결과", r[C.result]], ["고객 연락", [r[C.called], r[C.caller]].filter(Boolean).join(" · ")], ["비고", r[C.memo]]].filter((p) => p[1]);
  const can = ME.hq || i >= 3; // 지점은 고객 연락·전달 단계만, 본점은 전부
  let next = "";
  if (i < 4 && can) {
    if (i === 1) next = `<label>업체</label><input class="f" id="fVendor" value="${esc(r[C.vendor])}"><label>송장번호</label><input class="f" id="fTrack" value="${esc(r[C.track])}">`;
    if (i === 2) next = `<label>처리 결과</label><select class="f" id="fResult">${RESULT.map((v) => `<option ${v === r[C.result] ? "selected" : ""}>${v}</option>`).join("")}</select>`;
    next += `<button class="btn" id="nextBtn">${["본점에 도착했어요", "업체로 보냈어요", "결과 받고 고객에게 연락했어요", "고객에게 전달했어요"][i]}</button>`;
  } else if (i < 4) next = `<div class="msg">다음 단계(${SHORT[i + 1]})는 본점에서 처리해요.</div>`;
  const sms = r[C.phone] ? `<a class="btn w" style="text-align:center;text-decoration:none" href="sms:${esc(r[C.phone].replace(/[^0-9]/g, ""))}?body=${encodeURIComponent(`[베이프렌드 ${r[C.br] || ""}] ${r[C.name] || "고객"}님, 맡기신 ${r[C.dev] || "기기"} AS가 완료되어 매장에서 찾아가실 수 있어요.`)}">고객에게 문자 보내기</a>` : "";
  open(`<h2>${esc(r[C.name] || "(이름 없음)")}</h2><div class="sub">${esc(r[C.st] || "상태 없음")}${+r[C.days] > 7 && i < 4 ? ` · <b style="color:var(--red)">${r[C.days]}일째</b>` : ""}</div>
    <div class="steps">${ST.map((s, k) => `<span class="${k <= i ? "on" : ""}"></span>`).join("")}</div>
    <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${next}${sms}<button class="btn w" onclick="closeSheet()">닫기</button>`);
  const nb = $("nextBtn"); if (nb) nb.onclick = async () => {
    const set = { "상태": ST[i + 1] };
    if (i === 1) { set["업체"] = $("fVendor").value.trim(); set["송장번호"] = $("fTrack").value.trim(); }
    if (i === 2) { set["처리 결과"] = $("fResult").value; set["연락 담당자"] = myName(); }
    nb.disabled = true; nb.textContent = "저장 중…";
    try { await api({ action: "asUpdate", row, set }); toast("저장했어요"); closeSheet(); load(); } catch (e) { nb.disabled = false; nb.textContent = "다시 시도"; toast(e.message); }
  };
}
function myName() { let n = store.get("vf-as-name"); if (!n) { n = (prompt("이름을 넣어 주세요(접수자·담당자로 남아요)") || "").trim(); if (n) store.set("vf-as-name", n); } return n || ""; }
$("addBtn").onclick = () => {
  open(`<h2>AS 접수</h2><div class="sub">${ME.hq ? "지점을 골라 주세요" : esc(ME.branch) + " 접수"}</div>
    ${ME.hq ? `<label>지점 <em>*</em></label><select class="f" id="aBr">${BR.map((b) => `<option ${b === "본점" ? "selected" : ""}>${b}</option>`).join("")}</select>` : ""}
    <label>고객 성함 <em>*</em></label><input class="f" id="aName">
    <label>연락처 <em>*</em></label><input class="f" id="aPhone" inputmode="tel" placeholder="010-0000-0000">
    <label>기기 <em>*</em></label><input class="f" id="aDev" placeholder="예: 하복2 블랙">
    <label>구매일</label><input class="f" id="aBought" type="date">
    <label>증상 <em>*</em></label><textarea class="f" id="aSym" placeholder="예: 오토 베이핑, 충전 안 됨"></textarea>
    <label>대여기기</label><input class="f" id="aLoan" placeholder="빌려준 기기가 있으면">
    <label>비고</label><input class="f" id="aMemo">
    <div class="row2"><button class="btn w" onclick="closeSheet()">취소</button><button class="btn" id="aSave">접수하기</button></div><div class="msg" id="aMsg"></div>`);
  $("aSave").onclick = async () => {
    const v = (id) => ($(id) ? $(id).value.trim() : "");
    if (!v("aName") || !v("aPhone") || !v("aDev") || !v("aSym")) { $("aMsg").className = "msg bad"; $("aMsg").textContent = "* 표시 칸을 채워 주세요"; return; }
    const by = myName(); const b = $("aSave"); b.disabled = true; b.textContent = "접수 중…";
    try { const j = await api({ action: "asAdd", branch: v("aBr") || ME.branch, by, name: v("aName"), phone: v("aPhone"), device: v("aDev"), bought: v("aBought"), symptom: v("aSym"), loan: v("aLoan"), memo: v("aMemo") }); toast(`접수했어요 · ${j.no}`); closeSheet(); tab = 0; load(); }
    catch (e) { b.disabled = false; b.textContent = "다시 시도"; $("aMsg").className = "msg bad"; $("aMsg").textContent = e.message; }
  };
};
start();
</script>
</body>
</html>
