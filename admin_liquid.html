<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>베이프렌드 액상 관리자</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f8;color:#1a1a1a}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
.hd{padding:14px 16px;background:#2e3a8c;color:#fff;position:sticky;top:0;z-index:10}
.hd h1{font-size:16px;font-weight:700}
.hd p{font-size:11px;opacity:.8;margin-top:2px}
.tabs{display:flex;border-bottom:1px solid #eee}
.tab{flex:1;text-align:center;padding:12px 0;font-size:13px;font-weight:600;color:#aaa;cursor:pointer;border-bottom:2px solid transparent}
.tab.ac{color:#2e3a8c;border-bottom-color:#2e3a8c}
.sec{display:none;padding:14px 16px 40px}
.sec.ac{display:block}
.row{margin-bottom:12px}
.row label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:5px}
.row input,.row select{width:100%;padding:10px 12px;font-size:14px;border-radius:10px;border:1.5px solid #e8e8e8;background:#f8f8f8;outline:none;font-family:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:20px;border:1.5px solid #e8e8e8;background:#fff;font-size:13px;cursor:pointer;color:#666}
.chip.ac{background:#2e3a8c;border-color:#2e3a8c;color:#fff}
.btnrow{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:10px;cursor:pointer}
.btn.save{background:#2e3a8c;color:#fff}
.btn.del{background:#fff;color:#c62828;border:1.5px solid #c62828}
.list{padding:8px 16px 40px}
.item{background:#fff;border:1.5px solid #eee;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.item:active{background:#f8f8f8}
.item .n{font-size:14px;font-weight:700}
.item .meta{font-size:11px;color:#999;margin-top:2px}
.item .arrow{color:#ccc}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:#aaa;font-size:13px;padding:40px 0}
.search{padding:10px 16px 0}
.search input{width:100%;padding:10px 12px;font-size:14px;border-radius:10px;border:1.5px solid #e8e8e8;background:#f8f8f8;outline:none}
.hint{font-size:11.5px;margin-top:6px;line-height:1.5;color:#888;min-height:16px}
.hint.warn{color:#b05a00}
.hint.new{color:#1a7a40}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <h1>⚙️ 베이프렌드 액상 관리자</h1>
    <p>빈칸을 채우면 사이트에 바로 반영돼요</p>
  </div>
  <div class="tabs">
    <div class="tab ac" id="t0">목록</div>
    <div class="tab" id="t1">새로 추가</div>
  </div>

  <div class="sec ac" id="s0">
    <div class="search"><input id="q" placeholder="액상명 · 브랜드 · 도매처 · 위치 검색"></div>
    <div class="list" id="list"><div class="empty">불러오는 중...</div></div>
  </div>

  <div class="sec" id="s1">
    <div class="row"><label>액상명 *</label><input id="f_n" placeholder="예: 제로닉 거봉"></div>
    <div class="row"><label>도매처</label>
      <input id="f_b" list="brandList" autocomplete="off" placeholder="예: 엔바이오랩">
      <datalist id="brandList"></datalist>
      <div class="hint" id="b_hint"></div>
    </div>
    <div class="row"><label>브랜드</label>
      <input id="f_brand" list="brandList2" autocomplete="off" placeholder="예: 무무">
      <datalist id="brandList2"></datalist>
      <div class="hint" id="brand_hint"></div>
    </div>
    <div class="row"><label>맛</label><input id="f_f" placeholder="예: 포도"></div>
    <div class="row"><label>창고 위치</label>
      <input id="f_loc" list="locList" autocomplete="off" placeholder="예: R-6-2">
      <datalist id="locList"></datalist>
      <div class="hint" id="loc_hint">여러 곳이면 R-7-5|B-4-2~5 처럼 세로줄로 구분 · 비우면 위치 미등록</div>
    </div>
    <div class="row"><label>사진 파일명</label>
      <input id="f_img" autocomplete="off" placeholder="예: p368.jpg">
      <div class="hint" id="img_hint"></div>
    </div>
    <div class="row"><label>라인</label>
      <div class="chips" id="cChips">
        <div class="chip" data-v="프리미엄 라인">프리미엄 라인</div>
        <div class="chip" data-v="프라임 라인">프라임 라인</div>
      </div>
    </div>
    <div class="row"><label>종류 (복수 선택 가능)</label>
      <div class="chips" id="tChips">
        <div class="chip" data-v="일반">일반</div>
        <div class="chip" data-v="노멘솔">노멘솔</div>
        <div class="chip" data-v="무니코틴">무니코틴</div>
      </div>
    </div>
    <div class="btnrow">
      <button class="btn save" id="saveBtn">저장</button>
      <button class="btn del" id="delBtn" style="display:none">삭제</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7_3DBk_st-ALx7rKQw3A19C79PH3ZOmHyehJNXPaateeL5vdtJTuKW9JAIvBbo-A/exec";
var DATA = [];
var editId = null;
var selC = "";
var selT = [];

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(function(){ t.className = 'toast'; }, 2000);
}

function showTab(n){
  document.getElementById('t0').className = 'tab' + (n===0?' ac':'');
  document.getElementById('t1').className = 'tab' + (n===1?' ac':'');
  document.getElementById('s0').className = 'sec' + (n===0?' ac':'');
  document.getElementById('s1').className = 'sec' + (n===1?' ac':'');
}
document.getElementById('t0').addEventListener('click', function(){ showTab(0); });
document.getElementById('t1').addEventListener('click', function(){ clearForm(); showTab(1); });

document.getElementById('cChips').addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if(!chip) return;
  selC = chip.getAttribute('data-v');
  Array.prototype.forEach.call(document.querySelectorAll('#cChips .chip'), function(c){
    c.className = 'chip' + (c.getAttribute('data-v')===selC ? ' ac' : '');
  });
});
document.getElementById('tChips').addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if(!chip) return;
  var v = chip.getAttribute('data-v');
  var idx = selT.indexOf(v);
  if(idx >= 0) selT.splice(idx, 1); else selT.push(v);
  Array.prototype.forEach.call(document.querySelectorAll('#tChips .chip'), function(c){
    c.className = 'chip' + (selT.indexOf(c.getAttribute('data-v'))>=0 ? ' ac' : '');
  });
});


/* ═══ 브랜드 추천 목록 (입력은 자유, 방해하지 않음) ═══ */
function normBrand(s){
  return String(s||'').toLowerCase().replace(/[\s\-_.]/g,'');
}
function fieldCounts(key){
  var m = {};
  for(var i=0;i<DATA.length;i++){
    var b = (DATA[i][key]||'').trim();
    if(b) m[b] = (m[b]||0) + 1;
  }
  return m;
}
function brandCounts(){ return fieldCounts('b'); }
function fillDatalist(elId, key){
  var counts = fieldCounts(key);
  var names = Object.keys(counts).sort(function(a,b){ return a.localeCompare(b,'ko'); });
  var h = '';
  for(var i=0;i<names.length;i++){
    h += '<option value="' + String(names[i]).replace(/"/g,'&quot;') + '">' + counts[names[i]] + '종</option>';
  }
  document.getElementById(elId).innerHTML = h;
}
/* 다음 사진 번호 자동 제안 */
function nextImgName(){
  var mx = 0;
  for(var i=0;i<DATA.length;i++){
    var m = /^p(\d+)\.jpg$/i.exec((DATA[i].img||'').trim());
    if(m && +m[1] > mx) mx = +m[1];
  }
  return 'p' + String(mx+1).padStart(3,'0') + '.jpg';
}
function checkField(inputId, hintId, key, labelTxt){
  var v = document.getElementById(inputId).value.trim();
  var hint = document.getElementById(hintId);
  if(!v){ hint.className = 'hint'; hint.textContent = ''; return; }
  var counts = fieldCounts(key);
  var names = Object.keys(counts);
  if(counts[v]){ hint.className='hint'; hint.textContent='기존 '+labelTxt+' · 현재 '+counts[v]+'종'; return; }
  for(var i=0;i<names.length;i++){
    if(normBrand(names[i]) === normBrand(v)){
      hint.className='hint warn';
      hint.textContent='"'+names[i]+'" 와 거의 같아요. 같은 '+labelTxt+'라면 "'+names[i]+'" 로 맞춰주세요.';
      return;
    }
  }
  hint.className='hint new';
  hint.textContent='새 '+labelTxt+'로 추가됩니다.';
}
function buildBrandList(){
  var counts = brandCounts();
  var names = Object.keys(counts).sort(function(a,b){ return a.localeCompare(b,'ko'); });
  var h = '';
  for(var i=0;i<names.length;i++){
    h += '<option value="' + String(names[i]).replace(/"/g,'&quot;') + '">' + counts[names[i]] + '종</option>';
  }
  document.getElementById('brandList').innerHTML = h;
}
/* 저장을 막지는 않고, 아래에 안내 문구만 보여줍니다 */
function checkBrand(){
  var v = document.getElementById('f_b').value.trim();
  var hint = document.getElementById('b_hint');
  if(!v){ hint.className = 'hint'; hint.textContent = ''; return; }
  var counts = brandCounts();
  var names = Object.keys(counts);
  if(counts[v]){
    hint.className = 'hint';
    hint.textContent = '기존 브랜드 · 현재 ' + counts[v] + '종';
    return;
  }
  for(var i=0;i<names.length;i++){
    if(normBrand(names[i]) === normBrand(v)){
      hint.className = 'hint warn';
      hint.textContent = '"' + names[i] + '" 와 거의 같아요. 같은 브랜드라면 "' + names[i] + '" 로 맞춰주세요.';
      return;
    }
  }
  hint.className = 'hint new';
  hint.textContent = '새 브랜드로 추가됩니다.';
}
document.getElementById('f_b').addEventListener('input', checkBrand);
document.getElementById('f_brand').addEventListener('input', function(){ checkField('f_brand','brand_hint','brand','브랜드'); });
document.getElementById('f_loc').addEventListener('input', function(){ checkField('f_loc','loc_hint','loc','위치'); });

function clearForm(){
  editId = null;
  document.getElementById('f_n').value = '';
  document.getElementById('f_b').value = '';
  document.getElementById('f_brand').value = '';
  document.getElementById('f_f').value = '';
  document.getElementById('f_loc').value = '';
  document.getElementById('f_img').value = nextImgName();
  document.getElementById('brand_hint').textContent = '';
  document.getElementById('loc_hint').className = 'hint';
  document.getElementById('loc_hint').textContent = '여러 곳이면 R-7-5|B-4-2~5 처럼 세로줄로 구분 · 비우면 위치 미등록';
  document.getElementById('img_hint').textContent = '새 제품이면 이대로 두세요';
  checkBrand();
  selC = ''; selT = [];
  Array.prototype.forEach.call(document.querySelectorAll('#cChips .chip, #tChips .chip'), function(c){ c.className = 'chip'; });
  document.getElementById('delBtn').style.display = 'none';
}

function fillForm(d){
  editId = d.id;
  document.getElementById('f_n').value = d.n || '';
  document.getElementById('f_b').value = d.b || '';
  document.getElementById('f_brand').value = d.brand || '';
  checkBrand();
  checkField('f_brand','brand_hint','brand','브랜드');
  document.getElementById('f_f').value = d.f || '';
  document.getElementById('f_loc').value = d.loc || '';
  checkField('f_loc','loc_hint','loc','위치');
  document.getElementById('f_img').value = d.img || '';
  document.getElementById('img_hint').textContent = '';
  selC = d.c || '';
  selT = (d.t || '').split(',').filter(Boolean);
  Array.prototype.forEach.call(document.querySelectorAll('#cChips .chip'), function(c){
    c.className = 'chip' + (c.getAttribute('data-v')===selC ? ' ac' : '');
  });
  Array.prototype.forEach.call(document.querySelectorAll('#tChips .chip'), function(c){
    c.className = 'chip' + (selT.indexOf(c.getAttribute('data-v'))>=0 ? ' ac' : '');
  });
  document.getElementById('delBtn').style.display = 'block';
  showTab(1);
}

function renderList(){
  var q = document.getElementById('q').value.toLowerCase();
  var box = document.getElementById('list');
  var filtered = DATA.filter(function(d){
    return !q || (d.n||'').toLowerCase().indexOf(q) >= 0 || (d.b||'').toLowerCase().indexOf(q) >= 0
             || (d.brand||'').toLowerCase().indexOf(q) >= 0 || (d.loc||'').toLowerCase().indexOf(q) >= 0;
  });
  if(!filtered.length){ box.innerHTML = '<div class="empty">액상이 없어요</div>'; return; }
  var h = '';
  for(var i=0;i<filtered.length;i++){
    var d = filtered[i];
    h += '<div class="item" data-id="'+d.id+'"><div><div class="n">'+d.n+'</div><div class="meta">'+(d.b||'')+' · '+(d.c||'')+' · '+(d.t||'')+'</div></div><div class="arrow">›</div></div>';
  }
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('.item'), function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-id');
      var d = DATA.find(function(x){ return x.id === id; });
      if(d) fillForm(d);
    });
  });
}
document.getElementById('q').addEventListener('input', renderList);

async function loadData(){
  try{
    var res = await fetch(SCRIPT_URL + '?sheet=liquid');
    DATA = await res.json();
    renderList();
    buildBrandList();
    fillDatalist('brandList2','brand');
    fillDatalist('locList','loc');
    checkBrand();
  }catch(e){
    document.getElementById('list').innerHTML = '<div class="empty">불러오기 실패. 새로고침 해보세요.</div>';
  }
}
loadData();

document.getElementById('saveBtn').addEventListener('click', async function(){
  var n = document.getElementById('f_n').value.trim();
  if(!n){ toast('액상명을 입력해주세요'); return; }
  var item = {
    id: editId || ('liq_' + Date.now()),
    n: n,
    b: document.getElementById('f_b').value.trim(),
    brand: document.getElementById('f_brand').value.trim(),
    f: document.getElementById('f_f').value.trim(),
    loc: document.getElementById('f_loc').value.trim(),
    img: document.getElementById('f_img').value.trim(),
    c: selC,
    t: selT.join(',')
  };
  this.disabled = true;
  this.textContent = '저장 중...';
  try{
    var res = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({action:'save', sheet:'liquid', item:item}) });
    var json = await res.json();
    if(json.ok){
      toast('저장됐어요!');
      await loadData();
      showTab(0);
    } else {
      toast('저장 실패했어요');
    }
  }catch(e){
    toast('오류: ' + e.message);
  }
  this.disabled = false;
  this.textContent = '저장';
});

document.getElementById('delBtn').addEventListener('click', async function(){
  if(!editId) return;
  if(!confirm('정말 삭제하시겠어요?')) return;
  this.disabled = true;
  try{
    var res = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({action:'delete', sheet:'liquid', id:editId}) });
    var json = await res.json();
    if(json.ok){
      toast('삭제됐어요');
      await loadData();
      showTab(0);
    } else {
      toast('삭제 실패했어요');
    }
  }catch(e){
    toast('오류: ' + e.message);
  }
  this.disabled = false;
});



function getGitHubToken(){
  var token = localStorage.getItem('vafe_gh_token');
  if(!token){
    token = prompt('GitHub 토큰을 입력해주세요 (최초 1회만):');
    if(token) localStorage.setItem('vafe_gh_token', token);
  }
  return token;
}

async function uploadImageToGitHub(file) {
  var status = document.getElementById('imgStatus');
  status.textContent = '업로드 중...';
  var token = getGitHubToken();
  if(!token){ status.textContent = '토큰이 없어요'; return; }
  try {
    var base64 = await new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    var filename = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    var url = 'https://api.github.com/repos/officialvafriend/vape/contents/' + filename;
    var res = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: '이미지 업로드: ' + filename,
        content: base64
      })
    });
    var json = await res.json();
    if(json.content && json.content.download_url){
      document.getElementById('f_img').value = json.content.download_url;
      document.getElementById('imgPreview').src = json.content.download_url;
      document.getElementById('imgPreviewWrap').style.display = 'block';
      status.textContent = '업로드 완료!';
    } else {
      if(json.message && json.message.includes('Bad credentials')){
        localStorage.removeItem('vafe_gh_token');
        status.textContent = '토큰 오류 — 다시 시도해주세요';
      } else {
        status.textContent = '업로드 실패: ' + (json.message || '알 수 없는 오류');
      }
    }
  } catch(err) {
    status.textContent = '오류: ' + err.message;
  }
}

</script>
</body>
</html>
