<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EEF0F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>베이프렌드 네이버</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#EEF0F3;--card:#fff;--ink:#111;--ink2:#4e5968;--sub:#8B95A1;--faint:#C4C9CF;--line:#ECEEF1;--navy:#3B4A6B;--navy2:#8A97B5;--navy3:#C3CBDB;--red:#F04452;--amber:#F5B400;--green:#03B26C}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  /* 틀: 왼쪽 메뉴 240 + 본문 */
  .shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px 16px;gap:2px}
  .logo{font-size:17px;font-weight:700;padding:4px 12px 22px;letter-spacing:-.2px}
  .logo small{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-top:2px}
  .tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--red);vertical-align:2px}
  .nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink2)}
  .nav:hover{background:rgba(255,255,255,.6)}
  .nav.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .nav .no{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
  .nav-h{font-size:12px;color:var(--sub);font-weight:600;padding:16px 12px 6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .dot.red{background:var(--red)} .dot.amber{background:var(--amber)}
  .side .bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:16px}
  .side .bottom .nav{font-size:14px;color:var(--sub)}
  .side .bottom .nav.rec{background:var(--navy);color:#fff;font-weight:600;justify-content:center;margin-bottom:8px}

  .main{padding:0 40px 40px;max-width:1200px;width:100%}
  .head{height:64px;display:flex;align-items:center;gap:12px;margin-top:16px}
  .head h1{font-size:24px;font-weight:600;letter-spacing:-.4px}
  .head h1 small{font-size:15px;color:var(--sub);font-weight:500;margin-left:6px}
  .head .when{margin-left:auto;color:var(--sub);font-size:13px}

  .card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .ct{font-size:14px;font-weight:500;color:var(--sub);display:flex;align-items:center;gap:8px}
  .ct small{margin-left:auto;font-size:13px;color:var(--faint)}

  /* 숫자 카드 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
  .stats.three{grid-template-columns:repeat(3,1fr)}
  .stat{height:128px;display:flex;flex-direction:column;justify-content:space-between}
  .stat .big{font-size:40px;font-weight:300;letter-spacing:-1px;line-height:1}
  .stat .big em{font-style:normal;font-size:16px;font-weight:500;color:var(--sub);margin-left:4px;letter-spacing:0}
  .stat .sub{font-size:13px;color:var(--sub)}
  .stat .sub b{font-weight:600} .dn{color:var(--red)} .upc{color:var(--green)}

  /* 큰 그래프 */
  .chartc{height:320px;display:flex;flex-direction:column;margin-bottom:16px}
  .chartc .ct{margin-bottom:4px}
  .chartc .cs{font-size:13px;color:var(--faint);margin-bottom:8px}
  .chartc .area{flex:1;min-height:0;position:relative}
  .chartc svg{width:100%;height:100%;display:block}
  .legend{display:flex;gap:14px;font-size:13px;color:var(--ink2)}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .note{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px;text-align:center;line-height:1.6}

  /* 아래 6:4 */
  .split{display:grid;grid-template-columns:6fr 4fr;gap:16px;align-items:start}
  .split>*{min-width:0}
  .list{margin-top:10px}
  .li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
  .li:first-child{border-top:0}
  .li b{font-weight:600;min-width:64px}
  .li .k{color:var(--sub);font-size:13px;margin-left:auto;text-align:right}
  .li .v{font-variant-numeric:tabular-nums}
  .empty{color:var(--sub);font-size:14px;padding:14px 0 4px;line-height:1.6}
  .todo i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;font-style:normal;color:#fff;font-size:13px}
  .todo.done i{background:var(--navy);border-color:var(--navy)} .todo.done span.t{color:var(--sub);text-decoration:line-through}
  .todo.skip i{background:var(--faint);border-color:var(--faint)}
  .todo span.t{flex:1} .todo small{display:block;font-size:13px;color:var(--sub);margin-top:2px}

  /* 키워드 목록 (막대 30칸) */
  .kw{padding:14px 0;border-top:1px solid var(--line)}
  .kw:first-of-type{border-top:0}
  .kw .r1{display:flex;align-items:baseline;gap:10px;font-size:15px}
  .kw .r1 b{font-weight:600}
  .kw .r1 span{margin-left:auto;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .seg{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:8px}
  .seg i{height:8px;border-radius:2px;background:#E5E8EB}
  .seg i.on{background:var(--ink)}
  .kw .r2{font-size:13px;color:var(--sub);margin-top:6px}

  .chg{padding:14px 0;border-top:1px solid var(--line)}
  .chg:first-of-type{border-top:0}
  .chg .t{display:flex;align-items:center;gap:8px;font-size:15px}
  .chg .t em{font-style:normal;font-size:12px;font-weight:600;color:var(--navy);background:#E9ECF3;border-radius:6px;padding:2px 7px}
  .chg .t button{margin-left:auto;font-size:12px;color:var(--faint)}
  .chg p{font-size:14px;color:var(--ink2);margin-top:4px}
  .eff{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.7}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
  th{font-size:12px;color:var(--sub);font-weight:500;text-align:right;padding:6px 4px}
  th:first-child,td:first-child{text-align:left}
  td{padding:10px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  td small{display:block;font-size:12px;color:var(--sub)}
  .mask{filter:blur(6px)}
  .scroll{overflow-x:auto}

  /* 아래에서 올라오는 창 */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:50}
  .dim.on{display:flex}
  .sheet{background:#fff;width:min(560px,94vw);border-radius:20px;padding:28px 24px 24px;max-height:90vh;overflow:auto}
  .sheet h2{font-size:20px;font-weight:600} .sheet .desc{color:var(--sub);margin-top:6px;font-size:14px;line-height:1.5}
  .lbl{font-size:13px;font-weight:600;color:var(--ink2);margin-top:18px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{padding:9px 13px;border-radius:10px;background:#F2F4F6;font-weight:500;font-size:14px}
  .chip.on{background:var(--navy);color:#fff}
  .input{margin-top:8px;width:100%;height:48px;border-radius:12px;border:1px solid #E5E8EB;padding:0 14px;font:inherit;font-size:15px;outline:none;background:#fff}
  textarea.input{height:90px;padding:12px 14px;resize:vertical}
  .input:focus{border-color:var(--navy)}
  .btns{display:flex;gap:8px;margin-top:22px}
  .btn{flex:1;height:50px;border-radius:12px;font-weight:600;font-size:15px;background:#F2F4F6}
  .btn.primary{background:var(--navy);color:#fff} .btn:disabled{opacity:.5}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%)}

  /* 폰 */
  @media (max-width:900px){
    .shell{display:block}
    .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:6px;background:var(--bg)}
    .logo{padding:0 8px 0 4px;font-size:15px;white-space:nowrap}
    .logo small,.nav-h,.nav .no,.side .bottom{display:none}
    .nav{width:auto;white-space:nowrap;padding:8px 12px;font-size:14px}
    .main{padding:0 16px 32px}
    .head{height:52px;margin-top:4px}
    .head h1{font-size:20px}
    .stats{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .stats.three{grid-template-columns:1fr 1fr 1fr}
    .stat{height:auto;gap:14px;padding:18px}
    .stat .big{font-size:32px}
    .card{padding:18px}
    .chartc{height:260px;margin-bottom:10px}
    .split{grid-template-columns:1fr;gap:10px}
    .fab{position:fixed;right:16px;bottom:20px;background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.15);z-index:30}
  }
  @media (min-width:901px){ .fab{display:none} }
  .sech{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink);padding:24px 0 6px}
  .at{color:var(--ink2);font-size:14px}
  .at b.num{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="shell"><nav class="side" id="side"></nav><main class="main" id="main"></main></div>
<button class="fab" onclick="openRecord(VIEW === '개요' ? '' : VIEW)">＋ 바꾼 것 기록</button>
<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const VER = "10.09-9";
const APPS_URL = "https://script.google.com/macros/s/AKfycbyLK49pLpgbSpZ6TT47V8rezYHme0lFk_6dn_4NPvkbPINm0szww9TmuPAellcHv9Ry/exec";
const KIND = ["대표사진", "소개글", "블로그 발행", "리뷰", "트래픽 작업", "가격표, 소식", "키워드", "기타"];
const LINE = ["#3B4A6B", "#8A97B5", "#C3CBDB"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let D = null, R = null, remoteErr = "", VIEW = "개요";
let key = ls.get("vf-naver-key", "");
let hide = ls.get("vf-naver-hide", "0") === "1";

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2200); }
const md = (d) => { const [, m, dd] = d.split("-"); return `${+m}/${+dd}`; };
const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const today = () => { const x = new Date(); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };

// ── 날짜 ──
let DATES = [], LAST = "", PREV = "";
function setDates() {
  DATES = [...new Set([...D.place, ...D.blog, ...D.web].map((r) => r.d))].sort();
  LAST = DATES[DATES.length - 1] || "";
  PREV = DATES.filter((d) => d < LAST).pop() || "";
}
const onOrBefore = (d) => DATES.filter((x) => x <= d).pop() || "";

// ── 값 ──
const pRank = (b, k, d) => { const r = D.place.find((x) => x.b === b && x.k === k && x.d === d); return r ? r.r : null; };
const bCnt = (b, k, d) => { const r = D.blog.find((x) => x.b === b && x.k === k && x.d === d); return r ? r.n : null; };
const wRank = (k, d) => { const r = D.web.find((x) => x.k === k && x.d === d); return r ? r.r : null; };
const rk = (r) => (r == null ? "-" : r >= 101 ? "밖" : r + "위");
const n11 = (r) => (r >= 101 ? 11 : r);
const best = (arr) => { const v = arr.filter((x) => x != null); return v.length ? Math.min(...v) : null; };
// 순위 변화 표시 (숫자 작아지면 좋아짐)
function dRank(now, before) {
  if (now == null || before == null) return "";
  const d = n11(before) - n11(now);
  return d > 0 ? `<b class="upc">▲${d}</b> 어제보다` : d < 0 ? `<b class="dn">▼${-d}</b> 어제보다` : "어제와 같음";
}
function dCnt(now, before) {
  if (now == null || before == null) return "";
  const d = now - before;
  return d > 0 ? `<b class="upc">+${d}</b> 어제보다` : d < 0 ? `<b class="dn">${d}</b> 어제보다` : "어제와 같음";
}

// ── 시트(열쇠) ──
async function loadRemote() {
  R = null; remoteErr = "";
  if (!APPS_URL) { remoteErr = "setup"; return; }
  if (!key) { remoteErr = "nokey"; return; }
  try {
    const r = await (await fetch(`${APPS_URL}?k=${encodeURIComponent(key)}&t=${Date.now()}`)).json();
    if (!r.ok) { remoteErr = r.error === "key" ? "badkey" : "fail"; return; }
    R = r;
  } catch { remoteErr = "fail"; }
}
async function post(body) {
  if (!APPS_URL || !key) { toast("열쇠를 먼저 넣어주세요"); return false; }
  try {
    const r = await (await fetch(APPS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ k: key, ...body }) })).json();
    if (!r.ok) { toast(r.error === "key" ? "열쇠가 맞지 않아요" : "저장 실패"); return false; }
    return true;
  } catch { toast("연결 실패, 잠시 후 다시"); return false; }
}
const changes = () => (R ? R.changes.map((x) => ({ row: x.row, date: x.v[1], branch: x.v[2], kind: x.v[3], text: x.v[4] })) : []);
const todos = () => (R ? R.todos.map((x) => ({ row: x.row, week: x.v[0], branch: x.v[1], text: x.v[2], why: x.v[3], status: x.v[4] || "할 일", doneAt: x.v[5] })) : []);
const analysis = () => (R && R.analysis ? R.analysis.map((x) => ({ wk: x.v[0], per: x.v[1], sec: x.v[2], b: x.v[3], t: x.v[4] })) : []);
const lockMsg = () => ({ setup: "시트 연결 준비 중 (Apps Script 배포 후 열림)", nokey: "열쇠를 넣으면 보여요", badkey: "열쇠가 맞지 않아요", fail: "시트를 불러오지 못했어요" }[remoteErr] || "");
function weeklyFor(name) {
  if (!R || !R.weekly || !R.weekly.length) return null;
  const v = R.weekly, hi = v.findIndex((row) => row.some((c) => String(c).includes("지점명")));
  if (hi < 0) return null;
  const H = v[hi].map((c) => String(c).replace(/\s/g, "")), col = (n) => H.findIndex((h) => h.includes(n));
  const C = { wk: col("주차"), per: col("기간"), br: col("지점명"), view: col("플레이스조회수"), call: col("전화"), guest: col("객수"), sales: col("매출") };
  return v.slice(hi + 1).filter((r) => { const n = String(r[C.br] || "").trim(); return n === name || n === name + "점"; }).slice(-5)
    .map((r) => ({ wk: r[C.wk], per: r[C.per], view: r[C.view], call: r[C.call], guest: r[C.guest], sales: r[C.sales] }));
}

// ── 판단 ──
// 신경 쓸 변화: 순위 2칸 이상, 10위 안↔밖, 블로그 3개 이상
function bigDiffs() {
  if (!PREV) return [];
  const out = [];
  const rank = (b, what, k, a, z) => { if (a == null || z == null) return; if (Math.abs(n11(a) - n11(z)) >= 2 || (a >= 101) !== (z >= 101)) out.push({ b, what, k, from: rk(z), to: rk(a), down: n11(a) > n11(z) }); };
  for (const br of D.branches) {
    for (const k of br.place) { rank(br.name, "플레이스", k, pRank(br.name, k, LAST), pRank(br.name, k, PREV)); rank(br.name, "웹노출", k, wRank(k, LAST), wRank(k, PREV)); }
    for (const k of br.blog) { const a = bCnt(br.name, k, LAST), z = bCnt(br.name, k, PREV); if (a != null && z != null && Math.abs(a - z) >= 3) out.push({ b: br.name, what: "블로그", k, from: z + "개", to: a + "개", down: a < z }); }
  }
  return out.sort((a, b) => b.down - a.down);
}
// 평소 순위: 주간통계 시트 지도검색 순위(최근 8주) + 봇 기록(최근 14일)의 가운데 값
// 시트에 같은 키워드가 없으면 그 지점 시트 순위로 대신함 (공통 키워드는 같은 키워드만)
const median = (v) => { const s = v.slice().sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function placeBase(b, k) {
  const W = D.weeklyRank || [];
  const bot = DATES.filter((d) => d < LAST && d >= addDays(LAST, -14)).map((d) => pRank(b, k, d)).filter((v) => v != null).map(n11);
  let src = W.filter((x) => x.b === b && x.k === k).slice(-8).map((x) => n11(x.r));
  if (!src.length && k !== D.common) src = W.filter((x) => x.b === b && x.k !== D.common).slice(-8).map((x) => n11(x.r));
  const vals = [...src, ...bot];
  return vals.length ? Math.round(median(vals)) : null;
}
// 평소보다 떨어짐: 평소보다 2칸 이상 아래, 또는 평소 10위 안인데 오늘 밖
function vsBase(b, k) {
  const r = pRank(b, k, LAST), base = placeBase(b, k);
  if (r == null || base == null) return null;
  const now = n11(r), diff = now - base;
  return { r, base, down: diff >= 2 || (now === 11 && base <= 10), up: diff <= -2 };
}
function baseDowns() {
  const out = [];
  for (const br of D.branches) for (const k of br.place) { const v = vsBase(br.name, k); if (v && v.down) out.push({ b: br.name, k, ...v }); }
  return out;
}
function status(br, big) {
  if (big.some((x) => x.b === br.name && x.down)) return "red";
  return br.place.some((k) => (vsBase(br.name, k) || {}).down) ? "red" : "";
}

// ── 그래프 (13번 Performance 느낌) ──
function chart(series, chs) {
  const days = DATES.slice(-30);
  const W = 1000, H = 230, L = 34, Rt = 8, T = 10, B = 24;
  const x = (i) => (days.length < 2 ? (L + W - Rt) / 2 : L + (i * (W - L - Rt)) / (days.length - 1));
  const y = (r) => T + ((Math.min(r, 11) - 1) * (H - T - B)) / 10;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for (const r of [1, 3, 5, 7, 10]) s += `<line x1="${L}" x2="${W - Rt}" y1="${y(r)}" y2="${y(r)}" stroke="#F1F2F4"/><text x="${L - 8}" y="${y(r) + 4}" font-size="12" fill="#B0B8C1" text-anchor="end">${r}</text>`;
  s += `<text x="${L - 8}" y="${y(11) + 4}" font-size="12" fill="#B0B8C1" text-anchor="end">밖</text>`;
  chs.forEach((c) => { const i = days.findIndex((d) => d >= c.date); if (i < 0) return; s += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}" stroke="#3B4A6B" stroke-dasharray="3 4" opacity=".5"/><text x="${x(i) + 4}" y="${T + 10}" font-size="11" fill="#3B4A6B">${esc(c.kind)}</text>`; });
  series.forEach((ser, si) => {
    const pts = days.map((d, i) => [i, ser.val(d)]).filter(([, v]) => v != null);
    if (!pts.length) return;
    const P = pts.map(([i, v]) => `${x(i)},${y(v)}`).join(" ");
    if (si === 0 && pts.length > 1) s += `<polygon fill="url(#g)" points="${x(pts[0][0])},${H - B} ${P} ${x(pts[pts.length - 1][0])},${H - B}"/>`;
    s += `<polyline fill="none" stroke="${ser.color}" stroke-width="${si ? 2 : 2.5}" stroke-linejoin="round" points="${P}"/>`;
    pts.forEach(([i, v]) => (s += `<circle cx="${x(i)}" cy="${y(v)}" r="${pts.length < 3 ? 4 : 2.5}" fill="${ser.color}"/>`));
  });
  if (days.length) [0, days.length - 1].forEach((i) => (s += `<text x="${x(i)}" y="${H - 4}" font-size="12" fill="#B0B8C1" text-anchor="${days.length < 2 ? "middle" : i ? "end" : "start"}">${md(days[i])}</text>`));
  s += `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B4A6B" stop-opacity=".12"/><stop offset="1" stop-color="#3B4A6B" stop-opacity="0"/></linearGradient></defs>`;
  return s + `</svg>` + (days.length < 2 ? `<div class="note" style="pointer-events:none;top:auto;bottom:40px;inset-inline:0">${md(LAST)} 하루치라 점 하나뿐이에요. 매일 9시마다 선이 이어집니다.</div>` : "");
}

// ── 개요 ──

  const avg = (d) => { const v = allPlace.map(([b, k]) => pRank(b, k, d)).filter((r) => r != null).map(n11); return v.length ? v.reduce((a, c) => a + c, 0) / v.length : null; };

// ── 지점 ──
function effect(br, c) {
  const base = onOrBefore(c.date);
  if (!base) {
    // 봇 기록 전 변경은 주간통계 시트의 주차별 지도검색 순위로 비교
    const W = (D.weeklyRank || []).filter((x) => x.b === br.name && x.k !== D.common).map((x) => {
      const m = (x.per || "").match(/(\d+)\/(\d+)\s*~\s*(\d+)\/(\d+)/); if (!m) return null;
      const p = (a, b) => `2026-${String(a).padStart(2, "0")}-${String(b).padStart(2, "0")}`;
      return { s: p(m[1], m[2]), e: p(m[3], m[4]), k: x.k, r: x.r };
    }).filter(Boolean);
    if (!W.length) return "기록 전 변경이라 비교할 순위가 없어요";
    const before = W.filter((w) => w.e < c.date).pop(), after = W.filter((w) => w.s >= c.date).slice(0, 3);
    if (!before && !after.length) return "기록 전 변경이라 비교할 순위가 없어요";
    const f = (w) => `${md(w.s)}주 ${rk(w.r)}`;
    return `주간통계 시트 ${esc((before || after[0]).k)}: ${[before ? "변경 전 " + f(before) : "", ...after.map(f)].filter(Boolean).join(" → ")}`;
  }
  return br.place.map((k) => {
    const parts = [rk(pRank(br.name, k, base))];
    for (const n of [3, 7, 14]) { const t = addDays(c.date, n); parts.push(t > LAST ? `${n}일 후 –` : `${n}일 후 ${rk(pRank(br.name, k, onOrBefore(t)))}`); }
    return `${esc(k)} ${parts.join(" → ")}`;
  }).join("<br>");
}
function renderBranch() {
  const br = D.branches.find((b) => b.name === VIEW);
  const pNow = best(br.place.map((k) => pRank(br.name, k, LAST))), pPrev = PREV ? best(br.place.map((k) => pRank(br.name, k, PREV))) : null;
  const bk = br.blog[0], bNow = bk ? bCnt(br.name, bk, LAST) : null, bPrev = bk && PREV ? bCnt(br.name, bk, PREV) : null;
  const wNow = best(br.place.map((k) => wRank(k, LAST))), wPrev = PREV ? best(br.place.map((k) => wRank(k, PREV))) : null;
  const chs = changes().filter((c) => c.branch === br.name || c.branch === "전체").sort((a, b) => (a.date < b.date ? 1 : -1));
  const kws = [...new Set([...br.place, ...br.blog])];
  const kwHtml = kws.map((k) => {
    const n = bCnt(br.name, k, LAST);
    const vb = br.place.includes(k) ? vsBase(br.name, k) : null;
    const right = br.place.includes(k) ? `플레이스 ${vb && vb.down ? `<b class="dn">${rk(pRank(br.name, k, LAST))}</b>` : rk(pRank(br.name, k, LAST))}${vb ? ` <small style="color:var(--sub)">(평소 ${vb.base}위)</small>` : ""} · 웹 ${rk(wRank(k, LAST))}` : "";
    return `<div class="kw"><div class="r1"><b>${esc(k)}</b><span>${right}</span></div>
      ${n != null ? `<div class="seg">${Array.from({ length: 30 }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div><div class="r2">블로그 ${n} / 30${PREV && bCnt(br.name, k, PREV) != null ? ` · 어제 ${bCnt(br.name, k, PREV)}` : ""}</div>` : ""}</div>`;
  }).join("");
  const wk = weeklyFor(br.name), m = hide ? "mask" : "";
  const weeklyHtml = !R ? `<div class="empty">🔒 ${lockMsg()}</div>` : !wk || !wk.length ? `<div class="empty">주간통계 시트에 ${br.name} 기록이 없어요.</div>` :
    `<div class="scroll"><table><tr><th>주차</th><th>조회수</th><th>전화</th><th>객수</th><th>매출</th></tr>${wk.slice().reverse().map((w) => `<tr><td>${esc(w.wk)}<small>${esc(w.per)}</small></td><td>${esc(w.view)}</td><td class="${m}">${esc(w.call)}</td><td class="${m}">${esc(w.guest)}</td><td class="${m}">${esc(w.sales)}</td></tr>`).join("")}</table></div>`;

  $("#main").innerHTML = `
    <div class="head"><h1>${br.name}<small>${br.no}호</small></h1><span class="when">${md(LAST)} 기준</span></div>
    <div class="stats three">
      <div class="card stat"><div class="ct">플레이스 최고</div><div class="big">${pNow == null ? "–" : pNow >= 101 ? "밖" : pNow}<em>${pNow != null && pNow < 101 ? "위" : ""}</em></div><div class="sub">${(() => { const bs = br.place.map((k) => placeBase(br.name, k)).filter((v) => v != null); return bs.length ? `평소 ${Math.min(...bs)}위` : ""; })()}${dRank(pNow, pPrev) ? " · " + dRank(pNow, pPrev) : ""}</div></div>
      <div class="card stat"><div class="ct">블로그 점유</div><div class="big">${bNow ?? "–"}<em>/ 30</em></div><div class="sub">${dCnt(bNow, bPrev) || esc(bk || "")}</div></div>
      <div class="card stat"><div class="ct">웹노출 최고</div><div class="big">${wNow == null ? "–" : wNow >= 101 ? "밖" : wNow}<em>${wNow != null && wNow < 101 ? "위" : ""}</em></div><div class="sub">${dRank(wNow, wPrev) || "우리 사이트 중 가장 높은 순위"}</div></div>
    </div>
    <div class="card chartc"><div class="ct">플레이스 순위 흐름<small><span class="legend">${br.place.map((k, i) => `<span><i style="background:${LINE[i % 3]}"></i>${esc(k)}</span>`).join("")}</span></small></div>
      <div class="cs">위로 갈수록 좋음 · 점선 = 바꾼 날</div>
      <div class="area">${chart(br.place.map((k, i) => ({ color: LINE[i % 3], val: (d) => { const r = pRank(br.name, k, d); return r == null ? null : n11(r); } })), chs)}</div></div>
    <div class="split">
      <div class="card"><div class="ct">키워드</div><div class="list">${kwHtml}</div></div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card"><div class="ct">바꾼 것과 그 뒤 순위<small>${chs.length ? `전체 ${chs.length}건` : ""}</small></div><div class="list">${!R ? `<div class="empty">🔒 ${lockMsg()}</div>` : chs.length ? chgList(br, chs) : `<div class="empty">아직 기록이 없어요.</div>`}</div></div>
        <div class="card"><div class="ct">주간 통계<small>팀장님 캡처 기준</small></div>${weeklyHtml}</div>
        <div class="card"><div class="ct">지난 주간 분석에서 ${br.name}</div><div class="list">${!R ? `<div class="empty">🔒 ${lockMsg()}</div>` : (() => { const a = analysis().filter((x) => x.b === br.name).reverse().slice(0, 4); return a.length ? a.map((x) => `<div class="li" style="align-items:flex-start"><b style="min-width:52px">${esc(x.wk)}</b><span class="v at ${m}" style="flex:1;line-height:1.6"><small style="color:var(--ink);font-weight:600">${x.sec === "집중 관리" ? `<span class="dot red" style="display:inline-block;margin-right:6px"></span>` : ""}${esc(x.sec)}</small><br>${hl(x.t)}</span></div>`).join("") : `<div class="empty">언급된 적 없어요.</div>`; })()}</div></div>
      </div>
    </div>`;
}

// 바꾼 것 목록: 최근 3건 펼침, 이전 것은 한 줄(누르면 펼침), 한 줄 목록은 5개까지 → 더 보기
const OPEN = new Set(); let allChg = false;
function chgList(br, chs) {
  const full = (c) => `<div class="chg"><div class="t">${md(c.date)}<em>${esc(c.kind)}</em><button onclick="delChange(${c.row})">지우기</button></div><p>${esc(c.text)}</p><div class="eff">${effect(br, c)}</div></div>`;
  const rest = chs.slice(3), shown = allChg ? rest : rest.slice(0, 5);
  const line = (c) => OPEN.has(c.row) ? `<div onclick="OPEN.delete(${c.row});render()" style="cursor:pointer">${full(c)}</div>`
    : `<button class="li" onclick="OPEN.add(${c.row});render()" style="font-size:14px"><b style="min-width:44px;font-weight:500;color:var(--sub)">${md(c.date)}</b><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)">${esc(c.kind)} ${esc(c.text)}</span><span style="color:var(--faint)">›</span></button>`;
  return chs.slice(0, 3).map(full).join("")
    + (rest.length ? `<div class="nav-h" style="padding:14px 0 2px">이전 기록</div>${shown.map(line).join("")}` : "")
    + (rest.length > 5 ? `<button class="li" onclick="allChg=!allChg;render()" style="justify-content:center;color:var(--navy);font-weight:600;font-size:14px">${allChg ? "접기" : `이전 기록 ${rest.length - 5}건 더 보기`}</button>` : "");
}

// ── 주간 분석 (기존 '플레이스 순위변화 분석' 탭들을 옮긴 것) ──
// 최근 1주만 펼치고 지난 주차는 한 줄로 접어 둠 (누르면 펼침)
// 분석 문장: 숫자만 검정 굵게
const hl = (t) => esc(t).replace(/[+-]?d[d,.]*(%|원|건|회|위|일|명)?/g, (m) => `<b class="num">${m}</b>`);
const SECS = ["상승", "집중 관리", "공통", "다음 주 할 일", "종합 판단", "주의점"];
const OPENW = new Set();
function renderAnalysis() {
  const A = analysis(), m = hide ? "mask" : "";
  const weeks = [...new Set(A.map((a) => a.wk))].reverse();
  const body = !R ? `<div class="card"><div class="empty">🔒 ${lockMsg()}</div></div>` : !weeks.length ? `<div class="card"><div class="empty">아직 주간 분석이 없어요.</div></div>` :
    weeks.map((w, i) => {
      const rows = A.filter((a) => a.wk === w);
      const open = i === 0 || OPENW.has(w);
      const head = `<div class="ct" style="font-size:16px;color:var(--ink);font-weight:600">${esc(w)}주<small>${esc(rows[0].per)}${i ? (open ? " · 접기 ▴" : " · 펼치기 ▾") : ""}</small></div>`;
      if (!open) {
        const brief = rows.filter((a) => a.sec === "집중 관리").map((a) => a.b).filter(Boolean).join(", ");
        return `<button class="card" style="display:block;width:100%;text-align:left;margin-bottom:10px;padding:18px 24px" onclick="OPENW.add('${w}');render()">${head}<div style="font-size:14px;color:var(--sub);margin-top:6px">집중 관리: ${esc(brief || "없음")}</div></button>`;
      }
      return `<div class="card" style="margin-bottom:16px"><div ${i ? `onclick="OPENW.delete('${w}');render()" style="cursor:pointer"` : ""}>${head}</div>
        ${SECS.map((s) => { const r = rows.filter((a) => a.sec === s); return r.length ? `<div class="sech">${s === "집중 관리" ? `<span class="dot red"></span>` : ""}${s}</div>${r.map((a) => `<div class="li" style="align-items:flex-start"><b>${esc(a.b) || "–"}</b><span class="v at ${m}" style="flex:1;line-height:1.6">${hl(a.t)}</span></div>`).join("")}` : ""; }).join("")}</div>`;
    }).join("");
  $("#main").innerHTML = `<div class="head"><h1>주간 분석</h1><span class="when">기존 주간통계 시트의 주차별 분석</span></div>${body}`;
}

function render() { renderSide(); VIEW === "개요" ? renderOverview() : VIEW === "주간 분석" ? renderAnalysis() : renderBranch(); }
function go(v) { if (v === VIEW) return; VIEW = v; allChg = false; history.pushState({ v }, ""); render(); window.scrollTo(0, 0); }
window.addEventListener("popstate", (e) => { if ($("#dim").classList.contains("on")) { $("#dim").classList.remove("on"); return; } VIEW = (e.state && e.state.v) || "개요"; render(); });

// ── 기록하기 ──
let rec = {};
function openRecord(branch) {
  rec = { date: today(), branch: branch || "", kind: "", text: "" };
  $("#sheet").innerHTML = `<h2>바꾼 것 기록</h2><p class="desc">적어두면 3일, 7일, 14일 뒤 순위를 자동으로 붙여서 보여줘요.</p>
    <div class="lbl">날짜</div><input class="input" type="date" id="rDate" value="${rec.date}">
    <div class="lbl">지점</div><div class="chips" id="rBr">${["전체", ...D.branches.map((b) => b.name)].map((n) => `<button class="chip ${n === rec.branch ? "on" : ""}" data-v="${n}">${n}</button>`).join("")}</div>
    <div class="lbl">무엇을</div><div class="chips" id="rKind">${KIND.map((n) => `<button class="chip" data-v="${n}">${n}</button>`).join("")}</div>
    <div class="lbl">내용</div><textarea class="input" id="rText" placeholder="예: 대표사진 1번을 이벤트 이미지로 교체"></textarea>
    <div class="btns"><button class="btn" onclick="closeSheet()">닫기</button><button class="btn primary" id="rSave" onclick="saveRecord()">저장</button></div>`;
  const pick = (id, f) => $(id).addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; $(id).querySelectorAll(".chip").forEach((x) => x.classList.remove("on")); b.classList.add("on"); rec[f] = b.dataset.v; });
  pick("#rBr", "branch"); pick("#rKind", "kind");
  openSheet();
}
async function saveRecord() {
  rec.date = $("#rDate").value; rec.text = $("#rText").value.trim();
  if (!rec.branch) return toast("지점을 골라주세요");
  if (!rec.kind) return toast("무엇을 바꿨는지 골라주세요");
  if (!rec.text) return toast("내용을 적어주세요");
  $("#rSave").disabled = true;
  if (await post({ type: "change", ...rec })) { closeSheet(); toast("저장했어요"); await reload(true); }
  else $("#rSave").disabled = false;
}
async function delChange(row) { if (!confirm("이 기록을 지울까요?")) return; if (await post({ type: "delChange", row })) { toast("지웠어요"); await reload(true); } }
async function cycleTodo(row, st) { const next = st === "할 일" ? "함" : st === "함" ? "안 함" : "할 일"; if (await post({ type: "todoStatus", row, status: next })) await reload(true); }

// ── 열쇠 ──
function openKey() {
  $("#sheet").innerHTML = `<h2>열쇠</h2><p class="desc">열쇠가 있으면 할 일, 바꾼 것 기록, 주간 통계(매출, 객수, 전화)가 보여요. 이 기기에만 저장돼요.</p>
    <input class="input" id="kIn" type="password" autocomplete="off" value="">
    <div class="btns"><button class="btn" onclick="key='';ls.set('vf-naver-key','');closeSheet();reload(true)">열쇠 빼기</button><button class="btn primary" onclick="saveKey()">저장</button></div>`;
  openSheet();
}
async function saveKey() { key = $("#kIn").value.trim(); ls.set("vf-naver-key", key); closeSheet(); await reload(true); toast(R ? "열렸어요" : lockMsg()); }
function toggleHide() { hide = !hide; ls.set("vf-naver-hide", hide ? "1" : "0"); render(); }

function openSheet() { $("#dim").classList.add("on"); history.pushState({ v: VIEW, s: 1 }, ""); }
function closeSheet() { if ($("#dim").classList.contains("on")) history.back(); }
$("#dim").addEventListener("click", (e) => { if (e.target.id === "dim") closeSheet(); });

async function reload(remoteOnly) {
  if (!remoteOnly) { D = await (await fetch("data.json?t=" + Date.now())).json(); setDates(); }
  await loadRemote();
  render();
}
history.replaceState({ v: "개요" }, "");
reload().catch(() => ($("#main").innerHTML = `<div class="empty" style="padding:40px 0">데이터를 불러오지 못했어요. 새로고침 해주세요.</div>`));
</script>
