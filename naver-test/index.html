<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#191f28">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>베이프렌드 네이버</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f2f4f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--sub:#8b95a1;--line:#e5e8eb;--blue:#3182f6;--blue-soft:#e8f3ff;--green:#03b26c;--green-soft:#e5f8ef;--red:#f04452;--red-soft:#fdecee;--amber:#b77700;--amber-soft:#fff4dc;--dark:#191f28}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .app{max-width:640px;margin:0 auto;padding:16px 16px 60px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .logo{font-weight:800;font-size:18px} .logo b{color:var(--blue)}
  .tag{background:var(--red);color:#fff;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
  .date{margin-left:auto;color:var(--sub);font-size:13px;font-weight:500;text-align:right}
  .hero{background:var(--dark);color:#fff;border-radius:22px;padding:20px 22px;margin-bottom:12px}
  .hero h1{font-size:21px;letter-spacing:-.4px;line-height:1.4}
  .hero p{color:#b0b8c1;margin-top:6px;font-size:14px;line-height:1.5}
  .hero .row{display:flex;gap:8px;margin-top:14px}
  .hero .pill{flex:1;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px}
  .hero .pill b{display:block;font-size:20px} .hero .pill span{font-size:12px;color:#b0b8c1}
  .act{height:44px;padding:0 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
  .act.gray{background:#f2f4f6;color:var(--ink2)}
  .hero .act{margin-top:14px;width:100%}
  .card{background:var(--card);border-radius:20px;padding:6px 18px 10px;margin-bottom:12px}
  .card h2{font-size:15px;color:var(--sub);font-weight:700;padding:14px 0 6px;display:flex;align-items:center;gap:8px}
  .card h2 small{margin-left:auto;font-weight:600;font-size:12px}
  .empty{color:var(--sub);font-size:14px;padding:6px 0 12px;line-height:1.5}
  /* 지점 카드 */
  .br{display:block;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line)}
  .card h2+.br{border-top:0}
  .br .hd{display:flex;align-items:center;gap:8px}
  .br .hd b{font-size:17px} .br .hd .no{font-size:12px;color:var(--sub);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:#d1d6db;flex:none}
  .dot.down{background:var(--red)} .dot.up{background:var(--green)}
  .br .hd .go{margin-left:auto;color:var(--sub);font-size:13px}
  .mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .met{background:#f7f8fa;border-radius:12px;padding:9px 10px}
  .met span{display:block;font-size:12px;color:var(--sub);font-weight:600}
  .met b{font-size:18px} .met i{font-style:normal;font-size:12px;font-weight:700;margin-left:4px}
  .up-t{color:var(--green)} .down-t{color:var(--red)} .same-t{color:var(--sub)}
  .met.down{background:var(--red-soft)} .met.up{background:var(--green-soft)}
  /* 할 일 */
  .todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
  .card h2+.todo{border-top:0}
  .todo i{width:26px;height:26px;border-radius:8px;border:2px solid #d1d6db;display:grid;place-items:center;flex:none;font-style:normal;color:#fff;font-size:15px;margin-top:1px}
  .todo.done i{background:var(--green);border-color:var(--green)}
  .todo.skip i{background:#d1d6db;border-color:#d1d6db}
  .todo b{display:block;font-size:15px} .todo span{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.45}
  .todo.done b{color:var(--sub);text-decoration:line-through}
  /* 상세 */
  .page{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:40;display:none}
  .page.on{display:block}
  .back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink2);padding:6px 0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{white-space:nowrap;font-size:12px;color:var(--sub);font-weight:700;text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  td.k{font-weight:600;font-size:13px;word-break:keep-all}
  td small{display:block;white-space:nowrap;font-size:11px;color:var(--sub);font-weight:500}
  tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto}
  .chart{margin:6px 0 4px}
  .chart svg{width:100%;height:auto;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin:4px 0 8px}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .chg{padding:12px 0;border-top:1px solid var(--line)}
  .card h2+.chg{border-top:0}
  .chg .t{display:flex;gap:8px;align-items:center}
  .chg .t b{font-size:15px} .chg .t em{font-style:normal;font-size:12px;font-weight:700;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:2px 6px}
  .chg .t button{margin-left:auto;font-size:12px;color:var(--sub)}
  .chg p{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.45}
  .eff{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.6;background:#f7f8fa;border-radius:10px;padding:8px 10px}
  .lock{display:flex;align-items:center;gap:10px;padding:8px 0 14px;color:var(--sub);font-size:14px}
  .mask{filter:blur(6px)}
  /* 아래에서 올라오는 창 */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .dim.on{display:flex}
  .sheet{background:#fff;width:min(640px,100%);border-radius:24px 24px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .sheet h2{font-size:21px;letter-spacing:-.4px} .sheet .desc{color:var(--sub);margin-top:6px;font-size:14px;line-height:1.5}
  .lbl{font-size:13px;font-weight:700;color:var(--ink2);margin-top:16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{padding:10px 14px;border-radius:12px;background:#f2f4f6;font-weight:600;font-size:15px}
  .chip.on{background:var(--blue);color:#fff}
  .input{margin-top:8px;width:100%;height:50px;border-radius:14px;border:1px solid var(--line);padding:0 14px;font:inherit;font-size:16px;outline:none;background:#fff}
  textarea.input{height:96px;padding:12px 14px;resize:vertical}
  .input:focus{border-color:var(--blue)}
  .btns{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;height:54px;border-radius:14px;font-weight:700;font-size:16px;background:#f2f4f6}
  .btn.primary{background:var(--blue);color:#fff} .btn:disabled{opacity:.5}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .foot{font-size:12px;color:var(--sub);text-align:center;margin-top:18px;line-height:1.8}
  .foot button{color:var(--blue);font-weight:600;font-size:12px;margin:0 6px}
  .kwl{margin-top:10px;font-size:13px}
  .kwl .kh,.kwl .kr{display:grid;grid-template-columns:1fr 38px 30px 38px;gap:4px;padding:5px 2px;align-items:center}
  .kwl .kh{color:var(--sub);font-size:11px;font-weight:700;border-bottom:1px solid var(--line)}
  .kwl .kr span:not(:first-child),.kwl .kh span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .kwl .kr span:first-child{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kwl .kr.down{background:var(--red-soft);border-radius:8px} .kwl .kr.up{background:var(--green-soft);border-radius:8px}
  @media (min-width:900px){
    .app{max-width:1360px;padding:24px 28px 60px}
    .lay{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;align-items:stretch;margin-bottom:14px}
    .lay>*{margin-bottom:0}
    .bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:4px 0 8px}
    .bgrid .br{border:1px solid var(--line);border-radius:16px;padding:14px;border-top:1px solid var(--line)}
    .bgrid .br:hover{border-color:var(--blue)}
    .brs{padding-bottom:14px}
    .dl{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
    .dl .card{margin-bottom:14px}
    .page .app{max-width:1360px}
    .sheet{border-radius:24px;margin-bottom:auto;margin-top:auto}
    .dim{align-items:center}
  }
  @media (min-width:900px) and (max-width:1180px){ .bgrid{grid-template-columns:repeat(2,1fr)} }
  /* 홈 v2 */
  html,body{background:#f7f8fa}
  .bar{display:flex;align-items:center;gap:10px;padding:4px 0 18px}
  .bar .when{margin-left:auto;color:var(--sub);font-size:14px;font-weight:600}
  .act.sm{height:38px;font-size:14px;padding:0 14px}
  .sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .sh h2{font-size:18px;letter-spacing:-.3px} .sh h3{font-size:15px} .sh span{color:var(--sub);font-size:13px;line-height:1.5}
  .sh.sub{margin-top:4px;padding-top:14px;border-top:1px solid var(--line)}
  .chs{display:grid;grid-template-columns:1fr;gap:6px}
  .ch{display:grid;grid-template-columns:22px 70px 70px 1fr auto;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:10px;background:#f7f8fa;font-size:14px}
  .ch .ar{font-weight:800} .ch .wh{color:var(--sub);font-size:13px} .ch .kw{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch .ft{font-variant-numeric:tabular-nums;color:var(--ink2)} .ch .ft strong{color:var(--ink)}
  .ch.dn{background:var(--red-soft)} .ch.dn .ar{color:var(--red)}
  .ch.upc{background:var(--green-soft)} .ch.upc .ar{color:var(--green)}
  .ch.wk{background:var(--amber-soft)} .ch.wk .ar{color:var(--amber)}
  table.big{font-size:14px}
  table.big th,table.big td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  table.big thead th{color:var(--sub);font-size:12px;font-weight:700;background:#fafbfc}
  table.big .l,table.big td.kw{text-align:left}
  table.big td.kw{color:var(--ink2);font-weight:500}
  table.big th.bn{text-align:left;font-size:15px;vertical-align:top;background:#fff;border-right:1px solid var(--line)}
  table.big th.bn small{display:block;color:var(--sub);font-size:11px;font-weight:600}
  table.big tbody tr{cursor:pointer} table.big tbody tr:hover td{background:#f7f9fc}
  table.big td.weak{background:var(--amber-soft)}
  table.big td.down{color:var(--red);font-weight:700} table.big td.up{color:var(--green);font-weight:700}
  table.big td i{font-style:normal;font-size:11px;margin-left:4px}
  table.big td.na{color:#c4c9cf}
  table.big tr.cm td,table.big tr.cm th{background:#fafbfc}
  .two .todo{border-top:1px solid var(--line)} .two .sh+.todo{border-top:0}
  @media (min-width:900px){
    .two{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
    .two>.sec{margin-bottom:0}
    .chs{grid-template-columns:1fr 1fr}
  }
  @media (max-width:600px){ .ch{grid-template-columns:18px 56px 1fr auto} .ch .wh{display:none} }

  /* 홈 v3 */
  .alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .alert{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:16px 18px;border-radius:14px;font-size:17px;background:#fff;border:1px solid var(--line)}
  .alert span{margin-left:auto;color:var(--sub);font-size:13px}
  .alert.red{background:var(--red-soft);border-color:transparent} .alert.red strong{color:var(--red)}
  .alert.ok{background:var(--green-soft);border-color:transparent;color:#027a4b;font-weight:700}
  .alert.none{color:var(--ink2)}
  .more{color:var(--sub);font-size:13px;padding-left:4px}
  .rows{padding:6px 8px}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 12px;border-radius:10px;font-size:16px}
  .row+.row{border-top:1px solid var(--line);border-radius:0}
  .row:hover{background:#f7f9fc}
  .row b{width:72px;flex:none;font-size:17px}
  .row .tx{flex:1;color:var(--ink2);min-width:0}
  .row .gt{color:#c4c9cf;font-size:20px}
  .sd{width:12px;height:12px;border-radius:50%;flex:none}
  .sd.red{background:var(--red)} .sd.amber{background:#f5b400} .sd.green{background:var(--green)}

</style>
</head>
<body>
<div class="app" id="home"></div>
<div class="page" id="detail"><div class="app" id="detailIn"></div></div>
<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const VER = "10.09-3";
const APPS_URL = ""; // 네이버앱_AppsScript 배포 주소(…/exec)
const KIND = ["대표사진", "소개글", "블로그 발행", "리뷰", "트래픽 작업", "가격표, 소식", "키워드", "기타"];
const COLORS = ["#3182f6", "#f04452", "#03b26c", "#b77700", "#8b5cf6"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let D = null, R = null, remoteErr = "";
let key = ls.get("vf-naver-key", "");
let hide = ls.get("vf-naver-hide", "0") === "1";

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2200); }
const md = (d) => { const [, m, dd] = d.split("-"); return `${+m}/${+dd}`; };
const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const today = () => { const x = new Date(); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };

// ── 날짜 기준 ──
let DATES = [], LAST = "", PREV = "", WEEK = "";
function setDates() {
  DATES = [...new Set([...D.place, ...D.blog, ...D.web].map((r) => r.d))].sort();
  LAST = DATES[DATES.length - 1] || "";
  PREV = DATES.filter((d) => d < LAST).pop() || "";
  WEEK = DATES.filter((d) => d <= addDays(LAST, -7)).pop() || "";
}
const onOrBefore = (d) => DATES.filter((x) => x <= d).pop() || "";

// ── 값 꺼내기 ──
const pRank = (b, k, d) => { const r = D.place.find((x) => x.b === b && x.k === k && x.d === d); return r ? r.r : null; };
const bCnt = (b, k, d) => { const r = D.blog.find((x) => x.b === b && x.k === k && x.d === d); return r ? r.n : null; };
const wRank = (k, d) => { const r = D.web.find((x) => x.k === k && x.d === d); return r ? r.r : null; };
const rk = (r) => (r == null ? "-" : r >= 101 ? "밖" : r + "위");
const best = (arr) => { const v = arr.filter((x) => x != null); return v.length ? Math.min(...v) : null; };

// 순위: 숫자가 작아지면 좋아짐 / 점유: 숫자가 커지면 좋아짐
function delta(now, before, lowerBetter) {
  if (now == null || before == null) return { cls: "", txt: "" };
  const a = now >= 101 ? 11 : now, b = before >= 101 ? 11 : before;
  const diff = lowerBetter ? b - a : a - b;
  if (diff > 0) return { cls: "up", txt: `<i class="up-t">▲${Math.abs(diff)}</i>` };
  if (diff < 0) return { cls: "down", txt: `<i class="down-t">▼${Math.abs(diff)}</i>` };
  return { cls: "", txt: `<i class="same-t">-</i>` };
}

function branchSummary(br, d) {
  return {
    place: best(br.place.map((k) => pRank(br.name, k, d))),
    blog: br.blog.length ? bCnt(br.name, br.blog[0], d) : null,
    web: best(br.place.map((k) => wRank(k, d))),
  };
}

// ── 원격(열쇠) ──
async function loadRemote() {
  R = null; remoteErr = "";
  if (!APPS_URL) { remoteErr = "setup"; return; }
  if (!key) { remoteErr = "nokey"; return; }
  try {
    const r = await (await fetch(`${APPS_URL}?k=${encodeURIComponent(key)}&t=${Date.now()}`)).json();
    if (!r.ok) { remoteErr = r.error === "key" ? "badkey" : "fail"; return; }
    R = r;
  } catch { remoteErr = "fail"; }
}
async function post(body) {
  if (!APPS_URL || !key) { toast("열쇠를 먼저 넣어주세요"); return false; }
  try {
    const r = await (await fetch(APPS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ k: key, ...body }) })).json();
    if (!r.ok) { toast(r.error === "key" ? "열쇠가 맞지 않아요" : "저장 실패"); return false; }
    return true;
  } catch { toast("연결 실패, 잠시 후 다시"); return false; }
}
const changes = () => (R ? R.changes.map((x) => ({ row: x.row, at: x.v[0], date: x.v[1], branch: x.v[2], kind: x.v[3], text: x.v[4] })) : []);
const todos = () => (R ? R.todos.map((x) => ({ row: x.row, week: x.v[0], branch: x.v[1], text: x.v[2], why: x.v[3], status: x.v[4] || "할 일", doneAt: x.v[5] })) : []);
function lockMsg() {
  return { setup: "시트 연결 준비 중이에요 (Apps Script 배포 후 열림)", nokey: "열쇠를 넣으면 보여요", badkey: "열쇠가 맞지 않아요", fail: "시트를 불러오지 못했어요" }[remoteErr] || "";
}

// ── 주간통계(시트) ──
function weeklyFor(name) {
  if (!R || !R.weekly || !R.weekly.length) return null;
  const v = R.weekly;
  const hi = v.findIndex((row) => row.some((c) => String(c).includes("지점명")));
  if (hi < 0) return null;
  const H = v[hi].map((c) => String(c).replace(/\s/g, ""));
  const col = (n) => H.findIndex((h) => h.includes(n));
  const C = { wk: col("주차"), per: col("기간"), br: col("지점명"), view: col("플레이스조회수"), inflow: col("검색유입"), call: col("전화"), guest: col("객수"), sales: col("매출"), note: col("특이사항") };
  const rows = v.slice(hi + 1).filter((r) => { const n = String(r[C.br] || "").trim(); return n === name || n === name + "점"; });
  return rows.slice(-6).map((r) => ({ wk: r[C.wk], per: r[C.per], view: r[C.view], inflow: r[C.inflow], call: r[C.call], guest: r[C.guest], sales: r[C.sales], note: r[C.note] }));
}

// ── 홈 ──
// 신경 쓸 변화만: 순위 2칸 이상, 10위 안↔밖, 블로그 3개 이상
function bigDiffs() {
  if (!PREV) return [];
  const out = [];
  const rank = (b, what, k, a, z) => {
    if (a == null || z == null) return;
    const A = a >= 101 ? 11 : a, Z = z >= 101 ? 11 : z;
    if (Math.abs(A - Z) >= 2 || (a >= 101) !== (z >= 101)) out.push({ b, what, k, from: rk(z), to: rk(a), down: A > Z });
  };
  const cnt = (b, k, a, z) => { if (a != null && z != null && Math.abs(a - z) >= 3) out.push({ b, what: "블로그", k, from: z + "개", to: a + "개", down: a < z }); };
  for (const br of D.branches) {
    for (const k of br.place) { rank(br.name, "플레이스", k, pRank(br.name, k, LAST), pRank(br.name, k, PREV)); rank(br.name, "웹노출", k, wRank(k, LAST), wRank(k, PREV)); }
    for (const k of br.blog) cnt(br.name, k, bCnt(br.name, k, LAST), bCnt(br.name, k, PREV));
    rank(br.name, "플레이스", D.common, pRank(br.name, D.common, LAST), pRank(br.name, D.common, PREV));
  }
  return out.sort((a, b) => b.down - a.down);
}
// 지점 한 줄 요약
function branchLine(br, big) {
  const mine = big.filter((x) => x.b === br.name);
  const bits = mine.filter((x) => x.down).map((x) => `${x.what} ${x.from}→${x.to} (${x.k})`);
  const weakBits = [];
  for (const k of br.place) {
    const p = pRank(br.name, k, LAST), w = wRank(k, LAST);
    if (p != null && p >= 4) weakBits.push(`플레이스 ${rk(p)} (${k})`);
    if (w != null && w >= 4) weakBits.push(`웹 ${rk(w)} (${k})`);
  }
  for (const k of br.blog) { const n = bCnt(br.name, k, LAST); if (n != null && n <= 5) weakBits.push(`블로그 ${n}개 (${k})`); }
  const ups = mine.filter((x) => !x.down).map((x) => `${x.what} ${x.from}→${x.to}`);
  if (bits.length) return { st: "red", txt: "떨어짐: " + bits.slice(0, 2).join(", ") + (weakBits.length ? ` · 약함 ${weakBits.length}칸` : "") };
  if (weakBits.length) return { st: "amber", txt: "약함: " + weakBits.slice(0, 2).join(", ") + (weakBits.length > 2 ? ` 외 ${weakBits.length - 2}` : "") };
  return { st: "green", txt: ups.length ? "올라감: " + ups.slice(0, 2).join(", ") : "문제 없음" };
}

function renderHome() {
  const big = bigDiffs();
  const downs = big.filter((x) => x.down);
  const go = (b) => (b === "공통" ? "" : `openBranch('${b}')`);
  const head = !PREV
    ? `<div class="alert none">${md(LAST)} 첫 기록이에요. 내일부터 크게 바뀐 것만 여기에 뜹니다.</div>`
    : downs.length
      ? downs.slice(0, 4).map((x) => `<button class="alert red" onclick="${go(x.b)}"><b>${esc(x.b)}</b> ${x.what} ${x.from} → <strong>${x.to}</strong><span>${esc(x.k)}</span></button>`).join("") + (downs.length > 4 ? `<div class="more">외 ${downs.length - 4}건은 지점을 눌러서</div>` : "")
      : `<div class="alert ok">오늘은 신경 쓸 변화 없음</div>`;

  const rows = D.branches.map((br) => {
    const l = branchLine(br, big);
    return `<button class="row" onclick="openBranch('${br.name}')"><span class="sd ${l.st}"></span><b>${br.name}</b><span class="tx">${esc(l.txt)}</span><span class="gt">›</span></button>`;
  }).join("");

  const td = todos();
  const todoHtml = R
    ? (td.length ? td.slice().reverse().slice(0, 12).map((t) => `<button class="todo ${t.status === "함" ? "done" : t.status === "안 함" ? "skip" : ""}" onclick="cycleTodo(${t.row},'${t.status}')"><i>${t.status === "함" ? "✓" : t.status === "안 함" ? "–" : ""}</i><div><b>${esc(t.branch)} · ${esc(t.text)}</b><span>${esc(t.why)}${t.doneAt ? ` · ${esc(t.status)} ${esc(t.doneAt)}` : ""}</span></div></button>`).join("") : `<div class="empty">월요일 정리 때 채워집니다.</div>`)
    : `<div class="empty">🔒 ${lockMsg()}</div>`;

  $("#home").innerHTML = `
    <div class="bar"><div class="logo">베이프렌드 <b>네이버</b></div><span class="tag">테스트판 ${VER}</span>
      <span class="when">${LAST ? md(LAST) + " 기준" : ""}</span><button class="act sm" onclick="openRecord()">＋ 바꾼 것 기록</button></div>
    <div class="alerts">${head}</div>
    <div class="two"><div class="sec rows">${rows}</div>
      <div class="sec"><div class="sh"><h2>이번 주 할 일</h2></div>${todoHtml}</div></div>
    <div class="foot"><button onclick="openKey()">${key ? "열쇠 바꾸기" : "열쇠 넣기"}</button><button onclick="toggleHide()">${hide ? "숫자 보이기" : "숫자 숨기기"}</button><button onclick="reload()">새로고침</button></div>`;
}

// ── 지점 상세 ──
let curBranch = null;
function openBranch(name) { curBranch = name; renderBranch(); $("#detail").classList.add("on"); $("#detail").scrollTop = 0; history.pushState({ d: name }, ""); }
function closeBranch() { $("#detail").classList.remove("on"); curBranch = null; }
window.addEventListener("popstate", () => { if ($("#dim").classList.contains("on")) hideSheet(); else if (curBranch) closeBranch(); });

function chartSvg(br, chs) {
  const days = DATES.slice(-30);
  if (days.length < 2) return `<div class="empty">그래프는 기록이 이틀 이상 쌓이면 보여요. 지금은 ${md(LAST)} 하루치.</div>`;
  const W = 600, H = 200, L = 30, Rt = 10, T = 12, B = 26;
  const x = (i) => L + (i * (W - L - Rt)) / (days.length - 1);
  const y = (r) => T + ((Math.min(r, 11) - 1) * (H - T - B)) / 10;
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for (const r of [1, 3, 5, 10]) s += `<line x1="${L}" x2="${W - Rt}" y1="${y(r)}" y2="${y(r)}" stroke="#eef0f3"/><text x="${L - 6}" y="${y(r) + 4}" font-size="11" fill="#8b95a1" text-anchor="end">${r}</text>`;
  s += `<text x="${L - 6}" y="${y(11) + 4}" font-size="11" fill="#8b95a1" text-anchor="end">밖</text>`;
  chs.forEach((c) => { const i = days.findIndex((d) => d >= c.date); if (i < 0) return; s += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}" stroke="#3182f6" stroke-dasharray="4 4" opacity=".6"/><text x="${x(i) + 3}" y="${T + 9}" font-size="10" fill="#3182f6">${esc(c.kind)}</text>`; });
  br.place.forEach((k, ki) => {
    const pts = days.map((d, i) => [i, pRank(br.name, k, d)]).filter(([, r]) => r != null);
    if (!pts.length) return;
    s += `<polyline fill="none" stroke="${COLORS[ki % 5]}" stroke-width="2.5" points="${pts.map(([i, r]) => `${x(i)},${y(r >= 101 ? 11 : r)}`).join(" ")}"/>`;
    pts.forEach(([i, r]) => (s += `<circle cx="${x(i)}" cy="${y(r >= 101 ? 11 : r)}" r="3" fill="${COLORS[ki % 5]}"/>`));
  });
  [0, days.length - 1].forEach((i) => (s += `<text x="${x(i)}" y="${H - 8}" font-size="11" fill="#8b95a1" text-anchor="${i ? "end" : "start"}">${md(days[i])}</text>`));
  return s + `</svg>`;
}

function effect(br, c) {
  const base = onOrBefore(c.date);
  if (!base) return "기록 전 변경이라 비교할 순위가 없어요";
  return br.place.map((k) => {
    const parts = [`${rk(pRank(br.name, k, base))}`];
    for (const n of [3, 7, 14]) { const t = addDays(c.date, n); parts.push(t > LAST ? `${n}일 후 대기` : `${n}일 후 ${rk(pRank(br.name, k, onOrBefore(t)))}`); }
    return `${esc(k)}: ${parts.join(" → ")}`;
  }).join("<br>");
}

function renderBranch() {
  const br = D.branches.find((b) => b.name === curBranch);
  const kws = [...new Set([...br.place, ...br.blog])];
  const rows = kws.map((k) => {
    const pn = pRank(br.name, k, LAST), pp = PREV ? pRank(br.name, k, PREV) : null, pw = WEEK ? pRank(br.name, k, WEEK) : null;
    const bn = bCnt(br.name, k, LAST), bp = PREV ? bCnt(br.name, k, PREV) : null;
    const wn = wRank(k, LAST), wp = PREV ? wRank(k, PREV) : null;
    const dp = delta(pn, pp, true), db = delta(bn, bp, false), dw = delta(wn, wp, true);
    return `<tr><td class="k">${esc(k)}</td>
      <td>${br.place.includes(k) ? `${rk(pn)}${dp.txt}<small>어제 ${rk(pp)}</small><small>7일전 ${rk(pw)}</small>` : "-"}</td>
      <td>${bn == null ? "-" : bn + "개"}${db.txt}<small>어제 ${bp == null ? "-" : bp + "개"}</small></td>
      <td>${br.place.includes(k) ? `${rk(wn)}${dw.txt}<small>어제 ${rk(wp)}</small>` : "-"}</td></tr>`;
  }).join("");
  const prod = br.product.map((k) => `<tr><td class="k">${esc(k)}</td><td>-</td><td>${bCnt(br.name, k, LAST) ?? "-"}${bCnt(br.name, k, LAST) == null ? "" : "개"}</td><td>-</td></tr>`).join("");
  const chs = changes().filter((c) => c.branch === br.name || c.branch === "전체").sort((a, b) => (a.date < b.date ? 1 : -1));
  const wk = weeklyFor(br.name);
  const m = hide ? "mask" : "";
  const weeklyHtml = !R ? `<div class="lock">🔒 ${lockMsg()}</div>` : !wk || !wk.length ? `<div class="empty">주간통계 시트에 ${br.name} 기록이 없어요.</div>` :
    `<div class="scroll"><table><tr><th>주차</th><th>조회수</th><th>검색유입</th><th>전화</th><th>객수</th><th>매출</th></tr>${wk.slice().reverse().map((w) => `<tr><td class="k">${esc(w.wk)}<small>${esc(w.per)}</small></td><td>${esc(w.view)}</td><td>${esc(w.inflow)}</td><td class="${m}">${esc(w.call)}</td><td class="${m}">${esc(w.guest)}</td><td class="${m}">${esc(w.sales)}</td></tr>`).join("")}</table></div>`;

  $("#detailIn").innerHTML = `
    <div class="top"><button class="back" onclick="history.back()">‹ 전체</button><div class="date">${md(LAST)} 기준</div></div>
    <div class="hero"><h1>${br.name} <span style="font-size:15px;color:#b0b8c1">${br.no}호</span></h1><p>지정 키워드 ${br.place.length}개 · 바꾼 것 ${chs.length}건</p>
      <button class="act" onclick="openRecord('${br.name}')">＋ ${br.name} 바꾼 것 기록하기</button></div>
    <div class="dl"><div class="dcol"><div class="card"><h2>키워드별 오늘</h2><div class="scroll"><table><tr><th>키워드</th><th>플레이스</th><th>블로그</th><th>웹노출</th></tr>${rows}${prod}</table></div></div>
    <div class="card"><h2>플레이스 순위 흐름 <small>파란 점선 = 바꾼 날</small></h2>
      <div class="legend">${br.place.map((k, i) => `<span><i style="background:${COLORS[i % 5]}"></i>${esc(k)}</span>`).join("")}</div>
      <div class="chart">${chartSvg(br, chs)}</div></div></div><div class="dcol">
    <div class="card"><h2>바꾼 것과 그 뒤 순위</h2>${!R ? `<div class="lock">🔒 ${lockMsg()}</div>` : chs.length ? chs.map((c) => `<div class="chg"><div class="t"><b>${md(c.date)}</b><em>${esc(c.kind)}</em>${c.branch === "전체" ? "<em>전체</em>" : ""}<button onclick="delChange(${c.row})">지우기</button></div><p>${esc(c.text)}</p><div class="eff">${effect(br, c)}</div></div>`).join("") : `<div class="empty">아직 기록이 없어요. 뭔가 바꿨으면 위 버튼으로 남겨주세요.</div>`}</div>
    <div class="card"><h2>주간 통계 <small>팀장님 캡처 기준</small></h2>${weeklyHtml}</div></div></div>`;
}

// ── 기록하기 ──
let rec = {};
function openRecord(branch) {
  rec = { date: today(), branch: branch || "", kind: "", text: "" };
  $("#sheet").innerHTML = `<h2>바꾼 것 기록하기</h2><p class="desc">적어두면 3일, 7일, 14일 뒤 순위를 자동으로 붙여서 보여줘요.</p>
    <div class="lbl">날짜</div><input class="input" type="date" id="rDate" value="${rec.date}">
    <div class="lbl">지점</div><div class="chips" id="rBr">${["전체", ...D.branches.map((b) => b.name)].map((n) => `<button class="chip ${n === rec.branch ? "on" : ""}" data-v="${n}">${n}</button>`).join("")}</div>
    <div class="lbl">무엇을</div><div class="chips" id="rKind">${KIND.map((n) => `<button class="chip" data-v="${n}">${n}</button>`).join("")}</div>
    <div class="lbl">내용</div><textarea class="input" id="rText" placeholder="예: 대표사진 1번을 이벤트 이미지로 교체"></textarea>
    <div class="btns"><button class="btn" onclick="closeSheet()">닫기</button><button class="btn primary" id="rSave" onclick="saveRecord()">저장</button></div>`;
  const pick = (id, f) => $(id).addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; $(id).querySelectorAll(".chip").forEach((x) => x.classList.remove("on")); b.classList.add("on"); rec[f] = b.dataset.v; });
  pick("#rBr", "branch"); pick("#rKind", "kind");
  openSheet();
}
async function saveRecord() {
  rec.date = $("#rDate").value; rec.text = $("#rText").value.trim();
  if (!rec.branch) return toast("지점을 골라주세요");
  if (!rec.kind) return toast("무엇을 바꿨는지 골라주세요");
  if (!rec.text) return toast("내용을 적어주세요");
  $("#rSave").disabled = true;
  if (await post({ type: "change", ...rec })) { closeSheet(); toast("저장했어요"); await reload(true); }
  else $("#rSave").disabled = false;
}
async function delChange(row) { if (!confirm("이 기록을 지울까요?")) return; if (await post({ type: "delChange", row })) { toast("지웠어요"); await reload(true); } }
async function cycleTodo(row, st) { const next = st === "할 일" ? "함" : st === "함" ? "안 함" : "할 일"; if (await post({ type: "todoStatus", row, status: next })) await reload(true); }

// ── 열쇠 ──
function openKey() {
  $("#sheet").innerHTML = `<h2>열쇠 넣기</h2><p class="desc">열쇠가 있으면 할 일, 바꾼 것 기록, 주간 통계(매출, 객수, 전화)가 보여요. 이 기기에만 저장돼요.</p>
    <input class="input" id="kIn" type="password" autocomplete="off" value="">
    <div class="btns"><button class="btn" onclick="key='';ls.set('vf-naver-key','');closeSheet();reload(true)">열쇠 빼기</button><button class="btn primary" onclick="saveKey()">저장</button></div>`;
  openSheet();
}
async function saveKey() { key = $("#kIn").value.trim(); ls.set("vf-naver-key", key); closeSheet(); await reload(true); toast(R ? "열렸어요" : lockMsg()); }
function toggleHide() { hide = !hide; ls.set("vf-naver-hide", hide ? "1" : "0"); renderHome(); if (curBranch) renderBranch(); }

function openSheet() { $("#dim").classList.add("on"); history.pushState({ s: 1 }, ""); }
function hideSheet() { $("#dim").classList.remove("on"); }
function closeSheet() { if ($("#dim").classList.contains("on")) history.back(); }
$("#dim").addEventListener("click", (e) => { if (e.target.id === "dim") closeSheet(); });

async function reload(remoteOnly) {
  if (!remoteOnly) { D = await (await fetch("data.json?t=" + Date.now())).json(); setDates(); }
  await loadRemote();
  renderHome(); if (curBranch) renderBranch();
}
reload().catch(() => ($("#home").innerHTML = `<div class="empty" style="padding:40px 0">데이터를 불러오지 못했어요. 새로고침 해주세요.</div>`));
</script>
</body>
</html>
