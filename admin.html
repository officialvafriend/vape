<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<title>본점 매장 도면 (관리자)</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#f2f3f5;
    color:#1a1e21;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    padding:14px;
  }
  h1{font-size:16px;margin:0 0 4px;}
  .sub{font-size:12px;color:#637075;margin-bottom:10px;}
  .toolbar{display:flex;gap:8px;margin-bottom:10px;}
  button{
    border:1px solid #d8dcde;background:#fff;color:#1a1e21;
    padding:8px 13px;border-radius:9px;font-size:13px;cursor:pointer;
  }
  button.primary{background:#1a1e21;color:#fff;border-color:#1a1e21;}
  .search-wrap{margin-bottom:10px;}
  .search-wrap input{
    width:100%;padding:11px 14px;border-radius:9px;
    border:1px solid #d8dcde;background:#fff;color:#1a1e21;
    font-size:14px;outline:none;
  }
  .search-wrap input:focus{border-color:#e0392f;}
  .floor{
    position:relative;
    background:#fff;
    border:1px solid #d8dcde;
    border-radius:10px;
    height:640px;
    overflow:auto;
    touch-action:none;
  }
  .floorInner{
    position:relative;
    width:1800px;
    height:1200px;
    background-image:
      linear-gradient(rgba(0,0,0,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.06) 1px, transparent 1px);
    background-size:20px 20px;
  }
  .floor.line-mode{cursor:crosshair;}
  .lineLayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .floor.line-mode .lineLayer{pointer-events:auto;}
  .lineLayer line{stroke:#c0392b;stroke-width:3;cursor:pointer;}
  .lineLayer text{font-size:13px;font-weight:700;fill:#c0392b;font-family:inherit;user-select:none;}
  .lineLayer .hitline{stroke:transparent;stroke-width:16;cursor:pointer;}
  .lineLayer line.selected{stroke:#1a56db;}
  .lineActions{
    position:absolute;display:none;gap:6px;transform:translate(-50%,-100%);
    background:#1a1e21;padding:5px;border-radius:8px;z-index:9;
  }
  .lineActions button{
    padding:5px 9px;font-size:11.5px;border-radius:6px;border:none;
    background:#2c3438;color:#fff;cursor:pointer;
  }
  .lineActions button.danger{background:#d1372c;}
  .boxLayer{position:absolute;inset:0;}
  .box{
    position:absolute;
    border-radius:8px;
    border:2px solid #b23b2f;
    background:#e0392f;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:grab;
    touch-action:none;
    user-select:none;
    overflow:hidden;
  }
  .boxLabel{
    font-size:12px;font-weight:700;text-align:center;padding:3px;
    outline:none;width:100%;
    word-break:keep-all;
  }
  .boxLabel:empty::before{
    content:"이름 입력";
    opacity:.6;font-weight:500;
  }
  .boxLabel[contenteditable="true"]{
    background:rgba(0,0,0,.25);border-radius:4px;cursor:text;
    user-select:text;
  }
  .box.dragging{cursor:grabbing;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:5;filter:brightness(1.1);}
  .box.dim{opacity:.18;}
  .box.match{box-shadow:0 0 0 3px #1a56db, 0 6px 18px rgba(26,86,219,.5);z-index:6;}
  .resize-handle{
    position:absolute;right:2px;bottom:2px;width:16px;height:16px;
    cursor:nwse-resize;border-radius:3px;
    background:rgba(255,255,255,.5);
  }
  .dup-handle{
    position:absolute;left:2px;top:2px;width:18px;height:18px;
    cursor:pointer;border-radius:4px;
    background:rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#1a1e21;font-weight:800;
  }
  .dup-handle:hover{background:#fff;}
  .del-handle{
    position:absolute;left:2px;bottom:2px;width:16px;height:16px;
    cursor:pointer;border-radius:4px;
    background:rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#7a1410;font-weight:800;
  }
  .del-handle:hover{background:#fff;}
  .kw-handle{
    position:absolute;right:2px;top:2px;width:16px;height:16px;
    cursor:pointer;border-radius:4px;
    background:rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#1a1e21;font-weight:800;
  }
  .kw-handle:hover{background:#fff;}
  .kw-handle.has-kw{background:#ffd76a;}
  .flow{display:flex;justify-content:space-between;font-size:11px;color:#637075;margin-top:8px;}
  .out{
    margin-top:14px;background:#1c2226;color:#eef1f2;border-radius:9px;padding:12px 14px;
    font-family:monospace;font-size:11.5px;white-space:pre-wrap;word-break:break-all;
    max-height:160px;overflow:auto;display:none;
  }
</style>

  <h1>본점 매장 도면 (관리자용 · 편집 가능)</h1>

  <div class="search-wrap">

  </div>
  <div class="toolbar">
    <button class="primary" id="exportBtn">좌표 내보내기</button>
    <button id="addBtn">박스 추가</button>
    <button id="lineModeBtn">선 그리기: 꺼짐</button>
    <button id="clearLinesBtn">선 전체 지우기</button>
    <button id="growBtn">캔버스 키우기</button>
    <button id="uniformBtn">박스 크기 통일</button>
    <button id="alignBtn">정렬 정리</button>
    <button id="resetBtn">초기 배치로 리셋</button>
  </div>
  <div class="floor" id="floor">
    <div class="floorInner" id="floorInner">
      <div class="boxLayer" id="boxLayer"></div>
      <svg class="lineLayer" id="lineLayer"></svg>
      <div class="lineActions" id="lineActions">
        <button id="renameLineBtn">이름 수정</button>
        <button id="deleteLineBtn" class="danger">삭제</button>
      </div>
    </div>
  </div>
  <div class="flow"><span>◂ 창고 방향(B-3)</span><span>입구·외부자판기 ▸</span></div>

function render(){
  boxLayer.innerHTML = '';
  Object.keys(layout).forEach(num=>{
    const pos = layout[num];
    const box = document.createElement('div');
    box.className = 'box';
    box.dataset.num = num;
    box.style.left = pos.x + '%';
    box.style.top = pos.y + '%';
    box.style.width = pos.w + '%';
    box.style.height = pos.h + '%';

    const label = document.createElement('div');
    label.className = 'boxLabel';
    label.spellcheck = false;
    label.textContent = pos.label || '';
    box.appendChild(label);
    boxLayer.appendChild(box);

    label.addEventListener('dblclick', (e)=>{ e.stopPropagation(); });
    label.addEventListener('blur', ()=>{
      label.contentEditable = 'false';
      pos.label = label.textContent.trim();
      saveLayout();
    });
    label.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); label.blur(); }
    });

    const handle = document.createElement('div');
    handle.className = 'resize-handle';
    box.appendChild(handle);

    const dupHandle = document.createElement('div');
    dupHandle.className = 'dup-handle';
    dupHandle.textContent = '⧉';
    dupHandle.title = '옆에 복제';
    box.appendChild(dupHandle);

    dupHandle.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
    });
    dupHandle.addEventListener('click', (e)=>{
      e.stopPropagation();
      const nums = Object.keys(layout).map(Number);
      const nextNum = nums.length ? Math.max(...nums) + 1 : 1;
      const gap = 1;
      let nx = pos.x + pos.w + gap;
      let ny = pos.y;
      if(nx + pos.w > 100){ nx = 0; ny = Math.min(100 - pos.h, pos.y + pos.h + gap); }
      layout[nextNum] = { x:nx, y:ny, w:pos.w, h:pos.h, label:pos.label, keywords:pos.keywords||"" };
      saveLayout();
      render();
    });

    const delHandle = document.createElement('div');
    delHandle.className = 'del-handle';
    delHandle.textContent = '✕';
    delHandle.title = '박스 삭제';
    box.appendChild(delHandle);
    delHandle.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); });
    delHandle.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!confirm(num + '번 박스를 삭제할까요?')) return;
      delete layout[num];
      saveLayout();
      render();
    });

    const kwHandle = document.createElement('div');
    kwHandle.className = 'kw-handle' + (pos.keywords ? ' has-kw' : '');
    kwHandle.textContent = '🔍';
    kwHandle.title = '검색 키워드 편집';
    box.appendChild(kwHandle);
    kwHandle.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); });
    kwHandle.addEventListener('click', (e)=>{
      e.stopPropagation();
      const cur = pos.keywords || '';
      const input = prompt(
        num + '번 박스 검색 키워드 (쉼표로 구분, 화면엔 안 보이고 검색에만 씀)\n예: 말론 0.4옴, 폐호흡 코일, XROS 코일',
        cur
      );
      if(input === null) return;
      pos.keywords = input.trim();
      saveLayout();
      render();
    });

    let lastDown = 0;
    box.addEventListener('pointerdown', (e)=>{
      if(e.target === handle || e.target === dupHandle || e.target === delHandle || e.target === kwHandle) return;
      if(label.contentEditable === 'true') return; // let text editing/caret placement work normally

      const now = Date.now();
      const isDouble = (now - lastDown) < 350;
      lastDown = now;

      if(isDouble){
        label.contentEditable = 'true';
        label.focus();
        document.execCommand('selectAll', false, null);
        return;
      }

      const startX = e.clientX, startY = e.clientY;
      const startPX = pos.x, startPY = pos.y;
      const rect = floorInnerEl.getBoundingClientRect();
      box.setPointerCapture(e.pointerId);
      box.classList.add('dragging');

      function onMove(ev){
        const dxPct = (ev.clientX - startX) / rect.width * 100;
        const dyPct = (ev.clientY - startY) / rect.height * 100;
        let nx = Math.max(0, Math.min(100 - pos.w, startPX + dxPct));
        let ny = Math.max(0, Math.min(100 - pos.h, startPY + dyPct));
        pos.x = nx; pos.y = ny;
        box.style.left = nx + '%'; box.style.top = ny + '%';
      }
      function onUp(){
        box.releasePointerCapture(e.pointerId);
        box.classList.remove('dragging');
        box.removeEventListener('pointermove', onMove);
        box.removeEventListener('pointerup', onUp);
        saveLayout();
      }
      box.addEventListener('pointermove', onMove);
      box.addEventListener('pointerup', onUp);
    });

    handle.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      const startX = e.clientX, startY = e.clientY;
      const startW = pos.w, startH = pos.h;
      const rect = floorInnerEl.getBoundingClientRect();
      handle.setPointerCapture(e.pointerId);

      function onMove(ev){
        const dxPct = (ev.clientX - startX) / rect.width * 100;
        const dyPct = (ev.clientY - startY) / rect.height * 100;
        let nw = Math.max(2, Math.min(100 - pos.x, startW + dxPct));
        let nh = Math.max(2, Math.min(100 - pos.y, startH + dyPct));
        pos.w = nw; pos.h = nh;
        box.style.width = pos.w + '%'; box.style.height = pos.h + '%';
      }
      function onUp(){
        handle.releasePointerCapture(e.pointerId);
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        saveLayout();
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
    });
  });
  if(typeof applySearch === 'function') applySearch();
}

const searchEl = document.getElementById('search');
function applySearch(){
  const q = searchEl.value.trim().toLowerCase();
  const boxEls = boxLayer.querySelectorAll('.box');
  let firstMatch = null;
  boxEls.forEach(b=>{
    const num = b.dataset.num;
    const p = layout[num] || {};
    const haystack = ((p.label||'') + ' ' + (p.keywords||'')).toLowerCase();
    b.classList.remove('dim','match');
    if(!q) return;
    if(haystack.includes(q) || num.includes(q)){
      b.classList.add('match');
      if(!firstMatch) firstMatch = b;
    }else{
      b.classList.add('dim');
    }
  });
  if(firstMatch){
    firstMatch.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
  }
}
searchEl.addEventListener('input', applySearch);

render();

document.getElementById('growBtn').addEventListener('click', ()=>{
  const curW = parseInt(floorInnerEl.style.width || '1800', 10);
  const curH = parseInt(floorInnerEl.style.height || '1200', 10);
  floorInnerEl.style.width = (curW + 400) + 'px';
  floorInnerEl.style.height = (curH + 300) + 'px';
});

document.getElementById('alignBtn').addEventListener('click', ()=>{
  const thIn = prompt('정렬 민감도(%) — 이 값보다 가까운 것들끼리 줄을 맞춰요', '2.5');
  if(thIn === null) return;
  const threshold = Math.max(0.5, parseFloat(thIn) || 2.5);

  function snapAxis(axis){
    const nums = Object.keys(layout);
    const items = nums.map(k=>({k, v: layout[k][axis]})).sort((a,b)=>a.v-b.v);
    let group = [];
    function flush(){
      if(!group.length) return;
      const avg = group.reduce((s,it)=>s+it.v,0)/group.length;
      group.forEach(it=> layout[it.k][axis] = Math.round(avg*10)/10 );
      group = [];
    }
    items.forEach(it=>{
      if(group.length && (it.v - group[group.length-1].v) > threshold){
        flush();
      }
      group.push(it);
    });
    flush();
  }
  snapAxis('x');
  snapAxis('y');

  // clamp back into bounds after snapping
  Object.keys(layout).forEach(k=>{
    const p = layout[k];
    p.x = Math.max(0, Math.min(100 - p.w, p.x));
    p.y = Math.max(0, Math.min(100 - p.h, p.y));
  });

  saveLayout();
  render();
});

document.getElementById('uniformBtn').addEventListener('click', ()=>{
  const nums = Object.keys(layout);
  if(!nums.length) return;
  const avgW = nums.reduce((s,k)=>s+layout[k].w,0)/nums.length;
  const avgH = nums.reduce((s,k)=>s+layout[k].h,0)/nums.length;
  const wIn = prompt('통일할 가로 크기(%)', Math.round(avgW));
  if(wIn === null) return;
  const hIn = prompt('통일할 세로 크기(%)', Math.round(avgH));
  if(hIn === null) return;
  const w = Math.max(1, parseFloat(wIn) || avgW);
  const h = Math.max(1, parseFloat(hIn) || avgH);
  nums.forEach(k=>{
    layout[k].w = Math.min(w, 100 - layout[k].x);
    layout[k].h = Math.min(h, 100 - layout[k].y);
  });
  saveLayout();
  render();
});

document.getElementById('addBtn').addEventListener('click', ()=>{
  const nums = Object.keys(layout).map(Number);
  const nextNum = nums.length ? Math.max(...nums) + 1 : 1;
  layout[nextNum] = { x:5, y:5, w:14, h:14, label:"" };
  saveLayout();
  render();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('초기 배치로 되돌릴까요?')) return;
  layout = JSON.parse(JSON.stringify(DEFAULTS));
  saveLayout();
  render();
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const out = document.getElementById('out');
  const rounded = {};
  Object.keys(layout).forEach(k=>{
    const p = layout[k];
    rounded[k] = {x:Math.round(p.x), y:Math.round(p.y), w:Math.round(p.w), h:Math.round(p.h), label:p.label||"", keywords:p.keywords||""};
  });
  out.textContent = JSON.stringify({boxes:rounded, lines:lines}, null, 2);
  out.style.display = 'block';
});

// ---- line drawing ----
const lineActions = document.getElementById('lineActions');
const renameLineBtn = document.getElementById('renameLineBtn');
const deleteLineBtn = document.getElementById('deleteLineBtn');
let selectedIdx = null;

function renderLines(){
  lineLayer.innerHTML = '';
  lines.forEach((ln, idx)=>{
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');

    const hit = document.createElementNS('http://www.w3.org/2000/svg','line');
    hit.setAttribute('class','hitline');
    hit.setAttribute('x1', ln.x1+'%'); hit.setAttribute('y1', ln.y1+'%');
    hit.setAttribute('x2', ln.x2+'%'); hit.setAttribute('y2', ln.y2+'%');

    const vis = document.createElementNS('http://www.w3.org/2000/svg','line');
    vis.setAttribute('x1', ln.x1+'%'); vis.setAttribute('y1', ln.y1+'%');
    vis.setAttribute('x2', ln.x2+'%'); vis.setAttribute('y2', ln.y2+'%');
    if(selectedIdx === idx) vis.classList.add('selected');

    g.appendChild(vis);
    g.appendChild(hit);

    if(ln.label){
      const midX = (ln.x1+ln.x2)/2, midY = (ln.y1+ln.y2)/2;
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', midX+'%'); text.setAttribute('y', (midY-1)+'%');
      text.setAttribute('text-anchor','middle');
      text.textContent = ln.label;
      g.appendChild(text);
    }

    hit.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      selectedIdx = idx;
      renderLines();
      showLineActions(ln);
    });

    lineLayer.appendChild(g);
  });
  if(selectedIdx === null || selectedIdx >= lines.length){
    lineActions.style.display = 'none';
  }
}

function showLineActions(ln){
  const rect = floorInnerEl.getBoundingClientRect();
  const midX = (ln.x1+ln.x2)/2, midY = (ln.y1+ln.y2)/2;
  lineActions.style.left = midX + '%';
  lineActions.style.top = 'calc(' + midY + '% - 8px)';
  lineActions.style.display = 'flex';
}

renameLineBtn.addEventListener('click', ()=>{
  if(selectedIdx === null) return;
  const ln = lines[selectedIdx];
  const newLabel = prompt('선 이름', ln.label || '');
  if(newLabel !== null){
    ln.label = newLabel.trim();
    saveLines();
    renderLines();
    showLineActions(ln);
  }
});
deleteLineBtn.addEventListener('click', ()=>{
  if(selectedIdx === null) return;
  lines.splice(selectedIdx, 1);
  selectedIdx = null;
  saveLines();
  renderLines();
});
document.getElementById('clearLinesBtn').addEventListener('click', ()=>{
  if(!confirm('그려둔 선을 전부 지울까요?')) return;
  lines = [];
  selectedIdx = null;
  saveLines();
  renderLines();
});

boxLayer.addEventListener('pointerdown', ()=>{
  if(selectedIdx !== null){ selectedIdx = null; renderLines(); }
});

renderLines();

const lineModeBtn = document.getElementById('lineModeBtn');
let lineMode = false;
lineModeBtn.addEventListener('click', ()=>{
  lineMode = !lineMode;
  floorEl.classList.toggle('line-mode', lineMode);
  lineModeBtn.textContent = '선 그리기: ' + (lineMode ? '켜짐' : '꺼짐');
  selectedIdx = null;
  renderLines();
});

let drawing = null;
lineLayer.addEventListener('pointerdown', (e)=>{
  if(!lineMode) return;
  if(e.target.closest('.hitline')) return; // handled above, selects instead
  selectedIdx = null;
  lineActions.style.display = 'none';
  const rect = floorInnerEl.getBoundingClientRect();
  const x1 = (e.clientX - rect.left) / rect.width * 100;
  const y1 = (e.clientY - rect.top) / rect.height * 100;
  drawing = { x1, y1, x2:x1, y2:y1, label:'' };
  lines.push(drawing);
  renderLines();
  lineLayer.setPointerCapture(e.pointerId);

  function onMove(ev){
    const rect2 = floorInnerEl.getBoundingClientRect();
    drawing.x2 = (ev.clientX - rect2.left) / rect2.width * 100;
    drawing.y2 = (ev.clientY - rect2.top) / rect2.height * 100;
    renderLines();
  }
  function onUp(){
    lineLayer.releasePointerCapture(e.pointerId);
    lineLayer.removeEventListener('pointermove', onMove);
    lineLayer.removeEventListener('pointerup', onUp);
    const label = prompt('선 이름 (예: 입구, 외벽) — 취소하면 이름 없이 저장', '');
    if(label !== null) drawing.label = label.trim();
    saveLines();
    renderLines();
    drawing = null;
  }
  lineLayer.addEventListener('pointermove', onMove);
  lineLayer.addEventListener('pointerup', onUp);
});
</script>
</body>
