<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>구성 만들기 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--ink:#191f28;--sub:#8b95a1;--red:#d7262e;--line:#e5e8eb}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .top{display:flex;align-items:baseline;gap:10px;padding:18px 20px 0}
  .top b{font-size:20px;font-weight:800} .top span{color:var(--sub);font-size:14px;font-weight:600}

  /* 무대: 가운데 기기 + 둘레에 액상 */
  .stage{position:relative;height:500px;touch-action:pan-y;cursor:grab;user-select:none}
  .stage.drag{cursor:grabbing}
  .base{position:absolute;left:50%;top:330px;transform:translateX(-50%);width:min(640px,92vw);height:150px;pointer-events:none}
  .base svg{width:100%;height:100%;overflow:visible}
  .dev,.bt{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;pointer-events:none}
  .dev{width:270px;height:270px;z-index:50}
  .dev img,.bt img{width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
  .bt{width:104px;height:148px}
  .bt img{border-radius:6px}
  .empty{position:absolute;left:50%;top:430px;transform:translateX(-50%);font-size:14px;color:var(--sub);font-weight:600;white-space:nowrap}
  .rot{position:absolute;top:410px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;font-size:22px;font-weight:800;z-index:90}
  .rot.l{left:calc(50% - min(320px,46vw) - 6px)} .rot.r{left:calc(50% + min(320px,46vw) - 44px)}

  /* 아래 선택 영역 */
  .panel{padding:0 20px 30px;max-width:760px;margin:0 auto}
  .sec{margin-top:18px}
  .sec h3{font-size:15px;color:var(--sub);font-weight:700;margin-bottom:10px}
  .colors{display:flex;gap:10px;flex-wrap:wrap}
  .colors button{display:flex;align-items:center;gap:8px;padding:9px 14px 9px 9px;border-radius:999px;background:#f2f4f6;font-weight:700}
  .colors button i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.08)}
  .colors button.on{background:var(--ink);color:#fff}
  .liqs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .liqs::-webkit-scrollbar{display:none}
  .lq{flex:none;width:92px;text-align:center;position:relative}
  .lq img{width:92px;height:92px;object-fit:cover;border-radius:14px;background:#f2f4f6}
  .lq b{display:block;font-size:12px;margin-top:6px;line-height:1.3}
  .lq em{position:absolute;top:-6px;right:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 6px}
  .sum{display:flex;align-items:center;gap:12px;margin-top:20px;background:#191f28;color:#fff;border-radius:18px;padding:16px 18px}
  .sum .t{flex:1} .sum .t b{display:block;font-size:16px} .sum .t span{font-size:13px;color:#b0b8c1}
  .sum .p{font-size:24px;font-weight:800}
  .sum button{height:44px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700}
  .note{font-size:12px;color:var(--sub);text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="top"><b>나만의 구성 만들기</b><span>기기 색을 고르고 액상을 담아 보세요</span></div>

<div class="stage" id="stage">
  <div class="base"><svg viewBox="0 0 640 150" preserveAspectRatio="none">
    <ellipse cx="320" cy="60" rx="300" ry="56" fill="rgba(0,0,0,.035)" stroke="#e1e1de" stroke-width="2"/>
    <path d="M 24 80 A 300 56 0 0 0 616 80" fill="none" stroke="#191f28" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
    <path d="M 24 80 l 4 -14 M 24 80 l 13 -6 M 616 80 l -4 -14 M 616 80 l -13 -6" stroke="#191f28" stroke-width="3" stroke-linecap="round" fill="none"/>
  </svg></div>
  <div class="dev" id="dev"><img id="devImg" alt=""></div>
  <div id="ring"></div>
  <div class="empty" id="empty">아래에서 액상을 고르면 기기 둘레에 놓여요</div>
  <button class="rot l" id="prev" aria-label="왼쪽으로 돌리기">‹</button>
  <button class="rot r" id="next" aria-label="오른쪽으로 돌리기">›</button>
</div>

<div class="panel">
  <div class="sec"><h3>기기 색상 · 발라리안 맥스프로</h3><div class="colors" id="colors"></div></div>
  <div class="sec"><h3>액상 담기 (누르면 1병씩 · 최대 12병)</h3><div class="liqs" id="liqs"></div></div>
  <div class="sum"><div class="t"><b id="sumT"></b><span id="sumS"></span></div><div class="p" id="sumP"></div><button id="clear">비우기</button></div>
  <div class="note">구성 만들기 시안 · 받침을 손가락으로 밀거나 ‹ › 를 누르면 돌아가요, 가만히 두면 천천히 혼자 돌아요<br>사진은 임시(기기=톡톡 메뉴 이미지에서 잘라 씀, 액상=직원교육 사진) · 가격은 시안용 단순 계산</div>
</div>

<script src="data.js"></script>
<script>
const IMG = "https://officialvafriend.github.io/vape/img/";
const L = window.LIQ || [];
const COLORS = [["블랙", "black", "#222"], ["실버", "silver", "#c9c9c9"], ["퍼플", "purple", "#cdbfe6"], ["블루", "blue", "#cfe6f0"], ["핑크", "pink", "#f2c9d2"]];
const VILLAIN = ["VF 빌런 자두", "VF 빌런 청포도", "VF 빌런 레몬", "VF 빌런 레즈애플", "VF 빌런 청사과"];
const LIQS = [...VILLAIN.map((n) => L.find((x) => x.n === n)), ...L.filter((x) => x.line === "프리미엄" && !x.n.startsWith("VF 빌런")).slice(0, 10)].filter(Boolean);
const isVillain = (x) => x.n.startsWith("VF 빌런");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const won = (n) => n.toLocaleString("ko-KR") + "원";

let color = 0, picks = []; // picks: 담은 순서대로 액상 하나씩

// ── 고르기 ──
function renderColors() { $("#colors").innerHTML = COLORS.map(([n, , sw], i) => `<button data-c="${i}" class="${i === color ? "on" : ""}"><i style="background:${sw}"></i>${n}</button>`).join(""); $("#devImg").src = `dev_maxpro_${COLORS[color][1]}.png`; }
function renderLiqs() { $("#liqs").innerHTML = LIQS.map((x, i) => { const n = picks.filter((p) => p === i).length; return `<button class="lq" data-l="${i}"><img src="${IMG + x.img}" alt="">${n ? `<em>${n}</em>` : ""}<b>${esc(x.n.replace("VF ", ""))}</b></button>`; }).join(""); }
function renderRing() {
  $("#ring").innerHTML = picks.map((i) => `<div class="bt"><img src="${IMG + LIQS[i].img}" alt=""></div>`).join("");
  $("#empty").style.display = picks.length ? "none" : "";
  renderSum();
}
// 시안용 단순 계산 (실제 메뉴판 계산식으로 바꿀 예정)
function price() {
  const n = picks.length, vOnly = picks.every((i) => isVillain(LIQS[i]));
  if (n < 5) return [78000 + n * 15000, n ? "기기 + 낱개 액상" : "기기만"];
  if (n < 10) return n === 5 && vOnly ? [108000, "기기 + 빌런 5병 패키지"] : [118000 + (n - 5) * 15000, "기기 + 액상 5병 패키지" + (n > 5 ? ` + ${n - 5}병` : "")];
  return [153000 + (n - 10) * 15000, "기기 + 액상 10병 패키지" + (n > 10 ? ` + ${n - 10}병` : "")];
}
function renderSum() { const [p, how] = price(); $("#sumT").textContent = `맥스프로 ${COLORS[color][0]} + 액상 ${picks.length}병`; $("#sumS").textContent = how; $("#sumP").textContent = won(p); }

document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-c]"); if (c) { color = +c.dataset.c; renderColors(); renderSum(); return; }
  const l = e.target.closest("[data-l]"); if (l) { if (picks.length >= 12) return; picks.push(+l.dataset.l); renderLiqs(); renderRing(); return; }
  if (e.target.id === "clear") { picks = []; renderLiqs(); renderRing(); }
});

// ── 뱅글뱅글: 받침 둘레(타원)에 액상을 놓고 rot 만큼 돌린다. 앞(아래)은 크게, 뒤(위)는 작게 ──
let rot = 0, vel = 0.25, target = null, drag = null, idleAt = 0;
const stage = $("#stage");
function frame(t) {
  const dt = Math.min((t - (frame.t || t)) / 1000, 0.05); frame.t = t;
  if (target !== null) { const d = target - rot; rot += d * Math.min(dt * 8, 1); if (Math.abs(d) < 0.002) target = null; }
  else if (!drag) { if (t - idleAt > 1500) vel += (0.25 - vel) * dt * 1.5; rot += vel * dt; vel *= 1 - dt * 0.2; }
  layout(); requestAnimationFrame(frame);
}
function layout() {
  const W = stage.clientWidth, cx = W / 2, cy = 395, rx = Math.min(300, W * 0.44), ry = 56;
  const dev = $("#dev"); dev.style.transform = `translate(${cx - 135}px, ${cy - 270 * 0.93}px)`; // 사진 속 그림자(아래 7%)가 받침 가운데 오게
  const els = [...document.querySelectorAll(".bt")], n = els.length;
  els.forEach((el, i) => {
    const a = rot + (i / Math.max(n, 1)) * Math.PI * 2;
    const front = Math.cos(a);                 // 1 = 맨 앞(아래), -1 = 맨 뒤(위)
    const s = 0.55 + 0.45 * (front + 1) / 2;   // 앞 1배 ~ 뒤 0.55배
    const x = cx + Math.sin(a) * rx - 52, y = cy + front * ry - 148 + 14;
    el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    el.style.zIndex = String(front > -0.05 ? 60 + Math.round(front * 30) : 40 + Math.round(front * 30)); // 뒤쪽은 기기(50) 뒤로
    el.style.opacity = String(0.55 + 0.45 * (front + 1) / 2);
  });
}
const step = () => (Math.PI * 2) / Math.max(picks.length, 6);
$("#prev").onclick = (e) => { e.stopPropagation(); target = (target ?? rot) - step(); vel = 0; idleAt = performance.now(); };
$("#next").onclick = (e) => { e.stopPropagation(); target = (target ?? rot) + step(); vel = 0; idleAt = performance.now(); };
stage.addEventListener("pointerdown", (e) => { if (e.target.closest(".rot")) return; drag = { x: e.clientX, r: rot, t: performance.now(), lx: e.clientX }; target = null; stage.classList.add("drag"); });
window.addEventListener("pointermove", (e) => { if (!drag) return; const now = performance.now(); rot = drag.r + (e.clientX - drag.x) * 0.012; vel = ((e.clientX - drag.lx) * 0.012) / Math.max((now - drag.t) / 1000, 0.016); drag.lx = e.clientX; drag.t = now; });
window.addEventListener("pointerup", () => { if (!drag) return; drag = null; vel = Math.max(-4, Math.min(4, vel)); idleAt = performance.now(); stage.classList.remove("drag"); });

renderColors(); renderLiqs(); renderRing(); requestAnimationFrame(frame);
</script>
</body>
</html>
