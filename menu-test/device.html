<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>기기 상세 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--ink:#191f28;--ink2:#4e5968;--sub:#8b95a1;--line:#e5e8eb;--soft:#f2f4f6;--blue:#3182f6;--blue-soft:#e8f3ff;--red:#d7262e}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f2f4f6;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding:14px 14px 110px}
  /* 기기 고르기 */
  .models{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
  .models::-webkit-scrollbar{display:none}
  .models button{flex:none;padding:10px 14px;border-radius:12px;background:#fff;font-weight:700;font-size:14px;color:var(--ink2)}
  .models button.on{background:var(--ink);color:#fff}
  .card{background:#fff;border-radius:22px;padding:22px}
  .head{display:flex;align-items:flex-start}
  .head h1{font-size:24px;letter-spacing:-.5px} .head .sm{color:var(--sub);font-size:14px;margin-top:4px}
  .chips{display:flex;gap:8px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
  .chips button{flex:none;padding:9px 16px;border-radius:10px;background:var(--soft);color:var(--ink2);font-weight:600}
  .chips button.on{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 1px #9cc3fb}
  /* 360 받침 */
  .hero{position:relative;height:330px;margin-top:10px}
  .hero img{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);height:260px;width:auto;max-width:80%;object-fit:contain;z-index:2}
  .hero .ph{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);width:120px;height:200px;border-radius:22px;background:linear-gradient(160deg,#3a3531,#15120f);color:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:14px;z-index:2}
  .hero svg{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:min(420px,86%);height:80px}
  .hero .colorBtn{position:absolute;right:4px;bottom:8px;width:40px;height:40px;border-radius:50%;background:conic-gradient(#f04452,#f59f00,#03b26c,#3182f6,#8b5cf6,#f04452);box-shadow:0 0 0 4px #fff inset,0 2px 8px rgba(0,0,0,.15);z-index:3}
  .colors{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .colors button{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 7px;border-radius:999px;background:var(--soft);font-weight:700;font-size:14px}
  .colors button i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
  .colors button.on{background:var(--ink);color:#fff}
  /* 요약 카드 */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .box{background:var(--soft);border-radius:16px;padding:16px 18px}
  .box .k{font-size:14px;color:var(--blue);font-weight:700}
  .box .v{font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-.3px}
  .box .s{font-size:13px;color:var(--sub);margin-top:4px}
  .spec{background:var(--soft);border-radius:16px;padding:6px 18px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
  .spec div{padding:12px 0;border-bottom:1px solid #e3e6ea}
  .spec div:nth-last-child(-n+2){border-bottom:0}
  .spec .k{font-size:13px;color:var(--blue);font-weight:700} .spec .v{font-size:16px;margin-top:4px}
  .spec .v.todo{color:#c0c6cc}
  .cta{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;background:var(--soft);border-radius:16px;padding:18px;font-weight:800;font-size:16px;text-decoration:none;color:var(--ink)}
  .cta span{color:var(--red)}
  /* 팟·소모품 */
  .sec{margin-top:12px}
  .sec h2{font-size:18px;letter-spacing:-.3px} .sec .d{font-size:13px;color:var(--sub);margin-top:4px}
  .goods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .g{background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
  .g .ic{font-size:24px} .g b{font-size:15px;line-height:1.3} .g .p{font-weight:800}
  .g .ctl{display:flex;align-items:center;gap:8px;margin-top:auto}
  .g .ctl button{width:34px;height:34px;border-radius:10px;background:#fff;font-weight:800;font-size:18px}
  .g .ctl span{min-width:20px;text-align:center;font-weight:800}
  .g .ctl .add{flex:1;width:auto;background:var(--ink);color:#fff;font-size:14px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .bar .t{flex:1} .bar .t b{display:block;font-size:16px} .bar .t span{font-size:13px;color:var(--sub)}
  .bar button{height:50px;padding:0 20px;border-radius:14px;background:var(--red);color:#fff;font-weight:800}
  .note{font-size:12px;color:var(--sub);text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="models" id="models"></div>
  <div class="card" id="detail"></div>
  <div class="card sec" id="parts"></div>
  <div class="note">기기 상세 시안 · 기기·색상·가격·팟·소모품은 오케이포스 본점 재고·판매가(10/2) 기준<br>팟·소모품은 상품 이름으로 자동으로 묶은 것이라 호환 여부는 확인이 필요해요 · 스펙 칸은 입력 전</div>
</div>
<div class="bar"><div class="in"><div class="t"><b id="cartT">담은 상품 없음</b><span id="cartS">팟·소모품을 바로 담을 수 있어요</span></div><button id="go">직원에게 보여주기</button></div></div>

<script src="goods.js"></script>
<script>
const G = window.GOODS || [];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const won = (n) => n.toLocaleString("ko-KR") + "원";
const norm = (s) => s.replace(/\s+/g, "").replace(/옴/g, "");
// 사진: 지금은 맥스프로만 (블랙=받은 누끼, 나머지 색=톡톡 메뉴에서 잘라 쓴 임시)
const PHOTO = { "발라맥스프로": { 블랙: "dev_maxpro_black.png", 실버: "dev_maxpro_silver.png", 블루: "dev_maxpro_blue.png", 핑크: "dev_maxpro_pink.png", 퍼플: "dev_maxpro_purple.png" } };
const SWATCH = { 블랙: "#222", 실버: "#cfcfcf", 블루: "#cfe6f0", 핑크: "#f2c9d2", 퍼플: "#cdbfe6", 화이트: "#fff", 네이비: "#2b3a67", 그린: "#3b6e55", 건메탈: "#555", 레드: "#d7262e" };
// 스펙은 데이터가 없어 칸만 (사장님이 채워 주시면 여기에)
const SPEC = {};
const SPEC_KEYS = ["방식", "배터리", "팟 용량", "저항", "충전", "화면"];

// 기기 모델별로 묶기 (포스 상품 이름의 model/opt)
const MODELS = [...G.filter((x) => x.c === "dev").reduce((m, x) => { const k = x.model || x.n; (m.get(k) || m.set(k, []).get(k)).push(x); return m; }, new Map())];
// 그 모델의 팟·소모품: 이름에 모델 이름(앞의 '발라' 빼고도)이 들어간 것
function partsOf(model) {
  const keys = [norm(model), norm(model.replace(/^발라(리안)?/, ""))].filter((k) => k.length >= 2);
  // 다른 기기 이름이 더 길게 맞으면(예: '맥스프로 스티그마 케이스') 그 기기 것으로 본다
  const others = MODELS.map(([m]) => m).filter((m) => m !== model).flatMap((m) => [norm(m), norm(m.replace(/^발라(리안)?/, ""))]).filter((k) => k.length > Math.max(...keys.map((x) => x.length)));
  return G.filter((x) => x.c === "pod" && keys.some((k) => norm(x.n).includes(k)) && !others.some((k) => norm(x.n).includes(k)));
}
let mi = Math.max(0, MODELS.findIndex(([m]) => m === "발라맥스프로")), ci = 0;
const cart = new Map();

function render() {
  $("#models").innerHTML = MODELS.map(([m], i) => `<button data-m="${i}" class="${i === mi ? "on" : ""}">${esc(m)}</button>`).join("");
  const [model, list] = MODELS[mi], d = list[ci] || list[0], photo = PHOTO[model]?.[d.opt];
  const prices = [...new Set(list.map((x) => x.price))];
  const spec = SPEC[model] || {};
  $("#detail").innerHTML = `
    <div class="head"><div><h1>${esc(model)}</h1><div class="sm">${esc(d.pos || "")} · 색상 ${list.length}종</div></div></div>
    <div class="chips"><button class="on" data-go="detail">요약</button><button data-go="spec">스펙</button><button data-go="parts">팟·소모품</button><button data-go="cta">구매 혜택</button></div>
    <div class="hero">${photo ? `<img src="${photo}" alt="">` : `<div class="ph">${esc(model)}<br>사진 준비 중</div>`}
      <svg viewBox="0 0 420 80"><ellipse cx="210" cy="30" rx="200" ry="26" fill="none" stroke="#e1e3e6" stroke-width="2"/><text x="210" y="74" text-anchor="middle" font-size="13" fill="#b0b8c1">${esc(d.opt || "기본")}</text></svg>
      <button class="colorBtn" data-go="colors" aria-label="색상"></button></div>
    <div class="colors" id="colors">${list.map((x, i) => `<button data-c="${i}" class="${i === ci ? "on" : ""}"><i style="background:${SWATCH[x.opt] || "#ddd"}"></i>${esc(x.opt || "기본")}</button>`).join("")}</div>
    <div class="two">
      <div class="box"><div class="k">가격</div><div class="v">${prices.map(won).join(" / ")}</div><div class="s">포스 판매가 기준</div></div>
      <div class="box"><div class="k">기기 종류</div><div class="v">${esc(spec.종류 || d.pos || "입력 필요")}</div><div class="s">${esc(spec.종류설명 || "팟 교체형 · 일체형 등")}</div></div>
    </div>
    <div class="spec" id="spec">${SPEC_KEYS.map((k) => `<div><div class="k">${k}</div><div class="v ${spec[k] ? "" : "todo"}">${esc(spec[k] || "입력 필요")}</div></div>`).join("")}</div>
    <a class="cta" id="cta" href="build.html">기기구매 혜택 받으러 가기 <span>→</span></a>`;
  const parts = partsOf(model);
  $("#parts").innerHTML = `<h2>${esc(model)} 팟·소모품</h2><div class="d">${parts.length ? "누르면 바로 담겨요" : "이름으로 묶이는 팟·소모품이 없어요"}</div>
    <div class="goods">${parts.map((x) => { const n = cart.get(x.id) || 0; return `<div class="g"><div class="ic">${x.sub === "팟·코일" ? "🧩" : "🎒"}</div><b>${esc(x.n)}</b><div class="p">${won(x.price)}</div>
      <div class="ctl">${n ? `<button data-dec="${x.id}">−</button><span>${n}</span><button data-inc="${x.id}">+</button>` : `<button class="add" data-inc="${x.id}">담기</button>`}</div></div>`; }).join("")}</div>`;
  renderCart();
}
function renderCart() {
  const items = [...cart].filter(([, n]) => n > 0), cnt = items.reduce((a, [, n]) => a + n, 0);
  const sum = items.reduce((a, [id, n]) => a + G.find((x) => x.id === id).price * n, 0);
  $("#cartT").textContent = cnt ? `담은 상품 ${cnt}개 · ${won(sum)}` : "담은 상품 없음";
  $("#cartS").textContent = cnt ? items.map(([id, n]) => `${G.find((x) => x.id === id).n} ${n}`).join(", ") : "팟·소모품을 바로 담을 수 있어요";
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button,a"); if (!t) return;
  if (t.dataset.m) { mi = +t.dataset.m; ci = 0; return render(); }
  if (t.dataset.c) { ci = +t.dataset.c; return render(); }
  if (t.dataset.inc) { cart.set(t.dataset.inc, (cart.get(t.dataset.inc) || 0) + 1); return render(); }
  if (t.dataset.dec) { cart.set(t.dataset.dec, Math.max(0, (cart.get(t.dataset.dec) || 0) - 1)); return render(); }
  if (t.dataset.go) { const el = document.getElementById(t.dataset.go); el?.scrollIntoView({ behavior: "smooth", block: "center" }); }
});
render();
</script>
</body>
</html>
